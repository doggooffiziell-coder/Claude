<title>Prärie-Siedlung</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rye&family=Pixelify+Sans:wght@400;600&display=swap">
<style>
/* Layout: Vollbild-Canvas, Holzleiste oben (Datum, Vorräte), Holzleiste unten (Knöpfe), Info-Panel schiebt sich von unten */
:root{
  --ink:#1e120a; --wood:#3b2516; --wood-2:#4d3019; --plank:#6b4426; --cream:#f4e3c1; --dust:#c9a877; --rust:#b9502c; --sky:#8cc0da;
  --display:"Rye",Georgia,serif; --ui:"Pixelify Sans",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;overflow:hidden;background:var(--ink);color:var(--cream)}
body{font-family:var(--ui);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;background:var(--ink)}
.gut{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
#hud{position:fixed;top:0;left:0;right:0;z-index:5;padding-top:calc(env(safe-area-inset-top,0px) + 8px);padding-bottom:8px;
  background:linear-gradient(var(--wood-2),var(--wood));border-bottom:3px solid var(--ink);box-shadow:0 2px 0 rgba(0,0,0,.25)}
.hud-in{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:6px}
.clock{display:flex;justify-content:space-between;align-items:baseline;gap:12px;font-size:15px;color:var(--dust)}
#time{font-size:20px;color:var(--cream);font-variant-numeric:tabular-nums}
.res{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;min-width:0}
.res::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;padding:3px 8px;background:var(--ink);border:1px solid var(--plank);font-size:14px;font-variant-numeric:tabular-nums}
.chip i{width:8px;height:8px;display:block;box-shadow:inset -2px -2px 0 rgba(0,0,0,.3)}
#bar{position:fixed;left:0;right:0;bottom:0;z-index:5;padding-top:8px;padding-bottom:calc(8px + env(safe-area-inset-bottom,0px));
  background:linear-gradient(var(--wood),var(--wood-2));border-top:3px solid var(--ink)}
.bar-in{display:flex;gap:6px;max-width:640px;margin:0 auto}
button{min-height:48px;min-width:44px;font:600 15px var(--ui);color:var(--cream);background:var(--plank);border:2px solid var(--ink);border-radius:0;
  box-shadow:inset 0 2px 0 rgba(255,255,255,.12),inset 0 -3px 0 rgba(0,0,0,.28);cursor:pointer;touch-action:manipulation;padding:0 8px}
button:active{box-shadow:inset 0 3px 0 rgba(0,0,0,.3)}
button:focus-visible{outline:3px solid var(--sky);outline-offset:1px}
button[aria-pressed="true"]{background:var(--rust)}
.seg{display:flex;flex:4;min-width:0}
.seg button{flex:1;min-width:0;padding:0 2px;font-size:14px}
.seg button+button{border-left:0}
.bar-in>button{flex:2;min-width:0;padding:0 4px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:15;max-width:calc(100% - 32px);
  background:var(--ink);border:2px solid var(--plank);padding:8px 12px;font-size:15px;text-align:center;pointer-events:none}
#sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;max-height:64%;display:flex;flex-direction:column;background:var(--wood);
  border-top:3px solid var(--ink);box-shadow:0 -4px 0 rgba(0,0,0,.25);transform:translateY(110%);transition:transform .22s ease-out;
  padding-bottom:env(safe-area-inset-bottom,0px)}
#sheet.open{transform:none}
.grab{display:flex;justify-content:center;padding-top:10px;touch-action:none}
.grab span{width:48px;height:5px;background:var(--plank)}
.shead{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:6px;touch-action:none}
.shead h2{font:400 22px var(--display);margin:0;text-wrap:balance;min-width:0}
#sBody{overflow-y:auto;padding-block:4px 16px;display:flex;flex-direction:column;gap:12px;font-size:16px;line-height:1.4}
.who{display:flex;gap:12px;align-items:center}
.pic{width:54px;height:66px;image-rendering:pixelated;background:#7e8a3c;border:2px solid var(--ink);flex:none}
.meta{color:var(--dust);font-size:15px}
.act{font-size:17px}
.thought{margin:0;padding:10px 12px;background:var(--ink);border-left:4px solid var(--rust);font-size:16px}
.soon{margin:0;color:var(--dust);font-size:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row button{flex:1}
.list{display:flex;flex-direction:column;gap:6px}
.item{display:flex;gap:10px;align-items:center;text-align:left;width:100%;padding:6px 10px}
.item .pic{width:36px;height:44px}
.item b{display:block;font-weight:600}
.item small{display:block;color:var(--dust);font-size:13px;font-weight:400}
.log{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.log li{display:flex;gap:10px;font-size:15px}
.log time{flex:none;color:var(--dust);font-variant-numeric:tabular-nums;min-width:86px}
/* Hauptmenü: Panorama füllt den Schirm, Titel oben im Himmel, Holztafel unten */
#menu{position:fixed;inset:0;z-index:30;background:#241a36;overflow:hidden}
#menuCv{position:absolute;inset:0;width:100%;height:100%;display:block;image-rendering:pixelated}
.m-top{position:absolute;left:0;right:0;top:calc(env(safe-area-inset-top,0px) + 7vh);display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;pointer-events:none}
.m-top .eyebrow{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:#f6c86a;text-shadow:2px 2px 0 var(--ink)}
.m-top h1{font:400 clamp(40px,12.5vw,72px)/1 var(--display);margin:0;color:var(--cream);text-wrap:balance;
  text-shadow:3px 3px 0 var(--ink),-1px -1px 0 var(--ink),1px -1px 0 var(--ink),-1px 1px 0 var(--ink)}
.m-top .tag{margin:0;font-size:16px;color:var(--cream);text-shadow:2px 2px 0 var(--ink)}
.m-board{position:absolute;left:0;right:0;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 16px)}
.board{max-width:420px;margin:0 auto;box-sizing:border-box;background:var(--wood);border:3px solid var(--ink);box-shadow:6px 6px 0 rgba(0,0,0,.4),inset 0 2px 0 rgba(255,255,255,.08);
  padding:14px;display:flex;flex-direction:column;gap:10px;position:relative}
.board::before,.board::after{content:"";position:absolute;top:8px;width:6px;height:6px;background:var(--dust);box-shadow:0 0 0 2px var(--ink)}
.board::before{left:8px}.board::after{right:8px}
.mbtn{font:400 20px var(--display);min-height:54px;width:100%}
.mbtn.pri{background:var(--rust)}
.mrow{display:flex;gap:10px}.mrow .mbtn{flex:1}
.mlabel,.mtext{margin:0;font-size:16px;line-height:1.4;text-align:center;padding-inline:12px}
.mfoot{margin:0;text-align:center;font-size:13px;color:var(--dust);letter-spacing:.06em}
.help{list-style:none;margin:0;padding:0 4px;display:flex;flex-direction:column;gap:8px;font-size:15px;line-height:1.35}
.help b{display:block;font:400 17px var(--display);color:#f6c86a}
.opt{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:12px 14px;width:100%}
.opt b{font:400 19px var(--display)}
.opt small{font:400 14px var(--ui);color:var(--cream);opacity:.85}
.opt.alt{background:var(--wood-2)}
[hidden]{display:none!important}
@media (prefers-reduced-motion:reduce){#sheet{transition:none}}
</style>

<canvas id="cv" aria-label="Spielkarte"></canvas>

<header id="hud" class="gut"><div class="hud-in">
  <div class="clock"><span id="date">Frühling, Tag 1 · 1868</span><span id="time">08:00</span></div>
  <div class="res" id="res"></div>
</div></header>

<div id="toast" hidden></div>

<nav id="bar" class="gut"><div class="bar-in">
  <div class="seg" role="group" aria-label="Spielgeschwindigkeit">
    <button id="sp0" type="button" aria-pressed="false">Pause</button>
    <button id="sp1" type="button" aria-pressed="true">1×</button>
    <button id="sp3" type="button" aria-pressed="false">3×</button>
  </div>
  <button id="bPeople" type="button">Leute</button>
  <button id="bLog" type="button">Log</button>
  <button id="bMenu" type="button">Menü</button>
</div></nav>

<section id="sheet" aria-hidden="true">
  <div class="grab" id="grab"><span></span></div>
  <div class="shead gut" id="shead"><h2 id="sTitle"></h2><button id="sClose" type="button" aria-label="Schließen">✕</button></div>
  <div id="sBody" class="gut"></div>
</section>

<div id="menu" hidden>
  <canvas id="menuCv" aria-hidden="true"></canvas>
  <div class="m-top gut">
    <span class="eyebrow">Westernsiedlung · 1868</span>
    <h1>Prärie-Siedlung</h1>
    <p class="tag">Aus einem Planwagen wird eine Stadt.</p>
  </div>
  <div class="m-board gut"><div class="board" id="mBoard"></div></div>
</div>

<script>
'use strict';
/* =========================================================
   Hilfen: Zufall, Rauschen
   ========================================================= */
const TILE=16, W=96, H=96, PW=W*TILE, PH=H*TILE;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash(x,y,s){let h=(Math.imul(x,374761393)+Math.imul(y,668265263)+Math.imul(s,1442695041))|0;h=Math.imul(h^(h>>>13),1274126177);h^=h>>>16;return(h>>>0)/4294967296}
function noise(x,y,s){const xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi,u=xf*xf*(3-2*xf),v=yf*yf*(3-2*yf);
  const a=hash(xi,yi,s),b=hash(xi+1,yi,s),c=hash(xi,yi+1,s),d=hash(xi+1,yi+1,s);return a+(b-a)*u+(c-a)*v+(a-b-c+d)*u*v}
function fbm(x,y,s){return noise(x,y,s)*.57+noise(x*2,y*2,s+7)*.29+noise(x*4,y*4,s+13)*.14}
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const pick=(arr,r=Math.random)=>arr[Math.floor(r()*arr.length)];
const rgb=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
function mk(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');g.imageSmoothingEnabled=false;if(fn)fn(g,c);return c}

/* =========================================================
   Welt: Boden, Objekte, Fluss, Lager
   ========================================================= */
const GR={GRASS:0,DRY:1,SAND:2,DIRT:3,ROCK:4,WATER:5,SHALLOW:6};
const OB={NONE:0,TREE:1,JUNIPER:2,CACTUS:3,BOULDER:4,BUSH:5,SKULL:6};
const GR_NAME=['Präriegras','Trockenes Gras','Sand','Erde','Felsboden','Fluss','Furt'];
const OB_NAME=['','Pappel','Wacholder','Kaktus','Felsbrocken','Salbeibusch','Rinderschädel'];
const BLOCKING=[0,1,1,1,1,0,0];

const World={
  gen(seed){
    const ground=new Uint8Array(W*H),obj=new Uint8Array(W*H),river=new Float32Array(H),width=new Float32Array(H);
    const r=mulberry(seed*7+1),ph=r()*10;
    for(let y=0;y<H;y++){river[y]=W*.6+9*Math.sin(y/13+ph)+16*(fbm(y/10,3.3,seed)-.5);width[y]=1.3+fbm(y/7,9,seed)*1.5}
    const f1=10+Math.floor(r()*18),f2=H-30+Math.floor(r()*18);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const i=y*W+x,d=Math.abs(x+.5-river[y]),wid=width[y];
      let m=fbm(x/22,y/22,seed+1);if(d<12)m+=(12-d)/12*.28;
      const rk=fbm(x/13,y/13,seed+2);
      let g;
      if(d<wid)g=(Math.abs(y-f1)<=1||Math.abs(y-f2)<=1)?GR.SHALLOW:GR.WATER;
      else if(d<wid+1.2)g=GR.SAND;
      else if(rk>.66)g=GR.ROCK;
      else if(m<.40)g=GR.SAND;
      else if(m<.50)g=GR.DRY;
      else g=GR.GRASS;
      if(g===GR.DRY&&hash(x,y,seed+5)<.03)g=GR.DIRT;
      ground[i]=g;
      const p=hash(x,y,seed+9);let o=0;
      if(g===GR.GRASS){if(d<8&&p<.13)o=OB.TREE;else if(p<.03)o=OB.TREE;else if(p<.06)o=OB.BUSH}
      else if(g===GR.DRY){if(p<.05)o=OB.BUSH;else if(p<.065)o=OB.JUNIPER}
      else if(g===GR.SAND&&d>wid+1.2){if(p<.04)o=OB.CACTUS;else if(p<.06)o=OB.BUSH;else if(p<.063)o=OB.SKULL}
      else if(g===GR.ROCK){if(p<.16)o=OB.BOULDER;else if(p<.19)o=OB.JUNIPER}
      obj[i]=o;
    }
    // Lagerplatz suchen: westlich vom Fluss, freies Gras ohne Fels und Wasser
    let cx=Math.round(river[H>>1]-13),cy=H>>1,best=null;
    for(let rad=0;rad<30&&!best;rad++)for(let a=0;a<16&&!best;a++){
      const x=Math.round(cx+Math.cos(a/16*6.283)*rad),y=Math.round(cy+Math.sin(a/16*6.283)*rad);
      if(x<8||y<8||x>W-9||y>H-9)continue;
      let ok=true;
      for(let yy=-5;yy<=5&&ok;yy++)for(let xx=-5;xx<=5;xx++){const g=ground[(y+yy)*W+x+xx];if(g===GR.WATER||g===GR.SHALLOW||g===GR.ROCK){ok=false;break}}
      if(ok)best={x,y};
    }
    if(!best)best={x:cx,y:cy};
    for(let yy=-7;yy<=7;yy++)for(let xx=-7;xx<=7;xx++){
      const x=best.x+xx,y=best.y+yy;if(x<0||y<0||x>=W||y>=H)continue;
      const i=y*W+x,dd=Math.hypot(xx,yy);
      if(dd<6.5)obj[i]=0;
      if(dd<3.2+hash(x,y,seed+4)*1.5&&ground[i]<GR.ROCK)ground[i]=GR.DIRT;
    }
    return{seed,ground,obj,river,width,camp:best,blocked:new Uint8Array(W*H),structs:[]};
  },
  inb:(x,y)=>x>=0&&y>=0&&x<W&&y<H,
  walk(x,y){if(x<0||y<0||x>=W||y>=H)return false;const i=y*W+x;return world.ground[i]!==GR.WATER&&!BLOCKING[world.obj[i]]&&!world.blocked[i]},
  cost(x,y){return world.ground[y*W+x]===GR.SHALLOW?4:1},
  addStruct(type,x,y,w,h){const s={type,x,y,w,h};world.structs.push(s);for(let yy=0;yy<h;yy++)for(let xx=0;xx<w;xx++)world.blocked[(y+yy)*W+x+xx]=1;return s},
  near(tx,ty,rad,tries=40){
    for(let k=0;k<tries;k++){const x=Math.round(tx+(Math.random()*2-1)*rad),y=Math.round(ty+(Math.random()*2-1)*rad);if(World.walk(x,y))return{x,y}}
    return null;
  },
  placeStart(opt){
    const c=world.camp;
    World.addStruct('wagon',c.x+1,c.y,2,1);
    if(opt.tents){World.addStruct('tent',c.x-4,c.y-2,2,1);World.addStruct('tent',c.x-4,c.y+2,2,1);World.addStruct('tent',c.x+2,c.y+3,2,1)}
  }
};

/* =========================================================
   Wegfindung: A* auf dem Kachelraster (8 Richtungen)
   ========================================================= */
const Path=(()=>{
  const N=W*H,gS=new Float32Array(N),fS=new Float32Array(N),from=new Int32Array(N),seen=new Uint32Array(N),shut=new Uint32Array(N),heap=[];
  const DX=[1,-1,0,0,1,1,-1,-1],DY=[0,0,1,-1,1,-1,1,-1];let gen=0;
  function push(i){heap.push(i);let k=heap.length-1;while(k>0){const p=(k-1)>>1;if(fS[heap[p]]<=fS[i])break;heap[k]=heap[p];k=p}heap[k]=i}
  function pop(){const top=heap[0],last=heap.pop(),n=heap.length;if(n>0){let k=0;for(;;){const l=2*k+1;if(l>=n)break;const r=l+1,c=(r<n&&fS[heap[r]]<fS[heap[l]])?r:l;if(fS[heap[c]]>=fS[last])break;heap[k]=heap[c];k=c}heap[k]=last}return top}
  function hEst(x,y,tx,ty){const dx=Math.abs(x-tx),dy=Math.abs(y-ty);return Math.max(dx,dy)+.414*Math.min(dx,dy)}
  function find(sx,sy,tx,ty){
    if(!World.walk(tx,ty))return null;
    gen++;heap.length=0;const s=sy*W+sx,t=ty*W+tx;gS[s]=0;fS[s]=hEst(sx,sy,tx,ty);seen[s]=gen;from[s]=-1;push(s);let it=0;
    while(heap.length&&it++<9000){
      const c=pop();
      if(c===t){const out=[];let k=t;while(k!==s&&k>=0){out.push([k%W,(k/W)|0]);k=from[k]}return out.reverse()}
      if(shut[c]===gen)continue;shut[c]=gen;const cx=c%W,cy=(c/W)|0;
      for(let k=0;k<8;k++){
        const nx=cx+DX[k],ny=cy+DY[k];if(!World.walk(nx,ny))continue;
        if(k>=4&&(!World.walk(cx+DX[k],cy)||!World.walk(cx,cy+DY[k])))continue;
        const ni=ny*W+nx;if(shut[ni]===gen)continue;
        const ng=gS[c]+(k>=4?1.414:1)*World.cost(nx,ny);
        if(seen[ni]!==gen||ng<gS[ni]){seen[ni]=gen;gS[ni]=ng;fS[ni]=ng+hEst(nx,ny,tx,ty);from[ni]=c;push(ni)}
      }
    }
    return null;
  }
  return{find};
})();

/* =========================================================
   Darstellung: Pixel-Sprites im Code
   ========================================================= */
const OUTLINE='#24150b';
function outline(c,col=OUTLINE){
  const g=c.getContext('2d'),w=c.width,h=c.height,d=g.getImageData(0,0,w,h),a=d.data,mark=new Uint8Array(w*h),[r,gg,b]=rgb(col);
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    if(a[(y*w+x)*4+3])continue;
    const o=(xx,yy)=>xx>=0&&yy>=0&&xx<w&&yy<h&&a[(yy*w+xx)*4+3]>0;
    if(o(x-1,y)||o(x+1,y)||o(x,y-1)||o(x,y+1))mark[y*w+x]=1;
  }
  for(let i=0;i<w*h;i++)if(mark[i]){a[i*4]=r;a[i*4+1]=gg;a[i*4+2]=b;a[i*4+3]=255}
  g.putImageData(d,0,0);return c;
}
function shadow(w,h){return mk(w,h,g=>{g.fillStyle='rgba(36,18,6,.30)';for(let y=0;y<h;y++)for(let x=0;x<w;x++){const dx=(x+.5-w/2)/(w/2),dy=(y+.5-h/2)/(h/2);if(dx*dx+dy*dy<=1)g.fillRect(x,y,1,1)}})}
function blob(g,cx,cy,rad,cols,seed,lx=-1,ly=-1){
  for(let y=Math.floor(cy-rad);y<=cy+rad;y++)for(let x=Math.floor(cx-rad);x<=cx+rad;x++){
    const dx=x+.5-cx,dy=y+.5-cy,dd=Math.hypot(dx,dy);if(dd>rad)continue;
    const l=(dx*lx+dy*ly)/rad+(hash(x,y,seed)-.5)*.7;
    g.fillStyle=l>.35?cols[0]:l>-.35?cols[1]:cols[2];g.fillRect(x,y,1,1);
  }
}

const SPR={};
function buildStaticSprites(){
  SPR.tree=outline(mk(26,32,g=>{
    g.fillStyle='#6a4426';g.fillRect(11,19,4,12);g.fillStyle='#4e3019';g.fillRect(13,19,2,12);g.fillRect(9,29,2,2);g.fillRect(15,29,2,2);
    const c=['#a6b04c','#7c9038','#566a2a'];
    blob(g,8,15,6,c,3);blob(g,18,15,6,c,4);blob(g,13,10,8.5,c,5);
  }));
  SPR.juniper=outline(mk(16,22,g=>{
    g.fillStyle='#5a3a20';g.fillRect(7,16,2,5);
    const c=['#8a9e6a','#647a50','#46583a'];
    blob(g,8,13,5,c,6);blob(g,8,8,4,c,7);blob(g,8,4.5,2.5,c,8);
  }));
  SPR.cactus=outline(mk(14,22,g=>{
    const R=(x,y,w,h,c)=>{g.fillStyle=c;g.fillRect(x,y,w,h)};
    R(5,2,4,19,'#5f8f3c');R(6,2,1,19,'#86b456');R(8,3,1,18,'#3f6a2a');R(5,1,4,1,'#5f8f3c');
    R(1,7,2,6,'#5f8f3c');R(1,7,1,6,'#86b456');R(1,12,4,2,'#5f8f3c');
    R(10,5,2,6,'#5f8f3c');R(11,5,1,6,'#3f6a2a');R(9,10,3,2,'#5f8f3c');
    R(6,0,2,1,'#e0a0b0');
  }));

    const jx=clamp(px+((hj*7)|0)-3,0,PW-1),jy=clamp(py+(((hj*49)|0)%7)-3,0,PH-1);
    const gt=gr[(jy>>4)*W+(jx>>4)],n=hash(px,py,s+77);let k=0;
    if(gt>=GR.WATER){const wave=(py+Math.round(2*Math.sin(px/7+(py>>3))))&7;if(wave===0&&n>.25)k=1;else if(wave===4&&n>.75)k=2}
    else{const m=noise(px/22,py/22,s+3),t=n*.7+m*.6-.3;k=t<.08?2:t>.82?1:0}
    const col=PAL[gt][k],o=(py*PW+px)*4;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2];d[o+3]=255;
  }
  const set=(x,y,col)=>{if(x<0||y<0||x>=PW||y>=PH)return;const o=(y*PW+x)*4;d[o]=col[0];d[o+1]=col[1];d[o+2]=col[2]};
  const tuftL=rgb('#c0c26a'),tuftD=rgb('#6a7432'),dryL=rgb('#e0c47c'),dryD=rgb('#9a8044'),peb=rgb('#b8986e'),pebL=rgb('#f2deb4'),crack=rgb('#76584a'),fy=rgb('#ecc64a'),fp=rgb('#c27ab0'),fw=rgb('#f2ece0');
  for(let ty=0;ty<H;ty++)for(let tx=0;tx<W;tx++){

      else if(gt===GR.DRY&&h1<.5){set(x,y,dryD);set(x-1,y-1,dryL);set(x+1,y-2,dryL)}
      else if((gt===GR.SAND||gt===GR.DIRT)&&h1<.3){set(x,y,peb);set(x+1,y,peb);set(x,y-1,pebL)}

}

  },
  update(s,dt){

      const [tx,ty]=s.path[0],gx=tx+.5,gy=ty+.5,dx=gx-s.x,dy=gy-s.y,d=Math.hypot(dx,dy);
      const slow=world.ground[Math.floor(s.y)*W+Math.floor(s.x)]===GR.SHALLOW?.45:1,step=1.6*s.spd*slow*dt;
      if(!World.walk(tx,ty)){s.path=null;s.idle=.5;return}
      if(d<=step){s.x=gx;s.y=gy;s.path.shift();s.anim+=d}else{s.x+=dx/d*step;s.y+=dy/d*step;s.anim+=step;s.dir=faceDir(dx,dy)}
      s.moving=true;
      if(!s.path.length){s.path=null;s.moving=false;AI.arrive(s)}
    }else{
      s.moving=false;s.idle-=dt;if(s.idle<=0)AI.think(s);
    }
  }
};
function faceDir(dx,dy){return Math.abs(dx)>Math.abs(dy)?(dx>0?3:2):(dy>0?0:1)}

/* =========================================================
   Wildtiere: Pferdeherde und Hasen
   ========================================================= */
function lineFree(x0,y0,x1,y1){const n=Math.ceil(Math.hypot(x1-x0,y1-y0)*2);for(let i=1;i<=n;i++){const t=i/n;if(!World.walk(Math.floor(x0+(x1-x0)*t),Math.floor(y0+(y1-y0)*t)))return false}return true}
function makeAnimals(r){
  const c=world.camp,hs=[],rb=[];
  let hx=0,hy=0;
  for(let k=0;k<60;k++){const a=r()*6.283,d=18+r()*10;hx=Math.round(c.x+Math.cos(a)*d);hy=Math.round(c.y+Math.sin(a)*d);if(World.walk(hx,hy)&&world.ground[hy*W+hx]<GR.ROCK)break}
  const n=5+Math.floor(r()*3);
  for(let i=0;i<n;i++){const p=World.near(hx,hy,3)||{x:hx,y:hy},coat=Math.floor(r()*COATS.length);
    hs.push({id:i,coat,seed:Math.floor(r()*1e6),x:p.x+.5,y:p.y+.5,face:r()<.5?1:-1,anim:0,tx:null,ty:null,wait:r()*4,run:0,ox:(r()*2-1)*2.5,oy:(r()*2-1)*2.5})}
  for(let i=0;i<10;i++){for(let k=0;k<40;k++){const x=Math.floor(r()*W),y=Math.floor(r()*H);if(World.walk(x,y)&&world.ground[y*W+x]<=GR.DRY&&Math.hypot(x-c.x,y-c.y)>8){rb.push({x:x+.5,y:y+.5,face:1,hop:0,wait:r()*3,tx:null,ty:null});break}}}
  return{hs,rb};
}
const Animals={
  update(dt){
    const lead=horses[0];
    for(const h of horses){
      let fear=null;for(const s of settlers){const d=Math.hypot(s.x-h.x,s.y-h.y);if(d<3.2){fear=s;break}}
      if(fear&&h.run<=0){const a=Math.atan2(h.y-fear.y,h.x-fear.x),tx=h.x+Math.cos(a)*6,ty=h.y+Math.sin(a)*6;if(lineFree(h.x,h.y,tx,ty)){h.tx=tx;h.ty=ty;h.run=1.5}}
      h.run-=dt;
      if(h.tx===null){h.wait-=dt;if(h.wait<=0){
        let tx,ty;
        if(h===lead){const a=Math.random()*6.283,d=3+Math.random()*7;tx=h.x+Math.cos(a)*d;ty=h.y+Math.sin(a)*d}
        else{tx=lead.x+h.ox+(Math.random()-.5);ty=lead.y+h.oy+(Math.random()-.5)}
        if(lineFree(h.x,h.y,tx,ty)){h.tx=tx;h.ty=ty}else h.wait=.5+Math.random();
      }}
      if(h.tx!==null){
        const dx=h.tx-h.x,dy=h.ty-h.y,d=Math.hypot(dx,dy),sp=(h.run>0?3.4:.9)*dt;
        if(d<=sp){h.x=h.tx;h.y=h.ty;h.tx=null;h.wait=1+Math.random()*5}else{h.x+=dx/d*sp;h.y+=dy/d*sp;h.anim+=sp*(h.run>0?1.4:1)}
        if(Math.abs(dx)>.05)h.face=dx>0?1:-1;
      }
    }
    for(const b of rabbits){
      let fear=null;for(const s of settlers){if(Math.hypot(s.x-b.x,s.y-b.y)<3){fear=s;break}}
      if(b.tx===null){b.wait-=dt;if(b.wait<=0||fear){
        let a=Math.random()*6.283;if(fear)a=Math.atan2(b.y-fear.y,b.x-fear.x)+(Math.random()-.5);
        const d=fear?3:1+Math.random()*2,tx=b.x+Math.cos(a)*d,ty=b.y+Math.sin(a)*d;
        if(lineFree(b.x,b.y,tx,ty)){b.tx=tx;b.ty=ty;b.fast=!!fear}else b.wait=.4;
      }}
      if(b.tx!==null){const dx=b.tx-b.x,dy=b.ty-b.y,d=Math.hypot(dx,dy),sp=(b.fast?4:1.6)*dt;
        if(d<=sp){b.x=b.tx;b.y=b.ty;b.tx=null;b.wait=1+Math.random()*4}else{b.x+=dx/d*sp;b.y+=dy/d*sp;b.hop+=sp}
        if(Math.abs(dx)>.05)b.face=dx>0?1:-1}
    }
  }
};

/* =========================================================
   Kamera und Darstellung
   ========================================================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let dpr=1,cw=0,ch=0;
const cam={x:PW/2,y:PH/2,S:3,follow:null};
function Smin(){return Math.max(1,Math.round(dpr))}
function Smax(){return Math.max(Smin()+1,Math.round(dpr*7))}
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);
  cw=Math.round(cv.clientWidth*dpr);ch=Math.round(cv.clientHeight*dpr);cv.width=cw;cv.height=ch;
  cam.S=clamp(cam.S,Smin(),Smax());clampCam();
}
function clampCam(){
  const hw=cw/2/cam.S,hh=ch/2/cam.S;
  cam.x=PW<hw*2?PW/2:clamp(cam.x,hw,PW-hw);
  cam.y=PH<hh*2?PH/2:clamp(cam.y,hh,PH-hh);
}
function toWorld(clientX,clientY){const r=cv.getBoundingClientRect(),sx=(clientX-r.left)*dpr,sy=(clientY-r.top)*dpr;return{x:cam.x+(sx-cw/2)/cam.S,y:cam.y+(sy-ch/2)/cam.S}}

let terrain=null,sheets=new Map(),horseSheets=new Map(),rabbitSpr=null,pics=new Map();
const Render={
  frame(now){
    const S=cam.S,ox=Math.round(cw/2-cam.x*S),oy=Math.round(ch/2-cam.y*S);
    ctx.setTransform(1,0,0,1,0,0);ctx.imageSmoothingEnabled=false;ctx.fillStyle='#1e120a';ctx.fillRect(0,0,cw,ch);
    ctx.setTransform(S,0,0,S,ox,oy);ctx.imageSmoothingEnabled=false;
    const vx0=Math.max(0,Math.floor(-ox/S)),vy0=Math.max(0,Math.floor(-oy/S)),vx1=Math.min(PW,Math.ceil((cw-ox)/S)),vy1=Math.min(PH,Math.ceil((ch-oy)/S));
    if(vx1>vx0&&vy1>vy0)ctx.drawImage(terrain,vx0,vy0,vx1-vx0,vy1-vy0,vx0,vy0,vx1-vx0,vy1-vy0);
    const tx0=Math.max(0,(vx0>>4)-2),ty0=Math.max(0,(vy0>>4)-1),tx1=Math.min(W-1,(vx1>>4)+2),ty1=Math.min(H-1,(vy1>>4)+3);
    // Glitzern auf dem Wasser
    const tick=Math.floor(now/450);ctx.fillStyle='#b8e0ee';
    for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const gt=world.ground[ty*W+tx];if(gt===GR.WATER&&hash(tx,ty,tick)<.12){ctx.fillRect(tx*16+Math.floor(hash(tx,ty,tick+1)*12),ty*16+Math.floor(hash(tx,ty,tick+2)*14),2,1)}}
    // Alles mit Höhe nach y sortiert zeichnen
    const list=[];
    for(let ty=ty0;ty<=ty1;ty++)for(let tx=tx0;tx<=tx1;tx++){const o=world.obj[ty*W+tx];if(o)list.push({y:ty*16+13,k:0,o,tx,ty})}
    for(const s of world.structs)list.push({y:(s.y+s.h)*16-2,k:1,s});
    for(const h of horses)if(inView(h,vx0,vy0,vx1,vy1))list.push({y:Math.round(h.y*16)+3,k:3,h});
    for(const b of rabbits)if(inView(b,vx0,vy0,vx1,vy1))list.push({y:Math.round(b.y*16)+2,k:4,b});
    for(const s of settlers)if(inView(s,vx0,vy0,vx1,vy1))list.push({y:Math.round(s.y*16)+4,k:2,p:s});
    list.sort((a,b)=>a.y-b.y);
    for(const e of list){
      if(e.k===0){const name=OB_SPR[e.o],sp=SPR[name],sh=SPR.sh[name],jx=Math.round((hash(e.tx,e.ty,world.seed+50)-.5)*4);
        const bx=e.tx*16+8+jx,by=e.ty*16+14;ctx.drawImage(sh,bx-(sh.width>>1),by-(sh.height>>1));ctx.drawImage(sp,bx-(sp.width>>1),by-sp.height+1)}
      else if(e.k===1){const s=e.s,sp=SPR[s.type],sh=SPR.sh[s.type],bx=Math.round((s.x+s.w/2)*16),by=(s.y+s.h)*16-2;
        ctx.drawImage(sh,bx-(sh.width>>1),by-(sh.height>>1));ctx.drawImage(sp,bx-(sp.width>>1),by-sp.height+2)}
      else if(e.k===2){const s=e.p,px=Math.round(s.x*16),py=Math.round(s.y*16)+4,sh=sheets.get(s.id);
        const fr=s.moving?[1,0,2,0][Math.floor(s.anim*4)&3]:0;
        ctx.drawImage(SPR.sh.person,px-5,py-2);ctx.drawImage(sh,fr*CW,s.dir*CH,CW,CH,px-9,py-21,CW,CH);
        if(state.sel===s.id){const bob=Math.floor(now/250)&1;ctx.fillStyle='#24150b';ctx.fillRect(px-3,py-30+bob,7,4);ctx.fillRect(px-2,py-26+bob,5,2);
          ctx.fillStyle='#f2c64a';ctx.fillRect(px-2,py-29+bob,5,2);ctx.fillRect(px-1,py-27+bob,3,1);ctx.fillRect(px,py-26+bob,1,1)}}
      else if(e.k===3){const h=e.h,px=Math.round(h.x*16),py=Math.round(h.y*16)+3,sh=horseSheets.get(h.id);
        const moving=h.tx!==null,fr=moving?[1,0,2,0][Math.floor(h.anim*3)&3]:0;
        ctx.drawImage(SPR.sh.horse,px-9,py-2);ctx.drawImage(sh,fr*HW,h.face>0?HH:0,HW,HH,px-12,py-16,HW,HH)}
      else{const b=e.b,px=Math.round(b.x*16),py=Math.round(b.y*16)+2,fr=b.tx!==null?(Math.floor(b.hop*3)&1):0;
        ctx.drawImage(SPR.sh.rabbit,px-3,py-1);ctx.drawImage(rabbitSpr,fr*10,b.face>0?9:0,10,9,px-5,py-8,10,9)}
    }
  }
};
function inView(o,x0,y0,x1,y1){const px=o.x*16,py=o.y*16;return px>x0-24&&px<x1+24&&py>y0-8&&py<y1+32}

   Spielzustand, Zeit, Protokoll

let world=null,settlers=[],horses=[],rabbits=[];
let state={seed:1,opt:{tents:true},t:8*60,speed:1,res:{},log:[],sel:null,flags:{},started:false};
const RES=[['holz','Holz','#9a6438'],['stein','Stein','#a8a29a'],['lehm','Lehm','#b8704a'],['stroh','Stroh','#e0c46a'],['felle','Felle','#7a5a3a'],['nahrung','Nahrung','#c0532e']];
const SEASONS=['Frühling','Sommer','Herbst','Winter'];
function dateParts(t){const day=Math.floor(t/1440),season=Math.floor(day/30)%4,year=1868+Math.floor(day/120),hh=Math.floor(t%1440/60),mm=Math.floor(t%60);
  return{day:day%30+1,abs:day+1,season:SEASONS[season],year,clock:String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0')}}
function log(text){const d=dateParts(state.t);state.log.unshift({when:'Tag '+d.abs+', '+d.clock,text});if(state.log.length>80)state.log.pop();if(UI.view==='log')UI.showLog()}

function newGame(opt,seed){
  state={seed,opt,t:8*60,speed:1,res:{},log:[],sel:null,flags:{},started:true};
  state.res=opt.tents?{holz:4,stein:0,lehm:0,stroh:2,felle:3,nahrung:40}:{holz:2,stein:0,lehm:0,stroh:0,felle:1,nahrung:24};
  buildWorld(seed);World.placeStart(opt);
  const r=mulberry(seed*13+5);
  settlers=makeSettlers(5+Math.floor(r()*4),r);
  const a=makeAnimals(r);horses=a.hs;rabbits=a.rb;
  buildSheets();
  cam.x=(world.camp.x+1)*16;cam.y=(world.camp.y+.5)*16;cam.S=clamp(Math.round(dpr*2.25),Smin(),Smax());clampCam();
  log(settlers.length+' Siedler erreichen mit ihrem Planwagen die Prärie.');
  log(opt.tents?'Die Siedler schlagen drei Zelte auf.':'Ohne Zelte schlafen alle unter freiem Himmel.');
  UI.setSpeed(1);UI.hud();
}
function buildWorld(seed){world=World.gen(seed);terrain=renderTerrain();rabbitSpr=rabbitSpr||rabbitSheet()}
function buildSheets(){
  sheets=new Map();pics=new Map();horseSheets=new Map();
  for(const s of settlers){const sh=personSheet(s.look);sheets.set(s.id,sh);pics.set(s.id,portrait(sh))}
  for(const h of horses)horseSheets.set(h.id,horseSheet(COATS[h.coat],h.seed));
}
function serialize(){return{state,settlers:settlers.map(s=>Object.assign({},s,{path:null,arrive:null,idle:Math.min(s.idle,1)})),horses,rabbits,cam:{x:cam.x,y:cam.y,S:cam.S,follow:cam.follow}}}
function restore(d){
  state=d.state;buildWorld(state.seed);World.placeStart(state.opt);
  settlers=d.settlers;horses=d.horses;rabbits=d.rabbits;buildSheets();
  Object.assign(cam,d.cam);
}

(()=>{let y0=null,dy=0;const sh=$('sheet');
  const down=e=>{y0=e.clientY;dy=0;sh.style.transition='none';e.currentTarget.setPointerCapture(e.pointerId)};

/* =========================================================
   Eingabe: Touch ziehen, mit zwei Fingern zoomen, tippen
   ========================================================= */
const ptrs=new Map();let gest=null;
function pinchInfo(){const [a,b]=[...ptrs.values()];return{d:Math.hypot(a.x-b.x,a.y-b.y)||1,mx:(a.x+b.x)/2,my:(a.y+b.y)/2}}
function zoomAt(newS,clientX,clientY){
  const wp=toWorld(clientX,clientY),r=cv.getBoundingClientRect();cam.S=clamp(newS,Smin(),Smax());
  cam.x=wp.x-((clientX-r.left)*dpr-cw/2)/cam.S;cam.y=wp.y-((clientY-r.top)*dpr-ch/2)/cam.S;clampCam();
}
cv.addEventListener('pointerdown',e=>{
  cv.setPointerCapture(e.pointerId);ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  if(ptrs.size===1)gest={type:'pan',sx:e.clientX,sy:e.clientY,lx:e.clientX,ly:e.clientY,t:performance.now(),moved:false};
  else if(ptrs.size===2){const p=pinchInfo();gest={type:'pinch',d0:p.d,S0:cam.S,wp:toWorld(p.mx,p.my),lmx:p.mx,lmy:p.my};cam.follow=null}
});
cv.addEventListener('pointermove',e=>{
  if(!ptrs.has(e.pointerId))return;ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});if(!gest)return;
  if(gest.type==='pan'&&ptrs.size===1){
    const dx=e.clientX-gest.lx,dy=e.clientY-gest.ly;gest.lx=e.clientX;gest.ly=e.clientY;
    if(!gest.moved&&Math.hypot(e.clientX-gest.sx,e.clientY-gest.sy)>8){gest.moved=true;cam.follow=null}
    if(gest.moved){cam.x-=dx*dpr/cam.S;cam.y-=dy*dpr/cam.S;clampCam()}
  }else if(gest.type==='pinch'&&ptrs.size>=2){
    const p=pinchInfo(),r=cv.getBoundingClientRect();cam.S=clamp(Math.round(gest.S0*p.d/gest.d0),Smin(),Smax());
    cam.x=gest.wp.x-((p.mx-r.left)*dpr-cw/2)/cam.S;cam.y=gest.wp.y-((p.my-r.top)*dpr-ch/2)/cam.S;clampCam();
  }
});
function endPtr(e){
  if(!ptrs.has(e.pointerId))return;ptrs.delete(e.pointerId);
  if(gest&&gest.type==='pan'&&!gest.moved&&e.type==='pointerup'&&performance.now()-gest.t<500)tap(e.clientX,e.clientY);
  if(ptrs.size===1){const [p]=[...ptrs.values()];gest={type:'pan',sx:p.x,sy:p.y,lx:p.x,ly:p.y,t:0,moved:true}}
  else if(ptrs.size===0)gest=null;
}
cv.addEventListener('pointerup',endPtr);cv.addEventListener('pointercancel',endPtr);
cv.addEventListener('wheel',e=>{e.preventDefault();zoomAt(cam.S+(e.deltaY<0?1:-1),e.clientX,e.clientY)},{passive:false});

function tap(cx,cy){
  if(!state.started)return;
  const w=toWorld(cx,cy),pad=4;let best=null,bd=1e9;
  for(const s of settlers){const px=s.x*16,py=s.y*16+4;if(w.x>px-7-pad&&w.x<px+7+pad&&w.y>py-21-pad&&w.y<py+2+pad){const d=Math.hypot(w.x-px,w.y-(py-9));if(d<bd){bd=d;best=s}}}
  if(best){UI.showSettler(best);return}
  for(const h of horses){const px=h.x*16,py=h.y*16+3;if(w.x>px-12&&w.x<px+12&&w.y>py-17&&w.y<py+3){UI.close();UI.toast('Wildpferd · Fellfarbe '+COATS[h.coat].n);return}}
  for(const b of rabbits){const px=b.x*16,py=b.y*16;if(Math.abs(w.x-px)<8&&w.y>py-10&&w.y<py+4){UI.close();UI.toast('Präriehase');return}}
  if(UI.view){UI.close();return}
  const tx=Math.floor(w.x/16),ty=Math.floor(w.y/16);if(!World.inb(tx,ty))return;
  const st=world.structs.find(s=>tx>=s.x&&tx<s.x+s.w&&ty>=s.y-1&&ty<s.y+s.h);
  if(st){UI.toast(st.type==='wagon'?'Planwagen mit den Vorräten der Siedler':'Zelt');return}
  let o=world.obj[ty*W+tx];if(!o&&World.inb(tx,ty+1)){const o2=world.obj[(ty+1)*W+tx];if(o2===OB.TREE||o2===OB.CACTUS||o2===OB.JUNIPER)o=o2}
  UI.toast(o?OB_NAME[o]:GR_NAME[world.ground[ty*W+tx]],1400);
}

const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
const stops=a=>a.map(([p,c])=>[p,rgb(c)]);
const SKY=stops([[0,'#241a36'],[.32,'#46284a'],[.55,'#7e3446'],[.74,'#c0563a'],[.88,'#e8904a'],[1,'#f6c86a']]);
const GROUND=stops([[0,'#e09a52'],[.12,'#c87c40'],[.4,'#9a6434'],[.75,'#74502a'],[1,'#523a1e']]);
const RIVER=stops([[0,'#f6c86a'],[.3,'#e8904a'],[.65,'#c0563a'],[1,'#7e3446']]);
function grad(st,t,x,y){let i=0;while(i<st.length-2&&t>st[i+1][0])i++;const a=st[i],b=st[i+1],f=clamp((t-a[0])/(b[0]-a[0]),0,1);return f*16>BAYER[(y&3)*4+(x&3)]+.5?b[1]:a[1]}
function ridge(n,r,minH,maxH,gap){
  const h=new Float32Array(n);let x=0,cur=0;
  while(x<n){const target=r()<gap?0:minH+r()*(maxH-minH),sl=2+Math.floor(r()*4),from=cur;
    for(let i=1;i<=sl&&x<n;i++,x++)h[x]=from+(target-from)*i/sl;
    const len=8+Math.floor(r()*28);for(let i=0;i<len&&x<n;i++,x++)h[x]=target;cur=target}
  return h;
}
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const Menu={
  open:false,view:'main',P:4,aw:0,ah:0,hz:0,LW:0,L:null,
  init(){
    this.cv=$('menuCv');this.g=this.cv.getContext('2d');this.seed=(Math.random()*1e9)|0;
    const r=mulberry(this.seed);
    this.people=[makeLook(r,false,30),makeLook(r,true,26),makeLook(r,false,50)].map(personSheet);
    this.herd=[0,1,2,3,4].map(i=>({sh:horseSheet(COATS[(i*2+1+Math.floor(r()*6))%COATS.length],i*91+7),off:i*26+r()*10,dy:(i%3)*3}));
    this.clouds=[0,1,2,3].map(i=>({x:r()*400,y:.12+r()*.4,w:18+Math.floor(r()*30),s:1+r()*2}));
  },
  resize(){
    if(!this.open)return;const c=this.cv,d=Math.min(window.devicePixelRatio||1,3),w=Math.round(c.clientWidth*d),h=Math.round(c.clientHeight*d);if(!w||!h)return;
    if(w===this.cw&&h===this.ch&&this.L)return;this.cw=w;this.ch=h;c.width=w;c.height=h;
    this.P=Math.max(1,Math.round(Math.min(w,h*.6)/190));this.aw=Math.ceil(w/this.P);this.ah=Math.ceil(h/this.P);this.build();
  },
  build(){
    const aw=this.aw,ah=this.ah,LW=aw+80,hz=Math.round(ah*.47),gh=ah-hz,r=mulberry(this.seed+1);this.LW=LW;this.hz=hz;this.gh=gh;
    const sky=mk(LW,hz+1,g=>{
      const img=g.createImageData(LW,hz+1),d=img.data,star=rgb('#f2e6c8');
      for(let y=0;y<=hz;y++)for(let x=0;x<LW;x++){let c=grad(SKY,y/hz,x,y);if(y<hz*.3&&hash(x,y,this.seed)<.004)c=star;const o=(y*LW+x)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}
      g.putImageData(img,0,0);
      const R=Math.max(10,Math.round(aw*.085)),sx=Math.round(LW*.62),sy=hz-Math.round(ah*.12)-Math.round(R*.4);
      for(let dy=-R-3;dy<=R+3;dy++)for(let dx=-R-3;dx<=R+3;dx++){
        const dd=Math.hypot(dx,dy);
        if(dd<=R){const cut=dy>R*.15&&(dy%4===0||(dy>R*.55&&dy%4===1));if(cut)continue;g.fillStyle=dd<R*.6&&dx<0&&dy<0?'#fff1b8':'#fbe08a';g.fillRect(sx+dx,sy+dy,1,1)}
        else if(dd<=R+3&&((dx+dy)&1)===0){g.fillStyle='#f6c86a';g.fillRect(sx+dx,sy+dy,1,1)}
      }
    });
    const far=mk(LW,hz+1,g=>{const h=ridge(LW,r,ah*.03,ah*.12,.15);
      for(let x=0;x<LW;x++){const top=Math.round(hz-h[x]);g.fillStyle='#6e3a54';g.fillRect(x,top,1,hz+1-top);if(h[x]>0){g.fillStyle='#8a4a62';g.fillRect(x,top,1,1)}}});
    const mid=mk(LW,hz+3,g=>{const h=ridge(LW,r,ah*.02,ah*.075,.55),base=hz+2;
      for(let x=0;x<LW;x++){if(h[x]<1)continue;const top=Math.round(base-h[x]),lit=x>0&&h[x]>h[x-1]+.3;
        for(let y=top;y<=base;y++){g.fillStyle=lit?'#c0603a':(base-y)%5===2?'#843e2a':'#9a4a30';g.fillRect(x,y,1,1)}
        g.fillStyle='#d87a4a';g.fillRect(x,top,1,1)}});
    const riverX=t=>LW*.56+(LW*.3-LW*.56)*t+Math.sin(t*6+1)*10*t;this.riverX=riverX;
    const ground=mk(LW,gh,g=>{
      const img=g.createImageData(LW,gh),d=img.data,hi=rgb('#fbe08a'),bank=rgb('#5e3a22');
      for(let y=0;y<gh;y++){const t=y/gh,cx=riverX(t),wid=1+t*t*aw*.22;
        for(let x=0;x<LW;x++){let c;const dx=Math.abs(x+.5-cx);
          if(dx<wid){c=grad(RIVER,t,x,y);if(y%3===0&&hash(x,y,3)<.08)c=hi}
          else if(dx<wid+1+t*2)c=bank;else c=grad(GROUND,t,x,y);
          const o=(y*LW+x)*4;d[o]=c[0];d[o+1]=c[1];d[o+2]=c[2];d[o+3]=255}}
      g.putImageData(img,0,0);
      const n=Math.round(LW*gh*.025);
      for(let i=0;i<n;i++){const x=Math.floor(r()*LW),y=Math.floor(r()*gh),t=y/gh;if(Math.abs(x-riverX(t))<3+t*t*aw*.22)continue;
        const s=1+Math.floor(t*3);g.fillStyle=t<.3?'#b06a36':'#5e4422';g.fillRect(x,y-s+1,1,s);g.fillStyle=t<.3?'#e8a860':'#b49048';g.fillRect(x-1,y-s+1,1,Math.max(1,s-1));if(s>2)g.fillRect(x+1,y-s,1,s-1)}
    });
    this.L={sky,far,mid,ground};
    const cy=hz+Math.round(gh*.32);
    this.camp={y:cy,tent:Math.round(aw*.11)+40,wagon:Math.round(aw*.33)+40,fire:Math.round(aw*.22)+40,
      cacti:[[Math.round(aw*.80)+40,hz+Math.round(gh*.2)],[Math.round(aw*.93)+40,hz+Math.round(gh*.42)],[Math.round(aw*.70)+40,hz+Math.round(gh*.1)]]};
  },
  frame(now){
    this.resize();if(!this.L)return;
    const g=this.g,P=this.P,t=now/1000,LW=this.LW,hz=this.hz,gh=this.gh,pan=f=>reduceMotion?0:Math.round(Math.sin(t*.08)*f);
    g.setTransform(1,0,0,1,0,0);g.imageSmoothingEnabled=false;g.setTransform(P,0,0,P,0,0);
    g.drawImage(this.L.sky,-40+pan(3),0);
    for(const c of this.clouds){const x=Math.round(((c.x+t*c.s)%(LW+60))-60)+pan(3),y=Math.round(hz*c.y);
      g.fillStyle='#b8506a';g.fillRect(x+4,y,c.w-8,1);g.fillRect(x,y+1,c.w,2);g.fillStyle='#f0a060';g.fillRect(x+2,y+3,c.w-4,1)}
    for(let i=0;i<3;i++){const bx=Math.round(((t*7+i*14)%(LW+40))-20),by=Math.round(hz*.28+i*5+Math.sin(t+i)*2),up=(Math.floor(t*4+i)&1);
      g.fillStyle='#24150b';g.fillRect(bx,by,1,1);g.fillRect(bx-1,by-up,1,1);g.fillRect(bx+1,by-up,1,1);g.fillRect(bx-2,by-1+up*0,1,1);g.fillRect(bx+2,by-1,1,1)}
    g.drawImage(this.L.far,-40+pan(8),0);
    g.drawImage(this.L.mid,-40+pan(16),0);
    const gp=-40+pan(28);
    g.drawImage(this.L.ground,gp,hz);
    // Herde galoppiert am Horizont entlang
    const hy=hz+Math.round(gh*.09),hp=-40+pan(20),span=LW+80;
    for(const h of this.herd){
      const x=Math.round(LW-((t*14+h.off)%span))+hp-20,y=hy+h.dy,fr=[1,0,2,0][Math.floor(t*9+h.off)&3];
      g.fillStyle='#e8a868';for(let k=0;k<3;k++)if(hash(k,Math.floor(t*10),h.off|0)<.6)g.fillRect(x+18+k*3,y-1-k,2,1);
      g.drawImage(SPR.sh.horse,x+3,y-2);g.drawImage(h.sh,fr*HW,0,HW,HH,x,y-16,HW,HH);
    }
    // Lager im Vordergrund
    const c=this.camp,list=[];
    list.push({y:c.y,f:()=>{const sp=SPR.tent;g.drawImage(SPR.sh.tent,gp+c.tent-13,c.y-3);g.drawImage(sp,gp+c.tent-14,c.y-sp.height+2)}});
    list.push({y:c.y+1,f:()=>{const sp=SPR.wagon;g.drawImage(SPR.sh.wagon,gp+c.wagon-17,c.y-3);g.drawImage(sp,gp+c.wagon-18,c.y-sp.height+3)}});
    for(const [x,y] of c.cacti)list.push({y,f:()=>{g.drawImage(SPR.sh.cactus,gp+x-5,y-2);g.drawImage(SPR.cactus,gp+x-7,y-SPR.cactus.height+1)}});
    const fx=gp+c.fire,fy=c.y+6;
    list.push({y:fy,f:()=>{
      g.fillStyle='#5a341c';g.fillRect(fx-4,fy-1,8,2);g.fillStyle='#3a2414';g.fillRect(fx-3,fy,2,1);g.fillRect(fx+1,fy-1,2,1);
      const tk=Math.floor(t*8);
      for(let k=-2;k<=2;k++){const hgt=2+Math.floor(hash(k,tk,4)*(5-Math.abs(k)*1.2));
        g.fillStyle='#d0503a';g.fillRect(fx+k,fy-1-hgt,1,hgt);if(hgt>2){g.fillStyle='#f2a03a';g.fillRect(fx+k,fy-hgt,1,hgt-2)}if(hgt>4&&Math.abs(k)<2){g.fillStyle='#fbe08a';g.fillRect(fx+k,fy-hgt+2,1,2)}}
      for(let i=0;i<7;i++){const a=(t*.35+i/7)%1,sx=Math.round(fx+a*12+Math.sin(a*6+i)*2),sy=Math.round(fy-8-a*34);g.fillStyle=a<.5?'#a8968c':'#7e6e70';g.fillRect(sx,sy,a<.4?2:1,a<.4?2:1)}
    }});
    const ppl=[[fx-13,fy-1,3,0],[fx+13,fy-1,2,1],[fx+2,fy+9,1,2]];
    for(const [x,y,dir,i] of ppl)list.push({y,f:()=>{g.drawImage(SPR.sh.person,x-5,y-2);g.drawImage(this.people[i],0,dir*CH,CW,CH,x-9,y-21,CW,CH)}});
    list.sort((a,b)=>a.y-b.y);for(const e of list)e.f();
    // Feuerschein
    g.fillStyle='rgba(251,200,106,.10)';for(let ry=-6;ry<=6;ry++){const w=Math.round(Math.sqrt(36-ry*ry)*3);g.fillRect(fx-w,fy+ry-2,w*2,1)}
  },
  show(){
    this.open=true;this.view='main';$('menu').hidden=false;this.cw=0;this.resize();this.render();
  },
  hide(){this.open=false;$('menu').hidden=true},
  render(){
    const b=$('mBoard'),started=state.started,v=this.view;let h='';
    if(v==='main')h=(started?'<button type="button" class="mbtn pri" id="mbCont">Weiterspielen</button>':'')+
      '<button type="button" class="mbtn'+(started?'':' pri')+'" id="mbNew">Neues Spiel</button><button type="button" class="mbtn" id="mbHelp">Anleitung</button><p class="mfoot">Bauschritt 1 von 8</p>';
    else if(v==='confirm')h='<p class="mtext">Ein neues Spiel ersetzt deine aktuelle Siedlung.</p><div class="mrow"><button type="button" class="mbtn" id="mbBack">Zurück</button><button type="button" class="mbtn pri" id="mbYes">Neu beginnen</button></div>';
    else if(v==='start')h='<p class="mlabel">Womit beginnt dein Treck?</p>'+
      '<button class="opt" id="optTents" type="button"><b>Mit Zelten</b><small>Planwagen, drei Zelte und Vorräte für eine Woche.</small></button>'+
      '<button class="opt alt" id="optBare" type="button"><b>Ohne Zelte</b><small>Nur der Planwagen. Weniger Vorräte, harter Start.</small></button>'+
      '<button type="button" class="mbtn" id="mbBack">Zurück</button>';
    else h='<ul class="help"><li><b>Karte bewegen</b>Mit einem Finger ziehen.</li><li><b>Zoomen</b>Zwei Finger auseinander- oder zusammenziehen.</li>'+
      '<li><b>Bewohner ansehen</b>Auf eine Figur tippen. Mit „Folgen“ bleibt die Kamera bei ihr.</li><li><b>Fenster schließen</b>Nach unten wischen oder auf die Karte tippen.</li>'+
      '<li><b>Tempo</b>Pause, 1× oder 3× in der unteren Leiste.</li></ul><button type="button" class="mbtn" id="mbBack">Zurück</button>';
    b.innerHTML=h;
    const on=(id,fn)=>{const el=$(id);if(el)el.onclick=fn};
    on('mbCont',()=>this.hide());
    on('mbNew',()=>{this.view=started?'confirm':'start';this.render()});
    on('mbYes',()=>{this.view='start';this.render()});
    on('mbHelp',()=>{this.view='help';this.render()});
    on('mbBack',()=>{this.view='main';this.render()});
    on('optTents',()=>begin(true));on('optBare',()=>begin(false));
    const first=b.querySelector('button');if(first)first.focus({preventScroll:true});
  }
};
function begin(tents){Menu.hide();newGame({tents},(Math.random()*1e9)|0);UI.toast('Ziehe die Karte mit einem Finger. Zoome mit zwei Fingern.',4200)}

let last=performance.now(),hudT=0;
function loop(now){
  const rdt=Math.min(.1,(now-last)/1000);last=now;
  if(Menu.open){Menu.frame(now);requestAnimationFrame(loop);return}
  if(state.started){
    const dt=rdt*state.speed;
    if(dt>0){state.t+=dt*10;for(const s of settlers)AI.update(s,dt);Animals.update(dt)}
    if(cam.follow!==null){const s=settlers.find(q=>q.id===cam.follow);if(s){cam.x+=(s.x*16-cam.x)*Math.min(1,rdt*6);cam.y+=(s.y*16-cam.y)*Math.min(1,rdt*6);clampCam()}}
    hudT-=rdt;if(hudT<=0){hudT=.25;UI.hud();UI.refreshSettler()}
    Render.frame(now);
  }
  requestAnimationFrame(loop);
}
function start(data){
  buildStaticSprites();resize();Menu.init();
  window.addEventListener('resize',()=>{resize();Menu.resize()});
  if(data&&data.save&&data.save.state&&data.save.state.started){try{restore(data.save);UI.setSpeed(state.speed);UI.hud()}catch(e){Menu.show()}}
  else Menu.show();
  requestAnimationFrame(loop);
}
window.claude?.hot?.snapshot?.(()=>({save:state.started?serialize():null}));
window.claude?.hot?.ready?window.claude.hot.ready(start):start(window.claude?.hot?.data??{});
