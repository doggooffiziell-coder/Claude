<title>Ragpit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Silkscreen:wght@400;700&display=swap">
<style>
/* One dark game screen: the canvas sits centered and fills the phone in landscape. */
:root {
  --ground: #0b0b0e;
  --hint: #6a6a74;
  --hint-strong: #e2e2da;
  color-scheme: dark;
}
html, body { height: 100%; }
body {
  background: var(--ground);
  color: var(--hint);
  overflow: hidden;
  overscroll-behavior: none;
  -webkit-user-select: none;
  user-select: none;
  -webkit-touch-callout: none;
  -webkit-tap-highlight-color: transparent;
  font: 500 14px/1.4 "Chakra Petch", "Arial Narrow", system-ui, sans-serif;
}
#stage {
  height: 100%;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  padding-inline: max(6px, env(safe-area-inset-left, 0px), env(safe-area-inset-right, 0px));
  box-sizing: border-box;
}
#screen {
  display: block;
  touch-action: none;
  max-width: 100%;
  background: #000;
}
#hint { display: none; }
/* Upright phone: the game waits, a painted screen in its style asks to turn it. */
#portrait {
  display: none;
  position: fixed;
  inset: 0;
  width: 100vw;
  height: 100dvh;
  background: var(--ground);
}
@media (orientation: portrait) {
  #stage { visibility: hidden; }
  #portrait { display: block; }
}
</style>

<div id="stage">
  <canvas id="screen" aria-label="Ragpit Spielfeld"></canvas>
  <p id="hint"><strong>Ja, ich hab das Spiel wirklich erstellt,</strong><br>mit der Hilfe von Claude AI.<br><br><strong>Dreh dein iPhone quer</strong><br>Dann wird das Spielfeld groß.</p>
</div>
<canvas id="portrait" role="img" aria-label="Ragpit. Ja, ich hab das Spiel wirklich erstellt, mit der Hilfe von Claude AI. Dreh dein iPhone quer, dann wird das Spielfeld groß."></canvas>

<script>
"use strict";
// ======================================================================
// Ragpit web edition.
// Simulation runs on a 768x432 grid. The doll, gore and HUD are drawn as
// smooth vectors at the full device resolution.
// ======================================================================

// The room grows sideways to match wide phone screens, so nothing gets letterboxed.
// It measures the free area inside the safe margins, so the notch side does not
// squeeze the picture into bars at the top and bottom.
// Opened upright, it works out the room the phone will have once it turns,
// so turning it does not restart the game: the long side minus the notch on
// both ends (the notch sits at the top now and on a side later), the short
// side as the height.
const safeTop = () => {
  const p = document.createElement("div");
  p.style.cssText = "position:fixed;visibility:hidden;padding-top:env(safe-area-inset-top,0px)";
  document.body.appendChild(p);
  const v = parseFloat(getComputedStyle(p).paddingTop) || 0;
  p.remove();
  return v;
};
const idealWidth = () => {
  let w = innerWidth, h = innerHeight;
  const st = document.getElementById("stage");
  if (innerHeight > innerWidth) { w = innerHeight - 2 * Math.max(6, safeTop()); h = innerWidth; }
  else if (st) {
    const cs = getComputedStyle(st);
    w = st.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
    h = st.clientHeight;
  }
  const a = Math.max(w, h) / Math.max(1, Math.min(w, h));
  return Math.min(1248, Math.max(768, Math.round(432 * a / 48) * 48));
};
const W = idealWidth(), H = 432;
// The room is bigger than the screen: half again as wide and as high. The
// camera shows a screen-sized part of it and zooms out to show all of it.
// W and H are the screen, WW and WH the room. Maps are laid out on the old
// screen-sized room (BASE_FLOOR) and sit in the middle of the bigger one,
// on its floor (OFFX, OFFY).
const WW = Math.round(W * 1.5 / 48) * 48, WH = Math.round(H * 1.5), N = WW * WH, OFFX = (WW - W) / 2, OFFY = WH - H;

const BASE_FLOOR = 372, FLOOR_Y = BASE_FLOOR + OFFY;
const CHUNK = 16, CW = WW / CHUNK, CH = Math.ceil(WH / CHUNK);
const DT = 1 / 60;
const GRAVITY = 840;
const EMPTY = 0, WALL = 1, WATER = 2, BLOOD = 3, FIRE = 4, ICE = 5, STEAM = 6, SMOKE = 7;
const FONT = '"Silkscreen", "Courier New", monospace';

const rnd = (n) => (Math.random() * n) | 0;
const rf = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const lerp = (a, b, t) => a + (b - a) * t;
const moveToward = (v, to, d) => (Math.abs(to - v) <= d ? to : v + Math.sign(to - v) * d);
const wrapPi = (a) => a - Math.PI * 2 * Math.floor((a + Math.PI) / (Math.PI * 2));
const hex = (s) => [parseInt(s.slice(1, 3), 16), parseInt(s.slice(3, 5), 16), parseInt(s.slice(5, 7), 16)];
const mixc = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t), lerp(a[2], b[2], t)];
const lighten = (c, t) => [c[0] + (255 - c[0]) * t, c[1] + (255 - c[1]) * t, c[2] + (255 - c[2]) * t];
const darken = (c, t) => [c[0] * (1 - t), c[1] * (1 - t), c[2] * (1 - t)];
const css = (c, a = 1) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

const canvas = document.getElementById("screen");
let ctx = canvas.getContext("2d"); // swapped for a moment while a bitmap is cached
let K = 1; // device pixels per world unit

// ======================================================================
// World: falling-sand grid
// ======================================================================

const mat = new Uint8Array(N), mixv = new Uint8Array(N), life = new Uint8Array(N);
const shade = new Uint8Array(N), stamp = new Uint8Array(N), rest = new Uint8Array(N);
const paintMark = new Uint8Array(N);
const wcan = document.createElement("canvas");
wcan.width = WW; wcan.height = WH;
const wctx = wcan.getContext("2d");
const wimg = wctx.createImageData(WW, WH);
const wpx = wimg.data;
let worldDirty = true;
// Rows of the liquid layer painted since the last upload; only those go up.
let wDirtyY0 = 0, wDirtyY1 = WH - 1;
let paintList = [];
let chunkNow = new Uint8Array(CW * CH), chunkNext = new Uint8Array(CW * CH);
let tick = 0, curStamp = 1;
let particles = [];
for (let i = 0; i < N; i++) shade[i] = rnd(16);

const COL_WATER = hex("#2f63c4"), COL_VIOLET = hex("#6e2c96"), COL_BLOODLIQ = hex("#7a0c14");
function waterColor(share) {
  const t = Math.sqrt(share / 255);
  return t < 0.5 ? mixc(COL_WATER, COL_VIOLET, t * 2) : mixc(COL_VIOLET, COL_BLOODLIQ, (t - 0.5) * 2);
}
const waterLut = new Uint8Array(256 * 6);
for (let s = 0; s < 256; s++) {
  const c = waterColor(s), top = lighten(c, 0.4);
  waterLut.set([c[0], c[1], c[2], top[0], top[1], top[2]], s * 6);
}

const isFree = (m) => m === EMPTY || m >= STEAM;
function getMat(x, y) {
  if (x < 0 || x >= WW || y < 0 || y >= WH) return WALL;
  return mat[y * WW + x];
}
const matAt = (x, y) => getMat(Math.floor(x), Math.floor(y));
const solidAt = (x, y) => { const m = matAt(x, y); return m === WALL || m === ICE; };
const liquidAt = (x, y) => { const m = matAt(x, y); return m === WATER || m === BLOOD; };
const coldIceAt = (x, y) => matAt(x, y) === ICE && life[Math.floor(y) * WW + Math.floor(x)] > 0;

function worldReset() {
  mat.fill(EMPTY); mixv.fill(0); life.fill(0); stamp.fill(0); rest.fill(0);
  chunkNow.fill(0); chunkNext.fill(0); paintMark.fill(0); paintList = [];
  for (let y = FLOOR_Y; y < WH; y++) for (let x = 0; x < WW; x++) mat[y * WW + x] = WALL;
  particles = [];
  for (let i = 0; i < N; i++) paintCell(i);
  worldDirty = true; wDirtyY0 = 0; wDirtyY1 = WH - 1;
}

function setCell(x, y, m, mx = 0, lf = 0) {
  if (x < 0 || x >= WW || y < 0 || y >= WH) return;
  const i = y * WW + x;
  mat[i] = m; mixv[i] = mx; life[i] = lf;
  touch(i);
}

function paintDisc(cx, cy, radius, m, chance, lf = 0, skip = null) {
  const r = Math.ceil(radius);
  cx = Math.floor(cx); cy = Math.floor(cy);
  for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
    if (dx * dx + dy * dy > radius * radius || Math.random() > chance) continue;
    const x = cx + dx, y = cy + dy, cur = getMat(x, y);
    if (skip && skip(x, y)) continue;
    if (cur === EMPTY || cur === STEAM || cur === SMOKE) setCell(x, y, m, 0, m === FIRE ? 40 + rnd(50) : lf);
  }
}

const MAX_PARTICLES = 12000;
function spawnParticle(x, y, vx, vy, m, mx = 255) {
  if (particles.length >= MAX_PARTICLES) return false;
  particles.push({ x, y, vx, vy, m, mx, age: 0 });
  return true;
}

function splash(x, y, vx, vy) {
  x = Math.floor(x); y = Math.floor(y);
  const m = getMat(x, y);
  if (m !== WATER && m !== BLOOD) return;
  const sp = Math.hypot(vx, vy);
  if (sp > 300) splashSound(Math.min(1, sp / 1200));
  const mx = mixv[y * WW + x];
  setCell(x, y, EMPTY);
  spawnParticle(x + 0.5, y - 0.5, vx * 0.5 + rf(-50, 50), -Math.abs(vy) * 0.45 - rf(40, 120), m, m === WATER ? mx : 255);
}

function touch(i) {
  const x = i % WW, y = (i / WW) | 0;
  const cx = x >> 4, cy = y >> 4;
  chunkNext[cy * CW + cx] = 1;
  const lx = x & 15, ly = y & 15;
  if (lx === 0 && cx > 0) chunkNext[cy * CW + cx - 1] = 1;
  else if (lx === 15 && cx < CW - 1) chunkNext[cy * CW + cx + 1] = 1;
  if (ly === 0 && cy > 0) chunkNext[(cy - 1) * CW + cx] = 1;
  else if (ly === 15 && cy < CH - 1) chunkNext[(cy + 1) * CW + cx] = 1;
  // Wake resting neighbours that could move into this cell.
  rest[i] = 0;
  if (x > 0) rest[i - 1] = 0;
  if (x < WW - 1) rest[i + 1] = 0;
  if (y > 0) {
    const u = i - WW;
    rest[u] = 0;
    if (x > 0) rest[u - 1] = 0;
    if (x < WW - 1) rest[u + 1] = 0;
  }
  if (!paintMark[i]) { paintMark[i] = 1; paintList.push(i); }
  if (y + 1 < WH && !paintMark[i + WW]) { paintMark[i + WW] = 1; paintList.push(i + WW); }
}

function swap(i, j) {
  let t = mat[i]; mat[i] = mat[j]; mat[j] = t;
  t = mixv[i]; mixv[i] = mixv[j]; mixv[j] = t;
  t = life[i]; life[i] = life[j]; life[j] = t;
  stamp[i] = curStamp; stamp[j] = curStamp;
  touch(i); touch(j);
}

function neighbor(x, y, n) {
  switch (n) {
    case 0: return x > 0 ? y * WW + x - 1 : -1;
    case 1: return x < WW - 1 ? y * WW + x + 1 : -1;
    case 2: return y > 0 ? (y - 1) * WW + x : -1;
    default: return y < WH - 1 ? (y + 1) * WW + x : -1;
  }
}

function worldStep() {
  tick++;
  curStamp = (tick % 250) + 1;
  const sw = chunkNow; chunkNow = chunkNext; chunkNext = sw; chunkNext.fill(0);
  const leftFirst = (tick & 1) === 0;
  for (let cy = CH - 1; cy >= 0; cy--) {
    let any = false;
    for (let cx = 0; cx < CW; cx++) if (chunkNow[cy * CW + cx]) { any = true; break; }
    if (!any) continue;
    const y0 = cy * CHUNK, y1 = Math.min(y0 + CHUNK, WH) - 1;
    for (let y = y1; y >= y0; y--) {
      for (let ci = 0; ci < CW; ci++) {
        const cx = leftFirst ? ci : CW - 1 - ci;
        if (!chunkNow[cy * CW + cx]) continue;
        const x0 = cx * CHUNK;
        for (let k = 0; k < CHUNK; k++) {
          const x = leftFirst ? x0 + k : x0 + CHUNK - 1 - k;
          const i = y * WW + x, m = mat[i];
          if (m === EMPTY || m === WALL || m === ICE) continue;
          if (stamp[i] === curStamp) continue;
          if (rest[i] > 3 && ((tick + i) & 15) !== 0) {
            // A dozing liquid cell keeps its chunk awake until it has fully settled.
            if (rest[i] < 255) chunkNext[cy * CW + cx] = 1;
            continue;
          }
          if (m === WATER || m === BLOOD) liquid(x, y, i, m);
          else if (m === FIRE) fireCell(x, y, i);
          else gasCell(x, y, i);
        }
      }
    }
  }
  levelWater();
  stepParticles();
}

// Communicating vessels: water from a high surface flows to the lowest
// connected surface nearby, so a pool levels out within a second or two.
// It runs every second step with twice the tries, and when the room holds no
// pool it only looks again a quarter second later.
const colTop = new Int16Array(WW);
let levelIdle = 0;
function levelWater() {
  if ((tick & 1) || tick < levelIdle) return;
  let any = false;
  for (let x = 0; x < WW; x++) {
    let y = 0;
    while (y < WH && isFree(mat[y * WW + x])) y++;
    colTop[x] = y;
    if (y < WH && mat[y * WW + x] === WATER) any = true;
  }
  if (!any) { levelIdle = tick + 15; return; }
  for (let n = 0; n < 800; n++) {
    const x = rnd(WW), h = colTop[x];
    if (h >= WH || mat[h * WW + x] !== WATER || h === 0) continue;
    const d = Math.random() < 0.5 ? 1 : -1;
    let bestX = -1, bestT = h + 2;
    for (let c = x, k = 0; k < 160; k++) {
      const nc = c + d;
      if (nc < 0 || nc >= WW) break;
      // Neighbors must share water just below the lower of their two
      // surfaces. A few rows of slack let small air pockets through.
      const r0 = Math.max(colTop[c], colTop[nc]);
      let joined = false;
      for (let r = r0; r < r0 + 5 && r < WH; r++) {
        if (mat[r * WW + c] === WATER && mat[r * WW + nc] === WATER) { joined = true; break; }
      }
      if (!joined) break;
      if (colTop[nc] > bestT) { bestT = colTop[nc]; bestX = nc; }
      c = nc;
    }
    if (bestX < 0) continue;
    const from = h * WW + x, to = (bestT - 1) * WW + bestX;
    swap(from, to); life[to] = 0;
    colTop[x] = h + 1; colTop[bestX] = bestT - 1;
  }
}

function liquid(x, y, i, m) {
  const hasBelow = y + 1 < WH;
  if (hasBelow) {
    const b = i + WW;
    if (isFree(mat[b])) {
      // Over open air the cell turns back into a falling drop, so water
      // pours off ledges with real gravity instead of sliding down slowly.
      if (y + 3 < WH && isFree(mat[b + WW]) && isFree(mat[b + 2 * WW]) &&
          spawnParticle(x + 0.5, y + 0.5, rf(-6, 6), rf(40, 90), m, m === WATER ? mixv[i] : 255)) {
        mat[i] = EMPTY; mixv[i] = 0; life[i] = 0; touch(i);
        return;
      }
      swap(i, b); life[b] = 0; return;
    }
    let d = Math.random() < 0.5 ? 1 : -1;
    for (let k = 0; k < 2; k++) {
      const nx = x + d;
      if (nx >= 0 && nx < WW && isFree(mat[b + d]) && isFree(mat[i + d])) { swap(i, b + d); life[b + d] = 0; return; }
      d = -d;
    }
  }
  let dir = Math.random() < 0.5 ? 1 : -1;
  // Surface water runs downhill along the surface, so mounds flatten into a level pool.
  if (m === WATER && y > 0 && isFree(mat[i - WW])) {
    const j = rollTarget(x, y, dir);
    if (j >= 0) { swap(i, j); life[j] = 0; return; }
  }
  // Look sideways for a drop and flow toward it. Water looks far, blood is thick.
  const look = m === WATER ? 48 : 4;
  const row = y * WW;
  for (let k = 0; k < 2; k++) {
    let nx = x, s = 0, found = false;
    while (s < look) {
      const tx = nx + dir;
      if (tx < 0 || tx >= WW || !isFree(mat[row + tx])) break;
      nx = tx; s++;
      if (hasBelow && isFree(mat[row + WW + tx])) { found = true; break; }
    }
    if (found) { swap(i, row + x + dir * Math.min(s, m === WATER ? 8 : 1)); return; }
    dir = -dir;
  }
  // No drop in reach: spread at random. Every hop tires the cell, so pools come to rest.
  const tired = life[i];
  if (tired < (m === WATER ? 140 : 48) && (m === WATER || rnd(4) === 0)) {
    // Water slides several cells per step along the surface, blood one.
    const reach = m === WATER ? 3 + rnd(6) : 1;
    for (let k = 0; k < 2; k++) {
      let tx = x, n = 0;
      while (n < reach) {
        const nx = tx + dir;
        if (nx < 0 || nx >= WW || !isFree(mat[row + nx])) break;
        tx = nx; n++;
        if (hasBelow && isFree(mat[row + WW + tx])) break;
      }
      if (n > 0) {
        swap(i, row + tx);
        life[row + tx] = tired + 1;
        return;
      }
      dir = -dir;
    }
  }
  if (rest[i] < 255) rest[i]++;
  if (rnd(4) === 0) liquidReact(x, y, i, m);
}

function setLiquid(i, share) {
  if (share >= 250) { mat[i] = BLOOD; mixv[i] = 255; }
  else { mat[i] = WATER; mixv[i] = share; }
  touch(i);
}

function liquidReact(x, y, i, m) {
  const j = neighbor(x, y, rnd(4));
  if (j < 0) return;
  const mj = mat[j];
  if (mj === WATER || mj === BLOOD) {
    const fa = m === BLOOD ? 255 : mixv[i], fb2 = mj === BLOOD ? 255 : mixv[j];
    if (Math.abs(fa - fb2) > 6) {
      const avg = (fa + fb2) >> 1;
      setLiquid(i, avg); setLiquid(j, avg);
    }
  } else if (mj === ICE && m === WATER && life[j] > 40 && rnd(5) === 0) {
    mat[i] = ICE; life[i] = life[j] - 40; touch(i);
  }
}

function fireCell(x, y, i) {
  const l = life[i] - 1 - rnd(3);
  if (l <= 0) {
    if (rnd(3) === 0) { mat[i] = SMOKE; life[i] = 50 + rnd(40); }
    else { mat[i] = EMPTY; life[i] = 0; }
    touch(i);
    return;
  }
  life[i] = l;
  for (let n = 0; n < 4; n++) {
    const j = neighbor(x, y, n);
    if (j < 0) continue;
    const mj = mat[j];
    if (mj === WATER || mj === BLOOD) {
      mat[i] = STEAM; life[i] = 60;
      if (rnd(2) === 0) { mat[j] = STEAM; life[j] = 70; touch(j); }
      touch(i);
      return;
    }
    if (mj === ICE && rnd(4) === 0) { mat[j] = WATER; mixv[j] = 0; life[j] = 0; touch(j); }
  }
  const nx = x + rnd(3) - 1;
  if (y > 0 && nx >= 0 && nx < WW && isFree(mat[(y - 1) * WW + nx]) && rnd(3) !== 0) swap(i, (y - 1) * WW + nx);
  else touch(i);
}

function gasCell(x, y, i) {
  let l = life[i] - 1;
  if (y === 0) l -= 3;
  if (l <= 0) { mat[i] = EMPTY; life[i] = 0; touch(i); return; }
  life[i] = l;
  const nx = x + rnd(3) - 1;
  if (y > 0 && nx >= 0 && nx < WW && mat[(y - 1) * WW + nx] === EMPTY) { swap(i, (y - 1) * WW + nx); return; }
  const sx = x + (Math.random() < 0.5 ? 1 : -1);
  if (sx >= 0 && sx < WW && mat[y * WW + sx] === EMPTY) { swap(i, y * WW + sx); return; }
  touch(i);
}

function stepParticles() {
  for (let k = particles.length - 1; k >= 0; k--) {
    const p = particles[k];
    p.age += DT;
    p.vy += GRAVITY * DT;
    p.vx *= 0.995; p.vy *= 0.995;
    // Fast blood sometimes hits the back wall and leaves a stain there.
    if (p.m === BLOOD && p.age > 0.04 && p.y < FLOOR_Y - 2 && p.vx * p.vx + p.vy * p.vy > 90000 && Math.random() < 0.014) {
      splat(p.x, p.y, rf(1.2, 3.2));
      particles[k] = particles[particles.length - 1]; particles.pop();
      continue;
    }
    const x1 = p.x + p.vx * DT, y1 = p.y + p.vy * DT;
    const n = Math.floor(Math.max(Math.abs(x1 - p.x), Math.abs(y1 - p.y))) + 1;
    let done = false, lx = p.x, ly = p.y;
    for (let s = 1; s <= n; s++) {
      const qx = lerp(p.x, x1, s / n), qy = lerp(p.y, y1, s / n);
      const ix = Math.floor(qx), iy = Math.floor(qy);
      if (ix < 0 || ix >= WW || iy >= WH) { done = true; break; }
      if (iy < 0) { lx = qx; ly = qy; continue; }
      if (!isFree(mat[iy * WW + ix])) { settle(lx, ly, p.m, p.mx, p.vx); done = true; break; }
      lx = qx; ly = qy;
    }
    if (done) { particles[k] = particles[particles.length - 1]; particles.pop(); }
    else { p.x = x1; p.y = y1; }
  }
}

// Where a surface cell would end up if it ran down the surface. Only a move
// at least two rows down counts, so water always loses height and settles.
function rollTarget(x0, y0, dir) {
  let x = x0, y = y0, flat = 0, turned = false;
  for (let n = 0; n < 160; n++) {
    if (y + 1 < WH && isFree(mat[(y + 1) * WW + x])) { y++; flat = 0; continue; }
    const nx = x + dir;
    if (flat < 40 && nx >= 0 && nx < WW && isFree(mat[y * WW + nx])) { x = nx; flat++; continue; }
    if (!turned) { dir = -dir; turned = true; flat = 0; x = x0; y = y0; continue; }
    break;
  }
  return y >= y0 + 2 ? y * WW + x : -1;
}

// A landing drop runs down the surface before it rests, so a strong jet
// spreads into a pool instead of stacking up into a tower.
function settle(fx, fy, m, mx, vx = 0) {
  let x = Math.floor(fx), y = Math.floor(fy), ok = false;

    this.broken = new Array(PART_COUNT).fill(false);
    // Small signs of life: blinking, fear, a startle, what it looks at.
    this.blinkT = rf(1, 4); this.fear = 0; this.startle = 0; this.lookAt = null; this.lookT = 0; this.seenT = performance.now() / 1000; this.armsBusy = false;
  }

  // Damages the organs at height t of part k. A bullet crosses the body at a
  // random depth and hits the organs it passes; a blade or a blow hits less.
  hitOrgans(k, t, amount, chance) {
    const depth = rf(-1, 1);
    ORGANS.forEach((o, n) => {
      if (o.part !== k || this.organ[n] <= 0) return;
      const dt = Math.abs(t - o.t);
      if (k !== HEAD && dt > o.r) return;
      if (Math.abs(depth - o.s) > o.w || Math.random() > chance) return;
      const near = k === HEAD ? 1 : 1 - dt / o.r * 0.5;
      this.organ[n] = Math.max(0, this.organ[n] - amount * near * rf(0.75, 1.2));
    });
  }

  // Blunt force shakes every organ in the part a little.
  bruiseOrgans(k, amount) {
    ORGANS.forEach((o, n) => { if (o.part === k && this.organ[n] > 0) this.organ[n] = Math.max(0, this.organ[n] - amount * rf(0.5, 1)); });
  }

  // Effects of the organs on blood, air, heart and mind, once per step.
  updateOrgans() {
    const hp = (id) => this.organ[ORGAN[id]] / 100;
    if (!this.dead && hp("brain") <= 0) { this.cause = ORGAN_DEATH.brain; this.die(); }
    if (!this.arrest && hp("heart") <= 0) { this.arrest = true; this.logEvent("Herzstillstand"); }
    // Internal bleeding grows with the damage. A stopped heart bleeds less.
    let bleed = 0;
    // Organs in a lost body part bleed out through the stump instead.
    ORGANS.forEach((o, n) => { const loss = 1 - this.organ[n] / 100; if (loss > 0.02 && this.attached(o.part)) bleed += o.bleed * Math.pow(loss, 1.3); });
    if (this.arrest || this.dead) bleed *= 0.3;
    this.organBleed = bleed;
    this.bl = Math.max(0, this.bl - bleed * DT);
    // Lungs take in air, a stopped heart moves none of it to the body.
    const breath = (hp("lungL") + hp("lungR")) / 2;
    this.o2Drop = this.arrest ? 12 : Math.pow(1 - breath, 2) * 7;
    if (!this.dead) this.o2 = Math.max(0, this.o2 - this.o2Drop * DT);
    // Gut and stomach wounds hurt a lot. A torn stomach or gut lets its
    // contents into the belly, and the inflammation slowly grows. Mended
    // organs let it fade again.
    const belly = (1 - hp("stomach")) + (1 - hp("gut"));
    if (belly > 0.1) this.pn = Math.max(this.pn, Math.min(95, belly * 45));
    let leak = 0;
    for (const id of ["stomach", "gut"]) if (this.attached(ORGANS[ORGAN[id]].part)) leak += Math.max(0, 0.6 - hp(id)) / 0.6;
    this.sepsisRate = leak * SEPSIS_RATE;
    if (!this.dead) this.sepsis = leak > 0 ? Math.min(100, this.sepsis + this.sepsisRate * DT) : Math.max(0, this.sepsis - 0.5 * DT);
    if (this.sepsis > 50 && !this.dead) this.ko = Math.min(this.ko, 100 - (this.sepsis - 50) * 1.6);
    if (this.sepsis >= 100 && !this.dead) { this.cause = ORGAN_DEATH.stomach; this.die(); }
    if (!this.dead && hp("brain") < 1) this.ko = Math.min(this.ko, 15 + hp("brain") * 85);
    // A badly hurt heart pumps weakly: less oxygen, chest pain, a body that
    // stays weak. Below about a third it falls out of rhythm and can stop at
    // any moment, faster with adrenaline in the blood. Blood from a bag does
    // not repair it.
    const heart = hp("heart");
    if (!this.dead && heart > 0 && heart < 0.6) {
      const weak = (0.6 - heart) / 0.6;
      if (!this.arrest) this.o2 = Math.min(this.o2, 100 - weak * 45);
      this.pn = Math.max(this.pn, weak * 55);
      this.ko = Math.min(this.ko, 100 - weak * 55);
      const risk = heart < 0.35 ? (0.35 - heart) * 0.4 * (this.adrenT > 0 ? 2.5 : 1) : 0;
      if (!this.arrest && Math.random() < risk * DT) { this.arrest = true; this.logEvent("Kammerflimmern"); }
    }
    // Only lightly hurt organs mend, slowly, a little faster with an
    // infusion. Badly damaged ones (under 60 %) stay as they are.
    const mend = this.iv > 0 ? 1 : this.healing ? 0.3 : 0;
    if (mend && !this.dead) for (let n = 0; n < ORGANS.length; n++) if (this.organ[n] >= 60) this.organ[n] = Math.min(100, this.organ[n] + mend * DT);
  }

  // Seconds until death if nothing changes, or Infinity. this.etaWhy names
  // the reason: "blood", "air" or "belly".
  deathEta() {
    this.etaWhy = "";
    if (this.dead) return 0;
    let eta = Infinity;
    let wound = 0;
    for (const w of this.wounds) if (this.attached(w.part)) wound += w.bleed * 0.8;
    this.woundBleed = wound;
    let loss = this.organBleed + wound + this.burnLoss;
    if (this.iv > 0) loss -= 8;
    if (this.monitor) loss -= MONITOR_BLOOD;
    if (loss > 0.05) { eta = Math.max(0, this.bl - 8) / loss; this.etaWhy = this.burnLoss > this.organBleed + wound ? "burn" : "blood"; }
    // Air: what the lungs bring in against what the body loses.
    const breath = (this.organ[ORGAN.lungL] + this.organ[ORGAN.lungR]) / 200;
    const gain = this.headUnder ? -11 : this.arrest ? 0 : 20 * breath;
    const net = gain - this.o2Drop;
    if (net < 0) { const e = this.o2 / -net + Math.max(0, 6 - this.noAir); if (e < eta) { eta = e; this.etaWhy = "air"; } }
    if (this.sepsisRate > 0) { const e = (100 - this.sepsis) / this.sepsisRate; if (e < eta) { eta = e; this.etaWhy = "belly"; } }
    return eta;
  }

  hurtPart(k, amount) { if (k >= 0) this.dmg[k] = Math.min(100, this.dmg[k] + amount); }

  // Bullet hit: entry and exit wound, blood spray, a shove and a chance to lose the limb.
  shot(k, x, y, dx, dy, wp) {
    if (this.gone[k]) return;
    const [ax, ay, bx, by] = [this.x[this.pa[k]], this.y[this.pa[k]], this.x[this.pb[k]], this.y[this.pb[k]]];
    const sx = bx - ax, sy = by - ay, l2 = sx * sx + sy * sy || 1;
    const t = k === HEAD ? Math.random() : clamp(((x - ax) * sx + (y - ay) * sy) / l2, 0, 1);
    const side = Math.sign(sx * (y - ay) - sy * (x - ax)) || 1;
    fleshHitSound();
    this.addWound(k, t, side * 0.8, 1.1 + wp.dmg * 0.7, false, "shot");
    this.addWound(k, clamp(t + rf(-0.12, 0.12), 0, 1), -side * 0.8, 1.2 + wp.dmg, false, "shot", { exit: true });
    const w = k === HEAD ? HEAD_R : (TAPER[k][0] + TAPER[k][1]) / 2;
    this.burst(x + dx * w, y + dy * w, 16 + Math.round(wp.dmg * 12), dx, dy, 340);
    this.burst(x, y, 5, -dx, -dy, 120);
    splatAround(x + dx * 50, y + dy * 50, 7);
    for (const i of [this.pa[k], this.pb[k]]) this.push(i, dx * wp.push * 0.5, dy * wp.push * 0.5);
    this.pn = Math.min(100, this.pn + 22 * wp.dmg);
    this.hurtPart(k, 18 * wp.dmg);
    this.hits[k]++;
    this.damaged();
    this.stagger = Math.max(this.stagger, 1.2);
    this.hitReact = { t: 0.7, k, tt: t, s: side * 0.8 };
    // Bullets tear the organs they pass. A clean head shot can end it at once.
    this.hitOrgans(k, t, 75 * wp.dmg, 0.85);
    if (k === HEAD) {
      this.ko -= 45 * wp.dmg;
      if (Math.random() < wp.headKill) this.organ[ORGAN.brain] = 0;
    } else if (k === TORSO) {
      this.bl = Math.max(0, this.bl - 4 * wp.dmg);
    } else if (k !== PELVIS && this.dmg[k] >= 100 && this.hits[k] >= 8 && Math.random() < wp.sever) {
      // A limb only comes off after it has taken a lot of hits.
      this.severCd = 0;
      this.sever(k);
    }
  }

  // Taser: two barbs hook into the skin and the current locks every muscle
  // for five seconds. The body goes stiff, falls like a plank and shakes.
  // When the current stops, the doll is knocked out for a while.
  tase(k, t, s, ox, oy) {
    if (this.gone[k]) return;
    this.logEvent("Elektroschock " + PART_NAME[k]);
    // The second barb lands a hand's width lower on the body.
    const k2 = k === HEAD ? TORSO : k === TORSO ? (Math.random() < 0.5 ? TORSO : PELVIS) : k;
    const t2 = k2 === k ? clamp(t + rf(0.25, 0.4), 0, 0.95) : rf(0.1, 0.5);
    for (const [pk, pt] of [[k, t], [k2, t2]]) { this.addWound(pk, pt, s, 0.3, false, "hit"); this.wounds[this.wounds.length - 1].bleed = 0; }
    this.taseT = 5;
    for (const j of this.joints) j.taseRel = this.jointRel(j);
    this.stagger = Math.max(this.stagger, 5.5);
    if (!this.dead) this.pn = Math.min(100, this.pn + 45);
    this.damaged();
    wires.push({ d: this, k, t, k2, t2, ox, oy, age: 0 });
  }

  // A shot aimed in the front view: the spot and the organs are known exactly.
  // Returns where it hit in the room.
  preciseShot(hit, wp, dir = 0) {
    const { k, t, s, organs } = hit;
    fleshHitSound();
    this.addWound(k, t, s, 1.1 + wp.dmg * 0.7, false, "shot");
    // The exit hole sits on the back, out of sight in the front view, but it bleeds.
    this.addWound(k, t, s, 1.2 + wp.dmg, false, "shot", { exit: true });
    const [x, y] = this.woundPos({ part: k, t, s, stump: false });
    // The bullet flies into the picture: blood sprays out of the hole on all
    // sides and the exit wound marks the wall right behind the body.
    const fx = dir || 1;
    this.burst(x, y, 8 + Math.round(wp.dmg * 6), fx * 0.6, -0.5, 200);
    this.burst(x, y, 6 + Math.round(wp.dmg * 4), -fx * 0.6, -0.4, 160);
    splatAround(x + rf(-8, 8), y + rf(-6, 8), 6);
    for (const i of [this.pa[k], this.pb[k]]) this.push(i, fx * wp.push * 0.08, 0);
    this.pn = Math.min(100, this.pn + 22 * wp.dmg);
    this.hurtPart(k, 18 * wp.dmg);
    this.hits[k]++;
    const before = this.stagger;
    this.damaged();
    this.hitReact = { t: 0.7, k, tt: t, s };
    // A hit to the head or a leg buckles the doll. Elsewhere it flinches and keeps standing.
    const leg = k === THIGH_L || k === THIGH_R || k === SHIN_L || k === SHIN_R || k === FOOT_L || k === FOOT_R;
    if (k === HEAD || leg) this.stagger = Math.max(before, 1.2);
    else { this.stagger = before; this.flinch = 0.4; }
    for (const id of organs) this.organ[ORGAN[id]] = Math.max(0, this.organ[ORGAN[id]] - 85 * wp.dmg * rf(0.85, 1.15));
    if (k === HEAD) {
      this.ko -= 45 * wp.dmg;
      if (hit.crit) this.organ[ORGAN.brain] = 0;
    } else if (k === TORSO) this.bl = Math.max(0, this.bl - 4 * wp.dmg);
    else if (k !== PELVIS && this.dmg[k] >= 100 && this.hits[k] >= 8 && Math.random() < wp.sever) { this.severCd = 0; this.sever(k); }
    return [x, y];
  }

  // ------------------------------------------------ physics
  step() {
    const g = DOLL_GRAVITY * DT * DT;
    if (!this.dead) this.lifeT = (this.lifeT || 0) + DT;
    const feet0 = [this.x[P_ANKLE_L], this.x[P_TOE_L], this.x[P_ANKLE_R], this.x[P_TOE_R]];
    for (let i = 0; i < this.x.length; i++) {
      this.impactCd[i] = Math.max(0, this.impactCd[i] - DT);
      if (i === this.grabbed) { this.moveGrabbed(i); continue; }
      if (this.pins.has(i)) { this.holdPin(i); continue; }
      const x = this.x[i], y = this.y[i];
      let vx = x - this.ox[i], vy = y - this.oy[i];
      if (liquidAt(x, y)) {
        vx *= 0.86; vy *= 0.86;
        // Gas in a bloated corpse lifts the trunk up to the surface.
        const gas = this.dc && (i === P_NECK || i === P_WAIST || i === P_HIP) ? 0.5 * this.dc.bloat : 0;
        vy += g * (0.12 - gas);
        if (vx * vx + vy * vy > 64) splash(x, y, vx / DT, vy / DT);
      } else {
        const drag = 0.998;
        vx *= drag; vy *= drag;
        // Friction: points on the ground lose sideways speed, so a body slides
        // to a stop instead of rolling on. Slow points settle down at once.
        const below = matAt(x, y + this.rad[i] + 1.2);
        if (below === WALL || below === ICE) {
          if (vx * vx + vy * vy < 2.5) { const f = below === ICE ? 0.97 : 0.6; vx *= f; vy *= f; }
          else if (vy > -2) vx *= below === ICE ? 0.995 : 0.9;
        }
        vy += g;
      }
      const sp = Math.hypot(vx, vy);
      if (sp > MAX_STEP) { vx *= MAX_STEP / sp; vy *= MAX_STEP / sp; }
      this.integrate(i, vx, vy);
    }
    this.updateCripple();
    this.updateFacing();
    // A held doll swings around the finger and settles instead of whirling.
    if (this.grabbed >= 0) this.dampAroundGrab(0.86);
    this.dampSpin(0.02, this.grabbed >= 0 ? this.pieces()[this.grabbed] : -1);
    this.behave();
    if (this.getUp <= 0) this.balance();
    // Rigor gives way slowly under the weight of a body hung on a pin or held
    // up, so it ends up hanging instead of staying folded in the air.
    if (this.rigorOn && (this.pins.size || this.grabbed >= 0)) for (const j of this.joints) j.rigorRel += wrapPi(this.jointRel(j) - j.rigorRel) * DT * 0.8;
    for (let it = 0; it < ITERATIONS; it++) {
      for (let k = 0; k < PART_COUNT; k++) this.solveDistance(this.pa[k], this.pb[k], this.restLen[k]);
      this.solveJoints(this.frozen ? 0.5 : this.taseT > 0 ? 0.45 : this.rigorOn ? 0.45 * this.dc.rigor : 0, false);
      if (it % 2 === 1) { for (let i = 0; i < this.x.length; i++) this.pushOut(i); this.pushOutSegments(); this.selfCollide(); }
    }
    for (const i of this.pins.keys()) this.holdPin(i);
    // A stiff body moves as one block: whatever the points do apart from
    // swinging and turning together is calmed, so it cannot shake on a pin.
    // Hung on a pin, the block also slows down, so it settles under the pin
    // instead of turning like a windmill.
    if (this.frozen || this.rigorOn || this.taseT > 0) this.dampNonRigid(0.15, this.pins.size ? 0.9 : 1);
    // Muscles hold the posture once per step. They move the limbs without
    // adding speed, so they cannot rock the body into shaking.
    if (!this.frozen && !this.dead && !this.isOut()) {
      // Held by the finger, an awake doll keeps its posture and its footing
      // instead of going limp; only an unconscious one hangs loose.
      this.solveJoints(0.08 * clamp(this.ko / 100, 0, 1), true);

      for (let i = 0; i < this.x.length; i++) this.pushOut(i);
      this.pushOutSegments();
    }
    // In the front view a calm standing doll keeps the clean upright stance:
    // the muscles finish the step by lining the body up over its feet.
    if (this.standing && settings.front && !this.holdsBody()) {
      this.flinch = Math.max(0, (this.flinch || 0) - DT);
      const s = 0.3 * clamp(this.ko / 100, 0, 1) * (1 - this.pn / 130) * (1 - this.flinch * 2);
      if (s > 0.02) {
        const cx = (feet0[0] + feet0[2]) / 2, gy = Math.max(this.y[P_ANKLE_L], this.y[P_ANKLE_R]) + 8;
        this.poseToward(cx - (FRONT_POSE[P_ANKLE_L][0] + FRONT_POSE[P_ANKLE_R][0]) / 2 * this.facing, gy, s, false, this.armsBusy);
        for (let it = 0; it < 2; it++) for (let k = 0; k < PART_COUNT; k++) this.solveDistance(this.pa[k], this.pb[k], this.restLen[k]);
      }
    }
    // Standing feet grip the floor instead of sliding.
    if (this.standing) {
      const ids = [P_ANKLE_L, P_TOE_L, P_ANKLE_R, P_TOE_R];
      // A standing doll shuffles its feet back under its hips, a little each
      // step, so it ends up in its upright stance instead of a crooked one.
      const pose = activePose(), sh = this.footShift || 0, cx = (feet0[0] + feet0[2]) / 2 + sh;
      for (let n = 0; n < 4; n++) {
        const i = ids[n];
        if (!this.attached(this.owner[i])) continue;
        const target = cx + (pose[i][0] - (pose[P_ANKLE_L][0] + pose[P_ANKLE_R][0]) / 2) * this.facing;
        const fx = moveToward(feet0[n] + sh, target, 0.35);
        this.x[i] = fx; this.ox[i] = fx;
      }
    }
    // Arms held in a pose are carried by the muscles, so gravity cannot
    // build up speed in them and drag them down.
    if (this.armTargets) for (const [ua, la] of [[UARM_L, LARM_L], [UARM_R, LARM_R]]) {
      if (this.armTargets[ua] === undefined) continue;
      for (const i of [this.pb[ua], this.pb[la]]) { this.ox[i] += (this.x[i] - this.ox[i]) * 0.75; this.oy[i] += (this.y[i] - this.oy[i]) * 0.75; }
    }
    // A body at rest on the ground settles instead of buzzing in place: once
    // it barely moves, the leftover jitter of joints and floor is damped away.
    if (!this.standing && this.grabbed < 0 && !(this.getUp > 0) && !(this.taseT > 0) && !this.headUnder && !(this.dyingTimer > 0)) {
      let sum = 0;
      for (let i = 0; i < this.x.length; i++) sum += Math.abs(this.x[i] - this.ox[i]) + Math.abs(this.y[i] - this.oy[i]);
      this.restT = sum / this.x.length < 1.2 ? (this.restT || 0) + DT : 0;
      if (this.restT > 0.4) {
        const k = Math.min(0.85, (this.restT - 0.4) * 2);
        for (let i = 0; i < this.x.length; i++) { this.ox[i] += (this.x[i] - this.ox[i]) * k; this.oy[i] += (this.y[i] - this.oy[i]) * k; }
      }
    } else this.restT = 0;
    // Last safety: no point may leave the room, whatever moved it there.
    for (let i = 0; i < this.x.length; i++) {
      const r = this.rad[i], x = clamp(this.x[i], r, WW - r), y = Math.max(r, this.y[i]);
      if (x !== this.x[i]) { this.ox[i] = x; this.x[i] = x; }
      if (y !== this.y[i]) { this.oy[i] = y; this.y[i] = y; }
    }
    this.updateEffects();
    this.updateVitals();
  }

  // The grabbed point follows the finger with a little give instead of snapping to it.
  moveGrabbed(i) {
    const x = this.x[i], y = this.y[i];
    let tx = x + (this.gx - x) * 0.5, ty = y + (this.gy - y) * 0.5;
    const d = Math.hypot(tx - x, ty - y), cap = 22;
    if (d > cap) { tx = x + (tx - x) * cap / d; ty = y + (ty - y) * cap / d; }
    const r = this.rad[i];
    if (solidAt(tx, ty + r) || solidAt(tx - r, ty) || solidAt(tx + r, ty)) { tx = x; ty = y; }
    this.ox[i] = x; this.oy[i] = y;
    this.x[i] = tx; this.y[i] = ty;
  }

  integrate(i, vx, vy) {
    let x = this.x[i], y = this.y[i];
    const steps = Math.max(1, Math.ceil(Math.max(Math.abs(vx), Math.abs(vy))));
    let sx = vx / steps, sy = vy / steps, hit = 0;
    const r = this.rad[i], r6 = r * 0.6;
    for (let s = 0; s < steps; s++) {
      if (sx !== 0) {
        const nx = x + sx, px0 = nx + Math.sign(sx) * r;
        if (solidAt(px0, y)) { hit = Math.max(hit, Math.abs(vx)); vx *= -0.25; sx = 0; } else x = nx;
      }
      if (sy !== 0) {
        const ny = y + sy, py0 = ny + Math.sign(sy) * r, py1 = ny + Math.sign(sy) * r * 0.8;
        if (solidAt(x, py0) || solidAt(x - r6, py1) || solidAt(x + r6, py1)) {
          hit = Math.max(hit, Math.abs(vy)); if (vy > 0) vx *= 0.6; vy *= -0.2; sy = 0;
        } else y = ny;
      }
    }
    this.x[i] = x; this.y[i] = y; this.ox[i] = x - vx; this.oy[i] = y - vy;
    const speed = hit / DT;
    if (speed > WOUND_SPEED * 0.75 && this.impactCd[i] <= 0) { this.impactCd[i] = 0.15; this.onImpact(i, speed); }
  }

  // Damps every point's motion relative to the held point.
  // A pinned point stays exactly where it was fixed, like a nail through it.
  fixed(i) { return i === this.grabbed || this.pins.has(i); }
  w(i) { return this.fixed(i) ? 0 : this.inv[i]; }
  holdPin(i) {
    const [px, py] = this.pins.get(i);
    this.x[i] = this.ox[i] = px; this.y[i] = this.oy[i] = py;
  }
  togglePin(i) {
    if (this.pins.has(i)) { this.pins.delete(i); addGhost({ kind: "pin", x: this.x[i], y: this.y[i], vx: rf(-10, 10), dur: 0.55 }); return false; }
    this.pins.set(i, [this.x[i], this.y[i]]);
    if (this.grabbed === i) this.grabbed = -1;
    this.holdPin(i);
    return true;
  }

  // Groups the points into pieces that are still joined: the body and every
  // severed limb are separate pieces and must move on their own.
  pieces() {
    if (this.pieceKey === this.x.length) return this.pieceOf;
    const n = this.x.length, root = Array.from({ length: n }, (_, i) => i);
    const find = (i) => { while (root[i] !== i) { root[i] = root[root[i]]; i = root[i]; } return i; };
    for (let k = 0; k < PART_COUNT; k++) root[find(this.pa[k])] = find(this.pb[k]);
    this.pieceOf = root.map((_, i) => find(i));
    this.pieceKey = n;
    return this.pieceOf;
  }

  // True when the finger holds the main body, not a severed limb.
  holdsBody() {
    return this.grabbed >= 0 && this.attached(this.owner[this.grabbed]);
  }

  dampAroundGrab(keep) {
    const g = this.grabbed, piece = this.pieces();
    const gvx = this.x[g] - this.ox[g], gvy = this.y[g] - this.oy[g];
    for (let i = 0; i < this.x.length; i++) {
      if (i === g || piece[i] !== piece[g]) continue;
      const vx = this.x[i] - this.ox[i], vy = this.y[i] - this.oy[i];

  // Removes part of the spin around the center of mass.

        for (const k of [LARM_R, LARM_L]) {

          const h = this.pb[k], dd = Math.hypot(this.x[h] - wx, this.y[h] - wy);
          if (dd < bd) { bd = dd; best = h; }
        }
        if (best >= 0 && bd > 6) this.steer(best, wx, wy, Math.min(2.5, bd * 0.08), 0.15);
        if (best >= 0) busyHands = true;
      }
    }
    this.armsBusy = busyHands;
    if (settings.front) this.keepElbowsOut();

    // An awake doll on the floor keeps trying to get up. With a bad leg it
    // struggles halfway and falls back down.
    this.getUpCd = Math.max(0, this.getUpCd - DT);
    this.stillTime = maxV < 2.5 ? this.stillTime + DT : 0;
    const hasLeg = this.attached(PELVIS) && ((this.attached(THIGH_L) && this.attached(SHIN_L)) || (this.attached(THIGH_R) && this.attached(SHIN_R)));
    const able = hasLeg && this.pn < 90 && this.bl > 38 && this.burn <= 0 && !this.headUnder;
    if (this.getUp <= 0 && !this.standing && able && this.stillTime > 0.8 && this.getUpCd <= 0) { this.getUp = 1.6; this.getUpCd = 3.2; }
    if (this.getUp > 0) {
      if (!able) { this.getUp = 0; return; }
      this.getUp -= DT;
      // Its own motion while getting up is no shove that knocks it down again.
      this.stagger = 0;
      if (this.getUp <= 0) this.getUpGrace = 0.8;
      const p = 1 - Math.max(0, this.getUp) / 1.6;
      if (!this.legsWork() && p > 0.55) { this.getUp = 0; this.stagger = 1; return; }
      let feetX = 0, n = 0, ground = 0;
      for (const k of [FOOT_L, FOOT_R]) if (this.attached(k)) { feetX += this.x[this.pa[k]]; n++; }
      for (let i = 0; i < this.x.length; i++) ground = Math.max(ground, this.y[i] + this.rad[i]);
      if (!n) { this.getUp = 0; return; }
      // Getting up in two moves: first onto one knee, then up onto both feet.
      // From the front the doll comes straight up.
      if (!settings.front && p < 0.55) this.poseToward(feetX / n, Math.min(ground, FLOOR_Y) - 1, 0.025 + 0.12 * p, true, false, KNEEL_POSE);
      else this.poseToward(feetX / n, Math.min(ground, FLOOR_Y) - 1, settings.front ? 0.03 + 0.15 * p : 0.06 + 0.3 * (p - 0.55) / 0.45, true);
    }
  }

  // Pulls the attached body points toward the standing pose above (fx, gy).
  poseToward(fx, gy, s, withFeet, skipArms = false, pose = activePose()) {
    let ndx = 0, ndy = 0;
    for (let i = 0; i < POSE.length; i++) {
      const foot = i === P_ANKLE_L || i === P_ANKLE_R || i === P_TOE_L || i === P_TOE_R;
      if ((foot && !withFeet) || !this.attached(this.owner[i]) || this.fixed(i)) continue;
      // Arms busy with something (a wound, hands up, shielding) keep their
      // pose and only ride along with the shoulders.
      if (skipArms && (i === P_ELBOW_L || i === P_HAND_L || i === P_ELBOW_R || i === P_HAND_R)) {
        this.x[i] += ndx; this.y[i] += ndy; this.ox[i] += ndx; this.oy[i] += ndy;
        continue;
      }
      const bx = this.x[i], by = this.y[i];
      const keep = withFeet ? 0.7 : 0.88;
      const vx = (this.x[i] - this.ox[i]) * keep, vy = (this.y[i] - this.oy[i]) * keep;
      this.x[i] += (fx + pose[i][0] * this.facing - this.x[i]) * s;
      this.y[i] += (gy + pose[i][1] - this.y[i]) * s;
      this.ox[i] = this.x[i] - vx; this.oy[i] = this.y[i] - vy;
      if (i === P_NECK) { ndx = this.x[i] - bx; ndy = this.y[i] - by; }
    }
  }

  // A conscious doll with its feet on the floor keeps its body over its feet.
  balance() {
    this.standing = false;
    this.footShift = 0;
    this.stagger = Math.max(0, this.stagger - DT);
    // A hard shove to the upper body knocks the doll off its feet for a moment.
    const nv = Math.hypot(this.x[P_NECK] - this.ox[P_NECK], this.y[P_NECK] - this.oy[P_NECK]);
    // Its own get-up motion does not count as a shove.
    this.getUpGrace = Math.max(0, (this.getUpGrace || 0) - DT);
    if (nv > 5 && this.getUpGrace <= 0) this.stagger = Math.max(this.stagger, 1.4);
    if (this.stagger > 0) return;
    if (this.dead || this.frozen || this.isOut() || this.pn > 90) return;
    if (!this.legsWork()) return;
    let grounded = false, feetX = 0, feet = 0;
    for (const k of [FOOT_L, FOOT_R]) {
      if (!this.attached(k)) continue;
      const a = this.pa[k], b = this.pb[k];
      feetX += this.x[a]; feet++;
      if (solidAt(this.x[a], this.y[a] + this.rad[a] + 4) || solidAt(this.x[b], this.y[b] + this.rad[b] + 4)) grounded = true;
    }
    if (!grounded || feet === 0) return;
    feetX /= feet;
    // Pulled by the finger, the doll steps along under the held point at
    // walking speed instead of being dragged over.
    this.footShift = 0;
    if (this.holdsBody() || this.retreatX != null) {
      const g = this.grabbed, want = g >= 0 ? this.x[g] - activePose()[g][0] * this.facing : this.retreatX;
      const nf = moveToward(feetX, want, g >= 0 ? 1.2 : 0.4), dx = nf - feetX;
      // No stepping into a wall or out of the room.
      const blocked = [P_ANKLE_L, P_TOE_L, P_ANKLE_R, P_TOE_R].some((i) => {
        const x = this.x[i] + dx + Math.sign(dx) * this.rad[i];
        return x < 2 || x > WW - 2 || solidAt(x, this.y[i] - 2) || solidAt(x, this.y[i] - 12);
      });
      if (!blocked) { this.footShift = dx; feetX = nf; }
    }
    const groundY = Math.max(this.y[P_ANKLE_L], this.y[P_ANKLE_R]) + 8.09 * DS;
    if (this.y[P_NECK] > this.y[P_HIP] - 30 * DS || this.y[P_HIP] > groundY - 40 * DS || Math.abs(this.x[P_NECK] - feetX) > 36 * DS) return;
    this.standing = true;
    // Pain weakens the stance, so a hurt doll sways and wobbles.
    const s = 0.15 * clamp(this.ko / 100, 0, 1) * (1 - this.pn / 160);
    this.poseToward(feetX, groundY, s, false, this.armsBusy);
    if (this.pn > 40 && Math.random() < 0.08) this.push(P_NECK, rf(-1, 1) * this.pn / 60, 0);
  }

  solveDistance(a, b, rest) {
    const dx = this.x[b] - this.x[a], dy = this.y[b] - this.y[a];
    const len = Math.hypot(dx, dy);
    if (len < 0.0001) return;
    const wa = this.w(a), wb = this.w(b);
    const ws = wa + wb;
    if (ws <= 0) return;
    const f = (len - rest) / len;
    this.x[a] += dx * f * wa / ws; this.y[a] += dy * f * wa / ws;
    this.x[b] -= dx * f * wb / ws; this.y[b] -= dy * f * wb / ws;
  }

  jointIds(j) {
    const jp = j.atA ? this.pa[j.parent] : this.pb[j.parent];
    const op = j.atA ? this.pb[j.parent] : this.pa[j.parent];
    return [jp, op, this.pb[j.child]];
  }

  // Joint angle relative to the middle of its range. A doll facing the other
  // way (facing -1) bends every joint the mirrored way.
  jointRel(j, facing = this.facing) {
    const [jp, op, cp] = this.jointIds(j);
    const ap = Math.atan2(this.y[jp] - this.y[op], this.x[jp] - this.x[op]);
    const ac = Math.atan2(this.y[cp] - this.y[jp], this.x[cp] - this.x[jp]);
    return wrapPi(ac - ap - j.center * facing);
  }

  // The doll is flat, so its knees and hips only bend one way. When the body
  // is put into a pose that fits the mirrored doll much better, for example
  // seated against a wall the other way round, it turns to face the other way
  // instead of folding its joints backwards.
  updateFacing() {
    this.faceCd -= DT;
    // A stiff body (rigor, ice) cannot fold the other way round.
    if (this.faceCd > 0 || this.standing || this.getUp > 0 || this.rigorOn || this.frozen) return;
    this.faceCd = 0.2;
    const bad = (f) => {
      let v = 0;
      for (const j of this.joints) if (j.active) v += Math.max(0, Math.abs(this.jointRel(j, f)) - j.half);
      return v;
    };
    if (bad(-this.facing) + 0.35 < bad(this.facing)) {
      this.facing = -this.facing;
      for (const j of this.joints) { j.frozenRel = -j.frozenRel; j.rigorRel = -(j.rigorRel || 0); }
    }
  }

  // Limits pass (kinematic = false) keeps joints inside their range.
  // Muscle pass (kinematic = true) eases joints toward the rest pose.
  solveJoints(muscle, kinematic) {
    for (const j of this.joints) {
      if (!j.active) continue;
      const limp = !this.frozen && !this.rigorOn && !(this.taseT > 0) && (this.crippled[j.child] || (j.parent !== TORSO && this.crippled[j.parent]));
      const m = limp ? 0 : muscle;
      const [jp, op, cp] = this.jointIds(j);
      // The finger or a pin holds the outer end of this joint: leave the joint
      // loose instead of twisting the whole body around it against gravity.
      if (cp === this.grabbed || this.pins.has(cp)) continue;
      // Arms with a pose of their own (hands up, shielding) turn toward it;
      // arms doing something else on purpose are not pulled back down.
      const armT = kinematic && this.armTargets ? this.armTargets[j.child] : undefined;
      if (kinematic && armT === undefined && this.armsBusy && (j.child === UARM_L || j.child === UARM_R || j.child === LARM_L || j.child === LARM_R)) continue;
      const jx = this.x[jp], jy = this.y[jp];
      const rel = this.jointRel(j);
      // A joint pushed past its limit is led back gently. Only a joint turned
      // almost the wrong way round counts as dislocated and stays loose.
      const over = Math.abs(rel) - j.half;
      if (over > 1.8) continue;
      let target = kinematic ? rel : clamp(rel, -j.half, j.half);
      if (armT !== undefined) target = m > 0 ? rel + wrapPi(armT - rel) : rel;
      else if (m > 0) target = lerp(target, this.frozen ? j.frozenRel : this.taseT > 0 ? j.taseRel : this.rigorOn ? j.rigorRel : (settings.front ? j.restFront : j.rest) * this.facing, m);
      let diff = target - rel;
      if (Math.abs(diff) < 0.0001) continue;
      if (kinematic) diff = armT !== undefined ? clamp(diff * 0.35, -0.16, 0.16) : clamp(diff * 2, -0.05, 0.05);
      const wc = this.w(cp);
      const wo = this.w(op);
      const ws = wc + wo;
      if (ws <= 0) continue;
      // Small steps keep a tangled joint from flipping between its two limits.
      if (!kinematic) { const cap = over > 0.8 ? 0.04 : 0.12; diff = clamp(diff * 0.5, -cap, cap); }
      // Split the turn by moment of inertia (r^2 / inverse mass), so a joint
      // correction conserves angular momentum and cannot set the body spinning.
      const cx = this.x[cp] - jx, cy = this.y[cp] - jy;
      const ic = wc > 0 ? (cx * cx + cy * cy) / wc : Infinity;
      const io = wo > 0 ? ((this.x[op] - jx) ** 2 + (this.y[op] - jy) ** 2) / wo : Infinity;
      let rc, ro;
      // A posed arm turns on its own: the body does not twist back against it.
      if (armT !== undefined && wc > 0) { rc = diff; ro = 0; }
      else if (ic === Infinity) { rc = 0; ro = -diff; }
      else if (io === Infinity) { rc = diff; ro = 0; }
      else { rc = diff * io / (ic + io); ro = -diff * ic / (ic + io); }
      const ncx = jx + cx * Math.cos(rc) - cy * Math.sin(rc), ncy = jy + cx * Math.sin(rc) + cy * Math.cos(rc);
      const qx = this.x[op] - jx, qy = this.y[op] - jy;
      const nox = jx + qx * Math.cos(ro) - qy * Math.sin(ro), noy = jy + qx * Math.sin(ro) + qy * Math.cos(ro);
      const dcx = ncx - this.x[cp], dcy = ncy - this.y[cp], dox = nox - this.x[op], doy = noy - this.y[op];
      this.x[cp] = ncx; this.y[cp] = ncy; this.x[op] = nox; this.y[op] = noy;
      // Shift all three points so the rotation adds no linear momentum.
      const wj = this.w(jp);
      let shx = 0, shy = 0;
      if (wc > 0 && wo > 0 && wj > 0 && armT === undefined) {

        shx = -(dcx / wc + dox / wo) / mm; shy = -(dcy / wc + doy / wo) / mm;
        this.x[cp] += shx; this.y[cp] += shy;
        this.x[op] += shx; this.y[op] += shy;
        this.x[jp] += shx; this.y[jp] += shy;
      }
      // Muscles move without adding speed. Limits soak up most of the push,
      // so a limb hitting its joint stop stays there instead of bouncing.
      const soak = kinematic ? 1 : LIMIT_SOAK;
      if (soak > 0) {
        this.ox[cp] += (dcx + shx) * soak; this.oy[cp] += (dcy + shy) * soak;
        this.ox[op] += (dox + shx) * soak; this.oy[op] += (doy + shy) * soak;
        this.ox[jp] += shx * soak; this.oy[jp] += shy * soak;

  }

  // A point whose circle overlaps a solid cell moves back out and loses most of its speed.
  pushOut(i) {
    if (this.pins.has(i)) return;
    const r = this.rad[i], r6 = r * 0.6;
    let x = this.x[i], y = this.y[i], moved = false;
    const vx = x - this.ox[i], vy = y - this.oy[i];
    const low = (yy) => solidAt(x, yy + r) || solidAt(x - r6, yy + r * 0.8) || solidAt(x + r6, yy + r * 0.8);
    for (let n = 0; n < 2 * r + 4 && low(y); n++) { y = Math.floor(y + r) - r - 0.01; moved = true; }
    for (let n = 0; n < 2 * r + 4 && solidAt(x, y - r); n++) { y += 1; moved = true; }
    for (let n = 0; n < 2 * r + 4 && solidAt(x - r, y); n++) { x += 1; moved = true; }
    for (let n = 0; n < 2 * r + 4 && solidAt(x + r, y); n++) { x -= 1; moved = true; }
    if (!moved) return;
    this.x[i] = x; this.y[i] = y;
    this.ox[i] = x - vx * 0.25; this.oy[i] = y - vy * 0.25;
  }

  // ------------------------------------------------ damage
  // A hard landing or a blow against a wall. Below SAFE_SPEED (a fall of
  // about 1.5 m) nothing happens. Above it the harm grows with the square of
  // the extra speed: legs and feet take a landing best, the head worst.
  onImpact(i, speed) {
    const k = this.owner[i];
    if (this.gone[k] || speed < SAFE_SPEED) return;
    const over = (speed - SAFE_SPEED) / 100, dmg = over * over * 3 * (IMPACT_MULT[k] || 1);
    bodyThudSound(speed);
    this.hurtPart(k, dmg);
    // A limb that came off can be bashed around without the body feeling it.
    const loose = !this.attached(k);
    if (!loose) this.pn = Math.min(100, this.pn + dmg * 0.6);
    if (dmg > 3 && !loose) this.damaged();
    if (k === HEAD) { this.ko -= dmg * 1.4; this.bruiseOrgans(HEAD, dmg * 0.3); }
    else if (k === TORSO || k === PELVIS) this.bruiseOrgans(k, dmg * 0.35);
    // A badly hurt arm or leg breaks and stops carrying weight.
    if (k !== HEAD && k !== TORSO && k !== PELVIS && this.dmg[k] >= 85 && !this.broken[k]) {
      this.broken[k] = true;
      boneCrackSound();
      this.logEvent(PART_NAME[k] + " gebrochen");
      if (!loose) { this.pn = Math.min(100, this.pn + 30); this.stagger = Math.max(this.stagger, 1.5); }
    }
    if (speed > OPEN_SPEED && this.woundCd <= 0) {
      this.woundCd = 0.12;
      const t = k === HEAD ? Math.random() : (i === this.pa[k] ? 0.15 : 0.85);
      const sev = 0.5 + (speed - OPEN_SPEED) / 500;
      this.addWound(k, t, rf(-1, 1), sev);
      this.burst(this.x[i], this.y[i], 8 + Math.floor(sev * 8), 0, -1, 140);
      if (speed > WOUND_SPEED * 1.6) splatAround(this.x[i], this.y[i], 4);
    }
    // Brutal hits burst the body part apart, hard hits tear it off.
    if (k !== TORSO && speed > GIB_SPEED * (this.frozen ? 0.6 : 1) && Math.random() < 0.45) { this.gib(k); return; }
    let severAt = SEVER_SPEED * (this.frozen ? 0.55 : 1);
    if (k === HEAD) severAt *= 1.25;
    if (k !== TORSO && k !== PELVIS && speed > severAt && this.severCd <= 0) {
      if (Math.random() < clamp((speed - severAt) / 900 + 0.25, 0, 0.8)) this.sever(k);
    }
  }

  // extra: { exit: true } for the hole where a bullet left the body,
  // { ang } for a cut, the blade's path measured against the limb.
  addWound(k, t, s, severity, stump = false, kind = "hit", extra = null) {
    if (this.gone[k]) return;
    if (!stump) {
      // Bruises on one spot grow together. Every bullet and every cut keeps its own hole.
      const exit = !!(extra && extra.exit), near = kind === "hit" ? 0.2 : 0.035;
      for (const w of this.wounds) {
        if (w.part === k && !w.stump && w.kind === kind && !!w.exit === exit && Math.abs(w.t - t) < near && Math.abs(w.s - s) < 0.25) {
          w.bleed = Math.min(1, w.bleed + severity * 0.12);
          w.size = Math.min(3.5, w.size + 0.5);
          return;
        }
      }
    }
    if (this.wounds.length >= MAX_WOUNDS) {
      const idx = this.wounds.findIndex((w) => !w.stump);
      this.wounds.splice(idx >= 0 ? idx : 0, 1);
    }
    if (!stump && !(extra && extra.exit)) this.logEvent((WOUND_KIND[kind] || "Wunde") + " " + PART_NAME[k]);
    this.wounds.push({ part: k, t: clamp(t, 0, 1), s: clamp(s, -1, 1), bleed: severity * 0.25,
      size: severity < 1.5 ? 1.4 : 2.2, stump, kind, rot: rf(-0.6, 0.6), seed: Math.random() * 6.28, drip: 0, born: performance.now() / 1000, ...extra });
  }

  sever(k) {
    if (k === TORSO || this.severed[k]) return;
    splatSound();
    const jp = this.pa[k], np = this.x.length;
    this.x.push(this.x[jp]); this.y.push(this.y[jp]); this.ox.push(this.ox[jp]); this.oy.push(this.oy[jp]);
    this.inv.push(this.inv[jp]); this.owner.push(k); this.impactCd.push(0.3); this.rad.push(this.rad[jp]);
    this.pa[k] = np;
    this.severed[k] = true;
    this.logEvent(PART_NAME[k] + " abgetrennt");
    this.dmg[k] = 100;
    this.hurtPart(PARENT[k], 35);
    for (const j of this.joints) if (j.child === k) j.active = false;
    let parentT = 0;
    for (const d of JOINTS) if (d[0] === k) parentT = d[2] ? 0 : 1;
    this.addWound(PARENT[k], parentT, 0, 9, true, "hit", { child: k });
    this.addWound(k, 0, 0, 3.2, true);
    this.severCd = 0.25;
    if (this.grabbed === jp) this.grabbed = -1;
    this.pn = 100;
    const jx = this.x[jp], jy = this.y[jp];
    this.burst(jx, jy, 46, 0, -1, 240);
    splatAround(jx, jy, 10);
    for (let n = 0; n < 3; n++) spawnGib(jx, jy, rf(-160, 160), rf(-320, -80));
    this.damaged();
    if (k === HEAD) { if (!this.dead) this.cause = "KOPF VERLOREN"; this.die(); }
  }

  // The part bursts into meat and bone. Its children fall off as loose pieces.
  gib(k) {
    if (k === TORSO || this.gone[k]) return;
    const ax = this.x[this.pa[k]], ay = this.y[this.pa[k]], bx = this.x[this.pb[k]], by = this.y[this.pb[k]];
    const vx = (bx - this.ox[this.pb[k]]) / DT, vy = (by - this.oy[this.pb[k]]) / DT;
    this.severCd = 0;
    this.sever(k);
    for (let c = 0; c < PART_COUNT; c++) if (PARENT[c] === k) { this.severCd = 0; this.sever(c); }
    this.gone[k] = true;
    this.wounds = this.wounds.filter((w) => w.part !== k);
    if (this.grabbed === this.pa[k] || this.grabbed === this.pb[k]) this.grabbed = -1;
    const count = k === HEAD ? 16 : 9;
    for (let n = 0; n < count; n++) {
      const t = Math.random();
      spawnGib(lerp(ax, bx, t), lerp(ay, by, t), vx * 0.3 + rf(-260, 260), vy * 0.3 + rf(-420, -60), n % 4 === 0);
    }
    this.burst(lerp(ax, bx, 0.5), lerp(ay, by, 0.5), 80, 0, -1, 320);
    splatAround(bx, by, 22);
    if (k === HEAD) { if (!this.dead) this.cause = "KOPF VERLOREN"; this.die(); }
  }

  bladeHit(ax, ay, bx, by, speed) {
    if (speed < 200) return false;
    let hit = false;
    for (let k = 0; k < PART_COUNT; k++) {
      if (this.gone[k]) continue;
      const p0x = this.x[this.pa[k]], p0y = this.y[this.pa[k]];
      const p1x = this.x[this.pb[k]], p1y = this.y[this.pb[k]];
      let t = 0.5, dist, cx, cy;
      if (k === HEAD) {
        [cx, cy] = closestOnSeg(p1x, p1y, ax, ay, bx, by);
        dist = Math.hypot(cx - p1x, cy - p1y) - HEAD_R;
        t = Math.random();
      } else {
        const r = segSeg(ax, ay, bx, by, p0x, p0y, p1x, p1y);
        dist = r.d - WIDTH[k] * 0.5;
        cx = r.qx; cy = r.qy; t = r.t;
      }
      if (dist > 5) continue;
      hit = true;
      if (this.bladeCd[k] > 0) continue;
      this.bladeCd[k] = 0.15;
      this.hurtPart(k, 30);
      sliceSound();
      // The cut runs along the blade's path. A slow push leaves a short stab.
      const lx = k === HEAD ? 0 : p1x - p0x, ly = k === HEAD ? 1 : p1y - p0y;
      const ang = Math.atan2(lx * (by - ay) - ly * (bx - ax), lx * (bx - ax) + ly * (by - ay));
      this.addWound(k, t, rf(-0.7, 0.7), 0.7 + speed / 1600, false, "cut", { ang, len: clamp(speed / 700, 0.8, 2.4) });
      this.hitOrgans(k, t, 30 + speed / 60, 0.5);
      this.pn = Math.min(100, this.pn + 14);
      const l = Math.hypot(bx - ax, by - ay) || 1;
      this.burst(cx, cy, 22, (bx - ax) / l, (by - ay) / l, 200);
      splatAround(cx, cy, 3);
      if (speed > 900 && k !== TORSO && this.severCd <= 0 && Math.random() < 0.85) this.sever(k);
    }
    if (hit) { this.bladeTimer = 2; this.damaged(); }
    return hit;
  }

  blast(x, y, R) {
    let touched = false;
    for (let i = 0; i < this.x.length; i++) {
      const dx = this.x[i] - x, dy = this.y[i] - y, d = Math.hypot(dx, dy) || 1;
      if (d >= R) continue;
      touched = true;
      const f = 1 - d / R;
      const vx = this.x[i] - this.ox[i] + dx / d * f * 36, vy = this.y[i] - this.oy[i] + dy / d * f * 36 - f * 14;
      this.ox[i] = this.x[i] - vx; this.oy[i] = this.y[i] - vy;
    }
    if (!touched) return false;
    for (let k = 0; k < PART_COUNT; k++) {
      if (this.gone[k]) continue;
      const mx = (this.x[this.pa[k]] + this.x[this.pb[k]]) / 2, my = (this.y[this.pa[k]] + this.y[this.pb[k]]) / 2;
      const f = 1 - Math.hypot(mx - x, my - y) / R;
      if (f <= 0) continue;
      this.hurtPart(k, f * 90);
      if (f > 0.25) this.addWound(k, Math.random(), rf(-1, 1), 1 + f * 2);
      if (k === TORSO) { if (f > 0.7) { this.addWound(k, rf(0.3, 0.8), rf(-1, 1), 4); for (let n = 0; n < 6; n++) spawnGib(mx, my, rf(-250, 250), rf(-400, -100)); } continue; }
      if (f > 0.72 && Math.random() < 0.75) this.gib(k);
      else if (f > 0.45 && Math.random() < 0.7) { this.severCd = 0; this.sever(k); }
    }
    this.pn = 100;
    this.ko -= 40;
    // The fireball sets the near side of the body alight.
    this.applyHeat(x, y, R * 0.45, 2.5);
    this.damaged();
    return true;
  }

  near(px0, py0, r) {
    for (let i = 0; i < this.x.length; i++) if (Math.hypot(this.x[i] - px0, this.y[i] - py0) <= r) return true;
    return false;
  }
  // Sets a body part on fire for at least t seconds. Clothes and hair keep
  // it burning longer.
  ignite(k, t) {
    if (k < 0 || this.gone[k] || this.frozen) return;
    if (!this.fire.some((v) => v > 0)) this.logEvent(PART_NAME[k] + " fängt Feuer");
    const fuel = (PART_CLOTH[k] !== "skin" ? this.cloth[k] * 3 : 0) + (k === HEAD ? this.hair * 1.5 : 0);
    this.fire[k] = Math.max(this.fire[k], t + fuel);
  }
  extinguish(k = -1) {
    for (let n = 0; n < PART_COUNT; n++) if (k < 0 || n === k) this.fire[n] = 0;
    this.burn = this.fire.some((v) => v > 0) ? 1 : 0;
  }
  // Parts within r of the point catch fire.
  applyHeat(x, y, r, t = 3) {
    for (let k = 0; k < PART_COUNT; k++) {
      if (this.gone[k]) continue;
      const [ax, ay] = limbStart(this, k), bx = this.x[this.pb[k]], by = this.y[this.pb[k]];
      const [qx, qy] = closestOnSeg(x, y, ax, ay, bx, by), w = k === HEAD ? HEAD_R : RECT[k][0];
      if (Math.hypot(x - qx, y - qy) <= r + w) this.ignite(k, t);
    }
  }
  applyCold(x, y, r) { if (this.near(x, y, r)) { this.freeze = Math.min(1.6, this.freeze + DT * 1.1); this.extinguish(); } }
  // Intensive care: a monitor on a cart beside the body, with a blood line
  // and an oxygen line. As long as it is connected it replaces lost blood
  // steadily and helps breathing, so a patient with an internal bleeding
  // that no bandage can stop stays alive. It does not heal anything: when
  // it comes off, the bleeding takes over again. It beeps with every beat
  // and sounds the alarm when the heart stops.
  updateMonitor() {
    const m = this.monitor;
    const tx = this.x[P_WAIST] + m.side * 58;
    m.x = lerp(m.x, clamp(tx, 30, WW - 30), 0.06);
    // Dragged too far away, the lines tear off.
    if (Math.hypot(this.x[P_WAIST] - m.x, this.y[P_WAIST] - (m.y || this.y[P_WAIST])) > 260) {
      addGhost({ kind: "monitor", x: m.x, gy: (m.y || FLOOR_Y - 40) + 40, side: m.side, dur: 1.2, m });
      this.monitor = null; state.toast = 1.6; state.toastText = "Monitor abgerissen!"; this.logEvent("Monitor abgerissen"); return;
    }
    // A monitor shot to pieces does nothing any more; without its bag it
    // still gives air but no blood.
    if (m.broken) return;
    if (!this.dead) {
      if (m.bag !== false) this.bl = Math.min(100, this.bl + MONITOR_BLOOD * DT);
      if (!this.arrest && !this.headUnder) this.o2 = Math.min(100, this.o2 + 6 * DT);
    }
    // Alarm: two fast tones while the heart is stopped, a flat tone once dead.
    m.alarmT = (m.alarmT || 0) - DT;
    if (m.alarmT <= 0) {
      if (this.dead && this.deadT < 10) { monitorFlatline(); m.alarmT = 1.05; }
      else if (this.arrest && !this.dead) { monitorAlarm(); m.alarmT = 0.55; }
    }
  }

  // A swing with the bat: a hard blow on one part that knocks the body away
  // from the side it was hit, bruises, breaks bones and opens the skin.
  batHit(k, t, s, dir) {
    const i = k === HEAD ? this.pb[HEAD] : t < 0.5 ? this.pa[k] : this.pb[k];
    const leg = k === THIGH_L || k === THIGH_R || k === SHIN_L || k === SHIN_R || k === FOOT_L || k === FOOT_R;
    this.onImpact(i, rf(980, 1180));
    for (const j of [this.pa[k], this.pb[k]]) this.push(j, dir * 7, -2.2);
    if (k === HEAD) this.push(P_NECK, dir * 3, -1);
    this.stagger = Math.max(this.stagger, k === HEAD || leg ? 1.6 : 0.9);
    this.hitReact = { t: 0.7, k, tt: t, s };
    this.logEvent("Schlag " + PART_NAME[k]);
  }
  // Two paddles on the chest and a shock. A dead body comes back only if it
  // died a short while ago, the heart and brain still work and there is
  // enough blood left. Returns what happened, for the message.
  defib() {
    for (const i of [P_NECK, P_WAIST, P_HIP]) this.push(i, rf(-0.5, 0.5), -2.6);
    for (const i of [P_ELBOW_L, P_ELBOW_R, P_KNEE_L, P_KNEE_R]) this.push(i, rf(-1.5, 1.5), -1.5);
    const cx = lerp(this.x[P_NECK], this.x[P_WAIST], 0.4), cy = lerp(this.y[P_NECK], this.y[P_WAIST], 0.4);
    for (let n = 0; n < 12; n++) sparks.push({ x: cx + rf(-10, 10), y: cy + rf(-6, 6), vx: rf(-160, 160), vy: rf(-180, 40), life: rf(0.1, 0.3) });
    flashes.push({ x: cx, y: cy, ang: 0, age: 0 });
    if (!this.dead && this.arrest) {
      // Heart stopped but the body still alive: the shock can restart it.
      if (this.organ[ORGAN.heart] <= 0) return "Das Herz ist zerstört";
      if (Math.random() < 0.3) return "Kein Rhythmus, nochmal!";
      this.arrest = false; this.noAir = 0; this.hr = 55; this.logEvent("Herz neu gestartet");
      return "Herz schlägt wieder";
    }
    if (!this.dead) {
      this.pn = Math.min(100, this.pn + 25); this.hurtPart(TORSO, 6); this.damaged();
      this.logEvent("Elektroschock Brust");
      return this.isOut() ? "Schock, bleibt bewusstlos" : "Autsch! Sie lebt doch";
    }
    const brain = this.organ[ORGAN.brain], heart = this.organ[ORGAN.heart];
    if (!this.attached(HEAD) || this.cause === "KOPF VERLOREN" || this.cause === "VERBRANNT" || brain <= 0) return "Keine Chance mehr";
    if (this.deadT > 45) return "Zu lange tot";
    if (heart <= 0) return "Das Herz ist zerstört";
    if (this.bl <= 15) return this.iv > 0 ? "Noch zu wenig Blut, kurz warten" : "Zu wenig Blut: erst Infusion, dann schocken";
    if (Math.random() < 0.3) return "Kein Rhythmus, nochmal!";
    this.dead = false; this.cause = ""; this.report = null; this.dyingTimer = 0; this.deadT = 0; this.dc = null; this.rigorOn = false;
    this.arrest = false; this.noAir = 0; this.o2 = Math.max(this.o2, 60); this.hr = 60;
    this.ko = 15; this.koTimer = rf(4, 6); this.koLatched = true; this.sinceDamage = 0;
    this.logEvent("Wiederbelebt");
    return "Wiederbelebt!";
  }
  // Adrenaline: wakes it up, the heart races, pain fades for a while. A
  // second shot too soon strains the heart.
  // Heavy blood loss sends the body into shock: a fine, fast trembling.
  shockTremor() {
    const sh = clamp((50 - this.bl) / 30, 0, 1);
    if (sh <= 0 || this.dead || this.arrest || this.frozen) return;
    for (const i of [P_NECK, P_HAND_L, P_HAND_R, P_HEAD]) this.push(i, rf(-0.12, 0.12) * sh, rf(-0.08, 0.08) * sh);
  }
  adrenaline() {
    if (this.dead) return "Zu spät";
    if (this.adrenT > 12) { this.organ[ORGAN.heart] = Math.max(0, this.organ[ORGAN.heart] - 40); this.pn = Math.min(100, this.pn + 30); this.logEvent("Überdosis Adrenalin"); return "Überdosis! Herz geschädigt"; }
    this.adrenT = 25; this.ko = Math.min(100, this.ko + 70); this.koTimer = 0; this.koLatched = false;
    this.pn = Math.max(0, this.pn - 40); this.fear = Math.max(this.fear || 0, 0.6); this.stagger = 0;
    this.logEvent("Adrenalin");
    return "Adrenalin: hellwach";
  }

  // Notes what happens to the doll with its time, for the death report.
  logEvent(text) {
    if (this.dead) return;
    (this.log || (this.log = [])).push([this.lifeT || 0, text]);
    if (this.log.length > 40) this.log.shift();
  }
  damaged() {
    if (this.firstHurt === undefined) this.firstHurt = this.lifeT || 0;
    this.sinceDamage = 0; this.hurtFlash = 1; this.stagger = Math.max(this.stagger, 0.6);
  }
  die() {
    if (!this.dead) this.dyingTimer = 2.4;
    if (!this.dead && !this.cause) this.cause = "TOT";
    // The report is written at the moment of death, before anything changes.
    if (!this.dead) { this.dead = true; this.report = deathReport(this); worldEvent("death", this.x[P_NECK], this.y[P_NECK], this); }
    this.dead = true; this.ko = 0; this.getUp = 0;
  }

  burst(x, y, count, dx, dy, speed) {
    if (this.bl <= 1) return;
    for (let n = 0; n < count; n++) {
      const a = rf(-1.1, 1.1), s = speed * rf(0.3, 1);
      const vx = (dx * Math.cos(a) - dy * Math.sin(a)) * s + rf(-60, 60);
      const vy = (dx * Math.sin(a) + dy * Math.cos(a)) * s + rf(-100, 20);
      spawnParticle(x, y, vx, vy, BLOOD);
    }
  }

  // ------------------------------------------------ effects
  updateEffects() {
    this.severCd = Math.max(0, this.severCd - DT);
    this.woundCd = Math.max(0, this.woundCd - DT);
    for (let k = 0; k < PART_COUNT; k++) this.bladeCd[k] = Math.max(0, this.bladeCd[k] - DT);
    this.bladeTimer = Math.max(0, this.bladeTimer - DT);
    this.hurtFlash = Math.max(0, this.hurtFlash - DT * 4);
    this.beatFlash = Math.max(0, this.beatFlash - DT * 5);

    let cold = 0, wet = false;
    for (let i = 0; i < this.x.length; i++) {
      const x = this.x[i], y = this.y[i], m = matAt(x, y);
      if (m === FIRE && this.burnImmune <= 0) this.ignite(this.owner[i], 2.5);
      else if (m === WATER || m === BLOOD) { wet = true; this.fire[this.owner[i]] = 0; }
      // Only fresh ice from the ice tool is cold enough to freeze a doll.
      const r = this.rad[i] + 3;
      if (coldIceAt(x, y + r) || coldIceAt(x + r, y) || coldIceAt(x - r, y)) cold++;
    }
    const hx = this.x[this.pb[HEAD]], hy = this.y[this.pb[HEAD]];
    const under = !this.severed[HEAD] && liquidAt(hx, hy) && liquidAt(hx, hy - 10);
    if (under && !this.headUnder) this.logEvent("Kopf unter Wasser");
    this.headUnder = under;
    // Organs that fail are noted once.
    if (!this.orgDown) this.orgDown = ORGANS.map(() => false);
    ORGANS.forEach((o, n) => { if (this.organ[n] <= 0 && !this.orgDown[n]) { this.orgDown[n] = true; this.logEvent(o.name + " ZERSTÖRT"); } });

    if (wet && this.burn > 0 && !this.fire.some((v) => v > 0)) paintDisc(this.x[this.pa[TORSO]], this.y[this.pa[TORSO]], 12, STEAM, 0.4, 60);
    this.burnImmune = Math.max(0, this.burnImmune - DT);
    this.updateFire();
    if (this.taseT > 0) {
      // The current makes every muscle shake.
      this.taseT -= DT;
      for (let i = 0; i < this.x.length; i++) if (!this.fixed(i)) { this.x[i] += rf(-0.35, 0.35); this.y[i] += rf(-0.35, 0.35); }
      if (!this.dead) this.ko = Math.max(15, this.ko - DT * 14);
      if (this.taseT <= 0 && !this.dead) { this.ko = 5; this.koTimer = rf(8, 12); this.koLatched = true; }
    }
    if (cold > 0) this.freeze = Math.min(1.6, this.freeze + DT * 0.06 * Math.min(cold, 5));
    else if (this.burn <= 0) this.freeze = Math.max(0, this.freeze - DT * 0.06);
    if (!this.frozen && this.freeze >= 1) {
      this.frozen = true;
      for (const j of this.joints) j.frozenRel = this.jointRel(j);
    } else if (this.frozen && this.freeze < 0.5) this.frozen = false;

    // Decay after death. Ice stops it, cool water slows it.
    if (this.dead && settings.decay) {
      const wet = liquidAt(this.x[P_WAIST], this.y[P_WAIST]);
      const rate = this.frozen ? 0 : (settings.decayFast ? 10 : 1) * (wet ? 0.6 : 1);
      this.deadT += DT * rate;
      this.dc = decayOf(this.deadT);
      // Leaking fluid stains the floor under the trunk.
      if (this.dc.purge > 0.05 && rate > 0 && Math.random() < this.dc.purge * DT * 4 * rate) {
        let lo = P_WAIST;
        for (const i of [P_NECK, P_HIP]) if (this.y[i] > this.y[lo]) lo = i;
        const sx = this.x[lo] + rf(-14, 14), sy = this.y[lo] + 10;
        if (solidAt(sx, sy + 4)) {
          dctx.fillStyle = "rgba(48,38,14,0.09)";
          dctx.beginPath(); dctx.ellipse(sx * 2, sy * 2, rf(10, 26), rf(4, 7), 0, 0, Math.PI * 2); dctx.fill();
        }
      }
    } else this.dc = null;
    // Rigor: the joints lock in the pose the body has when it sets in.
    if (this.dc && this.dc.rigor > 0.05) {
      if (!this.rigorOn) { this.rigorOn = true; for (const j of this.joints) j.rigorRel = this.jointRel(j); }
    } else this.rigorOn = false;

    if (this.iv > 0) this.updateInfusion();

    // Bleeding: drips from every open wound, spurts from stumps on each heartbeat.
    let flow = this.bl <= 0 ? 0 : clamp(this.bl / 100, 0.2, 1);
    if (this.dead) flow *= 0.25;
    for (const w of this.wounds) {
      if (w.bleed <= 0) continue;
      const loose = !this.attached(w.part);
      if (w.bandaged) {
        // Under the bandage the blood soaks in and the bleeding stops.
        w.soak = Math.min(1, (w.soak || 0) + w.bleed * DT * 0.25);
        if (w.band) w.band.soak = Math.max(w.band.soak, w.soak);
        w.bleed = Math.max(0, w.bleed - DT * (w.stump ? 0.45 : 1.1));
        continue;
      }
      if (loose) w.bleed = Math.max(0, w.bleed - 0.07 * DT);
      this.stain[w.part] = Math.min(0.75, this.stain[w.part] + w.bleed * DT * 0.08);
      const f = loose ? 0.6 : flow;
      // Blood runs down the body from the wound for as long as it bleeds,
      // a few pixels a second. Turned over or lifted, the old run stays on
      // the skin as a stain and a new one starts downward from the wound.
      const pa = partAngle(this, w.part);
      if (w.runAng === undefined) w.runAng = pa;
      // Small turns bend the running blood; it keeps going down from its tip.
      // Only when the body is turned far over does a new run start at the wound.
      if (Math.abs(wrapPi(pa - w.runAng)) > 1.2) { w.runAng = pa; w.newStream = true; w.drip = 0; }
      w.drip = Math.min(90, (w.drip || 0) + (0.6 + w.bleed) * f * DT * 5);
      if (f <= 0) continue;
      // Where the run leaves the body, drops fall off to the floor.
      if (w.dripOut && w.dripEnd && Math.random() < (0.5 + w.bleed) * f * DT * 4) spawnParticle(w.dripEnd[0] + rf(-0.8, 0.8), w.dripEnd[1], rf(-4, 4), rf(10, 30), BLOOD);
      const [wx, wy] = this.woundPos(w);
      if (Math.random() < w.bleed * DT * 12 * f) {
        const [nx, ny] = this.woundNormal(w), s = rf(10, 50);
        spawnParticle(wx, wy, nx * s + rf(-12, 12), ny * s, BLOOD);
      }
      const pump = loose ? Math.random() < DT * 1.5 : this.beat;
      if (w.stump && pump) {
        const [ux, uy] = this.stumpDir(w);
        const n = 5 + Math.floor(w.bleed * 3);
        for (let q = 0; q < n; q++) {
          const a = rf(-0.3, 0.3), s = rf(110, 240) * f;
          spawnParticle(wx, wy, (ux * Math.cos(a) - uy * Math.sin(a)) * s, (ux * Math.sin(a) + uy * Math.cos(a)) * s, BLOOD);
        }
      }
    }
  }

  // ------------------------------------------------ infusion
  ivPoint() {
    if (!this.gone[UARM_R] && this.attached(UARM_R)) return this.pb[UARM_R];
    if (!this.gone[UARM_L] && this.attached(UARM_L)) return this.pb[UARM_L];
    return this.pa[TORSO];
  }

  // The bag hangs beside the doll and switches sides before it would slide under the panel.
  ivTargetX(i) {
    const x = this.x[i] + 50;
    return toScreen(x, 0)[0] > PANEL.x - 24 ? Math.max(30, this.x[i] - 50) : x;
  }

  // Extras: closes every wound and resets all values. Lost limbs stay lost.
  // Flames on each part: clothes and hair burn away, the skin under them
  // burns deeper, fire creeps to the neighbors, rolling on the floor and
  // water put it out.
  updateFire() {
    let burning = 0;
    const speed = Math.hypot(this.x[P_WAIST] - this.ox[P_WAIST], this.y[P_WAIST] - this.oy[P_WAIST]);
    for (let k = 0; k < PART_COUNT; k++) {
      if (this.fire[k] <= 0) { this.ember[k] = Math.max(0, this.ember[k] - DT * 0.3); continue; }
      if (this.gone[k] || this.frozen) { this.fire[k] = 0; continue; }
      burning++;
      this.fire[k] -= DT;
      this.ember[k] = 1;
      const ax = this.x[this.pa[k]], ay = this.y[this.pa[k]], bx = this.x[this.pb[k]], by = this.y[this.pb[k]];
      // Pressed against the floor while rolling, the flames suffocate.
      const r = this.rad[this.pa[k]] + 3;
      if (speed > 1 && (solidAt(ax, ay + r) || solidAt(bx, by + r))) this.fire[k] -= DT * 1.6;
      // Clothes and hair burn first and keep the fire going.
      const clothed = PART_CLOTH[k] !== "skin";
      if (clothed && this.cloth[k] > 0) {
        this.cloth[k] = Math.max(0, this.cloth[k] - DT * (k === FOOT_L || k === FOOT_R ? 0.05 : 0.15));
        this.fire[k] = Math.max(this.fire[k], 0.6);
      }
      if (k === HEAD && this.hair > 0) this.hair = Math.max(0, this.hair - DT * 0.45);
      // Clothes shield the skin at first.
      const shield = clothed ? 0.3 + 0.7 * (1 - this.cloth[k]) : 1;
      this.burnDeg[k] = Math.min(4, this.burnDeg[k] + DT * 0.3 * shield);
      this.char[k] = clamp((this.burnDeg[k] - 2.6) / 1.4, 0, 1);
      this.hurtPart(k, DT * 7 * shield);
      // Fire creeps along the body to the parts next to it.
      if (Math.random() < DT * 0.5) {
        const nb = BURN_NEIGHBORS[k], n = nb[rnd(nb.length)], pc = this.pieces();
        if (n !== undefined && pc[this.pa[n]] === pc[this.pa[k]]) this.ignite(n, 2);
      }
      // Flames and sparks rise from the part.
      if (Math.random() < 0.45) {
        const t = Math.random(), x = lerp(ax, bx, t), y = lerp(ay, by, t) - 8;
        if (matAt(x, y) === EMPTY) setCell(Math.floor(x) + rnd(7) - 3, Math.floor(y), FIRE, 0, 18 + rnd(26));
      }
      if (Math.random() < DT * 4) sparks.push({ x: lerp(ax, bx, Math.random()), y: lerp(ay, by, Math.random()) - 6, vx: rf(-40, 40), vy: rf(-170, -70), life: rf(0.3, 0.7) });
      if (this.fire[k] <= 0) this.burnImmune = 0.8;
    }
    this.burn = burning ? 1 : 0;
    if (burning) {
      this.sinceDamage = 0;
      this.freeze = Math.max(0, this.freeze - DT * 0.9);
      if (!this.dead) this.pn = Math.min(100, this.pn + (4 + 3 * burning) * DT);
    }
  }

  // Burns over the body: how much skin is burnt (rule of nines), the fluid
  // the burns weep, and the pain they leave. Called from the vitals.
  updateBurns() {
    let tbsa = 0, loss = 0, pain = 0;
    for (let k = 0; k < PART_COUNT; k++) {
      const deg = this.burnDeg[k];
      if (deg < 0.3 || !this.attached(k)) continue;
      const dressed = this.bands.some((b) => b.burn && b.part === k) ? 0.5 : 1;
      if (deg >= 1.5) tbsa += BSA[k];
      loss += BSA[k] * clamp(deg - 1.2, 0, 2) * 0.0045 * dressed;
      // Deep burns kill the nerves: the 3rd degree hurts less than the 2nd.
      pain += BSA[k] * (deg < 1.5 ? 0.6 * deg : deg < 2.6 ? 1.4 : 0.5) * dressed;
    }
    this.tbsa = Math.round(tbsa);
    this.burnLoss = this.dead ? 0 : loss;
    if (!this.dead) {
      this.bl = Math.max(0, this.bl - loss * DT);

// ======================================================================
// Pixel layer: dolls and gibs are drawn as pixel art.
// One pixel covers PIX world units, then the layer scales up without smoothing.
// The small hand-made shapes (faces, wounds, the blood bag) keep their old
// size: one of their pixels is PQ layer pixels. Gun sprites use SPX world
// units per sprite pixel.
// ======================================================================

}

}

// Tapered capsule with rounded clay shading, lit from the upper left.

function closestOnSeg(px0, py0, ax, ay, bx, by) {
  const dx = bx - ax, dy = by - ay, l2 = dx * dx + dy * dy;
