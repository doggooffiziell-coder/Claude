  return [ax + dx * t, ay + dy * t];
}

// Closest points between segment a-b and segment p-q. t is the position on p-q.
function segSeg(ax, ay, bx, by, p0x, p0y, p1x, p1y) {
  let best = { d: Infinity, qx: p0x, qy: p0y, t: 0 };
  const n = 12;
  for (let s = 0; s <= n; s++) {
    const t = s / n, qx = lerp(p0x, p1x, t), qy = lerp(p0y, p1y, t);
    const [cx, cy] = closestOnSeg(qx, qy, ax, ay, bx, by);
    const d = Math.hypot(cx - qx, cy - qy);
    if (d < best.d) best = { d, qx, qy, t };
  }

}

// Paints a tool sprite centred on the origin, every sprite pixel snapped to

function drawToolPix(rows) {
  const m = ctx.getTransform(), p = Math.max(1, Math.round(1.75 * Math.hypot(m.a, m.b)));
  const n = rows.length, ox = Math.round(m.e - rows[0].length * p / 2), oy = Math.round(m.f - n * p / 2);

  for (let y = 0; y < n; y++) {
    const r = rows[y];
    for (let x = 0; x < r.length; x++) {
      const ch = r[x];
      if (ch === ".") continue;
      let e = x + 1;
      while (e < r.length && r[e] === ch) e++;
      ctx.fillStyle = TOOL_PIX_COLORS[ch];
      ctx.fillRect(ox + x * p, oy + y * p, (e - x) * p, p);
      x = e - 1;
    }
  }

const RANGE = 1100;
function dollOnRay(ox, oy, dx, dy, skip = null) {

  // Casing flies out of the side and bounces on the floor; pump and bolt
  // guns throw it out when they cycle.
  const back = Math.cos(ang) < 0 ? 1 : -1;
  if (!wp.cycle) spawnGib(px0, py0 - 4, back * rf(60, 140), rf(-260, -160), false, true);
  else state.cycle = { at: performance.now() + (wp.cycle === "pump" ? 330 : 520), kind: wp.cycle, back };
  state.shake = Math.max(state.shake, wp.kick);
  state.kick = 1;
  state.climb = Math.min(0.3, state.climb + wp.climb);
  shotSound(SHOT_KIND[wp.name]);
}

// A bullet along a ray: it stops at the first wall, splashes through water,
// and hits dolls on its way. The sniper round goes through up to three.
function shootRay(ox, oy, a, wp) {
  const dx = Math.cos(a), dy = Math.sin(a), pierce = wp.pierce || 1, skip = new Set();
  let wallT = RANGE, wallM = 0;
  for (let t = 4; t < RANGE; t += 2) { const m = matAt(ox + dx * t, oy + dy * t); if (m === WALL || m === ICE) { wallT = t; wallM = m; break; } }
  let hits = 0, lastT = 0;
  while (hits < pierce) {
    const [d, k, t] = dollOnRay(ox, oy, dx, dy, skip);
    if (!d || t >= wallT) break;
    d.shot(k, ox + dx * t, oy + dy * t, dx, dy, wp); state.selected = d;
    skip.add(d); hits++; lastT = t;
  }
  const stopped = hits >= pierce, endT = stopped ? lastT : wallT;
  // Bags and monitor screens on the way are hit too; the bullet goes on.
  for (const tg of medTargets()) { const t = rayBox(ox, oy, dx, dy, tg); if (t < endT) hitMedical(tg, ox + dx * t, oy + dy * t, dx, dy); }
  for (let t = 4; t < endT; t += 2) { const m = matAt(ox + dx * t, oy + dy * t); if ((m === WATER || m === BLOOD) && Math.random() < 0.25) splash(ox + dx * t, oy + dy * t, dx * 600, dy * 600); }
  const ex = ox + dx * endT, ey = oy + dy * endT;
  if (!stopped && wallT < RANGE) {
    if (wallM === ICE) for (let n = 0; n < 10; n++) {
      const ix = Math.floor(ex + rf(-4, 4)), iy = Math.floor(ey + rf(-4, 4));
      if (getMat(ix, iy) === ICE) { setCell(ix, iy, EMPTY); spawnParticle(ix, iy, rf(-80, 80) - dx * 120, rf(-160, -40), WATER, 0); }
    }
    for (let n = 0; n < 6; n++) sparks.push({ x: ex - dx * 2, y: ey - dy * 2, vx: -dx * rf(60, 220) + rf(-90, 90), vy: -dy * rf(60, 220) - rf(30, 160), life: rf(0.15, 0.35) });
  }
  tracers.push({ ax: ox, ay: oy, bx: ex, by: ey, age: 0 });
  return [ex, ey];
}

// The body part under a point, with its spot, side and the organs behind it.
function fingerHit(x, y) {
  let best = null, bestD = 1e9;
  for (let n = state.dolls.length - 1; n >= 0; n--) {
    const d = state.dolls[n];
    for (let k = 0; k < PART_COUNT; k++) {
      if (d.gone[k]) continue;
      const [ax, ay] = limbStart(d, k), bx = d.x[d.pb[k]], by = d.y[d.pb[k]];
      let dist, r;
      if (k === HEAD) { dist = Math.hypot(x - bx, y - by); r = HEAD_R + 2; }
      else { const [qx, qy] = closestOnSeg(x, y, ax, ay, bx, by); dist = Math.hypot(x - qx, y - qy); r = (RECT[k] ? RECT[k][0] : WIDTH[k] * 0.5) + 2; }
      if (dist > r || dist / r >= bestD) continue;
      bestD = dist / r; best = { d, k };
    }
    if (best) break;
  }
  if (!best) return null;
  const { d, k } = best;
  const [ax, ay] = limbStart(d, k), bx = d.x[d.pb[k]], by = d.y[d.pb[k]];
  let t, s, sv;
  if (k === HEAD) {
    t = (((Math.atan2(y - by, x - bx) / (Math.PI * 2)) % 1) + 1) % 1;
    s = 0; sv = clamp((x - bx) / HEAD_R, -1, 1) * -1;
  } else {
    const l = Math.hypot(bx - ax, by - ay) || 1, ux = (bx - ax) / l, uy = (by - ay) / l;
    t = clamp(((x - ax) * ux + (y - ay) * uy) / l, 0.05, 0.95);
    const perp = (x - ax) * -uy + (y - ay) * ux, half = RECT[k] ? RECT[k][0] : WIDTH[k] * 0.5;
    s = clamp(perp / Math.max(1, WIDTH[k] * 0.5 - 4), -1, 1);
    sv = clamp(perp / half, -1, 1);
  }
  // Organs: the spot mapped onto the body chart, the doll's left on its right.
  // Trunk and head use the same frame as the organs seen in the zoom.
  const [rx, ry, rw, rh] = CHART[k];
  let cx = rx + rw / 2 + sv * d.facing * rw / 2, cy = ry + t * rh;
  if (k === HEAD || k === TORSO || k === PELVIS) [cx, cy] = chartAt(organFrame(d, k), x, y);
  const organs = ORGANS.filter((o) => o.part === k && ORGAN_HIT[o.id].some(([ex, ey, ex2, ey2]) => ((cx - ex) / ex2) ** 2 + ((cy - ey) / ey2) ** 2 <= 1)).map((o) => o.id);
  // Low in the belly lie the loops of small bowel.
  if (k === TORSO && cy > ry + rh) organs.push("gut");
  return { d, k, t, s, organs, name: PART_NAME[k], crit: k === HEAD && Math.hypot(x - bx, y - by) < HEAD_R * 0.35 };
}

// A shot that misses every doll: sparks and a hole in walls, a splash in water.
function wallShot(x, y) {
  const m = matAt(x, y);
  if (m === WATER || m === BLOOD) splashSound(0.4); else wallHitSound();
  if (m === WATER || m === BLOOD) { for (let n = 0; n < 4; n++) splash(x + rf(-3, 3), y + rf(-3, 3), rf(-300, 300), -400); return; }
  if (m === ICE) {
    for (let n = 0; n < 10; n++) {
      const ix = Math.floor(x + rf(-4, 4)), iy = Math.floor(y + rf(-4, 4));
      if (getMat(ix, iy) === ICE) { setCell(ix, iy, EMPTY); spawnParticle(ix, iy, rf(-80, 80), rf(-160, -40), WATER, 0); }
    }
  }
  dctx.fillStyle = "rgba(12,12,14,0.85)"; dctx.beginPath(); dctx.arc(x * 2, y * 2, 2.6, 0, Math.PI * 2); dctx.fill();
  dctx.fillStyle = "rgba(255,255,255,0.12)"; dctx.beginPath(); dctx.arc(x * 2 - 1, y * 2 - 1, 1.2, 0, Math.PI * 2); dctx.fill();
  for (let n = 0; n < 6; n++) sparks.push({ x, y, vx: rf(-200, 200), vy: rf(-260, -40), life: rf(0.15, 0.35) });
}

// ======================================================================
// Sound engine. Every effect is made from noise and simple waves, shaped
// like the real thing: a sharp attack, a body in the right frequency band
// and a short decay. All of it runs through one mixer with a compressor
// (so loud shots do not clip) and a small concrete room reverb, which ties
// the sounds to the lab. Nothing is loaded from files.
// ======================================================================
const SFX = { master: null, verb: null, noise: null, last: {} };
function sfxCtx() {
  if (!settings.sound) return null;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    if (!SFX.master) {
      const comp = audio.createDynamicsCompressor();
      comp.threshold.value = -16; comp.knee.value = 8; comp.ratio.value = 5; comp.attack.value = 0.002; comp.release.value = 0.18;
      comp.connect(audio.destination);
      SFX.master = audio.createGain(); SFX.master.gain.value = 0.9; SFX.master.connect(comp);
      // Room: a few early reflections and an exponential tail.
      const len = Math.floor(audio.sampleRate * 1.3), ir = audio.createBuffer(2, len, audio.sampleRate);
      for (let c = 0; c < 2; c++) {
        const d = ir.getChannelData(c);
        for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3.2) * 0.6;
        for (const [ms, a] of [[11, 0.7], [19, 0.5], [31, 0.4], [47, 0.3]]) { const i = Math.floor(audio.sampleRate * (ms + c * 3) / 1000); if (i < len) d[i] += a; }
      }
      const conv = audio.createConvolver(); conv.buffer = ir;
      SFX.verb = audio.createGain(); SFX.verb.gain.value = 0.32;
      SFX.verb.connect(conv); conv.connect(SFX.master);
      const n = audio.sampleRate * 2; SFX.noise = audio.createBuffer(1, n, audio.sampleRate);
      const nd = SFX.noise.getChannelData(0); for (let i = 0; i < n; i++) nd[i] = Math.random() * 2 - 1;
    }
    return audio;
  } catch (e) { return null; }
}
// Once every ms milliseconds at most, so a burst of hits stays clean.
function sfxLimit(key, ms) {
  const now = performance.now();
  if (now - (SFX.last[key] || -1e9) < ms) return false;
  SFX.last[key] = now; return true;
}
function sfxEnv(g, t, a, peak, dur) {
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(peak, t + a);
  g.gain.exponentialRampToValueAtTime(0.0001, t + a + dur);
}
function sfxRoute(node, send) {

}
// Filtered noise: type and freq of the filter (swept to f2), q, level g,
// attack a, decay dur, reverb send.
function nz(t, dur, o) {
  const src = audio.createBufferSource(); src.buffer = SFX.noise; src.playbackRate.value = o.rate || 1;
  const f = audio.createBiquadFilter(); f.type = o.type || "bandpass"; f.Q.value = o.q || 1;
  f.frequency.setValueAtTime(o.f, t); if (o.f2) f.frequency.exponentialRampToValueAtTime(o.f2, t + (o.a || 0.002) + dur);
  const g = audio.createGain(); sfxEnv(g, t, o.a || 0.002, o.g, dur);
  src.connect(f); f.connect(g); sfxRoute(g, o.send || 0);
  src.start(t, Math.random() * 1.5); src.stop(t + (o.a || 0.002) + dur + 0.05);
}
// A tone: wave type, pitch f swept to f2, level g, decay dur.
function tn(t, dur, o) {

  osc.frequency.setValueAtTime(o.f, t); if (o.f2) osc.frequency.exponentialRampToValueAtTime(o.f2, t + dur);
  const g = audio.createGain(); sfxEnv(g, t, o.a || 0.002, o.g, dur);
  osc.connect(g); sfxRoute(g, o.send || 0);
  osc.start(t); osc.stop(t + (o.a || 0.002) + dur + 0.05);

const sfx = (fn) => { const ac = sfxCtx(); if (!ac) return; try { fn(ac.currentTime + 0.005); } catch (e) { /* sound is optional */ } };

// Gunshots. Each weapon has its own crack, body, low punch and tail.
const SHOT_KIND = { "AK-47": "ak", "Sturmgewehr": "ar", "Glock 17": "pistol", "Schrotflinte": "shotgun", "Sniper": "sniper", "Taser": "taser" };
function shotSound(kind) {
  sfx((t) => {
    const P = {
      ak: { crack: 0.55, body: 900, bodyG: 0.75, bodyD: 0.16, punch: 110, punchG: 0.55, tail: 0.5, mech: 2600 },
      ar: { crack: 0.6, body: 1300, bodyG: 0.6, bodyD: 0.12, punch: 130, punchG: 0.4, tail: 0.4, mech: 3200 },
      pistol: { crack: 0.45, body: 1500, bodyG: 0.5, bodyD: 0.09, punch: 150, punchG: 0.3, tail: 0.3, mech: 3800 },
      shotgun: { crack: 0.5, body: 520, bodyG: 0.95, bodyD: 0.32, punch: 85, punchG: 0.8, tail: 0.75, mech: 0 },
      sniper: { crack: 0.9, body: 1100, bodyG: 0.9, bodyD: 0.22, punch: 70, punchG: 0.85, tail: 0.9, mech: 0 },

  sfx((t) => { tn(t, 0.035, { type: "triangle", f: freq * 1.6, f2: freq * 1.2, g: vol * 0.7 }); nz(t, 0.01, { type: "bandpass", f: freq * 4, q: 3, g: vol * 0.4 }); });

// Red laser from the muzzle until it meets a wall or a body.
function drawLaser() {
  if (state.tool !== T_GUN || state.gunDrag) return;
  const wp = WEAPONS[state.weapon];
  const [px0, py0, ang] = gunPose();
  const [ox, oy] = muzzlePoint(px0, py0, ang, wp);
  const a = aimDir(ox, oy, ang), dx = Math.cos(a), dy = Math.sin(a);
  const hitT = dollOnRay(ox, oy, dx, dy)[2];
  let t = 4;
  for (; t < hitT; t += 2) {
    const x = ox + dx * t, y = oy + dy * t;
    if (x < 0 || x >= WW || y < 0 || y >= WH || solidAt(x, y)) break;
  }
  t = Math.min(t, hitT);
  const ex = ox + dx * t, ey = oy + dy * t;
  const g = ctx.createLinearGradient(ox, oy, ex, ey);
  g.addColorStop(0, "rgba(255,40,40,0.55)"); g.addColorStop(1, "rgba(255,40,40,0.25)");
  ctx.strokeStyle = g; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
  const glow = ctx.createRadialGradient(ex, ey, 0, ex, ey, 7);
  glow.addColorStop(0, "rgba(255,70,60,0.9)"); glow.addColorStop(1, "rgba(255,30,30,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd0c8"; ctx.beginPath(); ctx.arc(ex, ey, 1.3, 0, Math.PI * 2); ctx.fill();
}

function rasterGun() {
  const wp = WEAPONS[state.weapon];
  const [px0, py0, ang] = gunPose();
  const cx = px0 / PIX, cy = py0 / PIX, ca = Math.cos(ang), sa = Math.sin(ang), flip = ca < 0 ? -1 : 1;
  const rows = wp.sprite, R = (rows[0].length + 2) * PQ;
  pxMark(cx - R - 1, cy - R - 1, cx + R + 1, cy + R + 1);
  const put = (x, y, c) => { if (x >= 0 && y >= 0 && x < DW && y < DH) { const o = (y * DW + x) * 4; ppx[o] = c[0]; ppx[o + 1] = c[1]; ppx[o + 2] = c[2]; ppx[o + 3] = 255; } };
  const sample = (x, y) => {
    const ex = x + 0.5 - cx, ey = y + 0.5 - cy;
    const u = (ex * ca + ey * sa) / PQ + wp.grip[0], v = ((-ex * sa + ey * ca) * flip) / PQ + wp.grip[1];
    const iu = Math.floor(u), iv = Math.floor(v);
    if (iv < 0 || iv >= rows.length || iu < 0 || iu >= rows[0].length) return null;
    const ch = rows[iv][iu];
    return ch === "." ? null : GUN_COLORS[ch];
  };
  for (let y = Math.floor(cy - R); y <= Math.ceil(cy + R); y++) {
    for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
      const c = sample(x, y);
      if (c) put(x, y, c);
      else if (sample(x - 1, y) || sample(x + 1, y) || sample(x, y - 1) || sample(x, y + 1)) put(x, y, PX_BLACK);
    }
  }
}

// True when a point lies on the gun body, from the stock to the muzzle.
function onGun(x, y) {
  const wp = WEAPONS[state.weapon], [px0, py0, ang] = gunPose();
  const cx = Math.cos(ang), sx = Math.sin(ang);
  const u = (x - px0) * cx + (y - py0) * sx, v = -(x - px0) * sx + (y - py0) * cx;
  const back = -wp.grip[0] * SPX - 6, front = (wp.sprite[0].length - wp.grip[0]) * SPX + 6;
  return u > back && u < front && Math.abs(v) < 20;
}

// Reloading runs through the steps of the real gun, each with its sound:
// magazine out, new one in, then the bolt or slide is pulled. The shotgun
// takes shells one by one, the sniper works its bolt.
const RELOAD_STEPS = {
  mag: [[0, "MAGAZIN RAUS", "out"], [0.28, "NEUES MAGAZIN", null], [0.58, "MAGAZIN REIN", "in"], [0.84, "DURCHLADEN", "rack"]],
  pistol: [[0, "MAGAZIN RAUS", "out"], [0.3, "NEUES MAGAZIN", null], [0.6, "MAGAZIN REIN", "in"], [0.84, "SCHLITTEN VOR", "rack"]],
  bolt: [[0, "VERSCHLUSS AUF", "bolt"], [0.18, "MAGAZIN RAUS", "out"], [0.56, "MAGAZIN REIN", "in"], [0.84, "VERSCHLUSS ZU", "bolt"]],
  taser: [[0, "KARTUSCHE RAUS", "out"], [0.6, "NEUE KARTUSCHE", "in"]],

function reloadSteps(wp) {
  if (wp.rk !== "shells") return RELOAD_STEPS[wp.rk] || RELOAD_STEPS.mag;
  const n = Math.max(1, wp.mag - state.reloadFrom), out = [];
  for (let i = 0; i < n; i++) out.push([(i + 0.4) / (n + 1), "PATRONE " + (state.reloadFrom + i + 1) + "/" + wp.mag, "shell"]);
  out.push([(n + 0.3) / (n + 1), "DURCHLADEN", "pump"]);
  return out;
}
function reloadEvent(ev) {
  const wp = WEAPONS[state.weapon];
  if (ev === "out") {
    magOutSound();
    // The empty magazine drops out under the gun, or in the front view where
    // the last shot was fired.
    if (settings.front) { const [lx, ly] = state.lastShot || [WW / 2, FLOOR_Y - 120]; spawnGib(lx, ly, rf(-30, 30), rf(-60, 0), false, true, true); }
    else { const [px0, py0, ang] = gunPose(); spawnGib(px0 + Math.cos(ang) * 14, py0 + 10, rf(-30, 30), rf(-60, 0), false, true, true); }
  } else if (ev === "in") { magInSound(); state.kick = 0.5; }
  else if (ev === "rack") { rackSound(); state.kick = 0.8; }
  else if (ev === "bolt") boltSound();
  else if (ev === "pump") { pumpSound(); state.kick = 0.8; }
  else if (ev === "shell") { shellInSound(); state.ammo[state.weapon] = Math.min(wp.mag, state.ammo[state.weapon] + 1); state.kick = 0.3; }
}
function reloadProgress() { return state.reloadT > 0 && state.reloadLen ? 1 - state.reloadT / state.reloadLen : 1; }
function reloadLabel() {
  const wp = WEAPONS[state.weapon], p = reloadProgress();
  let txt = "LÄDT";
  for (const [at, name] of reloadSteps(wp)) if (p >= at) txt = name;
  return txt;
}
function startReload() {
  const wp = WEAPONS[state.weapon];
  if (state.reloadT > 0 || state.ammo[state.weapon] >= wp.mag) return;
  state.reloadFrom = state.ammo[state.weapon];
  // Shells go in one by one, so the time grows with the shells missing.
  state.reloadT = wp.rk === "shells" ? wp.reload * (0.35 + 0.65 * (wp.mag - state.reloadFrom) / wp.mag) : wp.reload;
  state.reloadLen = state.reloadT; state.reloadStep = 0;
  state.triggerDown = false;
}
function reloadStep() {
  const wp = WEAPONS[state.weapon];
  if (state.reloadT <= 0) return;
  state.reloadT -= DT;
  const p = 1 - Math.max(0, state.reloadT) / state.reloadLen, steps = reloadSteps(wp);
  while (state.reloadStep < steps.length && p >= steps[state.reloadStep][0]) { const ev = steps[state.reloadStep][2]; if (ev) reloadEvent(ev); state.reloadStep++; }
  if (state.reloadT <= 0) { state.reloadT = 0; state.ammo[state.weapon] = wp.mag; }

// The monitor cart: a screen with the live heart trace, pulse and oxygen,

// The cart: pole with the bag, wheels, base and the screen frame. m holds
// what was shot: the bag (bag false) and the screen (broken, hx/hy the hole).
function drawMonitorCart(x, gy, screen, m = {}) {
  const now = performance.now() / 1000;
  ctx.fillStyle = "#0b0b0e"; ctx.fillRect(x + 8, gy - 108, 4, 82);
  ctx.fillStyle = "#8a8a94"; ctx.fillRect(x + 9, gy - 107, 2, 80);
  if (m.bag !== false) {
    ctx.fillStyle = "#0b0b0e"; ctx.fillRect(x + 3, gy - 104, 14, 16); ctx.fillStyle = "#e6e8ee"; ctx.fillRect(x + 4, gy - 103, 12, 14);
    ctx.fillStyle = "#b0121f"; ctx.fillRect(x + 5, gy - 100 + 2 * Math.sin(now), 10, 10);
  } else {
    // Only the hook and a torn scrap stay on the pole.
    ctx.fillStyle = "#0b0b0e"; ctx.fillRect(x + 5, gy - 106, 10, 4);
    ctx.fillStyle = "#c8ccd4"; ctx.fillRect(x + 6, gy - 105, 3, 5); ctx.fillStyle = "#7a1018"; ctx.fillRect(x + 11, gy - 105, 2, 4);
  }
  ctx.fillStyle = "#0b0b0e"; ctx.fillRect(x - 16, gy - 9, 34, 5); ctx.fillStyle = "#5a5a64"; ctx.fillRect(x - 15, gy - 8, 32, 3);
  for (const wx of [x - 13, x + 13]) { ctx.fillStyle = "#121216"; ctx.beginPath(); ctx.arc(wx, gy - 3, 3, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = "#0b0b0e"; ctx.fillRect(x - 2, gy - 30, 5, 22); ctx.fillStyle = "#6a6a74"; ctx.fillRect(x - 1, gy - 29, 3, 20);

  ctx.fillStyle = "#0b0b0e"; ctx.fillRect(sx - 2, sy - 2, sw + 4, sh + 4);
  ctx.fillStyle = "#b8bcc4"; ctx.fillRect(sx - 1, sy - 1, sw + 2, sh + 2);
  ctx.fillStyle = screen; ctx.fillRect(sx + 1, sy + 1, sw - 2, sh - 2);

    // Cracks run out from the bullet hole, the glass around it is white.
    const hx = sx + m.hx, hy = sy + m.hy;

    ctx.strokeStyle = "rgba(220,228,236,0.55)"; ctx.lineWidth = 0.6;

    }
    ctx.beginPath(); ctx.arc(hx, hy, 4, 0, Math.PI * 2); ctx.stroke();
    ctx.restore();
    ctx.fillStyle = "#0b0b0e"; ctx.beginPath(); ctx.arc(hx, hy, 1.6, 0, Math.PI * 2); ctx.fill();
  }
}

// Besides the dolls a shot can hit every blood bag (on its own stand or on a
// monitor pole) and every monitor screen.
function medTargets() {
  const out = [], S = SPX;
  for (const d of state.dolls) {
    if (d.iv > 0) out.push({ kind: "iv", d, x: d.ivX - 3 * S, y: d.ivY, w: 8 * S, h: 10 * S });
    const m = d.monitor;
    if (m && m.y !== undefined) {
      const x = Math.round(m.x), gy = m.y + 40;
      if (m.bag !== false) out.push({ kind: "monbag", d, x: x + 3, y: gy - 104, w: 14, h: 16 });
      if (!m.broken) out.push({ kind: "screen", d, x: x - 26, y: gy - 64, w: 48, h: 36 });
    }

  return out;
}
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
// How far along a ray it first enters a box, or Infinity.
function rayBox(ox, oy, dx, dy, b) {
  let t0 = 0, t1 = Infinity;
  for (const [o, d, lo, hi] of [[ox, dx, b.x, b.x + b.w], [oy, dy, b.y, b.y + b.h]]) {
    if (Math.abs(d) < 1e-9) { if (o < lo || o > hi) return Infinity; continue; }
    let a = (lo - o) / d, c = (hi - o) / d;
    if (a > c) [a, c] = [c, a];
    t0 = Math.max(t0, a); t1 = Math.min(t1, c);
    if (t0 > t1) return Infinity;
  }

}

function hitMedical(tg, x, y, dx, dy) {

// Blood squirting out of a shot bag for a moment after it bursts.
let bagJets = [];
function burstBag(tg, dx, dy) {
  const d = tg.d, cx = tg.x + tg.w / 2, cy = tg.y + tg.h * 0.55;
  const full = tg.kind === "iv" ? clamp(d.iv / IV_TIME, 0.2, 1) : 0.85;
  // The bag bursts: a cloud of blood flies on with the bullet and spatters the wall.
  for (let n = 0; n < 30 + full * 60; n++) {
    const a = Math.atan2(dy, dx) + rf(-1.2, 1.2), sp = rf(80, 460);
    spawnParticle(cx + rf(-4, 4), cy + rf(-4, 4), Math.cos(a) * sp + rf(-70, 70), Math.sin(a) * sp - rf(40, 240), BLOOD);
  }
  for (let n = 0; n < 10; n++) splat(cx + dx * rf(8, 70) + rf(-14, 14), cy + dy * rf(8, 70) + rf(-16, 16), rf(1.2, 3.4));
  bagJets.push({ x: cx, y: cy + 4, dx, dy, t: 0.3 + 0.7 * full });

  g.bag = true; g.r = 7; g.rot = rf(-0.4, 0.4); g.vr = rf(-7, 7); g.bleed = 0.8;
  if (tg.kind === "iv") { d.iv = 0; d.logEvent("Blutbeutel zerschossen"); }
  else { d.monitor.bag = false; d.logEvent("Blutbeutel am Monitor zerschossen"); }

    const k = clamp(j.t, 0, 1);

// ----------------------------------------------------------------- music
// Quiet menu music made on the fly: a soft pad and a slow plucked melody
// through an echo, four chords in a loop. After the shot on the title it
// turns dark: the melody stops, the pad sinks a semitone behind a closing
// filter and a slow heartbeat thumps underneath. In the game it fades out.
const music = { on: false, duck: 0, dark: 0, next: 0, step: 0, beat: 0, voices: [] };

function musicStart() {
  if (music.on || !settings.music) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const a = audio;
    music.out = a.createGain(); music.out.gain.value = 0;
    music.lp = a.createBiquadFilter(); music.lp.type = "lowpass"; music.lp.frequency.value = 1600;
    music.lp.connect(music.out); music.out.connect(a.destination);
    // Echo for the melody
    const echo = a.createDelay(1), fb = a.createGain(), wet = a.createGain();
    echo.delayTime.value = MUSIC_STEP * 1.5; fb.gain.value = 0.36; wet.gain.value = 0.45;
    echo.connect(fb); fb.connect(echo); echo.connect(wet); wet.connect(music.lp);

    pad.connect(plp); plp.connect(music.lp);

    lfo.frequency.value = 0.08; lg.gain.value = 260; lfo.connect(lg); lg.connect(plp.frequency); lfo.start();
    for (let v = 0; v < 4; v++) for (const det of [-8, 8]) {

      o.frequency.value = mtof(CHORDS[0][v] - 12); o.connect(pad); o.start();

}
function musicTick() {
  const a = audio, now = a.currentTime;
  const menu = state.screen !== "game" && settings.music;
  music.dark = moveToward(music.dark, titleShot && titleShot.bled && state.screen === "title" ? 1 : 0, 0.08 * 0.6);
  music.duck = Math.max(0, music.duck - 0.08 / 2.6);
  const dk = music.dark;
  music.out.gain.setTargetAtTime(menu ? 0.9 * (1 - 0.85 * music.duck) : 0, now, menu ? 0.6 : 0.25);
  music.lp.frequency.setTargetAtTime(lerp(1600, 360, dk) * (1 - 0.6 * music.duck), now, 0.3);
  music.mel.gain.setTargetAtTime(1 - dk, now, 0.4);
  if (!menu) { music.next = now + 0.1; return; }
  while (music.next < now + 0.3) {
    const t = music.next, bar = Math.floor(music.step / 16), chord = CHORDS[bar % 4], k = music.step % 16;
    if (k === 0) for (const vc of music.voices) {
      vc.o.frequency.setTargetAtTime(mtof(chord[vc.v] - 12), t, 0.5);
      vc.o.detune.setTargetAtTime(vc.det - 100 * dk, t, 1.2);
    }
    // The melody plucks through the chord, a few notes left out.
    const pat = [0, 2, 1, 3, 2, -1, 1, 2, 0, 3, 2, -1, 1, 2, 3, -1][k];
    if (pat >= 0 && dk < 0.95) pluck(mtof(chord[pat] + 12), t);

    if (dk > 0.3 && t >= music.beat) { thump(t, 0.3 * dk); thump(t + 0.26, 0.2 * dk); music.beat = t + 1.2; }

}
function thump(t, v) {
  const o = audio.createOscillator(), g = audio.createGain();
  o.frequency.setValueAtTime(62, t); o.frequency.exponentialRampToValueAtTime(38, t + 0.18);
  g.gain.setValueAtTime(v, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.25);
  o.connect(g); g.connect(music.out); o.start(t); o.stop(t + 0.27);
}

    }
    let [light, dark] = damageColors(d.dmg[k]);
    if (d.burnDeg[k] > 0.3) { const bc = burnSkin(hex("#f0d0b8"), d.burnDeg[k]), m = Math.min(1, d.burnDeg[k] / 1.5) * 0.85; light = mixc(light, bc, m); dark = mixc(dark, darken(bc, 0.3), m); }
    if (d.frozen) { light = mixc(light, COL_ICE, 0.5); dark = mixc(dark, COL_ICE, 0.5); }
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, css(light)); g.addColorStop(1, css(dark));
    ctx.fillStyle = g; ctx.fill();
    // A thin gap in the panel color separates every part from its neighbors.
    ctx.strokeStyle = "#0a0a0d"; ctx.lineWidth = 1.8; ctx.stroke();
  }
}

// Irregular blob around a point, the same shape every frame for one wound.
function blobPath(x, y, r, seed, n = 7, rough = 0.35) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2, q = r * (1 - rough / 2 + rough * (0.5 + 0.5 * Math.sin(seed * 7 + i * 2.3)));
    i ? ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q) : ctx.moveTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
  }
  ctx.closePath();
}

// A thin stream of blood running down from a wound, with a drop that grows and falls.
function drawDrip(x, y, s, bleed, seed, now) {
  const len = (3 + bleed * 7) * s, wob = Math.sin(seed * 3) * 0.8 * s;
  ctx.strokeStyle = "rgba(150,12,24,0.95)"; ctx.lineWidth = Math.max(0.8, 1.1 * s); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + wob, y + len * 0.5, x + wob * 0.6, y + len); ctx.stroke();
  const ph = (now * (0.8 + bleed) + seed) % 1;
  ctx.fillStyle = "#b3141f";
  ctx.beginPath(); ctx.arc(x + wob * 0.6, y + len + ph * ph * 4 * s, (0.7 + ph * 0.6) * s, 0, Math.PI * 2); ctx.fill();
}

function drawWoundMark(w, x, y, s, now) {
  const seed = w.seed || w.rot * 9, big = w.size > 2 ? 1.25 : 1;
  // A wrapped wound is hidden under its band (drawChartBands).
  if (w.bandaged && w.band && !w.stump) return;
  if (w.bandaged) {
    // Gauze strip across the part with the blood that soaked through.
    rr(x - 4.2 * s, y - 1.8 * s, 8.4 * s, 3.6 * s, 0.9 * s); ctx.fillStyle = "#ece8de"; ctx.fill();
    ctx.strokeStyle = "rgba(120,110,96,0.6)"; ctx.lineWidth = 0.35 * s; ctx.stroke();
    ctx.beginPath(); for (let k = -3; k <= 3; k += 1.5) { ctx.moveTo(x + k * s, y - 1.6 * s); ctx.lineTo(x + k * s, y + 1.6 * s); } ctx.stroke();
    ctx.fillStyle = w.bleed > 0 ? "rgba(170,24,40,0.85)" : "rgba(110,26,32,0.8)";
    blobPath(x, y, (0.7 + (w.soak || 0) * 1.1) * s, seed, 7, 0.4); ctx.fill();
    return;
  }
  if (w.stump) {
    // Torn flesh with the bone end in the middle
    blobPath(x, y, 3.6 * s, seed, 9, 0.5); ctx.fillStyle = "#7a0a16"; ctx.fill();
    blobPath(x, y, 2.6 * s, seed + 1, 8, 0.4); ctx.fillStyle = "#c8344c"; ctx.fill();
    ctx.fillStyle = "#ece6d4"; ctx.beginPath(); ctx.arc(x, y, 1.2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#b8ab90"; ctx.beginPath(); ctx.arc(x + 0.3 * s, y + 0.3 * s, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (w.bleed > 0.05) drawDrip(x, y + 2.4 * s, s, w.bleed, seed, now);
    return;
  }
  if (w.kind === "cut") {
    // A cut along the blade's path: it gapes in the middle like an eye,
    // red flesh inside, a dark slit in the center, pointed ends.
    const a = w.ang !== undefined ? Math.PI / 2 + w.ang : w.rot + 0.6;
    const l = (1.6 + (w.len || 1.6) * 1.3) * s * big, gw = (0.9 + w.size * 0.35) * s;
    const ux = Math.cos(a), uy = Math.sin(a), px = -uy, py = ux;
    const lens = (k) => {
      ctx.beginPath(); ctx.moveTo(x - ux * l, y - uy * l);
      ctx.quadraticCurveTo(x + px * gw * k * 2, y + py * gw * k * 2, x + ux * l, y + uy * l);
      ctx.quadraticCurveTo(x - px * gw * k * 2, y - py * gw * k * 2, x - ux * l, y - uy * l);
      ctx.closePath();
    };
    lens(1.6); ctx.fillStyle = "rgba(110,12,24,0.45)"; ctx.fill();
    lens(1); ctx.fillStyle = w.bleed > 0 ? "#d4566a" : "#9a1828"; ctx.fill();
    lens(0.45); ctx.fillStyle = "#2c0409"; ctx.fill();
    ctx.strokeStyle = "rgba(60,4,10,0.7)"; ctx.lineWidth = 0.5 * s; lens(1); ctx.stroke();
    if (w.bleed > 0.05) drawDrip(x, y + gw * 1.2, s, w.bleed, seed, now);
    return;
  }
  if (w.kind === "shot" && w.exit) {
    // Exit hole: bigger and torn outward, ragged flaps of flesh around it.
    const r = 1.5 * s * big;
    blobPath(x, y, r * 2.5, seed, 9, 0.45); ctx.fillStyle = "rgba(110,30,60,0.32)"; ctx.fill();
    blobPath(x, y, r * 1.8, seed + 1, 11, 0.7); ctx.fillStyle = "#c8344c"; ctx.fill();
    blobPath(x, y, r * 1.2, seed + 4, 8, 0.5); ctx.fillStyle = "#8a1222"; ctx.fill();
    blobPath(x, y, r * 0.65, seed + 2, 7, 0.4); ctx.fillStyle = "#2c0409"; ctx.fill();
    if (w.bleed > 0.05) drawDrip(x, y + r * 1.3, s, w.bleed, seed, now);
    return;
  }
  if (w.kind === "shot") {
    // Entry hole: small and round, a ring of scraped skin, a faint bruise
    const r = 0.95 * s * big;
    blobPath(x, y, r * 2.6, seed, 8, 0.3); ctx.fillStyle = "rgba(110,30,60,0.3)"; ctx.fill();
    ctx.fillStyle = "#7a0e1c"; ctx.beginPath(); ctx.arc(x, y, r * 1.7, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1a0306"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,140,140,0.35)"; ctx.beginPath(); ctx.arc(x - r * 0.9, y - r * 0.9, r * 0.45, 0, Math.PI * 2); ctx.fill();
    if (w.bleed > 0.05) drawDrip(x, y + r, s, w.bleed, seed, now);
    return;
  }
  // Blunt hit: torn skin over a bruise
  blobPath(x, y, 3 * s * big, seed, 8, 0.45); ctx.fillStyle = "rgba(96,30,70,0.45)"; ctx.fill();
  blobPath(x, y, 1.7 * s * big, seed + 3, 7, 0.5); ctx.fillStyle = "#9c1626"; ctx.fill();
  if (w.bleed > 0.05) drawDrip(x, y + 1.2 * s, s, w.bleed, seed, now);
}

// ======================================================================
// Static layers: room, lamp and light, rebuilt on every resize
// ======================================================================

// Three lamps hang from long cords: the old one over the middle and one
// over each new side of the room.
const LAMPS = [Math.round(OFFX * 0.5), Math.round(OFFX + W / 2), Math.round(WW - OFFX * 0.5)], LAMP_Y = OFFY + 42;
const bgCan = document.createElement("canvas"), lightCan = document.createElement("canvas");

function buildStatic() {
  // The room layers cover the whole room at screen sharpness, at most 2
  // device pixels per unit so the big room stays light on memory.
  const kb = Math.min(K, 2);
  bgCan.width = lightCan.width = Math.ceil(WW * kb);
  bgCan.height = lightCan.height = Math.ceil(WH * kb);
  const b = bgCan.getContext("2d");
  b.setTransform(kb, 0, 0, kb, 0, 0);
  const th = MAPS[state.map].theme;
  const wall = b.createLinearGradient(0, 0, 0, FLOOR_Y);
  wall.addColorStop(0, th.wall[0]); wall.addColorStop(1, th.wall[1]);
  b.fillStyle = wall; b.fillRect(0, 0, WW, FLOOR_Y);
  for (let x = 0; x < WW; x += 96) {
    b.fillStyle = "rgba(255,255,255,0.018)"; b.fillRect(x + 4, 20, 88, FLOOR_Y - 36);
    b.fillStyle = th.line; b.fillRect(x, 16, 1.5, FLOOR_Y - 16);
    b.fillStyle = "rgba(255,255,255,0.03)"; b.fillRect(x + 1.5, 16, 1, FLOOR_Y - 16);
  }
  for (let y = 96; y < FLOOR_Y - 20; y += 80) { b.fillStyle = th.line; b.fillRect(0, y, WW, 1.5); }
  b.fillStyle = "#111114"; b.fillRect(0, 0, WW, 16);
  b.fillStyle = "#0a0a0c"; b.fillRect(0, 16, WW, 1.5);
  // Pipes along the wall, vents and door frames give the room some depth.
  const pipe = (x0, y0, x1, y1, r) => {
    b.strokeStyle = "rgba(0,0,0,0.45)"; b.lineWidth = r * 2 + 2; b.lineCap = "butt";
    b.beginPath(); b.moveTo(x0, y0); b.lineTo(x1, y1); b.stroke();
    b.strokeStyle = th.line; b.lineWidth = r * 2; b.beginPath(); b.moveTo(x0, y0); b.lineTo(x1, y1); b.stroke();
    b.strokeStyle = "rgba(255,255,255,0.07)"; b.lineWidth = 1.2; b.beginPath(); b.moveTo(x0, y0 - r * 0.5); b.lineTo(x1, y1 - r * 0.5); b.stroke();
  };
  const py = OFFY + 150;
  pipe(0, py, WW, py, 4);
  pipe(0, OFFY * 0.45, WW, OFFY * 0.45, 3);
  pipe(WW * 0.86, py, WW * 0.86, FLOOR_Y - 12, 4);
  pipe(WW * 0.12, OFFY * 0.45, WW * 0.12, py, 3);
  for (let x = 40; x < WW; x += 160) { b.fillStyle = "rgba(0,0,0,0.5)"; b.fillRect(x, py - 6, 8, 12); }
  for (const vx of [WW * 0.07, WW * 0.5]) {
    b.fillStyle = "rgba(0,0,0,0.35)"; b.fillRect(vx, OFFY + 200, 54, 30);
    b.fillStyle = "rgba(255,255,255,0.05)";
    for (let k = 0; k < 6; k++) b.fillRect(vx + 4, OFFY + 204 + k * 4.5, 46, 1.5);
  }
  for (const dx of [WW * 0.66, WW * 0.2]) {
    b.strokeStyle = "rgba(0,0,0,0.4)"; b.lineWidth = 3;
    b.strokeRect(dx, FLOOR_Y - 150, 70, 138);
    b.fillStyle = "rgba(0,0,0,0.18)"; b.fillRect(dx + 2, FLOOR_Y - 148, 66, 134);
    b.fillStyle = "rgba(255,255,255,0.08)"; b.fillRect(dx + 54, FLOOR_Y - 84, 8, 3);
  }
  // High windows let a little cold light into the upper room.
  for (let x = 120; x < WW - 100; x += 300) {
    b.fillStyle = "rgba(0,0,0,0.45)"; b.fillRect(x, 44, 90, 46);
    b.fillStyle = "rgba(120,140,170,0.07)"; b.fillRect(x + 3, 47, 84, 40);
    b.fillStyle = "rgba(0,0,0,0.5)"; b.fillRect(x + 44, 47, 2, 40); b.fillRect(x + 3, 66, 84, 2);
  }
  // The upper room lies in the dark, away from the lamps.
  const dk = b.createLinearGradient(0, 0, 0, FLOOR_Y);
  dk.addColorStop(0, "rgba(0,0,0,0.4)"); dk.addColorStop(0.45, "rgba(0,0,0,0.14)"); dk.addColorStop(1, "rgba(0,0,0,0)");
  b.fillStyle = dk; b.fillRect(0, 0, WW, FLOOR_Y);
  b.fillStyle = "#2a2a31"; b.fillRect(0, FLOOR_Y - 12, WW, 12);
  b.fillStyle = "#3a3a42"; b.fillRect(0, FLOOR_Y - 12, WW, 1.2);
  // Floor tiles
  const fl = b.createLinearGradient(0, FLOOR_Y, 0, WH);
  fl.addColorStop(0, th.floor[0]); fl.addColorStop(1, th.floor[1]);
  b.fillStyle = fl; b.fillRect(0, FLOOR_Y, WW, WH - FLOOR_Y);
  b.fillStyle = th.edge; b.fillRect(0, FLOOR_Y, WW, 2);
  b.fillStyle = "rgba(0,0,0,0.18)";
  for (let x = 0; x < WW; x += 64) b.fillRect(x, FLOOR_Y + 2, 1.5, WH - FLOOR_Y);
  b.fillRect(0, FLOOR_Y + 26, WW, 1.5);
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let n = 0; n < 800; n++) {
    b.fillStyle = `rgba(0,0,0,${0.04 + rand() * 0.08})`;
    b.fillRect(rand() * WW, FLOOR_Y + 3 + rand() * (WH - FLOOR_Y - 3), 1 + rand() * 1.5, 1 + rand());
  }
  // Lamps on long cords from the ceiling
  for (const lx of LAMPS) {
    b.strokeStyle = "#0b0b0d"; b.lineWidth = 1.6;
    b.beginPath(); b.moveTo(lx, 16); b.lineTo(lx, LAMP_Y - 16); b.stroke();
    const shadeG = b.createLinearGradient(0, LAMP_Y - 18, 0, LAMP_Y - 2);
    shadeG.addColorStop(0, "#5a5a64"); shadeG.addColorStop(1, "#2e2e35");
    b.fillStyle = shadeG;
    b.beginPath(); b.moveTo(lx - 5, LAMP_Y - 17); b.lineTo(lx + 5, LAMP_Y - 17); b.lineTo(lx + 20, LAMP_Y - 3); b.lineTo(lx - 20, LAMP_Y - 3); b.closePath(); b.fill();
    b.strokeStyle = "#0b0b0d"; b.lineWidth = 1.4; b.stroke();
    b.fillStyle = "#fff4d0"; b.beginPath(); b.ellipse(lx, LAMP_Y - 1.5, 6, 3, 0, 0, Math.PI * 2); b.fill();
  }

  // Light: stacked cones give soft edges, plus a glow at the bulb and on the floor.
  const l = lightCan.getContext("2d");
  l.setTransform(kb, 0, 0, kb, 0, 0);
  for (const lx of LAMPS) {
    for (let n = 0; n < 6; n++) {
      const spread = 0.42 + n * 0.035;
      const g = l.createLinearGradient(0, LAMP_Y, 0, FLOOR_Y + 20);
      g.addColorStop(0, `rgba(255,240,204,${0.05})`);
      g.addColorStop(1, `rgba(255,240,204,${0.012})`);
      l.fillStyle = g;
      l.beginPath();
      l.moveTo(lx - 14, LAMP_Y - 2); l.lineTo(lx + 14, LAMP_Y - 2);
      l.lineTo(lx + (FLOOR_Y - LAMP_Y) * spread, FLOOR_Y + 30);
      l.lineTo(lx - (FLOOR_Y - LAMP_Y) * spread, FLOOR_Y + 30);
      l.closePath(); l.fill();
    }
    const glow = l.createRadialGradient(lx, LAMP_Y, 0, lx, LAMP_Y, 60);
    glow.addColorStop(0, "rgba(255,240,204,0.5)"); glow.addColorStop(1, "rgba(255,240,204,0)");
    l.fillStyle = glow; l.fillRect(lx - 60, LAMP_Y - 60, 120, 120);
    l.save(); l.translate(lx, FLOOR_Y + 4); l.scale(1, 0.12);
    const spot = l.createRadialGradient(0, 0, 0, 0, 0, 170);
    spot.addColorStop(0, "rgba(255,240,204,0.35)"); spot.addColorStop(1, "rgba(255,240,204,0)");
    l.fillStyle = spot; l.beginPath(); l.arc(0, 0, 170, 0, Math.PI * 2); l.fill();
    l.restore();
  }
}

// A block of a map in the big room: moved to the middle and down to the
// floor, stretched to the side walls where it touched the old ones.
function mapRect(r) {
  let x0 = r[0] + OFFX, x1 = r[0] + r[2] + OFFX;
  if (r[0] <= 0) x0 = 0;
  if (r[0] + r[2] >= W - 0.5) x1 = WW;
  return [x0, r[1] + OFFY, x1 - x0, r[3]];
}
// Where a map puts a doll: an x position, or [x, y] to start below a ceiling.
const mapDollSpot = (e) => (Array.isArray(e) ? e : [e, 40]);

function fillRect(r, m, mx = 0, lf = 0) {
  const [rx, ry, rw, rh] = r.map(Math.round);
  for (let y = ry; y < ry + rh; y++) for (let x = rx; x < rx + rw; x++) setCell(x, y, m, mx, lf);
}

// Builds the chosen map: room, blocks, water, ice and the starting dolls.
function loadMap(i) {
  state.map = i;
  homeView(state.cam); state.zoomAnim = null;
  state.fires = []; wires = [];
  worldReset();
  // Maps are laid out on the old screen-sized room; it sits in the middle of
  // the big room on its floor. Blocks that reached the old side walls go on
  // to the new ones.
  const m = MAPS[i].build(), down = mapRect;
  for (const r of m.walls) fillRect(down(r), WALL);
  for (const r of m.ice) fillRect(down(r), ICE, 0, 0);
  for (const r of m.water) fillRect(down(r), WATER);
  // Remember the map's own ice so "Eis entfernen" only clears placed ice.
  for (let i = 0; i < N; i++) mapIce[i] = mat[i] === ICE ? 1 : 0;
  gibs = []; effects = []; tracers = []; flashes = []; sparks = []; smokes = []; bagJets = [];
  dctx.clearRect(0, 0, decal.width, decal.height);
  state.dolls = []; state.selected = null; state.grabDoll = null; state.counter = 0;
  for (const e of m.dolls) { const [x, y] = mapDollSpot(e); placeDoll(x + OFFX, y + OFFY); }
  state.toast = 0;
  buildStatic();
}

// ======================================================================
// Animation helpers: short, eased and frame rate independent
// ======================================================================

let frameDt = 1 / 60;
const animV = {};
// Moves a value smoothly toward its target.
function tween(key, target, rate = 14) {
  let v = animV[key];
  if (v === undefined) v = target;
  v += (target - v) * (1 - Math.exp(-rate * frameDt));
  if (Math.abs(target - v) < 0.002) v = target;
  animV[key] = v;
  return v;
}
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
const easeIn = (t) => { t = clamp(t, 0, 1); return t * t; };
// Entry of the n-th element after a screen change: 0 hidden, 1 in place.
const appear = (n, dur = 0.3, step = 0.05) => easeOut((state.screenT - n * step) / dur);
// Draws something faded in and lifted while it appears.
function withAppear(a, fn, lift = 10) {
  if (a <= 0) return;
  if (a >= 1) { fn(); return; }
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * lift); fn(); ctx.restore();
}
// Scales a drawing around a point.
function scaled(cx, cy, k, fn) {
  if (k === 1) { fn(); return; }
  ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy); fn(); ctx.restore();
}
// A short dip in size after a tap.
const popAt = {};
const pop = (key) => { popAt[key] = performance.now(); };
function popScale(key, depth = 0.08) {
  const t = (performance.now() - (popAt[key] || -1e9)) / 170;
  return t >= 1 ? 1 : 1 - depth * Math.sin(Math.PI * t);
}

function setScreen(name) {

  if (state.screen === "settings") state.settingsFromGame = false;

}

// A blocky person in front view, used on the title screen and in map pictures.
// Units match the dolls: the person is about 186 units tall, feet at footY.
function drawBlockPerson(cx, footY, sc, look, opt = {}) {
  const bob = opt.bob || 0, arm = opt.arm || 0, outline = opt.outline !== false;
  const R = (x, y, w, h, c) => { ctx.fillStyle = typeof c === "string" ? c : css(c); ctx.fillRect(cx + x * sc, footY + y * sc, w * sc, h * sc); };
  const parts = [
    // shoes, legs, hips
    [-16, -7, 14, 7, look.shoes], [2, -7, 14, 7, look.shoes],
    [-14, -76, 12, 70, look.pants], [2, -76, 12, 70, look.pants],
    [-15, -94 + bob, 30, 22, look.pants],
    // arms behind the torso edge
    [-26, -146 + bob - arm, 11, 26, look.shirt], [15, -146 + bob, 11, 26, look.shirt],
    [-25, -121 + bob - arm, 9, 34, look.skin], [16, -121 + bob, 9, 34, look.skin],
    [-25.5, -88 + bob - arm, 10, 9, darken(look.skin, 0.08)], [15.5, -88 + bob, 10, 9, darken(look.skin, 0.08)],
    // torso, neck, head
    [-16, -148 + bob, 32, 58, look.shirt],
    [-5, -157 + bob, 10, 10, darken(look.skin, 0.12)],
    [-14, -187 + bob, 28, 32, look.skin],
    [-15, -190 + bob, 30, 9, look.hair], [-15, -184 + bob, 5, 12, look.hair], [10, -184 + bob, 5, 12, look.hair],
  ];
  if (outline) {
    const o = Math.max(1, 1.6 / sc);
    for (const [x, y, w, h] of parts) R(x - o, y - o, w + o * 2, h + o * 2, "#0b0b0e");
  }
  for (const [x, y, w, h, c] of parts) {
    R(x, y, w, h, c);
    if (sc > 0.4) { R(x, y, w, Math.min(2.5, h * 0.2), lighten(c, 0.16)); R(x + w - Math.min(3, w * 0.25), y, Math.min(3, w * 0.25), h, darken(c, 0.14)); }
  }
  if (sc > 0.3) {
    // eyes and mouth
    R(-8, -172 + bob, 4, 4, "#16161a"); R(4, -172 + bob, 4, 4, "#16161a");
    R(-4, -162 + bob, 8, 2, darken(look.skin, 0.35));
    // belt
    R(-15, -94 + bob, 30, 3, darken(look.pants, 0.35));
  }
}

      ctx.fillRect(-5, -9, 10, 18);
      ctx.fillStyle = "rgba(10,10,13,0.9)";
      for (let r = 0; r < 4; r++) for (let c = 0; c < 2; c++) ctx.fillRect(-3 + c * 4, -7 + r * 4, 2, 2);
      break;
    case 6: // arch bridge
      ctx.moveTo(-9, -1); ctx.lineTo(9, -1); ctx.moveTo(-6, -1); ctx.lineTo(-6, 7); ctx.moveTo(6, -1); ctx.lineTo(6, 7);
      ctx.moveTo(-6, 7); ctx.quadraticCurveTo(0, -1, 6, 7); ctx.stroke();
      break;
    case 7: // pit
      ctx.moveTo(-9, -3); ctx.lineTo(-4, -3); ctx.lineTo(-4, 6); ctx.lineTo(4, 6); ctx.lineTo(4, -3); ctx.lineTo(9, -3); ctx.stroke();
      ctx.beginPath(); ctx.arc(0, 2, 1.8, 0, Math.PI * 2); ctx.fill();
      break;
    case 8: // crate
      ctx.strokeRect(-7, -7, 14, 14); ctx.moveTo(-7, -7); ctx.lineTo(7, 7); ctx.moveTo(7, -7); ctx.lineTo(-7, 7); ctx.stroke();
      break;
    case 9: // bars
      ctx.strokeRect(-8, -8, 16, 16); for (const x of [-4, 0, 4]) { ctx.moveTo(x, -8); ctx.lineTo(x, 8); } ctx.stroke();
      break;
    case 10: // fish
      ctx.moveTo(-8, 0); ctx.quadraticCurveTo(-1, -7, 5, 0); ctx.quadraticCurveTo(-1, 7, -8, 0); ctx.moveTo(5, 0); ctx.lineTo(9, -4); ctx.lineTo(9, 4); ctx.closePath(); ctx.stroke();
      ctx.beginPath(); ctx.arc(-3, -1, 1, 0, Math.PI * 2); ctx.fill();
      break;
    case 11: // zigzag jump
      ctx.moveTo(-9, 7); ctx.lineTo(-3, 1); ctx.lineTo(0, 4); ctx.lineTo(7, -4); ctx.moveTo(3, -4); ctx.lineTo(7, -4); ctx.lineTo(7, 0); ctx.stroke();
      break;
    case 12: // slope
      ctx.moveTo(-9, -6); ctx.lineTo(9, 7); ctx.lineTo(-9, 7); ctx.closePath(); ctx.fill();
      break;
    case 13: // well shaft with water
      ctx.moveTo(-9, -6); ctx.lineTo(-4, -6); ctx.lineTo(-4, 8); ctx.moveTo(4, 8); ctx.lineTo(4, -6); ctx.lineTo(9, -6); ctx.stroke();
      ctx.beginPath(); ctx.fillRect(-3, 3, 6, 4);
      break;
    case 14: // bunker dome with a door
      ctx.moveTo(-9, 7); ctx.lineTo(-9, 1); ctx.quadraticCurveTo(0, -11, 9, 1); ctx.lineTo(9, 7); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "rgba(10,10,13,0.9)"; ctx.fillRect(-2.5, 1, 5, 6);
      break;
  }
  ctx.restore();
}

// A small painted picture of a map: room, lamp light, blocks, water, ice and people.
// Map pictures are painted once per size into a bitmap and reused.
const mapPreviewCache = new Map();
function drawMapPreview(i, x, y, w, h) {
  const key = i + ":" + Math.round(w) + ":" + Math.round(h) + ":" + K;
  let c = mapPreviewCache.get(key);
  if (!c) {
    c = document.createElement("canvas"); c.width = Math.ceil(w * K); c.height = Math.ceil(h * K);
    const real = ctx; ctx = c.getContext("2d");
    try { ctx.setTransform(K, 0, 0, K, 0, 0); paintMapPreview(i, 0, 0, w, h); } finally { ctx = real; }
    mapPreviewCache.set(key, c);
  }
  ctx.drawImage(c, x, y, w, h);
  drawMapBadge(i, x + w - 15, y + 15, 11);
}
function paintMapPreview(i, x, y, w, h) {
  const m = MAPS[i], t = m.theme, sx = w / WW, sy = h / WH, b = m.build();
  ctx.save();
  rr(x, y, w, h, 8); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + FLOOR_Y * sy);
  g.addColorStop(0, t.wall[0]); g.addColorStop(1, t.wall[1]);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, FLOOR_Y * sy);
  // wall panels and the ceiling strip
  ctx.fillStyle = t.line;
  for (let px1 = 0; px1 < WW; px1 += 96) ctx.fillRect(x + px1 * sx, y, 1, FLOOR_Y * sy);
  ctx.fillRect(x, y + (OFFY + 150) * sy, w, 1.6);
  ctx.fillStyle = "#0e0e11"; ctx.fillRect(x, y, w, 16 * sy);
  // lamps and their cones of light
  for (const lw of LAMPS) {
    const lx = x + lw * sx, ly = y + LAMP_Y * sy;
    const cone = ctx.createLinearGradient(0, ly, 0, y + FLOOR_Y * sy);
    cone.addColorStop(0, "rgba(255,240,204,0.32)"); cone.addColorStop(1, "rgba(255,240,204,0.04)");
    ctx.fillStyle = cone;
    ctx.beginPath(); ctx.moveTo(lx - 3, ly); ctx.lineTo(lx + 3, ly); ctx.lineTo(lx + 150 * sx, y + FLOOR_Y * sy); ctx.lineTo(lx - 150 * sx, y + FLOOR_Y * sy); ctx.closePath(); ctx.fill();
    ctx.fillStyle = "#3a3a42"; ctx.fillRect(lx - 0.4, y, 0.8, ly - y - 2);
    ctx.fillStyle = "#d8d8d0"; ctx.fillRect(lx - 3, ly - 2.5, 6, 2.5);
    ctx.fillStyle = "#fff6d8"; ctx.beginPath(); ctx.arc(lx, ly + 1, 1.3, 0, Math.PI * 2); ctx.fill();
  }
  // floor
  const fl = ctx.createLinearGradient(0, y + FLOOR_Y * sy, 0, y + h);
  fl.addColorStop(0, t.floor[0]); fl.addColorStop(1, t.floor[1]);
  ctx.fillStyle = fl; ctx.fillRect(x, y + FLOOR_Y * sy, w, h - FLOOR_Y * sy);
  ctx.fillStyle = t.edge; ctx.fillRect(x, y + FLOOR_Y * sy, w, 1.2);
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  for (let px1 = 0; px1 < WW; px1 += 48) ctx.fillRect(x + px1 * sx, y + FLOOR_Y * sy, 0.8, h);
  // concrete blocks
  for (const r of b.walls) {
    const [r0, r1, r2, r3] = mapRect(r), rx = x + r0 * sx, ry = y + r1 * sy, rw = r2 * sx, rh = r3 * sy;
    ctx.fillStyle = "#4c4c56"; ctx.fillRect(rx, ry, rw, rh);
    ctx.fillStyle = "#8a8a94"; ctx.fillRect(rx, ry, rw, 1.2);
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(rx, ry + rh - 1, rw, 1);
  }
  // water with a bright surface line
  for (const r of b.water) {
    const [r0, r1, r2, r3] = mapRect(r), rx = x + r0 * sx, ry = y + r1 * sy, rw = r2 * sx, rh = r3 * sy;
    const wg = ctx.createLinearGradient(0, ry, 0, ry + rh);
    wg.addColorStop(0, "rgba(70,140,230,0.9)"); wg.addColorStop(1, "rgba(30,70,170,0.95)");
    ctx.fillStyle = wg; ctx.fillRect(rx, ry, rw, rh);
    ctx.fillStyle = "#b4dcff"; ctx.fillRect(rx, ry, rw, 1);
  }
  // ice with a white top and a shine
  for (const r of b.ice) {
    const [r0, r1, r2, r3] = mapRect(r), rx = x + r0 * sx, ry = y + r1 * sy, rw = r2 * sx, rh = r3 * sy;
    ctx.fillStyle = "#a6d6f6"; ctx.fillRect(rx, ry, rw, rh);
    ctx.fillStyle = "#f0fbff"; ctx.fillRect(rx, ry, rw, Math.min(1.2, rh));
    if (rh > 6) { ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.fillRect(rx + rw * 0.2, ry + 2, Math.max(1, rw * 0.12), rh - 4); }
  }
  // people standing where the map puts them
  b.dolls.forEach((e, n) => {
    const [dx, sy0] = mapDollSpot(e);
    let gy = BASE_FLOOR;
    for (const r of b.walls.concat(b.ice, b.water)) if (dx >= r[0] && dx <= r[0] + r[2] && r[1] < gy && r[1] > sy0) gy = r[1];
    ctx.save(); ctx.translate(x, y);
    drawBlockPerson((dx + OFFX) * sx, (gy + OFFY) * sy, Math.min(sx, sy) * 1.3, MENU_LOOKS[(n + i) % MENU_LOOKS.length]);
    ctx.restore();
  });
  // soft vignette
  const v = ctx.createRadialGradient(x + w / 2, y + h / 2, h * 0.3, x + w / 2, y + h / 2, w * 0.7);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = v; ctx.fillRect(x, y, w, h);
  ctx.restore();
}

const titleFx = { drops: [], dust: [], t: 0, dark: 0, fadeIn: 0 };
for (let n = 0; n < 26; n++) titleFx.dust.push({ x: rf(-60, 60), y: rf(60, 360), v: rf(3, 9), p: rf(0, 6.28) });

function titleButtons() {
  const x = 56, w = 250, h = 42, gap = 10, y0 = 196, items = [];
  if (state.inGame) items.push({ id: "resume", text: "WEITERSPIELEN", primary: true });
  items.push({ id: "maps", text: state.inGame ? "MAP WÄHLEN" : "SPIELEN", primary: !state.inGame });

function drawTitle(dt) {
  const f = titleFx;
  f.t += dt;
  const px1 = Math.max(W * 0.66, 420), floor = 372;
  playShotStep(dt, px1, floor);
  titleShotStep(dt, px1, floor);
  f.fadeIn = Math.max(0, f.fadeIn - dt);
  // After the shot the room slowly turns dark red, and back once it is over.
  f.dark = moveToward(f.dark, titleShot && titleShot.bled ? 1 : 0, dt * (titleShot ? 0.7 : 1.2));
  const dk = easeOut(f.dark);
  screenBackground("#121216", "#121216");
  // The room fades in slowly behind the menu.
  ctx.save();
  ctx.globalAlpha = easeOut(state.screenT / 0.6);
  const shk = titleShot ? titleShot.shake * 7 : 0;
  if (shk > 0.05 && settings.shake) ctx.translate(rf(-shk, shk), rf(-shk, shk));
  // Room on the right: wall panels, floor and a lamp over a waiting person
  ctx.fillStyle = css(mixc(hex("#16161b"), hex("#1c0f12"), dk)); ctx.fillRect(W * 0.42, 0, W, floor);
  ctx.fillStyle = "#0c0c0f";
  for (let x = W * 0.42; x < W; x += 96) ctx.fillRect(x, 0, 1.5, floor);
  ctx.fillRect(W * 0.42, 150, W, 1.5);
  const fl = ctx.createLinearGradient(0, floor, 0, H);
  fl.addColorStop(0, "#5a5a62"); fl.addColorStop(1, "#2a2a30");
  ctx.fillStyle = fl; ctx.fillRect(W * 0.42, floor, W, H - floor);
  ctx.fillStyle = "#8a8a92"; ctx.fillRect(W * 0.42, floor, W, 1.5);
  drawTitleProps(px1, floor, dk, f.t, dt);
  // fade the room into the menu side
  const fade = ctx.createLinearGradient(W * 0.42, 0, W * 0.62, 0);
  fade.addColorStop(0, "#121216"); fade.addColorStop(1, "rgba(18,18,22,0)");
  ctx.fillStyle = fade; ctx.fillRect(W * 0.42 - 1, 0, W * 0.2 + 2, H);
  // flickering lamp
  const flick = Math.sin(f.t * (23 + dk * 9)) > 0.96 - dk * 0.08 ? 0.4 : 1;
  const lc = mixc([255, 240, 204], [255, 64, 52], dk);
  const cone = ctx.createLinearGradient(0, 40, 0, floor);
  cone.addColorStop(0, css(lc, 0.3 * flick)); cone.addColorStop(1, css(lc, 0.06 * flick));
  ctx.fillStyle = cone;
  ctx.beginPath(); ctx.moveTo(px1 - 10, 40); ctx.lineTo(px1 + 10, 40); ctx.lineTo(px1 + 140, floor); ctx.lineTo(px1 - 140, floor); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#0a0a0c"; ctx.fillRect(px1 - 1, 0, 2, 30);
  ctx.fillStyle = "#cfcfc8"; ctx.beginPath(); ctx.moveTo(px1 - 16, 40); ctx.lineTo(px1 - 7, 30); ctx.lineTo(px1 + 7, 30); ctx.lineTo(px1 + 16, 40); ctx.closePath(); ctx.fill();
  ctx.fillStyle = css(mixc([255, 246, 216], [255, 90, 70], dk), flick); ctx.beginPath(); ctx.arc(px1, 41, 3, 0, Math.PI * 2); ctx.fill();
  // Moths circling the lamp
  for (let n = 0; n < 3; n++) {
    const a = f.t * (2.2 + n * 0.7) + n * 2.1, r = 10 + n * 6 + Math.sin(f.t * 3 + n) * 3;
    ctx.fillStyle = css(mixc([230, 220, 190], [255, 120, 100], dk), 0.75);
    ctx.fillRect(px1 + Math.cos(a) * r * 1.6 - 1, 44 + Math.sin(a) * r * 0.7 - 1, 2, Math.sin(f.t * 30 + n) > 0 ? 2 : 1);
  }
  // dust in the light
  for (const d of f.dust) {
    d.y -= d.v * dt; if (d.y < 50) d.y = 360;
    const dx = d.x * (d.y - 40) / 330 + Math.sin(f.t * 0.7 + d.p) * 4;
    ctx.fillStyle = css(mixc([255, 240, 210], [255, 90, 60], dk), 0.25 + 0.2 * Math.sin(f.t + d.p));
    ctx.fillRect(px1 + dx, d.y, 1.2, 1.2);
  }
  // blood pool and the person
  ctx.fillStyle = "rgba(110,8,18,0.85)";
  ctx.beginPath(); ctx.ellipse(px1 + 30, floor + 2, 46, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.35)";
  ctx.beginPath(); ctx.ellipse(px1, floor + 1, 34, 3, 0, 0, Math.PI * 2); ctx.fill();
  drawTitleShotBack(px1, floor);
  drawTitleDoll(px1, floor, f.t);
  drawTitleShotFront(px1, floor);
  ctx.restore();
  // A red shadow of the vignette closes in once it is dark.
  if (dk > 0.01) {
    const v = ctx.createRadialGradient(W * 0.62, H * 0.5, H * 0.3, W * 0.62, H * 0.5, W * 0.75);
    v.addColorStop(0, "rgba(90,0,8,0)"); v.addColorStop(1, `rgba(90,0,8,${0.32 * dk})`);
    ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);

  // The shot knocks a red ghost of the title sideways for a moment.

  if (glitch > 0) label("RAGPIT", 52 + 5 * glitch + rf(-1, 1), 104 + rf(-1, 1), 68, css([220, 20, 36], 0.7 * glitch));
  withAppear(appear(0, 0.4), () => label("RAGPIT", 52, 104, 68, css(mixc([236, 236, 228], [246, 214, 208], dk))), 14);
  const line = easeOut((state.screenT - 0.15) / 0.45);
  ctx.fillStyle = "#8e0f1c"; ctx.fillRect(56, 132, 300 * line, 4);
  if (line >= 1 && Math.random() < dt * 2.2) f.drops.push({ x: rf(60, 350), y: 136, v: 0, len: 0, age: 0 });
  for (const d of f.drops) {
    d.age += dt;

  }
  f.drops = f.drops.filter((d) => d.y < H);
  for (const d of f.drops) {

    if (d.age < 0.6) { ctx.fillRect(d.x - 1, 134, 2, d.len); ctx.beginPath(); ctx.arc(d.x, 134 + d.len, 2.2, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.beginPath(); ctx.ellipse(d.x, d.y, 1.8, 3, 0, 0, Math.PI * 2); ctx.fill(); }
  }
  withAppear(appear(2), () => label("PIXEL RAGDOLL SANDBOX", 56, 158, 12, "#7a7a84"));
  titleButtons().forEach((b, n) => withAppear(appear(3 + n), () => {
    if (playShot && b.id === "maps") { menuButton(b, "", b.primary, 0); drawSplitLabel(b, b.text); }
    else menuButton(b, b.text, b.primary, pressAmt(b.id, b));
  }));
  withAppear(appear(8), () => label("v2 · " + MAPS.length + " MAPS · " + TOOL_NAMES.length + " WERKZEUGE", 56, H - 16, 9, "#4c4c56"), 0);
  // A tip that changes every few seconds, under the buttons
  const btns = titleButtons(), last = btns[btns.length - 1], ty = last.y + last.h + 22;
  if (ty < H - 34) withAppear(appear(9), () => {
    const n = Math.floor(f.t / 5) % TITLE_TIPS.length, ph = (f.t % 5) / 5, a = Math.min(1, ph * 6, (1 - ph) * 6);
    ctx.save(); ctx.globalAlpha *= a;
    ctx.fillStyle = "#8e0f1c"; ctx.fillRect(56, ty - 6, 3, 12);
    label(TITLE_TIPS[n], 66, ty, fitFont(TITLE_TIPS[n], 300, 9, 400), "#8a8590", "left", 400);
    ctx.restore();
  });
  drawPlayBullet();
  drawTitleShotOverlay();
  if (playShot && playShot.fade > 0) { ctx.fillStyle = `rgba(0,0,0,${Math.min(1, playShot.fade / 0.4)})`; ctx.fillRect(0, 0, W, H); }
}

// The room behind the person: a pipe that drips, an exit sign, a camera

  ctx.fillStyle = "rgba(60,70,90,0.55)"; ctx.beginPath(); ctx.ellipse(dripX, floor + 2, 14, 2.5, 0, 0, Math.PI * 2); ctx.fill();

// The person on the title screen is a real game doll, drawn with the same
// pixel renderer, posed by hand and a little larger than in the game.
let titleDoll = null;
const TD_X = 240, TD_Y = 300, TD_SCALE = 1.35;
function drawTitleDoll(cx, floor, t, scale = TD_SCALE) {
  if (!titleDoll) {
    titleDoll = new Doll(TD_X, TD_Y, 0);
    titleDoll.look = { skin: hex("#e8c09a"), shirt: hex("#3c7a74"), pants: hex("#38425a"), shoes: hex("#2a2420"), hair: hex("#4a3020") };
    titleDoll.addWound(TORSO, 0.42, 0.5, 2.2, false, "shot");
    titleDoll.addWound(UARM_R, 0.55, 0.4, 1.2, false, "cut", { ang: 1.3, len: 1.6 });
    // Blood has already run down from both wounds.
    for (const w of titleDoll.wounds) w.drip = 5;
    titleDoll.stain[TORSO] = 0.25; titleDoll.stain[UARM_R] = 0.2;
  }
  const d = titleDoll, sh = titleShot;
  if (sh) titleFallPose(sh); else titleStandPose(t);
  // The person faces the menu, so a shot from that side tips them over to the right.
  for (let i = 0; i < d.x.length; i++) d.x[i] = 2 * TD_X - d.x[i];
  d.facing = -1;
  ppx.fill(0);
  // The title always shows the side view, the fall is drawn for it.
  const front = settings.front;
  settings.front = false;
  try { rasterDoll(d); } finally { settings.front = front; }
  pixCtx.putImageData(pixImg, 0, 0);
  // The next game frame clears and uploads the whole layer again.
  pxLast = [0, 0, DW - 1, DH - 1];
  // The doll is DS times larger than the old title person, so the cut-out
  // grows with it and the picture is drawn smaller again.
  const L = 75 * DS, R = 225 * DS, T = 222 * DS, B = 14 * DS, z = scale / DS;
  const sx = (TD_X - L) / PIX, sy = (TD_Y - T) / PIX, sw = (L + R) / PIX, shh = (T + B) / PIX;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pixCan, sx, sy, sw, shh, cx - L * z, floor - T * z, (L + R) * z, (T + B) * z);
  ctx.imageSmoothingEnabled = true;
}
// Title doll point (after the mirror) in screen units.
const titleScreenPt = (cx, floor, i) => [cx + (titleDoll.x[i] - TD_X) * TD_SCALE / DS, floor + (titleDoll.y[i] - TD_Y) * TD_SCALE / DS];

// Rest pose with breathing in the chest and a slow sway of head and arms,
// the right hand pressed on the old bullet wound. Facing right, before the mirror.
function titleStandPose(t) {
  const d = titleDoll, breathe = Math.sin(t * 2.2) * 1.4, sway = Math.sin(t * 0.9) * 1.5;
  for (let i = 0; i < POSE.length; i++) {
    let x = TD_X + POSE[i][0], y = TD_Y + POSE[i][1];
    if (i <= P_WAIST || (i >= P_ELBOW_L && i <= P_HAND_R)) y += breathe * (i === P_WAIST ? 0.4 : 1);
    if (i === P_HEAD) x += sway * 0.8;
    if (i === P_HAND_L || i === P_HAND_R) x += sway * 0.5;
    d.x[i] = x; d.y[i] = y;
  }
  d.x[P_ELBOW_R] = TD_X + 20 * DS; d.y[P_ELBOW_R] = TD_Y - 117 * DS + breathe;
  d.x[P_HAND_R] = TD_X - 1 * DS; d.y[P_HAND_R] = TD_Y - 125 * DS + breathe;
}

// ----------------------------------------------------------------- title shot
// SPIELEN fires a shot into the person on the title from the menu side: a
// short freeze, bullet time, blood out of the back, then the body tips over
// backward and lands hard. Room and music turn dark.
const TS_SEGS = [[P_HIP, P_WAIST], [P_WAIST, P_NECK], [P_NECK, P_HEAD], [P_NECK, P_ELBOW_L], [P_ELBOW_L, P_HAND_L],
  [P_NECK, P_ELBOW_R], [P_ELBOW_R, P_HAND_R], [P_HIP, P_KNEE_L], [P_KNEE_L, P_ANKLE_L], [P_ANKLE_L, P_TOE_L],
  [P_HIP, P_KNEE_R], [P_KNEE_R, P_ANKLE_R], [P_ANKLE_R, P_TOE_R]];
// Key poses as segment angles: 0 points straight down, plus leans forward.
// Hit: the chest jerks back, the hand flies off the wound. Fall: arms and
// head lag behind, the knees give. Down: arms flung over the head.
const PI_ = Math.PI;
const TS_KEYS = [
  [0.1, [PI_, PI_ + 0.28, PI_ - 0.4, 0.5, 0.9, 1.0, 1.6, -0.27, -0.06, 1.29, 0.27, 0.06, 1.29]],
  [0.5, [PI_, PI_ - 0.15, PI_ - 0.55, 1.5, 2.0, 1.7, 2.3, 0.2, -0.25, 1.35, 0.4, -0.3, 1.3]],
  [0.85, [PI_, PI_ - 0.05, PI_ - 0.2, 2.5, 2.9, 1.2, 1.4, 0.1, -0.1, 1.3, 0.38, -0.28, 1.2]],
  [1.35, [PI_, PI_, PI_ + 0.06, PI_ - 0.08, PI_ + 0.12, 0.3, 0.05, 0.02, -0.02, 1.2, 0.42, -0.36, 1.0]],
];
const TS_LAND = 0.85;
let titleShot = null;
const wrapAng = (a) => a - Math.round(a / (2 * Math.PI)) * 2 * Math.PI;
const smooth01 = (u) => { u = clamp(u, 0, 1); return u * u * (3 - 2 * u); };

function titleShoot(cx, floor, quiet = false) {
  titleStandPose(titleFx.t);
  const d = titleDoll;
  const a0 = [], len = [];
  for (const [a, b] of TS_SEGS) {
    const dx = d.x[b] - d.x[a], dy = d.y[b] - d.y[a];
    a0.push(Math.atan2(dx, dy)); len.push(Math.hypot(dx, dy));
  }
  titleShot = { real: 0, t: 0, a0, len, bled: false, landed: false, parts: [], stains: [], splats: [], pool: 0, shake: 0.6, quiet };
  if (!quiet) titleShotSound(); else titleImpactSound();
  shotRing();
  music.duck = 1;
}

function titleFallPose(s) {
  const d = titleDoll, t = s.t;
  // Angles between the key poses
  let prevT = 0, prev = s.a0, ang = s.a0;
  for (const [kt, ka] of TS_KEYS) {
    if (t < kt) { const u = smooth01((t - prevT) / (kt - prevT)); ang = prev.map((v, i) => v + wrapAng(ka[i] - v) * u); break; }
    prevT = kt; prev = ka; ang = ka;
  }
  // Chain the body together from the hip, then stand it on its feet.
  const px = new Array(14).fill(0), py = new Array(14).fill(0);
  TS_SEGS.forEach(([a, b], n) => { px[b] = px[a] + Math.sin(ang[n]) * s.len[n]; py[b] = py[a] + Math.cos(ang[n]) * s.len[n]; });
  const oy = -8 * DS - Math.max(py[P_ANKLE_L], py[P_ANKLE_R]), ox = -(px[P_ANKLE_L] + px[P_ANKLE_R]) / 2;
  // The whole body tips back around the heels, falling faster and faster,
  // bounces once on the floor and lies still.
  let rot;
  if (t < 0.1) rot = 0.1 * t / 0.1;
  else if (t < TS_LAND) { const u = (t - 0.1) / (TS_LAND - 0.1); rot = 0.1 + (Math.PI / 2 - 0.1) * u * u; }
  else { const b = (t - TS_LAND) / 0.3; rot = Math.PI / 2 - (b < 1 ? 0.09 * Math.sin(b * Math.PI) : 0); }
  // The bullet shoves the chest back, then the feet slide out forward.
  const slide = (-6 * Math.min(1, t / 0.1) + 58 * smooth01((t - 0.15) / 0.75)) * DS;
  const c = Math.cos(rot), sn = Math.sin(rot), lift = 12 * DS * sn;
  for (let i = 0; i < 14; i++) {
    const lx = px[i] + ox + 4 * DS, ly = py[i] + oy;
    d.x[i] = TD_X - 4 * DS + slide + lx * c + ly * sn;
    d.y[i] = TD_Y - lx * sn + ly * c - lift;
  }
}

// Advances the shot in real time with a freeze and bullet time at the start.
function titleShotStep(dt, cx, floor) {
  const s = titleShot;
  if (!s) return;
  const d = titleDoll;
  s.real += dt;
  const speed = s.real < 0.07 ? 0 : s.real < 0.45 ? 0.22 : s.real < 0.8 ? lerp(0.22, 1, (s.real - 0.45) / 0.35) : 1;
  const sdt = dt * speed;
  s.t += sdt;
  s.shake = Math.max(0, s.shake - dt * 2.2);
  if (!s.bled && s.real >= 0.07) {
    // The bullet goes through: a new hole in the chest, blood out of the back.
    s.bled = true;
    d.addWound(TORSO, 0.3, 0.6, 2.2, false, "shot");
    s.wound = d.wounds[d.wounds.length - 1]; s.wound.bleed = 0.8;
    d.stain[TORSO] = 0.45;
    const [nx, ny] = titleScreenPt(cx, floor, P_NECK), [wx, wy] = titleScreenPt(cx, floor, P_WAIST);
    const hx = lerp(nx, wx, 0.3) + 10, hy = lerp(ny, wy, 0.3);
    s.hit = [hx - 20, hy];
    for (let n = 0; n < 46; n++) s.parts.push({ x: hx, y: hy + rf(-4, 4), vx: rf(140, 560), vy: rf(-240, 60), r: rf(1, 2.6), age: 0, stick: Math.random() < 0.35 ? rf(0.08, 0.3) : 9, mist: false });
    for (let n = 0; n < 7; n++) s.parts.push({ x: hx, y: hy, vx: rf(60, 220), vy: rf(-80, 20), r: rf(4, 8), age: 0, stick: 9, mist: true });
  }
  if (!s.landed && s.t >= TS_LAND) {
    s.landed = true; s.shake = Math.max(s.shake, 0.45);
    d.dead = true;
    thudSound();
    const [hx] = titleScreenPt(cx, floor, P_NECK);
    for (let n = 0; n < 14; n++) s.parts.push({ x: rf(cx, hx + 20), y: floor - 2, vx: rf(-60, 60), vy: rf(-70, -20), r: rf(3, 6), age: 0, stick: 9, dust: true });
  }
  for (const p of s.parts) {
    p.age += sdt;
    if (p.dust) { p.x += p.vx * sdt; p.y += p.vy * sdt; p.vy += 40 * sdt; continue; }
    if (p.mist) { p.x += p.vx * sdt; p.y += p.vy * sdt; p.vx *= 1 - 2 * sdt; p.r += 14 * sdt; continue; }
    p.vy += 900 * sdt; p.x += p.vx * sdt; p.y += p.vy * sdt;
    if (p.y >= floor) { s.stains.push([p.x, floor + rf(0, 3), p.r * 1.6]); p.dead = true; }
    else if (p.age > p.stick) { s.splats.push([p.x, p.y, p.r, rf(0.7, 1)]); p.dead = true; }
  }
  s.parts = s.parts.filter((p) => !p.dead && p.age < (p.mist || p.dust ? 0.9 : 3));
  if (s.landed) {
    s.pool = Math.min(1, s.pool + dt / 9);
    if (s.wound) s.wound.drip = Math.min(7, s.wound.drip + dt * 1.5);
  }
}

// Blood on wall and floor, the pool under the chest and the dust of the fall.
function drawTitleShotBack(cx, floor) {
  const s = titleShot;
  if (!s) return;
  if (s.pool > 0) {
    const [nx] = titleScreenPt(cx, floor, P_NECK), [wx] = titleScreenPt(cx, floor, P_WAIST);
    const r = 70 * easeOut(s.pool);
    ctx.fillStyle = "rgba(96,6,14,0.9)";
    ctx.beginPath(); ctx.ellipse((nx + wx) / 2, floor + 2, r, 3 + r * 0.06, 0, 0, Math.PI * 2); ctx.fill();
  }
  ctx.fillStyle = "rgba(120,8,18,0.88)";
  for (const [x, y, r] of s.stains) { ctx.beginPath(); ctx.ellipse(x, y, r, r * 0.35, 0, 0, Math.PI * 2); ctx.fill(); }
  for (const [x, y, r, a] of s.splats) { ctx.fillStyle = `rgba(110,6,16,${a})`; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill(); }
}
function drawTitleShotFront(cx, floor) {
  const s = titleShot;
  if (!s) return;
  for (const p of s.parts) {
    if (p.dust) { ctx.fillStyle = `rgba(150,150,156,${0.35 * (1 - p.age / 0.9)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r + p.age * 10, 0, Math.PI * 2); ctx.fill(); }
    else if (p.mist) { ctx.fillStyle = `rgba(150,10,22,${0.3 * (1 - p.age / 0.9)})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
    else { ctx.fillStyle = "#a40f1e"; ctx.fillRect(p.x - p.r / 2, p.y - p.r / 2, p.r, p.r); }
  }
  // Tracer from the menu side and the flash of the shot
  if (s.hit && s.real < 0.2 && !s.quiet) {
    const a = 1 - s.real / 0.2;
    ctx.strokeStyle = `rgba(255,236,170,${a})`; ctx.lineWidth = 2.4; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(W * 0.42, s.hit[1] - 4); ctx.lineTo(s.hit[0], s.hit[1]); ctx.stroke();
  }
}
function drawTitleShotOverlay() {
  const s = titleShot;
  const fade = titleFx.fadeIn || 0;
  if (fade > 0) { ctx.fillStyle = `rgba(0,0,0,${fade / 0.45})`; ctx.fillRect(0, 0, W, H); }
  if (!s) return;
  if (s.real < 0.16) { ctx.fillStyle = `rgba(255,250,235,${0.4 * (1 - s.real / 0.16)})`; ctx.fillRect(0, 0, W, H); }
  // Film bars slide in for the shot and leave again.
  const bars = Math.min(easeOut(s.real / 0.25), 1 - easeOut((s.real - 2.6) / 0.5)) * 22;
  if (bars > 0.3) { ctx.fillStyle = "#000"; ctx.fillRect(0, 0, W, bars); ctx.fillRect(0, H - bars, W, bars); }
}

// ----------------------------------------------------------------- play shot
// SPIELEN fires a shot from the left edge. In bullet time the bullet cuts
// the word through the middle, the two halves spring apart with sparks, and
// the bullet flies on into the chest of the person. Once the body lies on
// the floor the screen goes black and the map choice opens.
let playShot = null;
function titleResetShot() {
  const old = titleShot;
  titleShot = null;
  if (old && titleDoll) {
    titleDoll.wounds = titleDoll.wounds.filter((w) => w !== old.wound);
    titleDoll.dead = false; titleDoll.stain[TORSO] = 0.25;
  }
}
function startPlayShot(b) {
  titleResetShot();
  ctx.font = `700 15px ${FONT}`;
  const tw = ctx.measureText(b.text).width, tx0 = b.x + 16, tx1 = b.x + 20 + tw;
  playShot = { t: 0, b, tx0, tx1, tcx: (tx0 + tx1) / 2, ty: b.y + b.h / 2 + 1, x0: -20, v1: 380, v2: 2600, aim: null, hit: false, after: 0, fade: 0, sparks: [], strip: -1 };
  titleShotSound();
  // The whiz lasts as long as the bullet takes through the word.
  bulletWhizSound(0.9);
  music.duck = 1;
}
const PS_STRIP = 5;
// Where the bullet is at time t: slow through the word, fast after it.
function playX(p, t) {
  const split = p.tx1 + 12, t1 = (split - p.x0) / p.v1;
  return t < t1 ? p.x0 + p.v1 * t : split + p.v2 * (t - t1);
}
const playY = (p, x) => p.ty + (x - p.tcx) * p.slope;
const playPass = (p, x) => (x - p.x0) / p.v1;
function playShotStep(dt, cx, floor) {
  const p = playShot;
  if (!p) return;
  if (!p.aim && titleDoll) {
    // Aim at the chest, the same spot the title shot hits.
    const [nx, ny] = titleScreenPt(cx, floor, P_NECK), [wx, wy] = titleScreenPt(cx, floor, P_WAIST);
    p.aim = [lerp(nx, wx, 0.3) - 10, lerp(ny, wy, 0.3)];
    p.slope = (p.aim[1] - p.ty) / (p.aim[0] - p.tcx);
    const l = Math.hypot(1, p.slope); p.dir = [1 / l, p.slope / l]; p.nrm = [p.slope / l, -1 / l];
  }
  if (!p.aim) return;
  p.t += dt;
  if (!p.hit) {
    const x = playX(p, p.t);
    // Sparks fly where the bullet cuts through the letters.
    const strip = Math.floor((Math.min(x, p.tx1) - p.tx0) / PS_STRIP);
    for (let k = p.strip + 1; k <= strip && x > p.tx0; k++) {
      const sx = p.tx0 + (k + 0.5) * PS_STRIP, sy = playY(p, sx);
      for (let n = 0; n < 3; n++) p.sparks.push({ x: sx, y: sy, vx: rf(80, 260), vy: rf(-160, 120), age: 0 });
    }
    if (p.strip < 0 && strip >= 0 && x > p.tx0) textSliceSound();
    p.strip = Math.max(p.strip, strip);
    if (x >= p.aim[0]) { p.hit = true; titleShoot(cx, floor, true); }
  } else {
    p.after += dt;
    if (p.after > 2.3) p.fade += dt;
    if (p.fade > 0.4) {
      playShot = null;
      titleResetShot(); titleFx.dark = 0;
      setScreen("maps");
      return;
    }
  }
  for (const sp of p.sparks) { sp.age += dt; sp.vy += 600 * dt; sp.x += sp.vx * dt; sp.y += sp.vy * dt; }
  p.sparks = p.sparks.filter((sp) => sp.age < 0.45);
}
// The word on the play button, cut along the bullet line. Every thin strip
// behind the bullet splits into an upper and a lower half that drift apart.
function drawSplitLabel(b, text) {
  const p = playShot, x = b.x + 18, y = b.y + b.h / 2 + 1, col = "#fff4ec";
  if (!p.aim) { label(text, x, y, 15, col); return; }
  const bx = p.hit ? Infinity : playX(p, p.t);
  // Once the halves fly, drawPlayBullet draws them above everything.
  if (playFlyAge(p) >= 0) return;
  for (let sx = p.tx0; sx < p.tx1; sx += PS_STRIP) {
    const mid = sx + PS_STRIP / 2, ly = playY(p, mid);
    if (mid > bx) {
      ctx.save(); ctx.beginPath(); ctx.rect(sx, b.y, PS_STRIP, b.h); ctx.clip(); label(text, x, y, 15, col); ctx.restore();
      continue;
    }
    const age = p.t - playPass(p, mid), sep = Math.min(5, 3.6 * easeOut(age / 0.22) + age * 0.6);
    for (const side of [-1, 1]) {
      ctx.save();
      // The upper half lifts, the lower half drops, both pushed along a bit.
      ctx.translate(p.dir[0] * sep * 0.5 - p.nrm[0] * sep * side, p.dir[1] * sep * 0.5 - p.nrm[1] * sep * side);
      ctx.beginPath();
      if (side < 0) ctx.rect(sx, b.y - 20, PS_STRIP, ly - b.y + 20); else ctx.rect(sx, ly, PS_STRIP, b.y + b.h + 20 - ly);
      ctx.clip();
      label(text, x, y, 15, col);
      ctx.restore();
    }
    // The fresh cut glows hot for a moment.
    const glow = 1 - age / 0.5;
    if (glow > 0) { ctx.fillStyle = `rgba(255,214,140,${glow})`; ctx.fillRect(sx, ly - 0.8, PS_STRIP, 1.6); }
  }
}
// Shortly after the bullet leaves the word, the two halves break loose and
// fly off: the upper half spins up and away toward the camera, the lower
// half tumbles down. They start in slow motion, then speed up, leaving a
// faint trail.
const PS_FLY_DELAY = 0.2;
const playFlyAge = (p) => p.t - playPass(p, p.tx1) - PS_FLY_DELAY;
const playWarp = (a) => (a < 0.3 ? a * 0.25 : 0.075 + (a - 0.3) * 1.1);
const PS_PIECES = [
  { side: -1, vx: 230, vy: -430, g: 170, spin: -1.5, grow: 0.9 },
  { side: 1, vx: 150, vy: 110, g: 760, spin: 2.2, grow: 0.25 },
];
function drawPlayPieces(p) {
  const a = playFlyAge(p);
  if (a < 0) return;
  const text = p.b.text, x = p.b.x + 18, y = p.b.y + p.b.h / 2 + 1, base = 3.7;
  const l0 = p.tx0 - 4, l1 = p.tx1 + 4, y0 = playY(p, l0), y1 = playY(p, l1);
  ctx.save();
  ctx.shadowColor = "rgba(255,70,50,0.7)"; ctx.shadowBlur = 8;
  for (const pc of PS_PIECES) {
    for (let k = 3; k >= 0; k--) {
      const u = playWarp(a) - 0.04 * k;
      if (u < 0) continue;
      const fade = 1 - clamp((u - 1.1) / 0.5, 0, 1);
      if (fade <= 0) continue;
      ctx.save();
      ctx.globalAlpha *= fade * (k ? 0.22 / k : 1);
      const ox = p.dir[0] * base * 0.5 - p.nrm[0] * base * pc.side + pc.vx * u;
      const oy = p.dir[1] * base * 0.5 - p.nrm[1] * base * pc.side + pc.vy * u + pc.g * u * u;
      ctx.translate(p.tcx + ox, p.ty + oy);
      ctx.rotate(pc.spin * u);
      const z = 1 + pc.grow * u;
      ctx.scale(z, z);
      ctx.translate(-p.tcx, -p.ty);
      ctx.beginPath();
      if (pc.side < 0) { ctx.moveTo(l0, y0); ctx.lineTo(l1, y1); ctx.lineTo(l1, p.ty - 30); ctx.lineTo(l0, p.ty - 30); }
      else { ctx.moveTo(l0, y0); ctx.lineTo(l1, y1); ctx.lineTo(l1, p.ty + 30); ctx.lineTo(l0, p.ty + 30); }
      ctx.closePath(); ctx.clip();
      label(text, x, y, 15, "#fff4ec");
      // The cut edge still glows on each half.
      const hot = 1 - u / 0.4;
      if (hot > 0 && !k) {
        ctx.strokeStyle = `rgba(255,214,140,${hot})`; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(l0, y0); ctx.lineTo(l1, y1); ctx.stroke();
      }
      ctx.restore();
    }
  }
  ctx.restore();
  // A white streak flashes along the cut as the halves break loose.
  const flash = 1 - a / 0.22;
  if (flash > 0) {
    ctx.strokeStyle = `rgba(255,250,235,${flash})`; ctx.lineWidth = 2.5 * flash + 0.5; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(l0 - 20, playY(p, l0 - 20)); ctx.lineTo(l1 + 20, playY(p, l1 + 20)); ctx.stroke();
  }
}
function drawPlayBullet() {
  const p = playShot;
  if (!p || !p.aim) return;
  drawPlayPieces(p);
  for (const sp of p.sparks) { ctx.fillStyle = `rgba(255,${180 + 60 * (1 - sp.age / 0.45) | 0},90,${1 - sp.age / 0.45})`; ctx.fillRect(sp.x - 1, sp.y - 1, 2, 2); }
  // Muzzle flash at the left edge
  if (p.t < 0.09) {
    const a = 1 - p.t / 0.09, y0 = playY(p, 0);
    const g = ctx.createRadialGradient(0, y0, 0, 0, y0, 60);
    g.addColorStop(0, `rgba(255,246,210,${a})`); g.addColorStop(1, "rgba(255,180,80,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, y0, 60, 0, Math.PI * 2); ctx.fill();
  }
  if (p.hit) return;
  const x = playX(p, p.t), y = playY(p, x), fast = x > p.tx1 + 12, tl = fast ? 140 : 46;
  const g = ctx.createLinearGradient(x - p.dir[0] * tl, y - p.dir[1] * tl, x, y);
  g.addColorStop(0, "rgba(255,220,150,0)"); g.addColorStop(1, "rgba(255,236,180,0.9)");
  ctx.strokeStyle = g; ctx.lineWidth = 1.8; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x - p.dir[0] * tl, y - p.dir[1] * tl); ctx.lineTo(x, y); ctx.stroke();
  ctx.save(); ctx.translate(x, y); ctx.rotate(Math.atan2(p.dir[1], p.dir[0]));
  ctx.shadowColor = "#ffcc66"; ctx.shadowBlur = 8;
  ctx.fillStyle = "#c89a3c"; rr(-6, -1.8, 9, 3.6, 1.8); ctx.fill();
  ctx.fillStyle = "#fff4d0"; ctx.fillRect(-4, -0.8, 6, 1.4);
  ctx.restore();
}

// Settings in the look of the game: a dark room with blood on the walls,
// a title with a bleeding underline, tabs that drip and switches that fill
// with blood when they are on.
const settingsFx = { drops: [], splats: null };
function settingsSplats() {
  if (settingsFx.splats) return settingsFx.splats;
  // Fixed spatter, the same each time: a few big blots with droplets around.
  let seed = 7;
  const rnd2 = () => { seed = (seed * 16807) % 2147483647; return seed / 2147483647; };
  const out = [];
  for (const [cx, cy, r] of [[40, 380, 26], [W - 60, 90, 22], [W - 30, 360, 14], [90, 120, 10], [W * 0.62, 410, 12]]) {
    out.push([cx, cy, r, 0.55]);
    for (let n = 0; n < 14; n++) {
      const a = rnd2() * Math.PI * 2, d = r * (0.9 + rnd2() * 2.2);
      out.push([cx + Math.cos(a) * d, cy + Math.sin(a) * d, 1 + rnd2() * r * 0.18, 0.4 + rnd2() * 0.4]);
    }
  }
  return (settingsFx.splats = out);
}

function drawSettingTab(t) {
  const k = tween("tab:" + t.id, t.id === (state.settingsTab || "audio") ? 1 : 0, 16);
  scaled(t.x + t.w / 2, t.y + t.h / 2, 1 - 0.03 * pressAmt("tab:" + t.id, t), () => {
    rr(t.x, t.y, t.w, t.h, 8);
    ctx.fillStyle = "#16141a"; ctx.fill();
    if (k > 0.01) {
      // The chosen tab is soaked in blood that runs off its lower edge.
      ctx.save(); ctx.globalAlpha *= k;
      const g = ctx.createLinearGradient(0, t.y, 0, t.y + t.h);
      g.addColorStop(0, "#c8222f"); g.addColorStop(1, "#7a0c16");
      rr(t.x, t.y, t.w, t.h, 8); ctx.fillStyle = g; ctx.fill();
      ctx.fillStyle = "rgba(255,255,255,0.14)"; rr(t.x + 4, t.y + 3, t.w - 8, 3, 1.5); ctx.fill();
      ctx.fillStyle = "#7a0c16";
      const now = performance.now() / 1000;

function drawScreen(dt) {
  if (state.screen === "title") drawTitle(dt);
  else if (state.screen === "maps") drawMaps(dt);
  else if (state.screen === "help") drawHelp();
  else if (state.screen === "settings") drawSettings(dt);
}

// Every tappable thing on the current menu screen and what it does.
function screenTargets() {
  const t = [];
  if (state.screen === "title") {
    for (const b of titleButtons()) t.push({ id: b.id, box: b, run: () => (b.id === "maps" && !state.inGame ? startPlayShot(b) : setScreen(b.id === "resume" ? "game" : b.id)) });
    return t;
  }
  t.push({ id: "back", box: BACK_BTN, run: () => setScreen(state.screen === "settings" && state.settingsFromGame ? "game" : "title") });
  if (state.screen === "settings" && state.settingsFromGame) t.push({ id: "home", box: homeBtn(), run: () => setScreen("title") });
  if (state.screen === "maps") {
    for (const c of menuCards()) t.push({ id: "map" + c.i, box: c, run: () => { state.inGame = true; loadMap(c.i); setScreen("game"); } });
    t.push({ id: "random", box: randomBtn(), run: () => { state.inGame = true; loadMap(rnd(MAPS.length)); setScreen("game"); } });
  } else if (state.screen === "settings") {
    for (const r of settingRows()) {
      t.push({ id: r.id, box: r, run: () => { if (r.id === "panel") togglePanel(); else { settings[r.id] = !settings[r.id]; saveSettings(); } musicStart(); } });
    }
    for (const tb of settingTabs()) t.push({ id: "tab:" + tb.id, box: tb, run: () => { if (state.settingsTab !== tb.id) { state.settingsTab = tb.id; state.settingsTabT = performance.now(); } } });
  }
  return t;
}

// Menus react on release, so the button can show that it is pressed.
function screenPress() {
  musicStart();
  // While the play shot runs, the title takes no taps.
  if (playShot && state.screen === "title") { state.pressTarget = null; return; }
  const hit = screenTargets().find((tg) => hitBox(tg.box, state.sx, state.sy));
  state.pressTarget = hit ? hit.id : null;
}
function screenRelease() {
  const id = state.pressTarget;
  state.pressTarget = null;
  if (!id) return;
  const tg = screenTargets().find((t) => t.id === id);
  if (tg && hitBox(tg.box, state.sx, state.sy)) { clickSound(800, 0.05); tg.run(); }
}

  if (!state.pressing || !state.dolls.includes(lp.d) || Math.hypot(state.mx - lp.x, state.my - lp.y) > 9 / state.cam.z) { state.lp = null; return; }
  if ((performance.now() - lp.t) / 1000 < LONG_PRESS) return;
