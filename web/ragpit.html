const T_GRAB = 0, T_WATER = 1, T_BLADE = 2, T_FIRE = 3, T_ICE = 4, T_BOMB = 5, T_IV = 6, T_DOLL = 7, T_RESET = 8;
const TOOL_NAMES = ["Greifen", "Wasser", "Klinge", "Feuer", "Eis", "Bombe", "Infusion", "Neue Puppe", "Reset"];
const TOOL_COUNT = 9;
const BTN = 46, BTN_GAP = 6, TOOLBAR_Y = H - 54;
const PANEL = { x: 570, y: 8, w: 190, h: 345 };
const BARS = [["KO", "#4ccf5a"], ["BL", "#d0283a"], ["PN", "#f08a24"], ["O2", "#2ec8c0"], ["HR", "#ec5f92"]];
const TAGS = [["OUT", "#a2a2aa"], ["BLEED", "#d6202f"], ["FIRE", "#ff5a1e"], ["CHOKE", "#2ec8c0"],
  ["AGONY", "#f08a24"], ["HEAL", "#f2da3a"], ["BLADE", "#c8d0dc"], ["TORN", "#f272b8"], ["FROZEN", "#86c4ff"]];
const MINI = [[0, -12], [0, -8], [0, 0], [0, 3], [-5, -3], [-7, 2], [5, -3], [7, 2], [-2, 9], [-3, 15], [-5, 15], [2, 9], [3, 15], [5, 15]];
const MINI_W = [2, 4.2, 4, 2, 1.8, 2, 1.8, 2.4, 2, 1.4, 2.4, 2, 1.4];

const toolbarX = () => (W - (TOOL_COUNT * BTN + (TOOL_COUNT - 1) * BTN_GAP)) / 2;
const buttonX = (i) => toolbarX() + i * (BTN + BTN_GAP);
function toolbarHit(x, y) {
  for (let i = 0; i < TOOL_COUNT; i++) {
    const bx = buttonX(i);
    if (x >= bx - 3 && x < bx + BTN + 3 && y >= TOOLBAR_Y - 6 && y < TOOLBAR_Y + BTN + 6) return i;
  }
  return -1;
}
const inPanel = (x, y) => x >= PANEL.x && x < PANEL.x + PANEL.w && y >= PANEL.y && y < PANEL.y + PANEL.h;
const blocksInput = (x, y) => toolbarHit(x, y) >= 0 || inPanel(x, y);

function rr(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x + r, y);
  ctx.arcTo(x + w, y, x + w, y + h, r);
  ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r);
  ctx.arcTo(x, y, x + w, y, r);
  ctx.closePath();
}

function label(s, x, y, size, color, align = "left", weight = 700) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align;
  ctx.textBaseline = "middle";
  ctx.fillStyle = color;
  ctx.fillText(s, x, y);
}

function drawMini(d, cx, cy, s) {
  ctx.lineCap = "round";
  for (let pass = 0; pass < 2; pass++) {
    for (const k of DRAW_ORDER) {
      const a = MINI[PART_A[k]], b = MINI[PART_B[k]];
      let c;
      if (pass === 0) c = COL_LINE;
      else if (d.gone[k]) continue;
      else if (!d.attached(k)) c = hex("#3c3c44");
      else {
        let col = mixc(hex("#e8e8e2"), COL_CHAR, clamp(d.char[k], 0, 0.8));
        if (d.frozen) col = mixc(col, COL_ICE, 0.6);
        col = mixc(col, COL_GORE, d.stain[k] * 0.6);
        c = col;
      }
      if (pass === 0 && d.gone[k]) continue;
      const grow = pass === 0 ? 1.4 : 0;
      const col = c;
      if (k === HEAD) {
        ctx.fillStyle = css(col);
        ctx.beginPath(); ctx.ellipse(cx + b[0] * s, cy + b[1] * s, 2.7 * s + grow, 3.2 * s + grow, 0, 0, Math.PI * 2); ctx.fill();
      } else {
        const [ra, rb] = TAPER[k];
        taperFill(cx + a[0] * s, cy + a[1] * s, cx + b[0] * s, cy + b[1] * s, ra * 0.26 + grow, rb * 0.26 + grow, col);
      }
    }
  }
  const pulse = 0.5 + 0.5 * Math.sin(performance.now() * 0.008);
  for (const w of d.wounds) {
    if (d.gone[w.part]) continue;
    const a = MINI[PART_A[w.part]], b = MINI[PART_B[w.part]];
    let wx, wy;
    if (w.part === HEAD) {
      if (w.stump) { wx = a[0]; wy = a[1]; }
      else { wx = b[0] + Math.cos(w.t * Math.PI * 2) * 1.6; wy = b[1] + Math.sin(w.t * Math.PI * 2) * 1.6; }
    } else if (w.stump) {
      [wx, wy] = w.t < 0.5 ? a : b;
    } else {
      const l = Math.hypot(b[0] - a[0], b[1] - a[1]) || 1, off = w.s * MINI_W[w.part] * 0.35;
      wx = lerp(a[0], b[0], w.t) - (b[1] - a[1]) / l * off;
      wy = lerp(a[1], b[1], w.t) + (b[0] - a[0]) / l * off;
    }
    ctx.fillStyle = w.bleed > 0 ? css(mixc(hex("#ff1f30"), hex("#ff8a8a"), pulse)) : "#6a1a1e";
    ctx.beginPath(); ctx.arc(cx + wx * s, cy + wy * s, w.stump ? 2.6 : 1.7, 0, Math.PI * 2); ctx.fill();
  }
  // Missing parts get a dashed ghost outline.
  ctx.setLineDash([2, 2]);
  ctx.strokeStyle = "rgba(208,40,58,0.6)"; ctx.lineWidth = 1;
  for (let k = 0; k < PART_COUNT; k++) {
    if (!d.gone[k]) continue;
    const a = MINI[PART_A[k]], b = MINI[PART_B[k]];
    ctx.beginPath();
    if (k === HEAD) ctx.arc(cx + b[0] * s, cy + b[1] * s, 3 * s, 0, Math.PI * 2);
    else { ctx.moveTo(cx + a[0] * s, cy + a[1] * s); ctx.lineTo(cx + b[0] * s, cy + b[1] * s); }
    ctx.stroke();
  }
  ctx.setLineDash([]);
}

// Dotted fill for empty bars and idle tags, like an unlit LED grid.
let dotPattern = null;
function dots() {
  if (dotPattern) return dotPattern;
  const c = document.createElement("canvas");
  c.width = c.height = 3;
  const g = c.getContext("2d");
  g.fillStyle = "#1c1c22"; g.fillRect(0, 0, 3, 3);
  g.fillStyle = "#2c2c34"; g.fillRect(0, 0, 1.5, 1.5);
  dotPattern = ctx.createPattern(c, "repeat");
  return dotPattern;
}

function drawEcg(x, y, w, flash) {
  const pts = [[0, 0], [0.3, 0], [0.38, -0.25], [0.46, 0.15], [0.54, -1], [0.62, 0.7], [0.7, 0], [1, 0]];
  ctx.strokeStyle = css(mixc(hex("#d8d8e0"), hex("#ff6a8a"), flash)); ctx.lineWidth = 2; ctx.lineJoin = "round"; ctx.lineCap = "round";
  ctx.beginPath();
  pts.forEach(([px0, py0], n) => (n ? ctx.lineTo : ctx.moveTo).call(ctx, x + px0 * w, y + py0 * 9));
  ctx.stroke();
}

function drawPanel(d) {
  const { x: px0, y: py0, w: pw, h: ph } = PANEL;
  rr(px0, py0, pw, ph, 12);
  ctx.fillStyle = "rgba(14,14,18,0.94)"; ctx.fill();
  ctx.strokeStyle = "#34343c"; ctx.lineWidth = 2; ctx.stroke();
  const bx0 = px0 + 10, by0 = py0 + 10, bw0 = pw - 20, bh0 = 94;
  rr(bx0, by0, bw0, bh0, 8);
  ctx.fillStyle = "#0a0a0d"; ctx.fill();
  if (!d) { label("KEINE PUPPE", px0 + pw / 2, by0 + bh0 / 2, 12, "#55555e", "center"); return; }
  label("P" + d.id, bx0 + 8, by0 + 12, 12, "#5a5a64");
  if (d.dead) label("TOT", bx0 + 8, by0 + 28, 12, "#e0303f");
  if (d.hr > 1) drawEcg(bx0 + bw0 - 40, by0 + 13, 32, d.beatFlash);
  drawMini(d, px0 + pw / 2, by0 + 52, 2.6);

  const values = [d.ko, d.bl, d.pn, d.o2, clamp(d.hr / 1.6, 0, 100)];
  for (let i = 0; i < BARS.length; i++) {
    const y = py0 + 116 + i * 19, bx = px0 + 12, bw = 128, bh = 11;
    rr(bx, y, bw, bh, 5.5); ctx.fillStyle = dots(); ctx.fill();
    let c = hex(BARS[i][1]);
    if (i === 4) c = mixc(c, [255, 255, 255], d.beatFlash * 0.45);
    const fw = bw * clamp(values[i] / 100, 0, 1);
    if (fw > 1) {
      rr(bx, y, Math.max(bh, fw), bh, 5.5);
      ctx.fillStyle = css(c); ctx.fill();
      rr(bx + 3, y + 2, Math.max(4, fw - 6), 2.5, 1.2);
      ctx.fillStyle = css(lighten(c, 0.45), 0.8); ctx.fill();
    }
    label(BARS[i][0], px0 + pw - 12, y + bh / 2 + 0.5, 13, "#e4e4dc", "right");
  }
  const f = d.flags();
  for (let i = 0; i < TAGS.length; i++) {
    const tw = 80, th = 21;
    const tx = px0 + 12 + (i % 2) * (tw + 6), ty = py0 + 216 + Math.floor(i / 2) * 25;
    const [name, col] = TAGS[i];
    rr(tx, ty, tw, th, 10.5);
    if (f[name]) {
      ctx.save(); ctx.shadowColor = col; ctx.shadowBlur = 10;
      ctx.fillStyle = col; ctx.fill(); ctx.restore();
      label(name, tx + tw / 2, ty + th / 2 + 1, 11, "#101013", "center");
    } else {
      ctx.fillStyle = dots(); ctx.fill();
      label(name, tx + tw / 2, ty + th / 2 + 1, 11, "#4c4c56", "center");
    }
  }
}

function drawIcon(i, cx, cy) {
  ctx.save();
  ctx.translate(cx, cy);
  ctx.scale(1.35, 1.35);
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  switch (i) {
    case T_GRAB: {
      ctx.fillStyle = "#ecece6";
      rr(-6, -1, 12, 9, 3); ctx.fill();
      for (const fx of [-5, -2, 1, 4]) { rr(fx, -9 + Math.abs(fx + 0.5) * 0.4, 2.6, 10, 1.3); ctx.fill(); }
      ctx.beginPath(); ctx.ellipse(-7, 2, 2, 4, -0.6, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case T_WATER: {
      ctx.fillStyle = "#3c82e6";
      ctx.beginPath(); ctx.moveTo(0, -10);
      ctx.bezierCurveTo(5, -3, 8, 1, 8, 4); ctx.arc(0, 4, 8, 0, Math.PI); ctx.bezierCurveTo(-8, 1, -5, -3, 0, -10);
      ctx.fill();
      ctx.fillStyle = "#b4d8ff"; ctx.beginPath(); ctx.ellipse(-3, 4, 1.6, 3, 0.3, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case T_BLADE: {
      ctx.rotate(-Math.PI / 4);
      ctx.fillStyle = "#d4d9e3";
      ctx.beginPath(); ctx.moveTo(-3, -12); ctx.lineTo(2.5, -8); ctx.lineTo(2.5, 3); ctx.lineTo(-3, 3); ctx.closePath(); ctx.fill();
      ctx.fillStyle = "#8c5a32"; rr(-3.5, 4, 7, 9, 2); ctx.fill();
      ctx.fillStyle = "#5c5c66"; ctx.fillRect(-5, 2.5, 10, 2);
      break;
    }
    case T_FIRE: {
      ctx.fillStyle = "#f06e1e";
      ctx.beginPath(); ctx.moveTo(0, -11);
      ctx.bezierCurveTo(7, -4, 9, 2, 7, 6); ctx.quadraticCurveTo(0, 13, -7, 6); ctx.bezierCurveTo(-9, 1, -4, -2, 0, -11); ctx.fill();
      ctx.fillStyle = "#ffdc50";
      ctx.beginPath(); ctx.moveTo(0, -3); ctx.bezierCurveTo(4, 1, 5, 4, 3, 7); ctx.quadraticCurveTo(0, 10, -3, 7); ctx.bezierCurveTo(-5, 4, -2, 1, 0, -3); ctx.fill();
      break;
    }
    case T_ICE: {
      ctx.strokeStyle = "#a6e0fc"; ctx.lineWidth = 2;
      for (let a = 0; a < 3; a++) {
        ctx.save(); ctx.rotate(a * Math.PI / 3);
        ctx.beginPath(); ctx.moveTo(0, -10); ctx.lineTo(0, 10);
        ctx.moveTo(-3, -7); ctx.lineTo(0, -4.5); ctx.lineTo(3, -7);
        ctx.moveTo(-3, 7); ctx.lineTo(0, 4.5); ctx.lineTo(3, 7);
        ctx.stroke(); ctx.restore();
      }
      break;
    }
    case T_BOMB: {
      ctx.fillStyle = "#3a3a44"; ctx.beginPath(); ctx.arc(-1, 3, 8, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#62626e"; ctx.beginPath(); ctx.arc(-4, 0, 2.6, 0, Math.PI * 2); ctx.fill();
      ctx.strokeStyle = "#b08a5a"; ctx.lineWidth = 1.8;
      ctx.beginPath(); ctx.moveTo(4, -3); ctx.quadraticCurveTo(7, -9, 10, -8); ctx.stroke();
      ctx.fillStyle = "#ffd050"; ctx.beginPath(); ctx.arc(10, -8.5, 2.4, 0, Math.PI * 2); ctx.fill();
      break;
    }
    case T_IV: {
      // Blood bag with a tube
      ctx.strokeStyle = "#8c8c96"; ctx.lineWidth = 1.4;
      ctx.beginPath(); ctx.moveTo(-1, -12); ctx.lineTo(-1, -9); ctx.stroke();
      ctx.fillStyle = "#d8dde4"; rr(-7, -9, 12, 15, 3); ctx.fill();
      ctx.fillStyle = "#c8182a"; rr(-7, -3, 12, 9, 3); ctx.fill();
      ctx.fillStyle = "#f4f4f4"; ctx.fillRect(-4, -6, 6, 3);
      ctx.strokeStyle = "#c8182a"; ctx.lineWidth = 1.6;
      ctx.beginPath(); ctx.moveTo(-1, 6); ctx.quadraticCurveTo(-1, 12, 6, 11); ctx.stroke();
      ctx.fillStyle = "#6ee66e"; ctx.fillRect(5, 4, 6, 2); ctx.fillRect(7, 2, 2, 6);
      break;
    }
    case T_DOLL: {
      ctx.fillStyle = "#ecece6"; ctx.strokeStyle = "#ecece6"; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(-3, -7, 3.6, 0, Math.PI * 2); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-3, -3); ctx.lineTo(-3, 4); ctx.moveTo(-8, -1); ctx.lineTo(2, -1);
      ctx.moveTo(-3, 4); ctx.lineTo(-6, 11); ctx.moveTo(-3, 4); ctx.lineTo(0, 11); ctx.stroke();
      ctx.strokeStyle = "#6ee66e"; ctx.lineWidth = 2.4;
      ctx.beginPath(); ctx.moveTo(8, -6); ctx.lineTo(8, 2); ctx.moveTo(4, -2); ctx.lineTo(12, -2); ctx.stroke();
      break;
    }
    case T_RESET: {
      ctx.strokeStyle = "#e6c850"; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.arc(0, 1, 8, -Math.PI * 0.35, Math.PI * 1.45); ctx.stroke();
      ctx.fillStyle = "#e6c850";
      ctx.beginPath(); ctx.moveTo(4, -9); ctx.lineTo(10, -6); ctx.lineTo(4, -2); ctx.closePath(); ctx.fill();
      break;
    }
  }
  ctx.restore();
}

function drawToolbar() {
  const x0 = toolbarX(), total = TOOL_COUNT * BTN + (TOOL_COUNT - 1) * BTN_GAP;
  rr(x0 - 8, TOOLBAR_Y - 6, total + 16, BTN + 12, 14);
  ctx.fillStyle = "rgba(15,15,19,0.92)"; ctx.fill();
  ctx.strokeStyle = "#383840"; ctx.lineWidth = 1.5; ctx.stroke();
  for (let i = 0; i < TOOL_COUNT; i++) {
    const bx = buttonX(i), by = TOOLBAR_Y;
    let bg = "#26262c", edge = "#3e3e46";
    if (i === state.tool) { bg = "#3a3a44"; edge = "#ecece6"; }
    else if (i === state.hover || i === state.flashBtn) { bg = "#303038"; edge = "#6a6a74"; }
    rr(bx, by, BTN, BTN, 10);
    ctx.fillStyle = bg; ctx.fill();
    ctx.strokeStyle = edge; ctx.lineWidth = i === state.tool ? 2 : 1.2; ctx.stroke();
    drawIcon(i, bx + BTN / 2, by + BTN / 2);
  }
  const text = state.hover >= 0 ? TOOL_NAMES[state.hover] + "  " + (state.hover + 1) : state.toast > 0 ? state.toastText : "";
  if (text) {
    ctx.font = `700 14px ${FONT}`;
    const lw = ctx.measureText(text).width + 24;
    rr(W / 2 - lw / 2, TOOLBAR_Y - 38, lw, 26, 13);
    ctx.fillStyle = "rgba(15,15,19,0.92)"; ctx.fill();
    ctx.strokeStyle = "#383840"; ctx.lineWidth = 1.5; ctx.stroke();
    label(text, W / 2, TOOLBAR_Y - 24.5, 14, "#e2e2da", "center");
  }
}

function drawCursor() {
  const { mx, my } = state;
  if (!state.pointerSeen || blocksInput(mx, my)) return;
  ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 1.2;
  if (state.tool === T_WATER || state.tool === T_FIRE || state.tool === T_ICE) {
    ctx.beginPath(); ctx.arc(mx, my, state.tool === T_WATER ? 4 : 8, 0, Math.PI * 2); ctx.stroke();
  } else if (state.tool === T_BOMB) {
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(mx, my, 130, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI * 2); ctx.stroke();
  } else if (state.tool === T_IV) {
    ctx.strokeStyle = "rgba(110,230,110,0.8)"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(mx - 6, my); ctx.lineTo(mx + 6, my); ctx.moveTo(mx, my - 6); ctx.lineTo(mx, my + 6); ctx.stroke();
  } else if (state.tool === T_BLADE) {
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.arc(mx, my, 1.6, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(mx - 8, my); ctx.lineTo(mx - 3, my); ctx.moveTo(mx + 3, my); ctx.lineTo(mx + 8, my);
    ctx.moveTo(mx, my - 8); ctx.lineTo(mx, my - 3); ctx.moveTo(mx, my + 3); ctx.lineTo(mx, my + 8);
    ctx.stroke();
  }
}

// ======================================================================
// Static layers: room, lamp and light, rebuilt on every resize
// ======================================================================

const LAMP_X = 384, LAMP_Y = 42;
const bgCan = document.createElement("canvas"), lightCan = document.createElement("canvas");

function buildStatic() {
  bgCan.width = lightCan.width = canvas.width;
  bgCan.height = lightCan.height = canvas.height;
  const b = bgCan.getContext("2d");
  b.setTransform(K, 0, 0, K, 0, 0);
  const wall = b.createLinearGradient(0, 0, 0, FLOOR_Y);
  wall.addColorStop(0, "#18181c"); wall.addColorStop(1, "#24242a");
  b.fillStyle = wall; b.fillRect(0, 0, W, FLOOR_Y);
  for (let x = 0; x < W; x += 96) {
    b.fillStyle = "rgba(255,255,255,0.018)"; b.fillRect(x + 4, 20, 88, FLOOR_Y - 36);
    b.fillStyle = "#141417"; b.fillRect(x, 16, 1.5, FLOOR_Y - 16);
    b.fillStyle = "rgba(255,255,255,0.03)"; b.fillRect(x + 1.5, 16, 1, FLOOR_Y - 16);
  }
  for (let y = 96; y < FLOOR_Y - 20; y += 80) { b.fillStyle = "#141417"; b.fillRect(0, y, W, 1.5); }
  b.fillStyle = "#111114"; b.fillRect(0, 0, W, 16);
  b.fillStyle = "#0a0a0c"; b.fillRect(0, 16, W, 1.5);
  b.fillStyle = "#2a2a31"; b.fillRect(0, FLOOR_Y - 12, W, 12);
  b.fillStyle = "#3a3a42"; b.fillRect(0, FLOOR_Y - 12, W, 1.2);
  // Floor tiles
  const fl = b.createLinearGradient(0, FLOOR_Y, 0, H);
  fl.addColorStop(0, "#bdbdc2"); fl.addColorStop(1, "#8a8a90");
  b.fillStyle = fl; b.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
  b.fillStyle = "#dedee2"; b.fillRect(0, FLOOR_Y, W, 2);
  b.fillStyle = "rgba(0,0,0,0.18)";
  for (let x = 0; x < W; x += 64) b.fillRect(x, FLOOR_Y + 2, 1.5, H - FLOOR_Y);
  b.fillRect(0, FLOOR_Y + 26, W, 1.5);
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let n = 0; n < 500; n++) {
    b.fillStyle = `rgba(0,0,0,${0.04 + rand() * 0.08})`;
    b.fillRect(rand() * W, FLOOR_Y + 3 + rand() * (H - FLOOR_Y - 3), 1 + rand() * 1.5, 1 + rand());
  }
  // Lamp
  b.strokeStyle = "#0b0b0d"; b.lineWidth = 1.6;
  b.beginPath(); b.moveTo(LAMP_X, 0); b.lineTo(LAMP_X, 26); b.stroke();
  const shadeG = b.createLinearGradient(0, 24, 0, 40);
  shadeG.addColorStop(0, "#5a5a64"); shadeG.addColorStop(1, "#2e2e35");
  b.fillStyle = shadeG;
  b.beginPath(); b.moveTo(LAMP_X - 5, 25); b.lineTo(LAMP_X + 5, 25); b.lineTo(LAMP_X + 20, 39); b.lineTo(LAMP_X - 20, 39); b.closePath(); b.fill();
  b.strokeStyle = "#0b0b0d"; b.lineWidth = 1.4; b.stroke();
  b.fillStyle = "#fff4d0"; b.beginPath(); b.ellipse(LAMP_X, 40.5, 6, 3, 0, 0, Math.PI * 2); b.fill();

  // Light: stacked cones give soft edges, plus a glow at the bulb and on the floor.
  const l = lightCan.getContext("2d");
  l.setTransform(K, 0, 0, K, 0, 0);
  for (let n = 0; n < 6; n++) {
    const spread = 0.42 + n * 0.035;
    const g = l.createLinearGradient(0, LAMP_Y, 0, FLOOR_Y + 20);
    g.addColorStop(0, `rgba(255,240,204,${0.05})`);
    g.addColorStop(1, `rgba(255,240,204,${0.012})`);
    l.fillStyle = g;
    l.beginPath();
    l.moveTo(LAMP_X - 14, LAMP_Y - 2); l.lineTo(LAMP_X + 14, LAMP_Y - 2);
    l.lineTo(LAMP_X + (FLOOR_Y - LAMP_Y) * spread, FLOOR_Y + 30);
    l.lineTo(LAMP_X - (FLOOR_Y - LAMP_Y) * spread, FLOOR_Y + 30);
    l.closePath(); l.fill();
  }
  const glow = l.createRadialGradient(LAMP_X, LAMP_Y, 0, LAMP_X, LAMP_Y, 60);
  glow.addColorStop(0, "rgba(255,240,204,0.5)"); glow.addColorStop(1, "rgba(255,240,204,0)");
  l.fillStyle = glow; l.fillRect(LAMP_X - 60, LAMP_Y - 60, 120, 120);
  l.save(); l.translate(LAMP_X, FLOOR_Y + 4); l.scale(1, 0.12);
  const spot = l.createRadialGradient(0, 0, 0, 0, 0, 170);
  spot.addColorStop(0, "rgba(255,240,204,0.35)"); spot.addColorStop(1, "rgba(255,240,204,0)");
  l.fillStyle = spot; l.beginPath(); l.arc(0, 0, 170, 0, Math.PI * 2); l.fill();
  l.restore();
  // Vignette
  const v = l.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, W * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.0)");
  l.fillStyle = v; l.fillRect(0, 0, W, H);
}

// ======================================================================
// Game state, tools and input
// ======================================================================

const state = {
  tool: T_GRAB, mx: W / 2, my: H / 2, lastX: W / 2, lastY: H / 2,
  pressing: false, pointerSeen: false, hover: -1, flashBtn: -1, toast: 0, toastText: "",
  dolls: [], selected: null, grabDoll: null, counter: 0, trail: [], shake: 0,
};

function spawnDoll(bx, by) {
  if (state.dolls.length >= 6) {
    const old = state.dolls.shift();
    if (state.grabDoll === old) state.grabDoll = null;
  }
  const d = new Doll(bx, by, ++state.counter);
  state.dolls.push(d);
  state.selected = d;
  return d;
}

function resetScene() {
  worldReset();
  gibs = []; effects = [];
  dctx.clearRect(0, 0, decal.width, decal.height);
  state.dolls = []; state.selected = null; state.grabDoll = null; state.counter = 0;
  spawnDoll(W / 2 - 110, FLOOR_Y);
}

function useButton(i) {
  state.flashBtn = i;
  setTimeout(() => { if (state.flashBtn === i) state.flashBtn = -1; }, 150);
  if (i === T_DOLL) {
    const d = spawnDoll(LAMP_X + rf(-80, 80), 250);
    for (let k = 0; k < d.x.length; k++) { d.ox[k] = d.x[k] + rf(-2, 2); d.oy[k] = d.y[k] - 2; }
  } else if (i === T_RESET) {
    resetScene();
  } else {
    release();
    state.tool = i;
  }
  state.toast = 1.2;
  state.toastText = TOOL_NAMES[i];
}

function press() {
  const b = toolbarHit(state.mx, state.my);
  if (b >= 0) { useButton(b); return; }
  if (blocksInput(state.mx, state.my)) return;
  state.pressing = true;
  state.lastX = state.mx; state.lastY = state.my;
  if (state.tool === T_BOMB) { explode(state.mx, Math.min(state.my, FLOOR_Y - 2)); state.pressing = false; return; }
  if (state.tool === T_IV) {
    state.pressing = false;
    let bestD = 70, best = null;
    for (const d of state.dolls) {
      const [i, dist] = d.nearestPoint(state.mx, state.my, bestD);
      if (i >= 0) { bestD = dist; best = d; }
    }
    if (best) { best.attachInfusion(); state.selected = best; state.toast = 1.2; state.toastText = "Infusion angelegt"; }
    return;
  }
  if (state.tool === T_GRAB) {
    let bestD = 40, best = null, bestI = -1;
    for (const d of state.dolls) {
      const [i, dist] = d.nearestPoint(state.mx, state.my, bestD);
      if (i >= 0) { bestD = dist; best = d; bestI = i; }
    }
    if (best) {
      for (const d of state.dolls) d.grabbed = -1;
      best.grabbed = bestI; best.gx = state.mx; best.gy = state.my;
      state.grabDoll = best; state.selected = best;
    }
  }
}

function release() {
  state.pressing = false;
  if (state.grabDoll) state.grabDoll.grabbed = -1;
  state.grabDoll = null;
}

function applyTool() {
  const { mx, my } = state;
  if (state.tool === T_WATER) {
    for (let n = 0; n < 12; n++) spawnParticle(mx + rf(-3, 3), my, rf(-24, 24), rf(20, 80), WATER, 0);
  } else if (state.tool === T_FIRE) {
    paintDisc(mx, my, 8, FIRE, 0.25);
    for (const d of state.dolls) d.applyHeat(mx, my, 26);
  } else if (state.tool === T_ICE) {
    paintDisc(mx, my, 7, ICE, 0.6, 200);
    for (const d of state.dolls) d.applyCold(mx, my, 30);
  } else if (state.tool === T_BLADE) {
    if (mx !== state.lastX || my !== state.lastY) {
      const speed = Math.hypot(mx - state.lastX, my - state.lastY) / DT;
      state.trail.push({ ax: state.lastX, ay: state.lastY, bx: mx, by: my, age: 0 });
      for (const d of state.dolls) if (d.bladeHit(state.lastX, state.lastY, mx, my, speed)) state.selected = d;
    }
  }
}

function physicsStep() {
  if (state.pressing) applyTool();
  worldStep();
  stepGibs();
  for (const d of state.dolls) {
    if (d === state.grabDoll) { d.gx = state.mx; d.gy = state.my; }
    d.step();
  }
  for (const s of state.trail) s.age += DT;
  state.trail = state.trail.filter((s) => s.age < 0.25);
  for (const e of effects) e.age += DT;
  effects = effects.filter((e) => e.age < 0.5);
  state.toast = Math.max(0, state.toast - DT);
  state.shake = Math.max(0, state.shake - DT);
  state.lastX = state.mx; state.lastY = state.my;
}

function toGame(ev) {
  const r = canvas.getBoundingClientRect();
  state.mx = clamp((ev.clientX - r.left) / r.width * W, 0, W - 0.01);
  state.my = clamp((ev.clientY - r.top) / r.height * H, 0, H - 0.01);
  state.pointerSeen = true;
}

let activePointer = null;
canvas.addEventListener("pointerdown", (ev) => {
  ev.preventDefault();
  if (activePointer !== null) return;
  activePointer = ev.pointerId;
  try { canvas.setPointerCapture(ev.pointerId); } catch (e) { /* pointer capture is optional */ }
  toGame(ev);
  state.lastX = state.mx; state.lastY = state.my;
  press();
});
canvas.addEventListener("pointermove", (ev) => {
  if (activePointer !== null && ev.pointerId !== activePointer) return;
  toGame(ev);
  state.hover = ev.pointerType === "mouse" ? toolbarHit(state.mx, state.my) : -1;
});
const endPointer = (ev) => {
  if (ev.pointerId !== activePointer) return;
  activePointer = null;
  release();
};
canvas.addEventListener("pointerup", endPointer);
canvas.addEventListener("pointercancel", endPointer);
canvas.addEventListener("contextmenu", (ev) => ev.preventDefault());
document.addEventListener("touchmove", (ev) => ev.preventDefault(), { passive: false });
document.addEventListener("gesturestart", (ev) => ev.preventDefault());

window.addEventListener("keydown", (ev) => {
  if (ev.key >= "1" && ev.key <= "9") useButton(+ev.key - 1);
  else if (ev.key === "r" || ev.key === "R") useButton(T_RESET);
  else if (ev.key === "n" || ev.key === "N") useButton(T_DOLL);
  else if (ev.key === "b" || ev.key === "B") useButton(T_BOMB);
});

// ---------------------------------------------------------------- layout

function fit() {
  const stage = document.getElementById("stage");
  const hint = document.getElementById("hint");
  const cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const hintH = hint.offsetParent ? hint.offsetHeight + 12 : 0;
  const availH = stage.clientHeight - hintH;
  const s = Math.max(0.2, Math.min(availW / W, availH / H));
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  K = canvas.width / W;
  buildStatic();
}
window.addEventListener("resize", fit);
window.addEventListener("orientationchange", () => setTimeout(fit, 200));

// ---------------------------------------------------------------- render

const COL_P_BLOOD = "#9c0e1c", COL_P_FIRE = "#ffc048";
function render() {
  flushPaint();
  if (worldDirty) { wctx.putImageData(wimg, 0, 0); worldDirty = false; }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.drawImage(bgCan, 0, 0);
  const sh = state.shake > 0 ? state.shake * 14 : 0;
  ctx.setTransform(K, 0, 0, K, rf(-sh, sh) * K, rf(-sh, sh) * K);
  ctx.imageSmoothingEnabled = true;
  ctx.drawImage(decal, 0, 0, W, H);
  // Gibs and dolls are pixel art on their own layer.
  ppx.fill(0);
  for (const g of gibs) rasterGib(g);
  for (const d of state.dolls) rasterDoll(d);
  for (const d of state.dolls) if (d.iv > 0) rasterInfusion(d);
  pixCtx.putImageData(pixImg, 0, 0);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pixCan, 0, 0, W, H);
  ctx.imageSmoothingEnabled = true;
  // Liquids, fire and smoke cover the dolls.
  ctx.drawImage(wcan, 0, 0, W, H);
  ctx.fillStyle = COL_P_BLOOD;
  ctx.beginPath();
  for (const p of particles) if (p.m === BLOOD) ctx.rect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
  ctx.fill();
  ctx.fillStyle = "rgba(120,170,240,0.85)";
  ctx.beginPath();
  for (const p of particles) if (p.m === WATER) ctx.rect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
  ctx.fill();
  ctx.fillStyle = COL_P_FIRE;
  ctx.beginPath();
  for (const p of particles) if (p.m !== BLOOD && p.m !== WATER) ctx.rect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
  ctx.fill();
  // Blade trail
  ctx.lineCap = "round";
  for (const s of state.trail) {
    ctx.strokeStyle = `rgba(240,246,255,${1 - s.age / 0.25})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();
  }
  // Light and explosion flashes add on top.
  ctx.globalCompositeOperation = "lighter";
  for (const e of effects) {
    const t = e.age / 0.5, r = 30 + t * 90;
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
    g.addColorStop(0, `rgba(255,230,160,${0.9 * (1 - t)})`);
    g.addColorStop(0.4, `rgba(255,120,40,${0.6 * (1 - t)})`);
    g.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.drawImage(lightCan, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  // HUD
  ctx.setTransform(K, 0, 0, K, 0, 0);
  label("RAGPIT", 14, 26, 26, "#8e8e98");
  label(TOOL_NAMES[state.tool].toUpperCase(), 15, 52, 13, "#5a5a64");
  drawCursor();
  let sel = state.selected;
  if (!sel || !state.dolls.includes(sel)) sel = state.selected = state.dolls[state.dolls.length - 1] || null;
  drawPanel(sel);
  drawToolbar();
}

let acc = 0, lastT = performance.now();
function loop(now) {
  acc += Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  let steps = 0;
  while (acc >= DT && steps < 4) { physicsStep(); acc -= DT; steps++; }
  if (steps === 4) acc = 0;
  render();
  requestAnimationFrame(loop);
}

resetScene();
fit();
requestAnimationFrame((t) => { lastT = t; loop(t); });
if (document.fonts && document.fonts.load) document.fonts.load(`700 12px ${FONT}`).catch(() => {});
</script>
