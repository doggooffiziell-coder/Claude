        ctx.moveTo(0, 0); ctx.lineTo(ex, ey);
        const bx = Math.cos(a) * 6, by = Math.sin(a) * 6;
        ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a + 0.75) * 3.2, by + Math.sin(a + 0.75) * 3.2);
        ctx.moveTo(bx, by); ctx.lineTo(bx + Math.cos(a - 0.75) * 3.2, by + Math.sin(a - 0.75) * 3.2);
      }
      ctx.stroke();
      ctx.fillStyle = "#ffffff";
      ctx.beginPath(); for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3; ctx.lineTo(Math.cos(a) * 2.6, Math.sin(a) * 2.6); } ctx.closePath(); ctx.fill();

    }
    case T_BOMB: {

      bg.addColorStop(0, "#6a6a78"); bg.addColorStop(0.5, "#2a2a32"); bg.addColorStop(1, "#0e0e12");
      ctx.fillStyle = bg; ctx.beginPath(); ctx.arc(-1, 2.5, 8.5, 0, Math.PI * 2); ctx.fill();

      ctx.save(); ctx.translate(4, -4.5); ctx.rotate(0.75);
      rr(-2.4, -2, 4.8, 3.6, 0.8); ctx.fillStyle = iconGrad(-2, 0, 2, 0, "#c8ccd6", "#6a6e78"); ctx.fill();
      ctx.restore();
      ctx.strokeStyle = "#b89a6a"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(5.5, -6); ctx.quadraticCurveTo(7, -10, 9.5, -9.5); ctx.stroke();
      iconGlow(9.6, -9.6, 4.5, "rgba(255,200,80,0.9)");
      ctx.fillStyle = "#fff6cc";
      ctx.beginPath(); for (let k = 0; k < 8; k++) { const a = k * Math.PI / 4, r = k % 2 ? 1 : 2.6; ctx.lineTo(9.6 + Math.cos(a) * r, -9.6 + Math.sin(a) * r); } ctx.closePath(); ctx.fill();

      ctx.beginPath(); ctx.moveTo(-1, -12); ctx.lineTo(-1, -9.5); ctx.stroke();
      rr(-7, -9.5, 12, 15, 3.5);
      ctx.fillStyle = "rgba(235,240,245,0.92)"; ctx.fill();
      ctx.save(); rr(-7, -9.5, 12, 15, 3.5); ctx.clip();
      ctx.fillStyle = iconGrad(0, -3, 0, 6, "#e0283c", "#8a0c1c"); ctx.fillRect(-7, -3.5, 12, 9);
      ctx.fillStyle = "rgba(255,255,255,0.35)"; ctx.fillRect(-5.8, -3, 1.2, 7);
      ctx.restore();
      ctx.fillStyle = "#ffffff"; rr(-4.5, -7.8, 7, 2.6, 0.8); ctx.fill();
      ctx.strokeStyle = "#c8222f"; ctx.lineWidth = 1.2;
      ctx.beginPath(); ctx.moveTo(-1, 5.5); ctx.quadraticCurveTo(-1, 10, 3, 10.5); ctx.stroke();

      ctx.fillStyle = iconGrad(0, -11, 0, -3, "#f4d8bc", "#d4a882"); ctx.fillRect(-8.6, -10.6, 7.2, 7.2);
      ctx.fillStyle = "#5a3a22"; ctx.fillRect(-8.6, -10.6, 7.2, 2.2);

      ctx.fillStyle = iconGrad(0, -2, 0, 6, "#5aa49c", "#2e6e68"); ctx.fillRect(-9.6, -1.6, 9.2, 7.2);
      ctx.fillStyle = "#38425a"; ctx.fillRect(-8.6, 6, 3.2, 5.6); ctx.fillRect(-4.6, 6, 3.2, 5.6);

    case T_RESET: {

function drawToolbar() {
  const { x0, total } = DOCK, top = TOOLBAR_Y - 7, h = BTN + 14;
  // Dock body with a soft top light
  rr(x0 - 9, top, total + 18, h, 16);
  const g = ctx.createLinearGradient(0, top, 0, top + h);
  g.addColorStop(0, "rgba(24,24,30,0.95)"); g.addColorStop(1, "rgba(11,11,14,0.95)");
  ctx.fillStyle = g; ctx.fill();
  ctx.strokeStyle = "#2e2e36"; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.fillStyle = "rgba(255,255,255,0.05)"; ctx.fillRect(x0 + 6, top + 1.5, total - 12, 1);
  // Thin dividers between the groups
  ctx.fillStyle = "#2a2a32";
  for (const sx of DOCK.seps) ctx.fillRect(sx - 0.5, TOOLBAR_Y + 8, 1, BTN - 16);
  DOCK.items.forEach((it, i) => {
    const by = TOOLBAR_Y, on = dockOn(it);
    const sel = tween("tb" + i, on ? 1 : 0, 18), hov = tween("tbh" + i, i === state.hover ? 1 : 0, 20);
    scaled(it.x + it.w / 2, by + BTN / 2, popScale("tb" + i, 0.1), () => {
      rr(it.x, by, it.w, BTN, 10);
      ctx.fillStyle = css(mixc(mixc(hex("#1d1d23"), hex("#26262e"), hov), hex("#2e2e37"), sel)); ctx.fill();
      if (sel > 0.01) {
        ctx.strokeStyle = css(hex(it.color), 0.35 * sel); ctx.lineWidth = 1.2; ctx.stroke();
        // Accent bar under the chosen tool
        const bw = it.w * 0.46 * sel;
        ctx.save(); ctx.shadowColor = it.color; ctx.shadowBlur = 8 * sel;
        rr(it.x + it.w / 2 - bw / 2, by + BTN - 5, bw, 3, 1.5); ctx.fillStyle = it.color; ctx.fill();
        ctx.restore();
      }
      const lift = 2 * sel, cx = it.x + it.w / 2, cy = by + BTN / 2 - 2 - lift;
      if (it.tool !== T_GUN) {
        ctx.save(); ctx.globalAlpha *= 0.72 + 0.28 * Math.max(sel, hov); drawIcon(it.tool, cx, cy + 1); ctx.restore();
      } else {
        const sp = WEAPONS[state.weapon].sprite, z = Math.min(1.3, (it.w - 12) / sp[0].length);
        drawSpriteOutlined(sp, cx - sp[0].length * z / 2, cy - sp.length * z / 2 - 2, z, 0.65 + 0.35 * Math.max(sel, hov));
        // Rounds left in the picked weapon
        const wp = WEAPONS[state.weapon], ammo = state.ammo[state.weapon];
        const loading = state.reloadT > 0;
        label(loading ? "LÄDT" : ammo + "/" + wp.mag, cx, by + BTN - 12, 7, loading ? "#e6c850" : ammo / wp.mag < 0.25 ? "#ff6a5a" : "#7a7a84", "center");
      }
    });
  });
  // Toasts fade in with a small rise and fade out at the end.
  if (state.toast > toastLast + 0.01) toastMax = state.toast;
  toastLast = state.toast;
  const hover = state.hover >= 0;
  const text = hover ? dockName(DOCK.items[state.hover]) : state.toast > 0 ? state.toastText : "";
  if (text) {
    const a = hover ? 1 : Math.min(easeOut((toastMax - state.toast) / 0.16), clamp(state.toast / 0.25, 0, 1));
    ctx.save(); ctx.globalAlpha *= a;
    ctx.font = `700 14px ${FONT}`;
    const lw = ctx.measureText(text).width + 24;
    const ly = TOOLBAR_Y - 38 + (1 - a) * 6;
    rr(W / 2 - lw / 2, ly, lw, 26, 13);
    ctx.fillStyle = "rgba(15,15,19,0.92)"; ctx.fill();
    ctx.strokeStyle = "#383840"; ctx.lineWidth = 1.5; ctx.stroke();
    label(text, W / 2, ly + 13.5, 14, "#e2e2da", "center");
    ctx.restore();
  }
}
let toastMax = 0, toastLast = 0, pillText = "PAUSE";

function drawCursor() {
  const { mx, my } = state;
  if (!state.pointerSeen || blocksInput(mx, my)) return;
  ctx.strokeStyle = "rgba(255,255,255,0.45)"; ctx.lineWidth = 1.2;
  if (state.tool === T_WATER || state.tool === T_FIRE || state.tool === T_ICE) {
    ctx.beginPath(); ctx.arc(mx, my, state.tool === T_WATER ? 4 : 8, 0, Math.PI * 2); ctx.stroke();
  } else if (state.tool === T_BOMB) {
    ctx.setLineDash([4, 4]);
    ctx.beginPath(); ctx.arc(mx, my, 130, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
    ctx.beginPath(); ctx.arc(mx, my, 3, 0, Math.PI * 2); ctx.stroke();
  } else if (state.tool === T_BUCKET) {
    ctx.setLineDash([3, 3]);
    ctx.beginPath(); ctx.arc(mx, my, 26, 0, Math.PI * 2); ctx.stroke();
    ctx.setLineDash([]);
  } else if (state.tool === T_GUN) {
    // The laser dot is the reticle.
  } else if (state.tool === T_IV) {
    ctx.strokeStyle = "rgba(110,230,110,0.8)"; ctx.lineWidth = 2.4;
    ctx.beginPath(); ctx.moveTo(mx - 6, my); ctx.lineTo(mx + 6, my); ctx.moveTo(mx, my - 6); ctx.lineTo(mx, my + 6); ctx.stroke();
  } else if (state.tool === T_BLADE) {
    ctx.fillStyle = "rgba(255,255,255,0.8)"; ctx.beginPath(); ctx.arc(mx, my, 1.6, 0, Math.PI * 2); ctx.fill();
  } else {
    ctx.beginPath();
    ctx.moveTo(mx - 8, my); ctx.lineTo(mx - 3, my); ctx.moveTo(mx + 3, my); ctx.lineTo(mx + 8, my);
    ctx.moveTo(mx, my - 8); ctx.lineTo(mx, my - 3); ctx.moveTo(mx, my + 3); ctx.lineTo(mx, my + 8);
    ctx.stroke();
  }
}

  { name: "Sturmgewehr", sprite: SPRITE_AR, grip: [12.5, 7], muzzle: [38, 3.5], mag: 30, reload: 2.0, climb: 0.022, auto: true, rate: 13, dmg: 0.85, spread: 0.025, push: 5, sever: 0.15, headKill: 0.22, kick: 0.045, snd: 0.8 },
  { name: "Glock 17", sprite: SPRITE_GLOCK, grip: [4, 6], muzzle: [18, 2.5], mag: 17, reload: 1.4, climb: 0.07, auto: false, rate: 6, dmg: 0.65, spread: 0.015, push: 3.5, sever: 0.05, headKill: 0.12, kick: 0.03, snd: 0.6 },
];
let tracers = [], flashes = [], sparks = [];

// The gun is an object in the room. It points where you aim, kicks back on
// every shot and climbs a little during long bursts.
const gunFlip = () => (Math.cos(state.gunAng) < 0 ? -1 : 1);
function gunPose() {
  const k = state.kick * 5, a = state.gunAng;
  return [state.gunX - Math.cos(a) * k, state.gunY - Math.sin(a) * k, a - state.climb * gunFlip()];
}

function aimAt(x, y) {
  if (Math.hypot(x - state.gunX, y - state.gunY) > 8) state.gunAng = Math.atan2(y - state.gunY, x - state.gunX);
  state.aimX = x; state.aimY = y;
}

function muzzlePoint(px0, py0, ang, wp) {
  const flip = Math.cos(ang) < 0 ? -1 : 1;
  const u = (wp.muzzle[0] - wp.grip[0]) * PIX, v = (wp.muzzle[1] - wp.grip[1]) * PIX * flip;
  return [px0 + Math.cos(ang) * u - Math.sin(ang) * v, py0 + Math.sin(ang) * u + Math.cos(ang) * v];
}

// First doll part along a ray: [doll, part, distance].
const RANGE = 1100;
function dollOnRay(ox, oy, dx, dy) {
  let hitD = null, hitK = -1, hitT = RANGE;
  for (const d of state.dolls) {
    for (let k = 0; k < PART_COUNT; k++) {
      if (d.gone[k]) continue;
      let ax = d.x[d.pa[k]], ay = d.y[d.pa[k]], bx = d.x[d.pb[k]], by = d.y[d.pb[k]];
      let r = (TAPER[k][0] + TAPER[k][1]) / 2;
      if (k === HEAD) { ax = bx; ay = by; r = HEAD_R; }
      const res = segSeg(ox, oy, ox + dx * RANGE, oy + dy * RANGE, ax, ay, bx, by);
      if (res.d > r) continue;
      const along = (res.qx - ox) * dx + (res.qy - oy) * dy - Math.sqrt(Math.max(0, r * r - res.d * res.d));
      if (along > 0 && along < hitT) { hitT = along; hitD = d; hitK = k; }
    }
  }
  return [hitD, hitK, hitT];
}

// Direction from the muzzle to the aim point, lifted by the recoil climb.
function aimDir(ox, oy, ang) {
  const aim = Math.hypot(state.aimX - ox, state.aimY - oy) > 6 ? Math.atan2(state.aimY - oy, state.aimX - ox) : ang;
  return aim - state.climb * gunFlip();
}

function fire() {
  const wp = WEAPONS[state.weapon];
  state.ammo[state.weapon]--;
  const [px0, py0, ang] = gunPose();
  const [ox, oy] = muzzlePoint(px0, py0, ang, wp);
  const a = aimDir(ox, oy, ang) + rf(-wp.spread, wp.spread);
  const dx = Math.cos(a), dy = Math.sin(a);
  const [hitD, hitK, hitT] = dollOnRay(ox, oy, dx, dy);
  // Walls, ice and water along the ray
  let endT = hitT, wall = false;
  for (let t = 4; t < hitT; t += 2) {
    const x = ox + dx * t, y = oy + dy * t, m = matAt(x, y);
    if (m === WALL || m === ICE) {
      endT = t; wall = true;
      if (m === ICE) {
        for (let n = 0; n < 10; n++) {
          const ix = Math.floor(x + rf(-4, 4)), iy = Math.floor(y + rf(-4, 4));
          if (getMat(ix, iy) === ICE) { setCell(ix, iy, EMPTY); spawnParticle(ix, iy, rf(-80, 80) - dx * 120, rf(-160, -40), WATER, 0); }
        }
      }
      break;
    }
    if ((m === WATER || m === BLOOD) && Math.random() < 0.25) splash(x, y, dx * 600, dy * 600);
  }
  const ex = ox + dx * endT, ey = oy + dy * endT;
  if (!wall && hitD) { hitD.shot(hitK, ex, ey, dx, dy, wp); state.selected = hitD; }
  if (wall) for (let n = 0; n < 6; n++) sparks.push({ x: ex - dx * 2, y: ey - dy * 2, vx: -dx * rf(60, 220) + rf(-90, 90), vy: -dy * rf(60, 220) - rf(30, 160), life: rf(0.15, 0.35) });
  tracers.push({ ax: ox, ay: oy, bx: ex, by: ey, age: 0 });
  flashes.push({ x: ox, y: oy, ang, age: 0 });
  // Casing flies out of the side and bounces on the floor.
  const back = Math.cos(ang) < 0 ? 1 : -1;
  spawnGib(px0, py0 - 4, back * rf(60, 140), rf(-260, -160), false, true);
  state.shake = Math.max(state.shake, wp.kick);
  state.kick = 1;
  state.climb = Math.min(0.3, state.climb + wp.climb);
  gunSound(wp.snd);
}

// Short metallic clicks for an empty gun and for reloading.
function clickSound(freq, vol = 0.12) {
  if (!settings.sound) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const o = audio.createOscillator(), g = audio.createGain(), t = audio.currentTime;
    o.type = "square"; o.frequency.value = freq;
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
    o.connect(g); g.connect(audio.destination); o.start(t); o.stop(t + 0.06);
  } catch (e) { /* sound is optional */ }
}

// ----------------------------------------------------------- gun controls

// Drag in the room to aim, the red button fires, the round button reloads.
// The fire button has its own finger, so you can aim and shoot at once.
const FIRE_BTN = { x: W - 64, y: 336, r: 32 };
const RELOAD_BTN = { x: W - 140, y: 349, r: 20 };
const MODE_BTN = { x: W - 172, y: 304, w: 60, h: 24 };
const inCircle = (b, x, y, pad = 4) => Math.hypot(x - b.x, y - b.y) < b.r + pad;
const inModeBtn = (x, y) => x >= MODE_BTN.x && x < MODE_BTN.x + MODE_BTN.w && y >= MODE_BTN.y && y < MODE_BTN.y + MODE_BTN.h;
const gunUi = () => state.screen === "game" && state.tool === T_GUN;
function gunButtonAt(x, y) {
  if (!gunUi()) return null;
  if (inCircle(FIRE_BTN, x, y)) return "fire";
  if (inCircle(RELOAD_BTN, x, y)) return "reload";
  if (inModeBtn(x, y)) return "mode";
  return null;
}
const modeAuto = () => WEAPONS[state.weapon].auto && state.autoMode[state.weapon];

function startReload() {
  const wp = WEAPONS[state.weapon];
  if (state.reloadT > 0 || state.ammo[state.weapon] >= wp.mag) return;
  state.reloadT = wp.reload;
  state.triggerDown = false;
  clickSound(520);
  // The empty magazine drops out under the gun.
  const [px0, py0, ang] = gunPose();
  spawnGib(px0 + Math.cos(ang) * 14, py0 + 10, rf(-30, 30), rf(-60, 0), false, true, true);
}

function pullTrigger() {
  state.triggerDown = true;
  if (state.reloadT > 0) return;
  if (state.ammo[state.weapon] <= 0) {
    clickSound(1400, 0.08);
    state.toast = 1.2; state.toastText = "Leer. Nachladen!";
    state.emptyFlash = 1;
    return;
  }
  fire();
  state.fireCd = 1 / WEAPONS[state.weapon].rate;
}

function gunButtonPress(b) {
  pop(b);
  if (b === "fire") pullTrigger();
  else if (b === "reload") startReload();
  else if (b === "mode") {
    const wp = WEAPONS[state.weapon];
    if (!wp.auto) { state.toast = 1; state.toastText = "Nur Einzelfeuer"; return; }
    state.autoMode[state.weapon] = !state.autoMode[state.weapon];
    clickSound(900, 0.06);
    state.toast = 1; state.toastText = state.autoMode[state.weapon] ? "Dauerfeuer" : "Einzelfeuer";
  }
}

function gunStep() {
  const wp = WEAPONS[state.weapon];
  if (state.tool !== T_GUN) state.triggerDown = false;
  if (state.reloadT > 0) {
    state.reloadT -= DT;
    if (state.reloadT <= 0) { state.reloadT = 0; state.ammo[state.weapon] = wp.mag; clickSound(700); }
  }
  if (state.triggerDown && modeAuto() && state.reloadT <= 0) {
    state.fireCd -= DT;
    while (state.fireCd <= 0 && state.ammo[state.weapon] > 0) { fire(); state.fireCd += 1 / wp.rate; }
    if (state.ammo[state.weapon] <= 0 && state.fireCd <= 0) { state.triggerDown = false; clickSound(1400, 0.08); state.emptyFlash = 1; }
  }
  state.kick = Math.max(0, state.kick - DT * 14);
  state.climb = moveToward(state.climb, 0, (state.triggerDown ? 0.15 : 0.9) * DT);
  state.emptyFlash = Math.max(0, state.emptyFlash - DT * 2);
}

// Red laser from the muzzle until it meets a wall or a body.
function drawLaser() {
  if (state.tool !== T_GUN || state.gunDrag) return;
  const wp = WEAPONS[state.weapon];
  const [px0, py0, ang] = gunPose();
  const [ox, oy] = muzzlePoint(px0, py0, ang, wp);
  const a = aimDir(ox, oy, ang), dx = Math.cos(a), dy = Math.sin(a);
  const hitT = dollOnRay(ox, oy, dx, dy)[2];
  let t = 4;
  for (; t < hitT; t += 2) {
    const x = ox + dx * t, y = oy + dy * t;
    if (x < 0 || x >= W || y < 0 || y >= H || solidAt(x, y)) break;
  }
  t = Math.min(t, hitT);
  const ex = ox + dx * t, ey = oy + dy * t;
  const g = ctx.createLinearGradient(ox, oy, ex, ey);
  g.addColorStop(0, "rgba(255,40,40,0.55)"); g.addColorStop(1, "rgba(255,40,40,0.25)");
  ctx.strokeStyle = g; ctx.lineWidth = 0.9;
  ctx.beginPath(); ctx.moveTo(ox, oy); ctx.lineTo(ex, ey); ctx.stroke();
  const glow = ctx.createRadialGradient(ex, ey, 0, ex, ey, 7);
  glow.addColorStop(0, "rgba(255,70,60,0.9)"); glow.addColorStop(1, "rgba(255,30,30,0)");
  ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(ex, ey, 7, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "#ffd0c8"; ctx.beginPath(); ctx.arc(ex, ey, 1.3, 0, Math.PI * 2); ctx.fill();
}

function drawGunControls() {
  if (!gunUi()) return;
  const a = easeOut(state.toolT / 0.25);
  ctx.save(); ctx.globalAlpha *= a; ctx.translate((1 - a) * 16, 0);
  drawGunControlsBody();
  ctx.restore();
}
function drawGunControlsBody() {
  const wp = WEAPONS[state.weapon], ammo = state.ammo[state.weapon], now = performance.now();
  // Fire button with the magazine as a ring around it
  const f = FIRE_BTN, down = state.triggerDown;
  ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 5, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(15,15,19,0.88)"; ctx.fill();
  const frac = tween("ammoRing", state.reloadT > 0 ? 1 - state.reloadT / wp.reload : ammo / wp.mag, 24);
  const fk = tween("fireDown", down ? 1 : 0, 32);
  ctx.lineCap = "butt"; ctx.lineWidth = 4;
  ctx.strokeStyle = "#2c2c34"; ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 1.5, 0, Math.PI * 2); ctx.stroke();
  ctx.strokeStyle = state.reloadT > 0 ? "#e6c850" : ammo / wp.mag < 0.25 ? "#ff5040" : "#ecece6";
  ctx.beginPath(); ctx.arc(f.x, f.y, f.r + 1.5, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * frac); ctx.stroke();
  const rg = ctx.createRadialGradient(f.x - 8, f.y - 10, 4, f.x, f.y, f.r);
  rg.addColorStop(0, down ? "#ff6a5a" : "#e8443a"); rg.addColorStop(1, down ? "#9a1a14" : "#7c1410");
  ctx.beginPath(); ctx.arc(f.x, f.y + 1.5 * fk, f.r - 3 - 2.5 * fk, 0, Math.PI * 2); ctx.fillStyle = rg; ctx.fill();
  ctx.strokeStyle = "rgba(255,255,255,0.18)"; ctx.lineWidth = 1.2; ctx.stroke();
  // Crosshair mark and the round count
  const cy = f.y + 1.5 * fk;
  label(state.reloadT > 0 ? "..." : String(ammo), f.x, cy - 3, 20, "#fff4ec", "center");
  label(state.reloadT > 0 ? "LÄDT" : "FEUER", f.x, cy + 15, 8, "rgba(255,240,230,0.85)", "center");
  // Reload button with a magazine icon, pulses when the gun is empty
  const rs = popScale("reload", 0.12);
  ctx.save(); ctx.translate(RELOAD_BTN.x, RELOAD_BTN.y); ctx.scale(rs, rs); ctx.translate(-RELOAD_BTN.x, -RELOAD_BTN.y);
  const r = RELOAD_BTN, empty = ammo <= 0 && state.reloadT <= 0;
  const pulse = empty ? 0.5 + 0.5 * Math.sin(now * 0.012) : 0;
  ctx.beginPath(); ctx.arc(r.x, r.y, r.r, 0, Math.PI * 2);
  ctx.fillStyle = empty ? css(mixc(hex("#26262c"), hex("#8a6a10"), pulse)) : "rgba(15,15,19,0.88)"; ctx.fill();
  ctx.strokeStyle = empty || state.emptyFlash > 0 ? "#e6c850" : "#3e3e46"; ctx.lineWidth = 1.6; ctx.stroke();
  if (state.reloadT > 0) {
    ctx.strokeStyle = "#e6c850"; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(r.x, r.y, r.r - 3, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * (1 - state.reloadT / wp.reload)); ctx.stroke();
  }
  ctx.save(); ctx.translate(r.x, r.y - 3); ctx.rotate(0.18);
  ctx.fillStyle = "#cfcfd6"; rr(-5, -9, 10, 15, 2); ctx.fill();
  ctx.fillStyle = "#e6c850"; rr(-3.5, -12, 7, 4, 1.5); ctx.fill();
  ctx.fillStyle = "#26262c"; for (let n = 0; n < 3; n++) ctx.fillRect(-3.5, -5 + n * 4, 7, 1.2);
  ctx.restore();
  label("LADEN", r.x, r.y + 13, 7, "#8e8e98", "center");
  ctx.restore();
  // Fire mode selector
  const ms = popScale("mode", 0.1);
  ctx.save(); ctx.translate(MODE_BTN.x + MODE_BTN.w / 2, MODE_BTN.y + MODE_BTN.h / 2); ctx.scale(ms, ms); ctx.translate(-MODE_BTN.x - MODE_BTN.w / 2, -MODE_BTN.y - MODE_BTN.h / 2);
  const m = MODE_BTN, auto = modeAuto();
  rr(m.x, m.y, m.w, m.h, 13);
  ctx.fillStyle = "rgba(15,15,19,0.88)"; ctx.fill();
  ctx.strokeStyle = wp.auto ? "#4c4c56" : "#2c2c34"; ctx.lineWidth = 1.4; ctx.stroke();
  label(auto ? "AUTO" : "EINZEL", m.x + m.w / 2, m.y + m.h / 2 + 1, 10, wp.auto ? (auto ? "#ff7a5a" : "#ecece6") : "#5a5a64", "center");
  ctx.restore();
}

let audio = null;
function gunSound(power) {
  if (!settings.sound) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const n = Math.floor(audio.sampleRate * 0.16), buf = audio.createBuffer(1, n, audio.sampleRate), ch = buf.getChannelData(0);
    for (let i = 0; i < n; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, 3.5);
    const src = audio.createBufferSource(); src.buffer = buf;
    const f = audio.createBiquadFilter(); f.type = "lowpass"; f.frequency.value = 900 + power * 1400;
    const g = audio.createGain(); g.gain.value = 0.18 + power * 0.18;
    src.connect(f); f.connect(g); g.connect(audio.destination); src.start();
  } catch (e) { /* sound is optional */ }
}

function rasterGun() {
  const wp = WEAPONS[state.weapon];
  const [px0, py0, ang] = gunPose();
  const cx = px0 / PIX, cy = py0 / PIX, ca = Math.cos(ang), sa = Math.sin(ang), flip = ca < 0 ? -1 : 1;
  const rows = wp.sprite, R = rows[0].length + 2;
  const put = (x, y, c) => { if (x >= 0 && y >= 0 && x < DW && y < DH) { const o = (y * DW + x) * 4; ppx[o] = c[0]; ppx[o + 1] = c[1]; ppx[o + 2] = c[2]; ppx[o + 3] = 255; } };
  const sample = (x, y) => {
    const ex = x + 0.5 - cx, ey = y + 0.5 - cy;
    const u = ex * ca + ey * sa + wp.grip[0], v = (-ex * sa + ey * ca) * flip + wp.grip[1];
    const iu = Math.floor(u), iv = Math.floor(v);
    if (iv < 0 || iv >= rows.length || iu < 0 || iu >= rows[0].length) return null;
    const ch = rows[iv][iu];
    return ch === "." ? null : GUN_COLORS[ch];
  };
  for (let y = Math.floor(cy - R); y <= Math.ceil(cy + R); y++) {
    for (let x = Math.floor(cx - R); x <= Math.ceil(cx + R); x++) {
      const c = sample(x, y);
      if (c) put(x, y, c);
      else if (sample(x - 1, y) || sample(x + 1, y) || sample(x, y - 1) || sample(x, y + 1)) put(x, y, PX_BLACK);
    }
  }
}

const ctxH = () => (state.tool === T_GUN ? 60 : 36);
// Sits top left under the title, so it never covers the floor where dolls stand.
const ctxY = () => 66;
function ctxItems() {
  if (state.tool === T_WATER) return [1, 2, 3, 4, 5].map((n) => ({ kind: "water", n, w: 34, label: String(n) }));
  if (state.tool === T_GUN) return WEAPONS.map((wp, n) => ({ kind: "gun", n, w: 104, label: wp.name.toUpperCase() }));
  return [];
}
function ctxLayout() {
  const items = ctxItems();
  if (!items.length) return null;
  const head = state.tool === T_WATER ? 70 : 0, gap = 6;
  const total = head + items.reduce((a, it) => a + it.w, 0) + gap * (items.length - 1) + 16;
  let x = 14 + 8 + head;
  for (const it of items) { it.x = x; x += it.w + gap; }
  return { items, x0: 14, total, head };
}
function ctxHit(x, y) {
  const l = ctxLayout();
  if (!l || y < ctxY() || y > ctxY() + ctxH()) return null;
  if (x < l.x0 || x > l.x0 + l.total) return null;
  return l.items.find((it) => x >= it.x - 3 && x <= it.x + it.w + 3) || { kind: "bar" };
}
// A sprite with a thin light rim, for dark guns on dark buttons.
function drawSpriteOutlined(rows, x, y, z, alpha = 1) {
  const prev = ctx.globalAlpha, o = Math.max(0.8, z * 0.7);
  ctx.globalAlpha = prev * alpha * 0.55;
  ctx.fillStyle = "#9a9aa6";
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) if (rows[r][c] !== ".") ctx.fillRect(x + c * z - o, y + r * z - o, z + o * 2, z + o * 2);
  }
  ctx.globalAlpha = prev;
  drawSprite(rows, x, y, z, alpha);
}

// A weapon sprite drawn as crisp blocks for menus and buttons.
function drawSprite(rows, x, y, z, alpha = 1) {
  const prev = ctx.globalAlpha;
  ctx.globalAlpha = prev * alpha;
  for (let r = 0; r < rows.length; r++) {
    for (let c = 0; c < rows[r].length; c++) {
      const ch = rows[r][c];
      if (ch === ".") continue;
      ctx.fillStyle = css(GUN_COLORS[ch]);
      ctx.fillRect(x + c * z, y + r * z, z + 0.05, z + 0.05);
    }
  }
  ctx.globalAlpha = prev;
}

function drawContextBar() {
  const l = ctxLayout();
  if (!l) return;
  const a = easeOut(state.toolT / 0.22);
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, -(1 - a) * 8);
  drawContextBarBody(l);
  ctx.restore();
}
function drawContextBarBody(l) {
  const y = ctxY(), CTX_H = ctxH();
  rr(l.x0, y, l.total, CTX_H, 12);
  ctx.fillStyle = "rgba(15,15,19,0.92)"; ctx.fill();
  ctx.strokeStyle = "#383840"; ctx.lineWidth = 1.5; ctx.stroke();
  if (l.head) label("MENGE", l.x0 + 12, y + CTX_H / 2 + 1, 12, "#8e8e98");
  for (const it of l.items) {
    const isOn = it.kind === "water" ? it.n <= state.waterLevel : it.n === state.weapon;
    const k = tween("cx" + it.kind + it.n, isOn ? 1 : 0, 18), on = k > 0.5;
    const ps = popScale("cx" + it.kind + it.n, 0.08);
    ctx.save(); ctx.translate(it.x + it.w / 2, y + CTX_H / 2); ctx.scale(ps, ps); ctx.translate(-(it.x + it.w / 2), -(y + CTX_H / 2));
    rr(it.x, y + 6, it.w, CTX_H - 12, 8);
    ctx.fillStyle = css(mixc(hex("#24242a"), hex(it.kind === "water" ? "#3c82e6" : "#3a3a44"), k)); ctx.fill();
    ctx.strokeStyle = it.kind === "gun" ? css(mixc(hex("#3e3e46"), hex("#ecece6"), k)) : "#3e3e46"; ctx.lineWidth = 1.5; ctx.stroke();
    if (it.kind === "gun") {
      const sp = WEAPONS[it.n].sprite, z = Math.min(2.2, (it.w - 16) / sp[0].length);
      drawSprite(sp, it.x + it.w / 2 - sp[0].length * z / 2, y + 30 - sp.length * z / 2 - 4, z, 0.45 + 0.55 * k);
      label(it.label, it.x + it.w / 2, y + CTX_H - 15, 9, on ? "#f2f2ec" : "#6a6a74", "center");
    } else {
      label(it.label, it.x + it.w / 2, y + CTX_H / 2 + 1, 11, on ? "#f2f2ec" : "#6a6a74", "center");
    }
    ctx.restore();
  }
}

const DMG_STOPS = [

function damageColors(v) {
  for (let i = 1; i < DMG_STOPS.length; i++) {
    const [a, la, da] = DMG_STOPS[i - 1], [b, lb, db] = DMG_STOPS[i];
    if (v <= b) { const t = (v - a) / (b - a); return [mixc(la, lb, t), mixc(da, db, t)]; }
  }
  return [DMG_STOPS[3][1], DMG_STOPS[3][2]];
}

// Chart shapes as rectangles [x, y, w, h] around the chart center: square head
// on a neck, shoulders on the torso, arms beside it, legs below the pelvis.
// The doll's left side sits on the right of the chart, as when facing someone.
const CHART = {
  [HEAD]: [-9, -71, 18, 20], [TORSO]: [-15, -45, 30, 34], [PELVIS]: [-14, -10, 28, 15],
  [UARM_R]: [-24.5, -44, 8.5, 28], [LARM_R]: [-24, -15, 7.5, 24],
  [UARM_L]: [16, -44, 8.5, 28], [LARM_L]: [16.5, -15, 7.5, 24],
  [THIGH_R]: [-13.5, 6, 12.5, 31], [SHIN_R]: [-13, 38, 11.5, 26], [FOOT_R]: [-16, 65, 15, 6],
  [THIGH_L]: [1, 6, 12.5, 31], [SHIN_L]: [1.5, 38, 11.5, 26], [FOOT_L]: [1, 65, 15, 6],
};

function chartPath(k, cx, cy, s) {
  const [rx, ry, rw, rh] = CHART[k];
  ctx.beginPath();
  ctx.roundRect ? ctx.roundRect(cx + rx * s, cy + ry * s, rw * s, rh * s, 2 * s) : ctx.rect(cx + rx * s, cy + ry * s, rw * s, rh * s);
  if (k === HEAD) ctx.rect(cx - 4 * s, cy - 51.5 * s, 8 * s, 7 * s);
  if (k === LARM_L || k === LARM_R) ctx.rect(cx + (rx + 0.5) * s, cy + (ry + rh + 0.8) * s, (rw - 1) * s, 6.5 * s);
}

// Organs on the chart, drawn as small anatomical shapes in chart units.
// The doll's left side is on the right of the chart, as when facing someone.
const ORGAN_COLOR = {
  brain: "#f0bcc8", lungL: "#f0a2b0", lungR: "#f0a2b0", heart: "#c8283c",
  liver: "#922c2c", stomach: "#e6ae8e", kidneys: "#a2343a", gut: "#e8aaa6",
};
// Where the red X sits on a destroyed organ: [x, y, size].
const ORGAN_MARK = {
  brain: [[0, -62, 4.5]], lungL: [[7.5, -34, 4]], lungR: [[-7.5, -34, 4]], heart: [[2.5, -29.5, 3]],
  liver: [[-5, -19.5, 3.5]], stomach: [[7, -18, 3]], kidneys: [[-6.5, -6, 2.2], [6.5, -6, 2.2]], gut: [[0, 1, 4]],
};
const ORGAN_DRAW = {
  brain(c, dk) {
    // Two hemispheres seen from the front, folds and the brain stem below.
    ctx.beginPath();
    ctx.moveTo(0, -68.5);
    ctx.bezierCurveTo(4, -69.5, 7.6, -67, 7.4, -62.5);
    ctx.bezierCurveTo(7.3, -58.5, 5, -56.4, 2, -56.8);
    ctx.lineTo(-2, -56.8);
    ctx.bezierCurveTo(-5, -56.4, -7.3, -58.5, -7.4, -62.5);
    ctx.bezierCurveTo(-7.6, -67, -4, -69.5, 0, -68.5);
    ctx.closePath();
    ctx.fillStyle = c; ctx.fill();
    ctx.fillStyle = dk; rr(-1, -57.4, 2, 3, 0.8); ctx.fill();
    ctx.strokeStyle = dk; ctx.lineWidth = 0.45; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -68.4); ctx.lineTo(0, -57);
    for (const sx of [-1, 1]) {
      ctx.moveTo(sx * 1.6, -66.5); ctx.quadraticCurveTo(sx * 4, -67.5, sx * 5.6, -65);
      ctx.moveTo(sx * 1.4, -63.5); ctx.quadraticCurveTo(sx * 3.5, -61.8, sx * 6.4, -62.6);
      ctx.moveTo(sx * 1.8, -60); ctx.quadraticCurveTo(sx * 4, -61, sx * 5.4, -58.8);
    }
    ctx.stroke();
  },
  lungR(c, dk) { drawLung(-1, c, dk); },
  lungL(c, dk) { drawLung(1, c, dk); },
  heart(c, dk) {
    // Vessels on top, then the heart with its apex toward the doll's left.
    ctx.lineCap = "round";
    ctx.strokeStyle = "#5a6ec8"; ctx.lineWidth = 1.3;
    ctx.beginPath(); ctx.moveTo(1, -32.5); ctx.quadraticCurveTo(0.5, -35.5, -1.5, -36); ctx.stroke();
    ctx.strokeStyle = c; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(2.8, -32.5); ctx.bezierCurveTo(2.6, -37.5, 6.4, -37.5, 6, -33.5); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(-0.8, -32);
    ctx.bezierCurveTo(1.5, -34.2, 5.5, -33.8, 6.4, -30.5);
    ctx.bezierCurveTo(7, -28, 6, -26, 4.2, -24.6);
    ctx.quadraticCurveTo(1, -26.2, -0.8, -28.8);
    ctx.quadraticCurveTo(-1.6, -30.5, -0.8, -32);
    ctx.closePath();
    ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = dk; ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.moveTo(2.2, -32.6); ctx.quadraticCurveTo(3.6, -29, 4, -25.4); ctx.stroke();
    ctx.fillStyle = "rgba(255,255,255,0.28)"; ctx.beginPath(); ctx.ellipse(1.4, -31.4, 1.3, 0.8, -0.4, 0, Math.PI * 2); ctx.fill();
  },
  liver(c, dk) {
    // Big right lobe, thin left lobe, gallbladder underneath.
    ctx.beginPath();
    ctx.moveTo(-13, -23.5);
    ctx.bezierCurveTo(-8, -25.5, 0, -25, 4.5, -22.5);
    ctx.quadraticCurveTo(5, -21.5, 3.5, -21);
    ctx.bezierCurveTo(-1, -19.5, -4, -17, -7, -15);
    ctx.bezierCurveTo(-10.5, -13.5, -13.6, -15.5, -13.6, -19);
    ctx.quadraticCurveTo(-13.8, -22, -13, -23.5);
    ctx.closePath();
    ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = dk; ctx.lineWidth = 0.4;
    ctx.beginPath(); ctx.moveTo(-3, -24.3); ctx.quadraticCurveTo(-3.6, -21, -5.5, -17.5); ctx.stroke();
    ctx.fillStyle = "#6e9a46"; ctx.beginPath(); ctx.ellipse(-6.8, -15.6, 1.1, 1.6, 0.3, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,255,255,0.18)"; ctx.beginPath(); ctx.ellipse(-9, -21.5, 3, 1, -0.2, 0, Math.PI * 2); ctx.fill();
  },
  stomach(c, dk) {
    // J-shaped bag from the gullet down to the exit on the right.
    ctx.lineCap = "round"; ctx.strokeStyle = c; ctx.lineWidth = 1.1;
    ctx.beginPath(); ctx.moveTo(3.2, -25); ctx.lineTo(4.4, -22.4); ctx.stroke();
    ctx.beginPath();
    ctx.moveTo(4, -23);
    ctx.bezierCurveTo(8, -24.5, 12, -22.5, 11.6, -18.5);
    ctx.bezierCurveTo(11.2, -14.5, 7, -13, 3.6, -14);
    ctx.quadraticCurveTo(1.2, -14.8, 0.8, -16.2);
    ctx.lineTo(2.2, -16.8);
    ctx.quadraticCurveTo(4.5, -16, 6.4, -16.6);
    ctx.bezierCurveTo(8, -17.4, 7.4, -20, 4.6, -20.5);
    ctx.quadraticCurveTo(3.4, -21.5, 4, -23);
    ctx.closePath();
    ctx.fillStyle = c; ctx.fill();
    ctx.strokeStyle = dk; ctx.lineWidth = 0.35;
    ctx.beginPath(); ctx.moveTo(8, -21.6); ctx.quadraticCurveTo(10, -19, 8.6, -15.6); ctx.moveTo(6.4, -22.2); ctx.quadraticCurveTo(9.2, -20, 9.6, -17.4); ctx.stroke();
  },
  kidneys(c, dk) {
    // Two beans with the dent toward the spine and a short ureter.
    for (const sx of [-1, 1]) {
      const x = sx * 6.5;
      ctx.beginPath();
      ctx.moveTo(x - sx * 0.6, -9.6);
      ctx.bezierCurveTo(x + sx * 3.2, -10.2, x + sx * 3.4, -2.6, x - sx * 0.6, -3.2);
      ctx.bezierCurveTo(x - sx * 2.6, -3.4, x - sx * 1.4, -5.4, x - sx * 1, -6.4);
      ctx.bezierCurveTo(x - sx * 1.4, -7.4, x - sx * 2.6, -9.4, x - sx * 0.6, -9.6);
      ctx.closePath();
      ctx.fillStyle = c; ctx.fill();
      ctx.strokeStyle = "#e8d070"; ctx.lineWidth = 0.4;
      ctx.beginPath(); ctx.moveTo(x - sx * 1, -6); ctx.quadraticCurveTo(x - sx * 2.5, -3, x - sx * 2.2, 0); ctx.stroke();
      ctx.fillStyle = "rgba(255,255,255,0.22)"; ctx.beginPath(); ctx.ellipse(x + sx * 0.8, -7.4, 0.9, 0.6, 0, 0, Math.PI * 2); ctx.fill();
    }
  },
  gut(c, dk) {
    // Large bowel as a frame, small bowel coiled inside.
    ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.strokeStyle = dk; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-11, 3.8); ctx.lineTo(-11, -0.8); ctx.quadraticCurveTo(-11, -2, -9.5, -2); ctx.lineTo(9.5, -2); ctx.quadraticCurveTo(11, -2, 11, -0.8); ctx.lineTo(11, 3.2); ctx.quadraticCurveTo(8.5, 4.6, 4.5, 4.2); ctx.stroke();
    ctx.strokeStyle = c; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(-8, 0);
    for (let k = 0; k < 4; k++) ctx.quadraticCurveTo(-6 + k * 4, -1.2 + (k % 2) * 3.4, -4 + k * 4, 0.3 + (k % 2) * 0.4);
    ctx.moveTo(-7.6, 2.6);
    for (let k = 0; k < 4; k++) ctx.quadraticCurveTo(-5.6 + k * 3.8, 3.8 - (k % 2) * 2.8, -3.6 + k * 3.8, 2.6 - (k % 2) * 0.3);
    ctx.stroke();
  },
};
function drawLung(side, c, dk) {
  // side 1: the doll's left lung on the chart's right, with the notch for the heart.
  const x = (v) => side * v;
  ctx.beginPath();
  ctx.moveTo(x(4.5), -43);
  ctx.bezierCurveTo(x(8.5), -43.2, x(12.8), -37, x(12.6), -29);
  ctx.quadraticCurveTo(x(12.6), -25.4, x(10.5), -25.2);
  ctx.quadraticCurveTo(x(6.5), -25.2, x(2.8), -26.6);
  if (side > 0) { ctx.quadraticCurveTo(x(6.4), -29, x(6.6), -32.4); ctx.quadraticCurveTo(x(3), -33.4, x(2.4), -36.5); }
  else ctx.quadraticCurveTo(x(1.6), -32, x(2.2), -37);
  ctx.quadraticCurveTo(x(2.6), -42.4, x(4.5), -43);
  ctx.closePath();
  ctx.fillStyle = c; ctx.fill();
  // Lobe line and bronchi
  ctx.strokeStyle = dk; ctx.lineWidth = 0.4; ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x(4.5), -35); ctx.quadraticCurveTo(x(8.5), -33, x(11.8), -28.4); ctx.stroke();
  ctx.strokeStyle = "rgba(255,240,240,0.65)"; ctx.lineWidth = 0.5;
  ctx.beginPath(); ctx.moveTo(x(1), -40); ctx.lineTo(x(4), -36.4); ctx.lineTo(x(6.5), -32);
  ctx.moveTo(x(4), -36.4); ctx.lineTo(x(7.6), -37.4); ctx.moveTo(x(6.5), -32); ctx.lineTo(x(9.4), -30.2); ctx.stroke();
}

function drawChartOrgans(d, cx, cy, s) {
  const now = performance.now() / 1000;
  ctx.save();
  ctx.translate(cx, cy); ctx.scale(s, s);
  // Windpipe between the lungs
  if (d.attached(TORSO)) {
    ctx.strokeStyle = "rgba(240,220,214,0.85)"; ctx.lineWidth = 1.1; ctx.lineCap = "round";
    ctx.beginPath(); ctx.moveTo(0, -47); ctx.lineTo(0, -40.5); ctx.moveTo(0, -40.5); ctx.lineTo(-1, -40); ctx.moveTo(0, -40.5); ctx.lineTo(1, -40); ctx.stroke();
  }
  // Back to front: the bowel lies behind the kidneys on this little chart.
  const order = ["brain", "lungR", "lungL", "heart", "liver", "stomach", "gut", "kidneys"];
  order.forEach((id) => {
    const n = ORGAN[id], o = ORGANS[n];
    if (!d.attached(o.part)) return;
    const hp = d.organ[n] / 100, base = hex(ORGAN_COLOR[o.id]);
    const c = mixc(hex("#2a1a1e"), base, 0.25 + 0.75 * hp);
    ctx.save();
    ctx.globalAlpha *= d.dead ? 0.6 : 1;
    // The heart beats on the chart while it works.
    if (o.id === "heart" && !d.arrest && !d.dead) {
      const k = 1 + d.beatFlash * 0.16;
      ctx.translate(2.5, -29.5); ctx.scale(k, k); ctx.translate(-2.5, 29.5);
    }
    ORGAN_DRAW[o.id](css(c), css(darken(c, 0.35)));
    ctx.restore();
    if (hp <= 0) {
      // Destroyed: a red X that pulses.
      const a = d.dead ? 0.6 : 0.55 + 0.45 * Math.sin(now * 6);
      ctx.strokeStyle = css(hex("#ff3040"), a); ctx.lineWidth = 0.9; ctx.lineCap = "round";
      for (const [mx, my, k] of ORGAN_MARK[o.id]) {
        ctx.beginPath(); ctx.moveTo(mx - k, my - k); ctx.lineTo(mx + k, my + k); ctx.moveTo(mx + k, my - k); ctx.lineTo(mx - k, my + k); ctx.stroke();
      }
    }
  });
  ctx.restore();
}

// One line under the chart: what is worst and how long the doll has left.
function drawOrganLine(d, x, y, w, h) {
  rr(x, y, w, h, 6); ctx.fillStyle = "#0a0a0d"; ctx.fill();
  let text, col;
  if (d.dead) { text = "TOD: " + (d.cause || "TOT"); col = "#e0303f"; }
  else {
    let worst = -1;
    ORGANS.forEach((o, n) => { if (d.attached(o.part) && d.organ[n] < 99 && (worst < 0 || d.organ[n] < d.organ[worst])) worst = n; });
    const eta = d.deathEta();
    if (worst < 0 && eta === Infinity) { text = "ORGANE OK"; col = "#4ccf5a"; }
    else {
      const o = worst >= 0 ? ORGANS[worst] : null, hp = o ? d.organ[worst] : 100;
      const organText = (n) => ORGANS[n].name + (d.organ[n] <= 0 ? " ZERSTÖRT" : " " + Math.round(d.organ[n]) + "%");
      let what = o ? organText(worst) : "BLUTVERLUST";
      // Name what really sets the time: the stopped heart, the lungs, water,
      // the bleeding organ, open wounds or the inflamed belly.
      if (d.etaWhy === "air") what = d.arrest ? "HERZSTILLSTAND" : d.headUnder ? "ERTRINKT" : "LUNGEN VERSAGEN";
      else if (d.etaWhy === "belly") what = "BAUCHFELLENTZÜNDUNG";
      else if (d.etaWhy === "blood") {
        let bleeder = -1;
        ORGANS.forEach((og, n) => { if (og.bleed > 0.1 && d.attached(og.part) && d.organ[n] < 100 && (bleeder < 0 || og.bleed * (100 - d.organ[n]) > ORGANS[bleeder].bleed * (100 - d.organ[bleeder]))) bleeder = n; });
        what = bleeder >= 0 && d.organBleed > d.woundBleed ? organText(bleeder) : "BLUTVERLUST";
      }
      if (eta < 3600) {
        text = what + " · " + (eta < 120 ? Math.ceil(eta) + "S" : Math.ceil(eta / 60) + " MIN");
        col = eta < 15 ? "#ff4050" : eta < 120 ? "#f08a24" : "#f2da3a";
      }
      else { text = what; col = hp <= 0 ? "#f08a24" : "#f2da3a"; }
    }
  }
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(x + 9, y + h / 2, 3, 0, Math.PI * 2); ctx.fill();
  label(text, x + 17, y + h / 2 + 0.5, 9, col);
}

// Where a wound sits on the chart, from its part and position along it.
function chartPoint(w) {
  const [rx, ry, rw, rh] = CHART[w.part];
  if (w.stump) {
    if (w.part === HEAD) return [0, -46];
    return w.t < 0.5 ? [rx + rw / 2, ry] : [rx + rw / 2, ry + rh];
  }
  if (w.part === HEAD) return [rx + rw / 2 + Math.cos(w.t * 6.28) * 5, ry + rh / 2 + Math.sin(w.t * 6.28) * 6];
  return [rx + rw / 2 + w.s * rw * 0.3, ry + rh * clamp(w.t, 0.08, 0.92)];
}

function drawBodyChart(d, x, y, w, h) {
  const s = h / 150, cx = x + w / 2, cy = y + h / 2 + 2 * s;
  const order = [TORSO, PELVIS, HEAD, UARM_R, LARM_R, UARM_L, LARM_L, THIGH_R, SHIN_R, FOOT_R, THIGH_L, SHIN_L, FOOT_L];
  ctx.lineJoin = "round";
  for (const k of order) {
    chartPath(k, cx, cy, s);
    if (!d.attached(k)) {
      // Missing part: only a faint dashed outline where it used to be.
      ctx.setLineDash([3, 3]); ctx.strokeStyle = "rgba(224,48,63,0.55)"; ctx.lineWidth = 1.2; ctx.stroke(); ctx.setLineDash([]);
      continue;
    }
    let [light, dark] = damageColors(d.dmg[k]);
    if (d.char[k] > 0.05) { light = mixc(light, COL_CHAR, d.char[k] * 0.8); dark = mixc(dark, COL_CHAR, d.char[k] * 0.8); }
    if (d.frozen) { light = mixc(light, COL_ICE, 0.5); dark = mixc(dark, COL_ICE, 0.5); }
    const g = ctx.createLinearGradient(x, y, x + w, y + h);
    g.addColorStop(0, css(light)); g.addColorStop(1, css(dark));
    ctx.fillStyle = g; ctx.fill();
    // A thin gap in the panel color separates every part from its neighbors.
    ctx.strokeStyle = "#0a0a0d"; ctx.lineWidth = 1.8; ctx.stroke();
  }
  drawChartOrgans(d, cx, cy, s);
  const now = performance.now() / 1000;
  for (const wd of d.wounds) {
    if (!d.attached(wd.part)) continue;
    const [wx, wy] = chartPoint(wd);
    drawWoundMark(wd, cx + wx * s, cy + wy * s, s * 1.2, now);
  }
}

// Irregular blob around a point, the same shape every frame for one wound.
function blobPath(x, y, r, seed, n = 7, rough = 0.35) {
  ctx.beginPath();
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2, q = r * (1 - rough / 2 + rough * (0.5 + 0.5 * Math.sin(seed * 7 + i * 2.3)));
    i ? ctx.lineTo(x + Math.cos(a) * q, y + Math.sin(a) * q) : ctx.moveTo(x + Math.cos(a) * q, y + Math.sin(a) * q);
  }
  ctx.closePath();
}

// A thin stream of blood running down from a wound, with a drop that grows and falls.
function drawDrip(x, y, s, bleed, seed, now) {
  const len = (3 + bleed * 7) * s, wob = Math.sin(seed * 3) * 0.8 * s;
  ctx.strokeStyle = "rgba(150,12,24,0.95)"; ctx.lineWidth = Math.max(0.8, 1.1 * s); ctx.lineCap = "round";
  ctx.beginPath(); ctx.moveTo(x, y); ctx.quadraticCurveTo(x + wob, y + len * 0.5, x + wob * 0.6, y + len); ctx.stroke();
  const ph = (now * (0.8 + bleed) + seed) % 1;
  ctx.fillStyle = "#b3141f";
  ctx.beginPath(); ctx.arc(x + wob * 0.6, y + len + ph * ph * 4 * s, (0.7 + ph * 0.6) * s, 0, Math.PI * 2); ctx.fill();
}

function drawWoundMark(w, x, y, s, now) {
  const seed = w.seed || w.rot * 9, big = w.size > 2 ? 1.25 : 1;
  if (w.stump) {
    // Torn flesh with the bone end in the middle
    blobPath(x, y, 3.6 * s, seed, 9, 0.5); ctx.fillStyle = "#7a0a16"; ctx.fill();
    blobPath(x, y, 2.6 * s, seed + 1, 8, 0.4); ctx.fillStyle = "#c8344c"; ctx.fill();
    ctx.fillStyle = "#ece6d4"; ctx.beginPath(); ctx.arc(x, y, 1.2 * s, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#b8ab90"; ctx.beginPath(); ctx.arc(x + 0.3 * s, y + 0.3 * s, 0.5 * s, 0, Math.PI * 2); ctx.fill();
    if (w.bleed > 0.05) drawDrip(x, y + 2.4 * s, s, w.bleed, seed, now);
    return;
  }
  if (w.kind === "cut") {
    // Slanted gash: dark core with swollen red edges
    const a = w.rot + 0.6, l = 3.4 * s * big, ux = Math.cos(a) * l, uy = Math.sin(a) * l;
    ctx.lineCap = "round";
    ctx.strokeStyle = "rgba(200,52,76,0.9)"; ctx.lineWidth = 2.2 * s;
    ctx.beginPath(); ctx.moveTo(x - ux, y - uy); ctx.lineTo(x + ux, y + uy); ctx.stroke();
    ctx.strokeStyle = "#3a0207"; ctx.lineWidth = 0.9 * s;
    ctx.beginPath(); ctx.moveTo(x - ux * 0.9, y - uy * 0.9); ctx.lineTo(x + ux * 0.9, y + uy * 0.9); ctx.stroke();
    if (w.bleed > 0.05) drawDrip(x + ux * 0.4, y + uy * 0.4 + 0.6 * s, s, w.bleed, seed, now);
    return;
  }
  if (w.kind === "shot") {
    // Bullet hole: bruised ring, red abrasion collar and a dark hole
    const r = 1.2 * s * big;
    blobPath(x, y, r * 2.6, seed, 8, 0.3); ctx.fillStyle = "rgba(110,30,60,0.35)"; ctx.fill();
    blobPath(x, y, r * 1.75, seed + 2, 7, 0.25); ctx.fillStyle = "#a8162a"; ctx.fill();
    ctx.fillStyle = "#1a0306"; ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "rgba(255,140,140,0.35)"; ctx.beginPath(); ctx.arc(x - r * 0.9, y - r * 0.9, r * 0.45, 0, Math.PI * 2); ctx.fill();
    if (w.bleed > 0.05) drawDrip(x, y + r, s, w.bleed, seed, now);
    return;
  }
  // Blunt hit: torn skin over a bruise
  blobPath(x, y, 3 * s * big, seed, 8, 0.45); ctx.fillStyle = "rgba(96,30,70,0.45)"; ctx.fill();
  blobPath(x, y, 1.7 * s * big, seed + 3, 7, 0.5); ctx.fillStyle = "#9c1626"; ctx.fill();
  if (w.bleed > 0.05) drawDrip(x, y + 1.2 * s, s, w.bleed, seed, now);
}

const LAMP_X = W / 2, LAMP_Y = 42;
const bgCan = document.createElement("canvas"), lightCan = document.createElement("canvas");

function buildStatic() {
  bgCan.width = lightCan.width = canvas.width;
  bgCan.height = lightCan.height = canvas.height;
  const b = bgCan.getContext("2d");
  b.setTransform(K, 0, 0, K, 0, 0);
  const th = MAPS[state.map].theme;
  const wall = b.createLinearGradient(0, 0, 0, FLOOR_Y);
  wall.addColorStop(0, th.wall[0]); wall.addColorStop(1, th.wall[1]);
  b.fillStyle = wall; b.fillRect(0, 0, W, FLOOR_Y);
  for (let x = 0; x < W; x += 96) {
    b.fillStyle = "rgba(255,255,255,0.018)"; b.fillRect(x + 4, 20, 88, FLOOR_Y - 36);
    b.fillStyle = th.line; b.fillRect(x, 16, 1.5, FLOOR_Y - 16);
    b.fillStyle = "rgba(255,255,255,0.03)"; b.fillRect(x + 1.5, 16, 1, FLOOR_Y - 16);
  }
  for (let y = 96; y < FLOOR_Y - 20; y += 80) { b.fillStyle = th.line; b.fillRect(0, y, W, 1.5); }
  b.fillStyle = "#111114"; b.fillRect(0, 0, W, 16);
  b.fillStyle = "#0a0a0c"; b.fillRect(0, 16, W, 1.5);
  // Pipes along the wall, a vent and a door frame give the room some depth.
  const pipe = (x0, y0, x1, y1, r) => {
    b.strokeStyle = "rgba(0,0,0,0.45)"; b.lineWidth = r * 2 + 2; b.lineCap = "butt";
    b.beginPath(); b.moveTo(x0, y0); b.lineTo(x1, y1); b.stroke();
    b.strokeStyle = th.line; b.lineWidth = r * 2; b.beginPath(); b.moveTo(x0, y0); b.lineTo(x1, y1); b.stroke();
    b.strokeStyle = "rgba(255,255,255,0.07)"; b.lineWidth = 1.2; b.beginPath(); b.moveTo(x0, y0 - r * 0.5); b.lineTo(x1, y1 - r * 0.5); b.stroke();
  };
  pipe(0, 150, W, 150, 4);
  pipe(W * 0.86, 150, W * 0.86, FLOOR_Y - 12, 4);
  for (let x = 40; x < W; x += 160) { b.fillStyle = "rgba(0,0,0,0.5)"; b.fillRect(x, 144, 8, 12); }
  b.fillStyle = "rgba(0,0,0,0.35)"; b.fillRect(W * 0.07, 200, 54, 30);
  b.fillStyle = "rgba(255,255,255,0.05)";
  for (let k = 0; k < 6; k++) b.fillRect(W * 0.07 + 4, 204 + k * 4.5, 46, 1.5);
  b.strokeStyle = "rgba(0,0,0,0.4)"; b.lineWidth = 3;
  b.strokeRect(W * 0.66, FLOOR_Y - 150, 70, 138); // tap it three times
  b.fillStyle = "rgba(0,0,0,0.18)"; b.fillRect(W * 0.66 + 2, FLOOR_Y - 148, 66, 134);
  b.fillStyle = "rgba(255,255,255,0.08)"; b.fillRect(W * 0.66 + 54, FLOOR_Y - 84, 8, 3);
  b.fillStyle = "#2a2a31"; b.fillRect(0, FLOOR_Y - 12, W, 12);
  b.fillStyle = "#3a3a42"; b.fillRect(0, FLOOR_Y - 12, W, 1.2);
  // Floor tiles
  const fl = b.createLinearGradient(0, FLOOR_Y, 0, H);
  fl.addColorStop(0, th.floor[0]); fl.addColorStop(1, th.floor[1]);
  b.fillStyle = fl; b.fillRect(0, FLOOR_Y, W, H - FLOOR_Y);
  b.fillStyle = th.edge; b.fillRect(0, FLOOR_Y, W, 2);
  b.fillStyle = "rgba(0,0,0,0.18)";
  for (let x = 0; x < W; x += 64) b.fillRect(x, FLOOR_Y + 2, 1.5, H - FLOOR_Y);
  b.fillRect(0, FLOOR_Y + 26, W, 1.5);
  let seed = 7;
  const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  for (let n = 0; n < 500; n++) {
    b.fillStyle = `rgba(0,0,0,${0.04 + rand() * 0.08})`;
    b.fillRect(rand() * W, FLOOR_Y + 3 + rand() * (H - FLOOR_Y - 3), 1 + rand() * 1.5, 1 + rand());
  }
  // Lamp
  b.strokeStyle = "#0b0b0d"; b.lineWidth = 1.6;
  b.beginPath(); b.moveTo(LAMP_X, 0); b.lineTo(LAMP_X, 26); b.stroke();
  const shadeG = b.createLinearGradient(0, 24, 0, 40);
  shadeG.addColorStop(0, "#5a5a64"); shadeG.addColorStop(1, "#2e2e35");
  b.fillStyle = shadeG;
  b.beginPath(); b.moveTo(LAMP_X - 5, 25); b.lineTo(LAMP_X + 5, 25); b.lineTo(LAMP_X + 20, 39); b.lineTo(LAMP_X - 20, 39); b.closePath(); b.fill();
  b.strokeStyle = "#0b0b0d"; b.lineWidth = 1.4; b.stroke();
  b.fillStyle = "#fff4d0"; b.beginPath(); b.ellipse(LAMP_X, 40.5, 6, 3, 0, 0, Math.PI * 2); b.fill();

  // Light: stacked cones give soft edges, plus a glow at the bulb and on the floor.
  const l = lightCan.getContext("2d");
  l.setTransform(K, 0, 0, K, 0, 0);
  for (let n = 0; n < 6; n++) {
    const spread = 0.42 + n * 0.035;
    const g = l.createLinearGradient(0, LAMP_Y, 0, FLOOR_Y + 20);
    g.addColorStop(0, `rgba(255,240,204,${0.05})`);
    g.addColorStop(1, `rgba(255,240,204,${0.012})`);
    l.fillStyle = g;
    l.beginPath();
    l.moveTo(LAMP_X - 14, LAMP_Y - 2); l.lineTo(LAMP_X + 14, LAMP_Y - 2);
    l.lineTo(LAMP_X + (FLOOR_Y - LAMP_Y) * spread, FLOOR_Y + 30);
    l.lineTo(LAMP_X - (FLOOR_Y - LAMP_Y) * spread, FLOOR_Y + 30);
    l.closePath(); l.fill();
  }
  const glow = l.createRadialGradient(LAMP_X, LAMP_Y, 0, LAMP_X, LAMP_Y, 60);
  glow.addColorStop(0, "rgba(255,240,204,0.5)"); glow.addColorStop(1, "rgba(255,240,204,0)");
  l.fillStyle = glow; l.fillRect(LAMP_X - 60, LAMP_Y - 60, 120, 120);
  l.save(); l.translate(LAMP_X, FLOOR_Y + 4); l.scale(1, 0.12);
  const spot = l.createRadialGradient(0, 0, 0, 0, 0, 170);
  spot.addColorStop(0, "rgba(255,240,204,0.35)"); spot.addColorStop(1, "rgba(255,240,204,0)");
  l.fillStyle = spot; l.beginPath(); l.arc(0, 0, 170, 0, Math.PI * 2); l.fill();
  l.restore();
  // Vignette
  const v = l.createRadialGradient(W / 2, H / 2, H * 0.4, W / 2, H / 2, W * 0.75);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.0)");
  l.fillStyle = v; l.fillRect(0, 0, W, H);
}

function fillRect(r, m, mx = 0, lf = 0) {

// Builds the chosen map: room, blocks, water, ice and the starting dolls.
function loadMap(i) {
  state.map = i;

  for (const r of m.walls) fillRect(r, WALL);
  for (const r of m.ice) fillRect(r, ICE, 0, 0);
  for (const r of m.water) fillRect(r, WATER);
  // Remember the map's own ice so "Eis entfernen" only clears placed ice.
  for (let i = 0; i < N; i++) mapIce[i] = mat[i] === ICE ? 1 : 0;

// ======================================================================
// Animation helpers: short, eased and frame rate independent
// ======================================================================

let frameDt = 1 / 60;
const animV = {};
// Moves a value smoothly toward its target.
function tween(key, target, rate = 14) {
  let v = animV[key];
  if (v === undefined) v = target;
  v += (target - v) * (1 - Math.exp(-rate * frameDt));
  if (Math.abs(target - v) < 0.002) v = target;
  animV[key] = v;
  return v;
}
const easeOut = (t) => 1 - Math.pow(1 - clamp(t, 0, 1), 3);
// Entry of the n-th element after a screen change: 0 hidden, 1 in place.
const appear = (n, dur = 0.3, step = 0.05) => easeOut((state.screenT - n * step) / dur);
// Draws something faded in and lifted while it appears.
function withAppear(a, fn, lift = 10) {
  if (a <= 0) return;
  if (a >= 1) { fn(); return; }
  ctx.save(); ctx.globalAlpha *= a; ctx.translate(0, (1 - a) * lift); fn(); ctx.restore();
}
// Scales a drawing around a point.
function scaled(cx, cy, k, fn) {
  if (k === 1) { fn(); return; }
  ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k); ctx.translate(-cx, -cy); fn(); ctx.restore();
}
// A short dip in size after a tap.
const popAt = {};
const pop = (key) => { popAt[key] = performance.now(); };
function popScale(key, depth = 0.08) {
  const t = (performance.now() - (popAt[key] || -1e9)) / 170;
  return t >= 1 ? 1 : 1 - depth * Math.sin(Math.PI * t);
}

function setScreen(name) {
  if (state.screen === name) return;
  state.screen = name; state.screenT = 0; state.pressTarget = null;
}

try { Object.assign(settings, JSON.parse(localStorage.getItem("ragpit.settings") || "{}")); } catch (e) { /* storage is optional */ }

// A blocky person in front view, used on the title screen and in map pictures.
// Units match the dolls: the person is about 186 units tall, feet at footY.
function drawBlockPerson(cx, footY, sc, look, opt = {}) {
  const bob = opt.bob || 0, arm = opt.arm || 0, outline = opt.outline !== false;
  const R = (x, y, w, h, c) => { ctx.fillStyle = typeof c === "string" ? c : css(c); ctx.fillRect(cx + x * sc, footY + y * sc, w * sc, h * sc); };
  const parts = [
    // shoes, legs, hips
    [-16, -7, 14, 7, look.shoes], [2, -7, 14, 7, look.shoes],
    [-14, -76, 12, 70, look.pants], [2, -76, 12, 70, look.pants],
    [-15, -94 + bob, 30, 22, look.pants],
    // arms behind the torso edge
    [-26, -146 + bob - arm, 11, 26, look.shirt], [15, -146 + bob, 11, 26, look.shirt],
    [-25, -121 + bob - arm, 9, 34, look.skin], [16, -121 + bob, 9, 34, look.skin],
    [-25.5, -88 + bob - arm, 10, 9, darken(look.skin, 0.08)], [15.5, -88 + bob, 10, 9, darken(look.skin, 0.08)],
    // torso, neck, head
    [-16, -148 + bob, 32, 58, look.shirt],
    [-5, -157 + bob, 10, 10, darken(look.skin, 0.12)],
    [-14, -187 + bob, 28, 32, look.skin],
    [-15, -190 + bob, 30, 9, look.hair], [-15, -184 + bob, 5, 12, look.hair], [10, -184 + bob, 5, 12, look.hair],
  ];
  if (outline) {
    const o = Math.max(1, 1.6 / sc);
    for (const [x, y, w, h] of parts) R(x - o, y - o, w + o * 2, h + o * 2, "#0b0b0e");
  }
  for (const [x, y, w, h, c] of parts) {
    R(x, y, w, h, c);
    if (sc > 0.4) { R(x, y, w, Math.min(2.5, h * 0.2), lighten(c, 0.16)); R(x + w - Math.min(3, w * 0.25), y, Math.min(3, w * 0.25), h, darken(c, 0.14)); }
  }
  if (sc > 0.3) {
    // eyes and mouth
    R(-8, -172 + bob, 4, 4, "#16161a"); R(4, -172 + bob, 4, 4, "#16161a");
    R(-4, -162 + bob, 8, 2, darken(look.skin, 0.35));
    // belt
    R(-15, -94 + bob, 30, 3, darken(look.pants, 0.35));
  }
}

// Small symbol for each map, drawn in a round badge.
function drawMapBadge(i, x, y, r) {
  ctx.save();
  ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(10,10,13,0.85)"; ctx.fill();
  ctx.strokeStyle = MAPS[i].accent; ctx.lineWidth = 1.5; ctx.stroke();
  ctx.translate(x, y); ctx.scale(r / 14, r / 14);
  ctx.strokeStyle = MAPS[i].accent; ctx.fillStyle = MAPS[i].accent; ctx.lineWidth = 1.8; ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath();
  switch (i) {
    case 0: // flask
      ctx.moveTo(-3, -8); ctx.lineTo(-3, -2); ctx.lineTo(-8, 7); ctx.lineTo(8, 7); ctx.lineTo(3, -2); ctx.lineTo(3, -8); ctx.moveTo(-5, -8); ctx.lineTo(5, -8);
      ctx.stroke(); ctx.beginPath(); ctx.moveTo(-5.5, 3); ctx.lineTo(5.5, 3); ctx.lineTo(7, 6); ctx.lineTo(-7, 6); ctx.closePath(); ctx.fill();
      break;
    case 1: // waves
      for (const wy of [-4, 2]) { ctx.moveTo(-8, wy); for (let k = 0; k < 4; k++) ctx.quadraticCurveTo(-6 + k * 4, wy - 3, -4 + k * 4, wy); }
      ctx.stroke(); ctx.beginPath(); ctx.moveTo(-8, 7); ctx.lineTo(8, 7); ctx.stroke();
      break;
    case 2: // stairs
      ctx.moveTo(-8, 8); ctx.lineTo(-8, 4); ctx.lineTo(-3, 4); ctx.lineTo(-3, -1); ctx.lineTo(2, -1); ctx.lineTo(2, -6); ctx.lineTo(8, -6); ctx.lineTo(8, 8); ctx.closePath(); ctx.fill();
      break;
    case 3: // platforms
      ctx.fillRect(-9, 3, 8, 3); ctx.fillRect(-3, -2, 8, 3); ctx.fillRect(3, -7, 7, 3); ctx.fillRect(-9, 8, 18, 1.6);
      break;
    case 4: // snowflake
      for (let k = 0; k < 3; k++) { const a = k * Math.PI / 3; ctx.moveTo(Math.cos(a) * 8, Math.sin(a) * 8); ctx.lineTo(-Math.cos(a) * 8, -Math.sin(a) * 8); }
      for (let k = 0; k < 6; k++) { const a = k * Math.PI / 3, px1 = Math.cos(a) * 5, py1 = Math.sin(a) * 5; ctx.moveTo(px1, py1); ctx.lineTo(px1 + Math.cos(a + 0.8) * 2.5, py1 + Math.sin(a + 0.8) * 2.5); ctx.moveTo(px1, py1); ctx.lineTo(px1 + Math.cos(a - 0.8) * 2.5, py1 + Math.sin(a - 0.8) * 2.5); }
      ctx.stroke();
      break;
  }
  ctx.restore();
}

// A small painted picture of a map: room, lamp light, blocks, water, ice and people.
function drawMapPreview(i, x, y, w, h) {
  const m = MAPS[i], t = m.theme, sx = w / W, sy = h / H, b = m.build();
  ctx.save();
  rr(x, y, w, h, 8); ctx.clip();
  const g = ctx.createLinearGradient(0, y, 0, y + FLOOR_Y * sy);
  g.addColorStop(0, t.wall[0]); g.addColorStop(1, t.wall[1]);
  ctx.fillStyle = g; ctx.fillRect(x, y, w, FLOOR_Y * sy);
  // wall panels and the ceiling strip
  ctx.fillStyle = t.line;
  for (let px1 = 0; px1 < W; px1 += 96) ctx.fillRect(x + px1 * sx, y, 1, FLOOR_Y * sy);
  ctx.fillRect(x, y + 150 * sy, w, 1.6);
  ctx.fillStyle = "#0e0e11"; ctx.fillRect(x, y, w, 16 * sy);
  // lamp and its cone of light
  const lx = x + w / 2, ly = y + 42 * sy;
  const cone = ctx.createLinearGradient(0, ly, 0, y + FLOOR_Y * sy);
  cone.addColorStop(0, "rgba(255,240,204,0.32)"); cone.addColorStop(1, "rgba(255,240,204,0.04)");
  ctx.fillStyle = cone;
  ctx.beginPath(); ctx.moveTo(lx - 4, ly); ctx.lineTo(lx + 4, ly); ctx.lineTo(lx + 150 * sx, y + FLOOR_Y * sy); ctx.lineTo(lx - 150 * sx, y + FLOOR_Y * sy); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#d8d8d0"; ctx.fillRect(lx - 4, ly - 3, 8, 3);
  ctx.fillStyle = "#fff6d8"; ctx.beginPath(); ctx.arc(lx, ly + 1, 1.6, 0, Math.PI * 2); ctx.fill();
  // floor
  const fl = ctx.createLinearGradient(0, y + FLOOR_Y * sy, 0, y + h);
  fl.addColorStop(0, t.floor[0]); fl.addColorStop(1, t.floor[1]);
  ctx.fillStyle = fl; ctx.fillRect(x, y + FLOOR_Y * sy, w, h - FLOOR_Y * sy);
  ctx.fillStyle = t.edge; ctx.fillRect(x, y + FLOOR_Y * sy, w, 1.2);
  ctx.fillStyle = "rgba(0,0,0,0.18)";
  for (let px1 = 0; px1 < W; px1 += 48) ctx.fillRect(x + px1 * sx, y + FLOOR_Y * sy, 0.8, h);
  // concrete blocks
  for (const r of b.walls) {
    const rx = x + r[0] * sx, ry = y + r[1] * sy, rw = r[2] * sx, rh = r[3] * sy;
    ctx.fillStyle = "#4c4c56"; ctx.fillRect(rx, ry, rw, rh);
    ctx.fillStyle = "#8a8a94"; ctx.fillRect(rx, ry, rw, 1.2);
    ctx.fillStyle = "rgba(0,0,0,0.3)"; ctx.fillRect(rx, ry + rh - 1, rw, 1);
  }
  // water with a bright surface line
  for (const r of b.water) {
    const rx = x + r[0] * sx, ry = y + r[1] * sy, rw = r[2] * sx, rh = r[3] * sy;
    const wg = ctx.createLinearGradient(0, ry, 0, ry + rh);
    wg.addColorStop(0, "rgba(70,140,230,0.9)"); wg.addColorStop(1, "rgba(30,70,170,0.95)");
    ctx.fillStyle = wg; ctx.fillRect(rx, ry, rw, rh);
    ctx.fillStyle = "#b4dcff"; ctx.fillRect(rx, ry, rw, 1);
  }
  // ice with a white top and a shine
  for (const r of b.ice) {
    const rx = x + r[0] * sx, ry = y + r[1] * sy, rw = r[2] * sx, rh = r[3] * sy;
    ctx.fillStyle = "#a6d6f6"; ctx.fillRect(rx, ry, rw, rh);
    ctx.fillStyle = "#f0fbff"; ctx.fillRect(rx, ry, rw, Math.min(1.2, rh));
    if (rh > 6) { ctx.fillStyle = "rgba(255,255,255,0.45)"; ctx.fillRect(rx + rw * 0.2, ry + 2, Math.max(1, rw * 0.12), rh - 4); }
  }
  // people standing where the map puts them
  b.dolls.forEach((dx, n) => {
    let gy = FLOOR_Y;
    for (const r of b.walls.concat(b.ice)) if (dx >= r[0] && dx <= r[0] + r[2] && r[1] < gy && r[1] > 20) gy = r[1];
    ctx.save(); ctx.translate(x, y);
    drawBlockPerson(dx * sx, gy * sy, sy, MENU_LOOKS[(n + i) % MENU_LOOKS.length]);
    ctx.restore();
  });
  // soft vignette
  const v = ctx.createRadialGradient(x + w / 2, y + h / 2, h * 0.3, x + w / 2, y + h / 2, w * 0.7);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,0.45)");
  ctx.fillStyle = v; ctx.fillRect(x, y, w, h);
  ctx.restore();
  drawMapBadge(i, x + 15, y + 15, 11);
}

  // flickering lamp

  const cone = ctx.createLinearGradient(0, 40, 0, floor);
  cone.addColorStop(0, `rgba(255,240,204,${0.3 * flick})`); cone.addColorStop(1, `rgba(255,240,204,${0.06 * flick})`);
  ctx.fillStyle = cone;
  ctx.beginPath(); ctx.moveTo(px1 - 10, 40); ctx.lineTo(px1 + 10, 40); ctx.lineTo(px1 + 140, floor); ctx.lineTo(px1 - 140, floor); ctx.closePath(); ctx.fill();
  ctx.fillStyle = "#0a0a0c"; ctx.fillRect(px1 - 1, 0, 2, 30);
  ctx.fillStyle = "#cfcfc8"; ctx.beginPath(); ctx.moveTo(px1 - 16, 40); ctx.lineTo(px1 - 7, 30); ctx.lineTo(px1 + 7, 30); ctx.lineTo(px1 + 16, 40); ctx.closePath(); ctx.fill();
  ctx.fillStyle = `rgba(255,246,216,${flick})`; ctx.beginPath(); ctx.arc(px1, 41, 3, 0, Math.PI * 2); ctx.fill();
  // dust in the light
  for (const d of f.dust) {
    d.y -= d.v * dt; if (d.y < 50) d.y = 360;

    ctx.fillStyle = `rgba(255,240,210,${0.25 + 0.2 * Math.sin(f.t + d.p)})`;
    ctx.fillRect(px1 + dx, d.y, 1.2, 1.2);

  // blood pool and the person

  ctx.beginPath(); ctx.ellipse(px1 + 30, floor + 2, 46, 4, 0, 0, Math.PI * 2); ctx.fill();
  ctx.fillStyle = "rgba(0,0,0,0.35)";

  for (const d of f.drops) {

// The person on the title screen is a real game doll, drawn with the same
// pixel renderer, posed by hand and a little larger than in the game.
let titleDoll = null;
const TD_X = 240, TD_Y = 300, TD_SCALE = 1.35;
function drawTitleDoll(cx, floor, t) {
  if (!titleDoll) {
    titleDoll = new Doll(TD_X, TD_Y, 0);
    titleDoll.look = { skin: hex("#e8c09a"), shirt: hex("#3c7a74"), pants: hex("#38425a"), shoes: hex("#2a2420"), hair: hex("#4a3020") };
    titleDoll.addWound(TORSO, 0.42, 0.5, 2.2, false, "shot");
    titleDoll.addWound(UARM_R, 0.55, 0.4, 1.2, false, "cut");
    titleDoll.stain[TORSO] = 0.25; titleDoll.stain[UARM_R] = 0.2;
  }
  const d = titleDoll, breathe = Math.sin(t * 2.2) * 1.4, sway = Math.sin(t * 0.9) * 1.5;
  // Rest pose with breathing in the chest and a slow sway of head and arms.
  for (let i = 0; i < POSE.length; i++) {
    let x = TD_X + POSE[i][0], y = TD_Y + POSE[i][1];
    if (i <= P_WAIST || (i >= P_ELBOW_L && i <= P_HAND_R)) y += breathe * (i === P_WAIST ? 0.4 : 1);
    if (i === P_HEAD) x += sway * 0.8;
    if (i === P_HAND_L || i === P_HAND_R) x += sway * 0.5;
    d.x[i] = x; d.y[i] = y;
  }
  // The right hand presses on the bullet wound.
  d.x[P_ELBOW_R] = TD_X + 20; d.y[P_ELBOW_R] = TD_Y - 117 + breathe;
  d.x[P_HAND_R] = TD_X - 1; d.y[P_HAND_R] = TD_Y - 125 + breathe;
  ppx.fill(0);
  rasterDoll(d);
  pixCtx.putImageData(pixImg, 0, 0);
  const sx = (TD_X - 70) / PIX, sy = (TD_Y - 200) / PIX, sw = 140 / PIX, sh = 210 / PIX;
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pixCan, sx, sy, sw, sh, cx - 70 * TD_SCALE, floor - 200 * TD_SCALE, 140 * TD_SCALE, 210 * TD_SCALE);
  ctx.imageSmoothingEnabled = true;
}

function drawScreen(dt) {
  if (state.screen === "title") drawTitle(dt);
  else if (state.screen === "maps") drawMaps();
  else if (state.screen === "help") drawHelp();
  else if (state.screen === "settings") drawSettings();
}

// Every tappable thing on the current menu screen and what it does.
function screenTargets() {
  const t = [];
  if (state.screen === "title") {
    for (const b of titleButtons()) t.push({ id: b.id, box: b, run: () => setScreen(b.id === "resume" ? "game" : b.id) });
    return t;
  }
  t.push({ id: "back", box: BACK_BTN, run: () => setScreen("title") });
  if (state.screen === "maps") {
    for (const c of menuCards()) t.push({ id: "map" + c.i, box: c, run: () => { state.inGame = true; loadMap(c.i); setScreen("game"); } });
  } else if (state.screen === "settings") {
    for (const r of settingRows()) {
      t.push({ id: r.id, box: r, run: () => { if (r.id === "panel") togglePanel(); else { settings[r.id] = !settings[r.id]; saveSettings(); } } });
    }
  }
  return t;
}

// Menus react on release, so the button can show that it is pressed.
function screenPress() {
  const hit = screenTargets().find((tg) => hitBox(tg.box, state.mx, state.my));
  state.pressTarget = hit ? hit.id : null;
}
function screenRelease() {
  const id = state.pressTarget;
  state.pressTarget = null;
  if (!id) return;
  const tg = screenTargets().find((t) => t.id === id);
  if (tg && hitBox(tg.box, state.mx, state.my)) { clickSound(800, 0.05); tg.run(); }
}

// Long press on a doll with the grab tool opens its menu (front view only).
const LONG_PRESS = 0.55;

  const lp = state.lp;
  if (!lp) return;
  if (!state.pressing || !state.dolls.includes(lp.d) || Math.hypot(state.mx - lp.x, state.my - lp.y) > 9) { state.lp = null; return; }
  if ((performance.now() - lp.t) / 1000 < LONG_PRESS) return;
  state.lp = null;
  lp.d.grabbed = -1; state.grabDoll = null; state.pressing = false;
  state.ctxMenu = { d: lp.d, x: lp.x, y: lp.y, t: performance.now() };
  state.selected = lp.d;
  clickSound(660, 0.05);
}
function drawLongPress() {
  const lp = state.lp;

  ctx.beginPath(); ctx.arc(lp.x, lp.y, 16, 0, Math.PI * 2); ctx.stroke();

function ctxMenuPress() {

// ----------------------------------------------------------------- aim view

const AIM_F = 2.35;
const aimCenter = () => [Math.round(W * 0.32), 240];
const AIM_BOX = () => ({ x: 14, y: 52, w: Math.round(W * 0.58) - 14, h: H - 66 });
const AIM_BACK = { x: 16, y: 10, w: 120, h: 34 };
// Hit areas of the organs on the chart, as ellipses [x, y, rx, ry].
const ORGAN_HIT = {
  brain: [[0, -62.5, 7.6, 6.2]], lungL: [[7.5, -34.5, 5.4, 8.8]], lungR: [[-7.5, -34.5, 5.4, 8.8]],
  heart: [[2.6, -29.5, 4, 4.6]], liver: [[-5, -19.6, 8.8, 4.6]], stomach: [[7, -18.6, 5.2, 4.8]],
  kidneys: [[-6.5, -6.4, 2.8, 3.6], [6.5, -6.4, 2.8, 3.6]], gut: [[0, 1, 11, 3.8]],
};
const PART_NAME = {
  [HEAD]: "KOPF", [TORSO]: "BRUST", [PELVIS]: "UNTERBAUCH", [UARM_L]: "OBERARM L", [UARM_R]: "OBERARM R",
  [LARM_L]: "UNTERARM L", [LARM_R]: "UNTERARM R", [THIGH_L]: "OBERSCHENKEL L", [THIGH_R]: "OBERSCHENKEL R",
  [SHIN_L]: "UNTERSCHENKEL L", [SHIN_R]: "UNTERSCHENKEL R", [FOOT_L]: "FUSS L", [FOOT_R]: "FUSS R",
};

function openAimView(d) {
  state.aimView = { d, t: performance.now(), aiming: false, cx: 0, cy: 0, flash: 0, last: null };
  state.tool = T_GUN; state.toolT = 9;
}
function closeAimView() { state.aimView = null; }

// What lies under a point of the front view: part, position and organs.
function frontHit(d, x, y) {
  const order = [LARM_L, LARM_R, UARM_L, UARM_R, HEAD, TORSO, PELVIS, FOOT_L, FOOT_R, SHIN_L, SHIN_R, THIGH_L, THIGH_R];
  for (const k of order) {
    if (!d.attached(k)) continue;
    const [rx, ry, rw, rh] = CHART[k];
    let inside = x >= rx && x <= rx + rw && y >= ry && y <= ry + rh, t;
    if (k === HEAD && !inside) inside = x >= -4 && x <= 4 && y >= -51.5 && y <= -44.5;
    if ((k === LARM_L || k === LARM_R) && !inside) inside = x >= rx && x <= rx + rw && y > ry + rh && y <= ry + rh + 7.3;
    if (!inside) continue;
    if (k === HEAD) t = (((Math.atan2((y - (ry + rh / 2)) / 6, (x - (rx + rw / 2)) / 5) / (Math.PI * 2)) % 1) + 1) % 1;
    else if (k === FOOT_L || k === FOOT_R) t = 0.5;
    else t = clamp((y - ry) / rh, 0.05, 0.95);
    const s = clamp((x - (rx + rw / 2)) / (rw * 0.3), -1, 1);
    const organs = [];
    for (const o of ORGANS) {
      if (o.part !== k) continue;
      if (ORGAN_HIT[o.id].some(([ex, ey, ax, ay]) => ((x - ex) / ax) ** 2 + ((y - ey) / ay) ** 2 <= 1)) organs.push(o.id);
    }
    let name = PART_NAME[k];
    if (k === TORSO && t > 0.55) name = "OBERBAUCH";
    if (k === HEAD && y > -51.5) name = "HALS";
    if ((k === LARM_L || k === LARM_R) && y > ry + rh) name = k === LARM_L ? "HAND L" : "HAND R";
    return { k, t, s, organs, name, crit: k === HEAD && Math.hypot(x, y + 62.5) < 3 };
  }
  return null;
}

function aimFire() {
  const v = state.aimView, d = v.d, wp = WEAPONS[state.weapon];
  if (state.reloadT > 0) return;
  if (state.ammo[state.weapon] <= 0) { clickSound(1400, 0.08); state.toast = 1.2; state.toastText = "Leer. Nachladen!"; return; }
  const [cx, cy] = aimCenter();
  const hit = frontHit(d, (v.cx - cx) / AIM_F, (v.cy - cy) / AIM_F);
  state.ammo[state.weapon]--;
  gunSound(wp.snd);
  state.shake = Math.max(state.shake, wp.kick);
  v.flash = 1; v.last = hit;
  if (!hit) { state.toast = 0.8; state.toastText = "Daneben"; return; }
  const [wx, wy] = d.preciseShot(hit, wp);
  // The shot also shows in the room: tracer from the gun and a muzzle flash.
  const [px0, py0, ang] = gunPose();
  const [ox, oy] = muzzlePoint(px0, py0, ang, wp);
  tracers.push({ ax: ox, ay: oy, bx: wx, by: wy, age: 0 });
  flashes.push({ x: ox, y: oy, ang, age: 0 });
  state.selected = d;
}

function aimButtons() {
  const x0 = Math.round(W * 0.6), w = W - x0 - 16, out = [];
  WEAPONS.forEach((wp, n) => out.push({ id: "w" + n, n, x: x0 + n * (w / 3), y: 58, w: w / 3 - 6, h: 52 }));
  out.push({ id: "reload", x: x0, y: 118, w: w / 2 - 3, h: 30 });
  out.push({ id: "xray", x: x0 + w / 2 + 3, y: 118, w: w / 2 - 3, h: 30 });
  return out;
}

function aimPress() {
  const v = state.aimView, { mx, my } = state;
  if (hitBox(AIM_BACK, mx, my)) { closeAimView(); return; }
  for (const b of aimButtons()) {
    if (!hitBox(b, mx, my)) continue;
    pop("aim" + b.id);
    if (b.id === "reload") startReload();
    else if (b.id === "xray") state.xray = !state.xray;
    else if (state.weapon !== b.n) { state.weapon = b.n; state.reloadT = 0; state.climb = 0; }
    clickSound(800, 0.05);
    return;
  }
  if (hitBox(AIM_BOX(), mx, my)) { v.aiming = true; v.cx = mx; v.cy = my; }
}
function aimMove() {
  const v = state.aimView;
  if (v && v.aiming) { v.cx = state.mx; v.cy = state.my; }
}
function aimRelease() {
  const v = state.aimView;
  if (!v || !v.aiming) return;
  v.aiming = false;
  aimFire();
}

// The doll seen from the front: blocky parts in its own colors, wounds on top.
function drawFrontDoll(d, cx, cy, F) {
  const now = performance.now() / 1000;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(F, F);
  const order = [UARM_L, UARM_R, LARM_L, LARM_R, THIGH_L, THIGH_R, SHIN_L, SHIN_R, FOOT_L, FOOT_R, PELVIS, TORSO, HEAD];
  for (const k of order) {
    if (!d.attached(k)) continue;
    const [rx, ry, rw, rh] = CHART[k];
    let c = tintFor(d, k, d.look[PART_CLOTH[k]]);
    if (d.stain[k] > 0.02) c = mixc(c, COL_GORE, d.stain[k] * 0.6);
    c = mixc(c, hex("#6a3a5a"), clamp(d.dmg[k] / 250, 0, 0.35));
    const box = (x, y, w, h, col) => {
      ctx.fillStyle = "#0b0b0e"; ctx.fillRect(x - 0.7, y - 0.7, w + 1.4, h + 1.4);
      ctx.fillStyle = css(col); ctx.fillRect(x, y, w, h);
      ctx.fillStyle = css(lighten(col, 0.14)); ctx.fillRect(x, y, w, Math.min(1.2, h * 0.2));
      ctx.fillStyle = css(darken(col, 0.12)); ctx.fillRect(x + w - Math.min(1.6, w * 0.2), y, Math.min(1.6, w * 0.2), h);
    };
    if (k === HEAD) {
      box(-3.6, -51.8, 7.2, 7.6, darken(c, 0.08));
      box(rx, ry, rw, rh, c);
      const hair = tintFor(d, k, d.look.hair);
      ctx.fillStyle = css(hair); ctx.fillRect(rx - 0.3, ry - 0.6, rw + 0.6, 4.6); ctx.fillRect(rx - 0.3, ry, 2, 8); ctx.fillRect(rx + rw - 1.7, ry, 2, 8);
      // Face: two eyes and a mouth, X eyes when dead, closed when out.
      ctx.fillStyle = "#121216";
      for (const ex of [-3.6, 3.6]) {
        if (d.dead) {
          ctx.strokeStyle = "#121216"; ctx.lineWidth = 0.7;
          ctx.beginPath(); ctx.moveTo(ex - 1.2, -63.2); ctx.lineTo(ex + 1.2, -60.8); ctx.moveTo(ex + 1.2, -63.2); ctx.lineTo(ex - 1.2, -60.8); ctx.stroke();
        } else if (d.isOut()) ctx.fillRect(ex - 1.3, -61.6, 2.6, 0.7);
        else { ctx.fillStyle = "#f4f4f0"; ctx.fillRect(ex - 1.3, -63, 2.6, 2.2); ctx.fillStyle = "#121216"; ctx.fillRect(ex - 0.6, -62.6, 1.3, 1.6); }
      }
      ctx.fillStyle = css(darken(c, 0.45)); ctx.fillRect(-2, -56.4, 4, d.pn > 50 && !d.dead ? 1.4 : 0.8);
      continue;
    }
    box(rx, ry, rw, rh, c);
    if (k === LARM_L || k === LARM_R) box(rx + 0.4, ry + rh + 0.8, rw - 0.8, 6.2, tintFor(d, k, d.look.skin));
    if (k === PELVIS) { ctx.fillStyle = css(darken(c, 0.35)); ctx.fillRect(rx, ry + 0.6, rw, 1.4); }
  }
  ctx.restore();
  if (state.xray) {
    // X-ray: the organs show through the body.
    ctx.save(); ctx.globalAlpha *= 0.92;
    drawChartOrgans(d, cx, cy, F);
    ctx.restore();
  }
  for (const w of d.wounds) {
    if (!d.attached(w.part)) continue;
    const [wx, wy] = chartPoint(w);
    drawWoundMark(w, cx + wx * F, cy + wy * F, F * 1.1, now);
  }
}

function drawAimView() {
  const v = state.aimView;
  if (!v) return;
  if (!state.dolls.includes(v.d)) { closeAimView(); return; }
  const d = v.d, a = easeOut((performance.now() - v.t) / 220), wp = WEAPONS[state.weapon];

    rr(AIM_BACK.x, AIM_BACK.y, AIM_BACK.w, AIM_BACK.h, 9); ctx.fillStyle = "rgba(26,26,32,0.95)"; ctx.fill();
    ctx.strokeStyle = "#3a3a42"; ctx.lineWidth = 1.5; ctx.stroke();
    label("‹ ZURÜCK", AIM_BACK.x + AIM_BACK.w / 2, AIM_BACK.y + AIM_BACK.h / 2 + 1, 12, "#cfcfd6", "center");
  });

  // Figure box with the doll from the front

  ctx.strokeStyle = "#26262e"; ctx.lineWidth = 1.5; ctx.stroke();
  const [cx, cy] = aimCenter();
  ctx.fillStyle = "rgba(0,0,0,0.35)"; ctx.beginPath(); ctx.ellipse(cx, cy + 72 * AIM_F, 34, 5, 0, 0, Math.PI * 2); ctx.fill();
  drawFrontDoll(d, cx, cy, AIM_F);
  // Crosshair with the target name
  const hit = v.aiming ? frontHit(d, (v.cx - cx) / AIM_F, (v.cy - cy) / AIM_F) : null;
  if (v.aiming) {
    const col = hit ? "#ff4050" : "#cfcfd6";
    ctx.strokeStyle = col; ctx.lineWidth = 1.6; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(v.cx, v.cy, 9, 0, Math.PI * 2);
    ctx.moveTo(v.cx - 16, v.cy); ctx.lineTo(v.cx - 5, v.cy); ctx.moveTo(v.cx + 5, v.cy); ctx.lineTo(v.cx + 16, v.cy);
    ctx.moveTo(v.cx, v.cy - 16); ctx.lineTo(v.cx, v.cy - 5); ctx.moveTo(v.cx, v.cy + 5); ctx.lineTo(v.cx, v.cy + 16); ctx.stroke();
    ctx.fillStyle = col; ctx.beginPath(); ctx.arc(v.cx, v.cy, 1.4, 0, Math.PI * 2); ctx.fill();
  }
  if (v.flash > 0) {
    v.flash = Math.max(0, v.flash - frameDt * 5);
    ctx.strokeStyle = `rgba(255,220,160,${v.flash})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(v.cx, v.cy, 10 + (1 - v.flash) * 16, 0, Math.PI * 2); ctx.stroke();
  }
  // Right column: weapon, ammo, x-ray, target and state
  for (const b of aimButtons()) {
    scaled(b.x + b.w / 2, b.y + b.h / 2, popScale("aim" + b.id), () => {
      const on = b.id === "xray" ? state.xray : b.id[0] === "w" ? state.weapon === b.n : false;
      rr(b.x, b.y, b.w, b.h, 9); ctx.fillStyle = on ? "#2e2e37" : "#1d1d23"; ctx.fill();
      ctx.strokeStyle = on ? "#ecece6" : "#34343c"; ctx.lineWidth = on ? 1.8 : 1.2; ctx.stroke();
      if (b.id[0] === "w") {
        const sp = WEAPONS[b.n].sprite, z = Math.min(1.5, (b.w - 12) / sp[0].length);
        drawSpriteOutlined(sp, b.x + b.w / 2 - sp[0].length * z / 2, b.y + 18 - sp.length * z / 2, z, on ? 1 : 0.5);
        label(WEAPONS[b.n].name.toUpperCase(), b.x + b.w / 2, b.y + b.h - 9, fitFont(WEAPONS[b.n].name.toUpperCase(), b.w - 8, 8), on ? "#f2f2ec" : "#6a6a74", "center");
      } else if (b.id === "reload") {
        label(state.reloadT > 0 ? "LÄDT..." : "NACHLADEN", b.x + b.w / 2, b.y + b.h / 2 + 1, 9, state.reloadT > 0 ? "#e6c850" : "#e2e2da", "center");
      } else label("RÖNTGEN " + (state.xray ? "AN" : "AUS"), b.x + b.w / 2, b.y + b.h / 2 + 1, 9, state.xray ? "#86c4ff" : "#e2e2da", "center");

// ======================================================================
// Easter egg: tap the door at the back three times. An old lab dog opens
// it and answers every question with yes, no, a laugh or a disgusted sound.
// ======================================================================

const DOOR = { x: Math.round(W * 0.66), y: FLOOR_Y - 150, w: 70, h: 138 };
const egg = { taps: [], open: 0, active: false, idle: 0, say: "", sayT: 0, last: "", anim: "", animT: 0, blink: 0 };
const EGG_ANSWERS = [["JA.", "nod", 35], ["NEIN.", "shake", 35], ["HO HO HO.", "laugh", 15], ["BÄÄÄH.", "yuck", 15]];
const dogBox = () => ({ x: DOOR.x + 6, y: DOOR.y + 40, w: DOOR.w - 12, h: DOOR.h - 40 });

// Returns true when the tap belonged to the egg.
function eggPress() {
  const { mx, my } = state;
  if (egg.active && egg.open > 0.8 && hitBox(dogBox(), mx, my)) { eggAnswer(); return true; }
  if (!hitBox(DOOR, mx, my)) return false;
  if (egg.active) { egg.active = false; eggVoice("bye"); return true; }
  const now = performance.now();
  egg.taps = egg.taps.filter((t) => now - t < 1400);
  egg.taps.push(now);
  if (egg.taps.length < 3) return false;
  egg.taps = []; egg.active = true; egg.idle = 0;
  egg.say = "HALLO?"; egg.sayT = 2.2; egg.anim = "nod"; egg.animT = 0;
  eggVoice("hello");
  return true;
}

function eggAnswer() {
  let pick;
  do {
    let r = Math.random() * 100;
    pick = EGG_ANSWERS.find(([, , w]) => (r -= w) < 0) || EGG_ANSWERS[0];
  } while (pick[0] === egg.last && Math.random() < 0.6);
  egg.last = pick[0]; egg.say = pick[0]; egg.sayT = 1.8; egg.anim = pick[1]; egg.animT = 0; egg.idle = 0;
  eggVoice(pick[1]);
}

function eggStep(dt) {
  egg.open = moveToward(egg.open, egg.active ? 1 : 0, dt * 2.5);
  egg.sayT = Math.max(0, egg.sayT - dt);
  egg.animT += dt;
  egg.blink -= dt; if (egg.blink < -3.5) egg.blink = 0.15;
  if (egg.active) { egg.idle += dt; if (egg.idle > 25) { egg.active = false; eggVoice("bye"); } }
}

// A low, grumpy dog voice made from two detuned waves.
function eggVoice(kind) {
  if (!settings.sound) return;
  try {
    if (!audio) audio = new (window.AudioContext || window.webkitAudioContext)();
    if (audio.state === "suspended") audio.resume();
    const parts = {
      nod: [[0, 0.28, 150, 115]], shake: [[0, 0.18, 165, 150], [0.22, 0.26, 150, 110]],
      laugh: [[0, 0.16, 130, 120], [0.22, 0.16, 130, 120], [0.44, 0.22, 130, 105]],
      yuck: [[0, 0.6, 240, 200]], hello: [[0, 0.16, 160, 170], [0.2, 0.3, 175, 135]], bye: [[0, 0.35, 140, 95]],
    }[kind];
    const t0 = audio.currentTime;
    for (const [at, len, f0, f1] of parts) {
      for (const [type, det, vol] of [["sawtooth", 1, 0.07], ["square", 1.007, 0.04]]) {
        const o = audio.createOscillator(), g = audio.createGain(), lp = audio.createBiquadFilter();
        o.type = type; lp.type = "lowpass"; lp.frequency.value = kind === "yuck" ? 1600 : 900;
        o.frequency.setValueAtTime(f0 * det, t0 + at); o.frequency.linearRampToValueAtTime(f1 * det, t0 + at + len);
        if (kind === "yuck") { const lfo = audio.createOscillator(), lg = audio.createGain(); lfo.frequency.value = 18; lg.gain.value = 18; lfo.connect(lg); lg.connect(o.frequency); lfo.start(t0 + at); lfo.stop(t0 + at + len); }
        g.gain.setValueAtTime(0, t0 + at); g.gain.linearRampToValueAtTime(vol, t0 + at + 0.03);
        g.gain.setValueAtTime(vol, t0 + at + len - 0.05); g.gain.linearRampToValueAtTime(0, t0 + at + len);
        o.connect(lp); lp.connect(g); g.connect(audio.destination); o.start(t0 + at); o.stop(t0 + at + len + 0.02);
      }
    }
  } catch (e) { /* sound is optional */ }
}

// The open door with the dog in it, drawn in the game's pixel blocks.
function drawEgg() {
  if (egg.open <= 0.001) return;
  const o = easeOut(egg.open), P = 3;
  // Dark room behind the door and the door leaf swinging open
  const g = ctx.createLinearGradient(0, DOOR.y, 0, DOOR.y + DOOR.h);
  g.addColorStop(0, "#07070a"); g.addColorStop(1, "#141418");
  ctx.fillStyle = g; ctx.fillRect(DOOR.x + 2, DOOR.y + 2, DOOR.w - 4, DOOR.h - 4);
  const leaf = (DOOR.w - 4) * (1 - o * 0.82);
  ctx.fillStyle = "#2a2a31"; ctx.fillRect(DOOR.x + 2, DOOR.y + 2, leaf, DOOR.h - 4);
  ctx.fillStyle = "rgba(255,255,255,0.08)"; ctx.fillRect(DOOR.x + 2 + leaf - 8, DOOR.y + 64, 5, 3);
  // The dog slides into the doorway.

  if ((egg.anim === "nod" || egg.anim === "shake") && t < 0.45) mouth = Math.sin(t * 20) > 0 ? 1 : 0;
  const R = (x, y, w, h, c) => { ctx.fillStyle = c; ctx.fillRect(cx + x * P, by + y * P, w * P, h * P); };
  const OUT = "#0b0b0e", FUR = "#8a5a32", DARK = "#5a3418", CREAM = "#e8d4b0", COAT = "#e6e6de", COATS = "#b8b8b0";

  R(-2, -18, 4, 9, FUR); R(-2, -10, 1, 9, COATS); R(1, -10, 1, 9, COATS);
  R(-8.5, -3.5, 5, 3.5, OUT); R(3.5, -3.5, 5, 3.5, OUT); R(-8, -3, 4, 3, FUR); R(4, -3, 4, 3, FUR);
  R(-7, -12, 3, 1, COATS); R(5, -12, 3, 1, COATS);
  // Head with droopy ears, grey brows, glasses and a cream muzzle
  ctx.save(); ctx.translate(hx * P, hy * P);
  R(-10.5, -28.5, 4, 13, OUT); R(6.5, -28.5, 4, 13, OUT); R(-10, -28, 3, 12, DARK); R(7, -28, 3, 12, DARK);
  R(-7.5, -30.5, 15, 14, OUT); R(-7, -30, 14, 13, FUR); R(-7, -30, 14, 2, DARK);
  R(-4.5, -23, 9, 6.5, OUT); R(-4, -22.5, 8, 6, CREAM);
  R(-1.5, -23.5, 3, 2, "#121216");
  // Eyes: sleepy lids, blink now and then, round glasses around them
  const shut = egg.blink > 0;
  for (const ex of [-5, 2]) {

    if (!shut) { R(ex + 1, -25.8, 1.2, 1.4, "#121216"); R(ex, -27, 3, 1.1, FUR); }

  else R(-2, -18.4, 4, 0.7, DARK);
  ctx.restore();

  if (egg.sayT > 0 && egg.say) {
