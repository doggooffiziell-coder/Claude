// ----------------------------------------------------------------- aim view

const AIM_F = 2.35;
const aimCenter = () => [Math.round(W * 0.32), 240];
const AIM_BOX = () => ({ x: 14, y: 52, w: Math.round(W * 0.58) - 14, h: H - 66 });
const AIM_BACK = { x: 16, y: 10, w: 120, h: 34 };
// Hit areas of the organs on the chart, as ellipses [x, y, rx, ry].
const ORGAN_HIT = {
  brain: [[0, -62.5, 7.6, 6.2]], lungL: [[7.5, -34.5, 5.4, 8.8]], lungR: [[-7.5, -34.5, 5.4, 8.8]],
  heart: [[2.6, -29.5, 4, 4.6]], liver: [[-5, -19.6, 8.8, 4.6]], stomach: [[7, -18.6, 5.2, 4.8]],
  kidneys: [[-6.5, -6.4, 2.8, 3.6], [6.5, -6.4, 2.8, 3.6]], gut: [[0, 1, 11, 3.8]],
};
const PART_NAME = {
  [HEAD]: "KOPF", [TORSO]: "BRUST", [PELVIS]: "UNTERBAUCH", [UARM_L]: "OBERARM L", [UARM_R]: "OBERARM R",
  [LARM_L]: "UNTERARM L", [LARM_R]: "UNTERARM R", [THIGH_L]: "OBERSCHENKEL L", [THIGH_R]: "OBERSCHENKEL R",
  [SHIN_L]: "UNTERSCHENKEL L", [SHIN_R]: "UNTERSCHENKEL R", [FOOT_L]: "FUSS L", [FOOT_R]: "FUSS R",
};

function openAimView(d) {
  state.aimView = { d, t: performance.now(), aiming: false, cx: 0, cy: 0, flash: 0, last: null };
  state.tool = T_GUN; state.toolT = 9;
}
function closeAimView() { state.aimView = null; }

// What lies under a point of the front view: part, position and organs.
function frontHit(d, x, y) {
  const order = [LARM_L, LARM_R, UARM_L, UARM_R, HEAD, TORSO, PELVIS, FOOT_L, FOOT_R, SHIN_L, SHIN_R, THIGH_L, THIGH_R];
  for (const k of order) {
    if (!d.attached(k)) continue;
    const [rx, ry, rw, rh] = CHART[k];
    let inside = x >= rx && x <= rx + rw && y >= ry && y <= ry + rh, t;
    if (k === HEAD && !inside) inside = x >= -4 && x <= 4 && y >= -51.5 && y <= -44.5;
    if ((k === LARM_L || k === LARM_R) && !inside) inside = x >= rx && x <= rx + rw && y > ry + rh && y <= ry + rh + 7.3;
    if (!inside) continue;
    if (k === HEAD) t = (((Math.atan2((y - (ry + rh / 2)) / 6, (x - (rx + rw / 2)) / 5) / (Math.PI * 2)) % 1) + 1) % 1;
    else if (k === FOOT_L || k === FOOT_R) t = 0.5;
    else t = clamp((y - ry) / rh, 0.05, 0.95);
    const s = clamp((x - (rx + rw / 2)) / (rw * 0.3), -1, 1);
    const organs = [];
    for (const o of ORGANS) {
      if (o.part !== k) continue;
      if (ORGAN_HIT[o.id].some(([ex, ey, ax, ay]) => ((x - ex) / ax) ** 2 + ((y - ey) / ay) ** 2 <= 1)) organs.push(o.id);
    }
    let name = PART_NAME[k];
    if (k === TORSO && t > 0.55) name = "OBERBAUCH";
    if (k === HEAD && y > -51.5) name = "HALS";
    if ((k === LARM_L || k === LARM_R) && y > ry + rh) name = k === LARM_L ? "HAND L" : "HAND R";
    return { k, t, s, organs, name, crit: k === HEAD && Math.hypot(x, y + 62.5) < 3 };
  }
  return null;
}

function aimFire() {
  const v = state.aimView, d = v.d, wp = WEAPONS[state.weapon];
  if (state.reloadT > 0) return;
  if (state.ammo[state.weapon] <= 0) { dryFireSound(); state.toast = 1.2; state.toastText = "Leer. Nachladen!"; return; }
  const [cx, cy] = aimCenter();
  const hit = frontHit(d, (v.cx - cx) / AIM_F, (v.cy - cy) / AIM_F);
  state.ammo[state.weapon]--;
  if (wp.taser) taserPop(); else shotSound(SHOT_KIND[wp.name]);
  state.shake = Math.max(state.shake, wp.kick);
  v.flash = 1; v.last = hit;
  if (!hit) { state.toast = 0.8; state.toastText = "Daneben"; return; }
  if (wp.taser) { d.tase(hit.k, hit.t, hit.s, d.x[P_WAIST] + rf(-40, 40), viewBottom() + 40); state.selected = d; return; }
  const [wx, wy] = d.preciseShot(hit, wp, Math.random() < 0.5 ? 1 : -1);
  flashes.push({ x: wx, y: wy, ang: 0, age: 0 });
  state.selected = d;
}

function aimButtons() {
  const x0 = Math.round(W * 0.6), w = W - x0 - 16, out = [];
  const nw = WEAPONS.length;
  WEAPONS.forEach((wp, n) => out.push({ id: "w" + n, n, x: x0 + n * (w / nw), y: 58, w: w / nw - 6, h: 52 }));
  out.push({ id: "reload", x: x0, y: 118, w: w / 2 - 3, h: 30 });
  out.push({ id: "xray", x: x0 + w / 2 + 3, y: 118, w: w / 2 - 3, h: 30 });
  return out;
}

function aimPress() {
  const v = state.aimView, mx = state.sx, my = state.sy;
  if (hitBox(AIM_BACK, mx, my)) { closeAimView(); return; }
  for (const b of aimButtons()) {
    if (!hitBox(b, mx, my)) continue;
    pop("aim" + b.id);
    if (b.id === "reload") startReload();
    else if (b.id === "xray") state.xray = !state.xray;
    else if (state.weapon !== b.n) { state.weapon = b.n; state.reloadT = 0; state.climb = 0; }
    clickSound(800, 0.05);
    return;
  }
  if (hitBox(AIM_BOX(), mx, my)) { v.aiming = true; v.cx = mx; v.cy = my; }
}
function aimMove() {
  const v = state.aimView;
  if (v && v.aiming) { v.cx = state.sx; v.cy = state.sy; }
}
function aimRelease() {
  const v = state.aimView;
  if (!v || !v.aiming) return;
  v.aiming = false;
  aimFire();
}

// The doll seen from the front: blocky parts in its own colors, wounds on top.
function drawFrontDoll(d, cx, cy, F) {
  const now = performance.now() / 1000;
  ctx.save(); ctx.translate(cx, cy); ctx.scale(F, F);
  const order = [UARM_L, UARM_R, LARM_L, LARM_R, THIGH_L, THIGH_R, SHIN_L, SHIN_R, FOOT_L, FOOT_R, PELVIS, TORSO, HEAD];
  for (const k of order) {
    if (!d.attached(k)) continue;
    const [rx, ry, rw, rh] = CHART[k];
    let c = tintFor(d, k, d.look[PART_CLOTH[k]]);
    if (d.stain[k] > 0.02) c = mixc(c, COL_GORE, d.stain[k] * 0.6);
    c = mixc(c, hex("#6a3a5a"), clamp(d.dmg[k] / 250, 0, 0.35));
    const box = (x, y, w, h, col) => {
      ctx.fillStyle = "#0b0b0e"; ctx.fillRect(x - 0.7, y - 0.7, w + 1.4, h + 1.4);
      ctx.fillStyle = css(col); ctx.fillRect(x, y, w, h);
      ctx.fillStyle = css(lighten(col, 0.14)); ctx.fillRect(x, y, w, Math.min(1.2, h * 0.2));

    };
    if (k === HEAD) {

      const hair = tintFor(d, k, d.look.hair);

        } else if (d.isOut()) ctx.fillRect(ex - 1.3, -61.6, 2.6, 0.7);
        else { ctx.fillStyle = "#f4f4f0"; ctx.fillRect(ex - 1.3, -63, 2.6, 2.2); ctx.fillStyle = "#121216"; ctx.fillRect(ex - 0.6, -62.6, 1.3, 1.6); }
      }
      ctx.fillStyle = css(darken(c, 0.45)); ctx.fillRect(-2, -56.4, 4, d.pn > 50 && !d.dead ? 1.4 : 0.8);
      continue;
    }
    box(rx, ry, rw, rh, c);
    if (k === LARM_L || k === LARM_R) box(rx + 0.4, ry + rh + 0.8, rw - 0.8, 6.2, tintFor(d, k, d.look.skin));
    if (k === PELVIS) { ctx.fillStyle = css(darken(c, 0.35)); ctx.fillRect(rx, ry + 0.6, rw, 1.4); }

  if (state.xray) {

    ctx.save(); ctx.globalAlpha *= 0.92;
    drawChartOrgans(d, cx, cy, F);
    ctx.restore();

  for (const w of d.wounds) {
    if (!d.attached(w.part) || w.exit) continue;
    const [wx, wy] = chartPoint(w);
    drawWoundMark(w, cx + wx * F, cy + wy * F, F * 1.1, now);
  }
  drawChartBands(d, cx, cy, F);
}

  dolls: [], selected: null, grabDoll: null, pinDrag: null, swings: [], dockCat: -1, catTool: null, counter: 0, trail: [], shake: 0,

function spawnDoll(bx, by) {
  const d = new Doll(bx, by, ++state.counter);
  state.dolls.push(d);
  state.selected = d;
  return d;
}

function resetScene() {
  loadMap(state.map);
}

// A dock button picks its tool with a short pop.
function useDock(n) {
  const b = dockButtons()[n];
  if (!b) return;
  if (b.kind === "cat") {
    pop("cat" + b.n); clickSound(700, 0.04);
    if (state.dockCat === b.n) state.dockCat = -1;
    else { state.dockCat = b.n; animV["flyout"] = 0; }
    return;
  }
  pop("tool" + b.tool);
  if (!state.catTool) state.catTool = {};
  if (b.tool !== T_RESET) state.catTool[b.n] = b.tool;
  state.dockCat = -1;
  useButton(b.tool);
}

function useButton(i) {
  if (i !== T_RESET && i !== state.tool) state.toolT = 0;
  state.flashBtn = i;
  setTimeout(() => { if (state.flashBtn === i) state.flashBtn = -1; }, 150);
  if (i === T_RESET) {
    resetScene();
  } else {
    release();
    state.tool = i;
  }
  state.toast = 1.4;
  state.toastText = i === T_DOLL ? "Tippe, wo sie stehen soll" : i === T_PIN ? "Körperteil ziehen, loslassen = fixieren" : i === T_GUN ? (settings.front ? "Tippe auf die Puppe, dort trifft der Schuss" : "Ziehen = zielen, roter Knopf = Feuer") : i === T_BAT ? "Tippe auf ein Körperteil zum Zuschlagen" : i === T_DEFI ? "Tippe auf eine Puppe, Schock auf die Brust" : i === T_ADREN ? "Tippe auf eine Puppe, weckt sie auf" : i === T_MONITOR ? "Tippe auf eine Puppe: Monitor an oder ab" : TOOL_NAMES[i];
}

// New doll stands upright on the ground below the tap, no fall, no collapse.
function placeDoll(x, y) {
  x = clamp(x, 40, WW - 40);
  let gy = Math.max(30, Math.floor(y));
  if (solidAt(x, gy)) { while (gy > 30 && solidAt(x, gy - 1)) gy--; }
  else { while (gy < WH - 1 && !solidAt(x, gy)) gy++; }
  if (gy - 180 < 10) { state.toast = 1.4; state.toastText = "Kein Platz"; return; }
  const d = spawnDoll(x, gy);
  state.toast = 1; state.toastText = "Puppe " + d.id;
}

function press() {
  if (state.screen !== "game") { screenPress(); return; }
  // An open death report closes on the next tap.
  if (state.deathReport) { state.deathReport = null; clickSound(500, 0.04); return; }
  if (state.aimView) { aimPress(); return; }
  if (state.ctxMenu) { ctxMenuPress(); return; }
  if (inZoomBtn(state.sx, state.sy)) { pop("zoom"); const c = state.cam; state.zoomAnim = { t: 0, z0: c.z, x0: c.x, y0: c.y }; return; }
  if (inFsBtn(state.sx, state.sy)) { pop("fs"); toggleFullscreen(); return; }
  if (inExtrasBtn(state.sx, state.sy)) { pop("extras"); state.extrasOpen = !state.extrasOpen; return; }
  if (state.extrasOpen) {
    // A tap outside the open list only closes it.
    if (inExtras(state.sx, state.sy)) extrasPress(state.sx, state.sy);
    else state.extrasOpen = false;
    return;
  }
  if (inPanelHead(state.sx, state.sy)) { togglePanel(); return; }
  // A tap on a compact row selects that doll.
  const row = panelOpen && (state.panelRows || []).find((r) => hitBox(r, state.sx, state.sy));
  if (row) { state.selected = row.d; pop("prow" + row.d.id); clickSound(820, 0.04); return; }
  if (inDockTab(state.sx, state.sy)) { toggleDock(); return; }
  if (state.infoBtn && hitBox(state.infoBtn, state.sx, state.sy)) {
    const d = state.infoBtn.d;
    if (!d.report) d.report = deathReport(d);
    state.deathReport = d; state.reportT = performance.now(); clickSound(700, 0.05);
    return;
  }
  if (inMenuBtn(state.sx, state.sy)) { pop("menu"); release(); state.aimView = null; state.ctxMenu = null; state.settingsFromGame = true; setScreen("settings"); state.extrasOpen = false; state.triggerDown = false; return; }
  const c = ctxHit(state.sx, state.sy);
  if (c) {
    pop("cx" + c.kind + c.n);
    if (c.kind === "water") { state.waterLevel = c.n; state.toast = 1; state.toastText = "Menge " + c.n; }
    if (c.kind === "fire") { state.fireMode = c.n; state.toast = 1; state.toastText = FIRE_HINTS[c.n]; }
    if (c.kind === "gun") { state.weapon = c.n; state.reloadT = 0; state.triggerDown = false; state.climb = 0; state.toast = 1; state.toastText = WEAPONS[c.n].name; }
    return;
  }
  const b = toolbarHit(state.sx, state.sy);
  if (b >= 0) { useDock(b); return; }
  // A tap anywhere else only closes an open tool row.
  if (state.dockCat >= 0 && state.dockCat !== undefined && state.dockCat !== null) { state.dockCat = -1; return; }
  if (blocksInput(state.sx, state.sy)) return;
  state.pressing = true;
  state.lastX = state.mx; state.lastY = state.my;
  if (state.tool === T_BOMB) { explode(state.mx, Math.min(state.my, FLOOR_Y - 2)); state.pressing = false; return; }
  if (state.tool === T_FIRE && state.fireMode !== 1) {
    state.pressing = false;
    if (state.fireMode === 0) lighter(state.mx, state.my); else molotov(state.mx, state.my);
    return;
  }
  if (state.tool === T_GUN) {
    // Front view: like the blade, the shot lands right under the finger.
    // With a finger the shot waits a moment: if a second finger follows,
    // it was a pinch to zoom and nothing fires.
    if (settings.front) { if (lastPointerType === "touch") state.pendingShot = performance.now(); else pullTrigger(); return; }
    // Otherwise: touch the gun to move it, touch anywhere else to aim there.
    if (onGun(state.mx, state.my)) { state.gunDrag = true; return; }
    aimAt(state.mx, state.my);
    return;
  }
  if (state.tool === T_DOLL) {
    state.pressing = false;
    placeDoll(state.mx, state.my);
    return;
  }
  if (state.tool === T_BAT) {
    // A swing: the doll part under the finger takes the blow, knocked away
    // from the side it was hit on.
    state.pressing = false;
    const hit = fingerHit(state.mx, state.my);
    state.swings.push({ x: state.mx, y: state.my, dir: hit ? (Math.sign(hit.d.x[P_NECK] - state.mx) || 1) : 1, age: 0 });
    if (hit) {

      worldEvent("shot", state.mx, state.my, hit.d);
    } else batSound(false);
    return;
  }
  if (state.tool === T_MONITOR) {
    state.pressing = false;
    let bestD = 70, best = null;
    for (const d of state.dolls) { const [i, dist] = d.nearestPoint(state.mx, state.my, bestD); if (i >= 0) { bestD = dist; best = d; } }
    if (!best) { state.toast = 1.2; state.toastText = "Tippe auf eine Puppe"; return; }
    state.selected = best; state.toast = 1.8;
    if (best.monitor) { const m = best.monitor; addGhost({ kind: "monitor", x: m.x, gy: (m.y || FLOOR_Y - 40) + 40, side: m.side, dur: 1.2, m }); best.monitor = null; state.toastText = "Monitor abgenommen"; best.logEvent("Monitor abgenommen"); clickSound(500, 0.06); }
    else if (best.dead && best.deadT > 45) state.toastText = "Zu spät für den Monitor";
    else {

  }
  if (state.tool === T_DEFI || state.tool === T_ADREN) {
    state.pressing = false;
    let bestD = 70, best = null;
    for (const d of state.dolls) { const [i, dist] = d.nearestPoint(state.mx, state.my, bestD); if (i >= 0) { bestD = dist; best = d; } }
    if (!best) { state.toast = 1.2; state.toastText = "Tippe auf eine Puppe"; return; }
    state.selected = best; state.toast = 1.6;
    if (state.tool === T_DEFI) {

    else if (best && best.dead) { best.attachInfusion(); state.selected = best; state.toast = 1.8; state.toastText = "Infusion läuft, gleich schocken"; }

}

function release() {
  // A quick tap: the waiting shot fires now, as a single shot.
  if (state.pendingShot) { state.pendingShot = 0; pullTrigger(); state.triggerDown = false; }
  state.pressing = false;
  state.gunDrag = false;
  // In the front view the finger itself is the trigger.
  if (settings.front) state.triggerDown = false;
  const pd = state.pinDrag;
  state.pinDrag = null;
  if (pd && state.grabDoll === pd.d && pd.d.grabbed === pd.i && !pd.d.gone[pd.d.owner[pd.i]]) {
    const tap = Math.hypot(state.mx - pd.x0, state.my - pd.y0) < 6 && performance.now() - pd.t < 400;
    pd.d.grabbed = -1; state.grabDoll = null;
    if (pd.was && tap) { state.toast = 1; state.toastText = "Gelöst"; clickSound(500, 0.06); }
    else { pd.d.togglePin(pd.i); state.toast = 1; state.toastText = "Fixiert"; clickSound(700, 0.06); }
    return;
  }
  if (state.grabDoll) state.grabDoll.grabbed = -1;
  state.grabDoll = null;
}

function applyTool() {
  const { mx, my } = state;
  if (state.tool === T_WATER) {
    pourSound();
    // Each level roughly doubles the flow. Level 5 is a thick, fast jet.
    const lv = state.waterLevel, count = [5, 12, 26, 52, 100][lv - 1], spread = [1.5, 3, 4.5, 6.5, 9][lv - 1];
    const push = [30, 60, 100, 150, 220][lv - 1];
    for (let n = 0; n < count; n++) {
      const ox = rf(-spread, spread);
      spawnParticle(mx + ox, my + rf(-spread, spread) * 0.5, ox * 3 + rf(-8, 8), push * rf(0.7, 1.1), WATER, 0);
    }
  } else if (state.tool === T_BUCKET) {
    // Scoop up water and blood under the finger.
    const r = 26;
    for (let dy = -r; dy <= r; dy++) for (let dx = -r; dx <= r; dx++) {
      if (dx * dx + dy * dy > r * r) continue;
      const x = Math.floor(mx) + dx, y = Math.floor(my) + dy, m = getMat(x, y);
      if (m === WATER || m === BLOOD) setCell(x, y, EMPTY);
    }
    particles = particles.filter((p) => (p.m !== WATER && p.m !== BLOOD) || Math.hypot(p.x - mx, p.y - my) > r);
  } else if (state.tool === T_GUN && !settings.front) {
    if (state.gunDrag) {
      state.gunX = clamp(mx, 30, WW - 30); state.gunY = clamp(my, 40, FLOOR_Y - 12);
      return;
    }
    aimAt(mx, my);
  } else if (state.tool === T_FIRE) {
    paintDisc(mx, my, 8, FIRE, 0.25);
    for (const d of state.dolls) d.applyHeat(mx, my, 10, 3);
  } else if (state.tool === T_ICE) {
    iceSound();
    // Ice grows around the doll, never inside it.
    paintDisc(mx, my, 7, ICE, 1, 200, (x, y) => state.dolls.some((d) => d.near(x, y, 4) || d.x.some((px1, i) => Math.hypot(px1 - x, d.y[i] - y) < d.rad[i] + 3)));
    for (const d of state.dolls) d.applyCold(mx, my, 30);
  } else if (state.tool === T_BLADE) {
    if (mx !== state.lastX || my !== state.lastY) {
      const speed = Math.hypot(mx - state.lastX, my - state.lastY) / DT;
      state.trail.push({ ax: state.lastX, ay: state.lastY, bx: mx, by: my, age: 0 });
      for (const d of state.dolls) if (d.bladeHit(state.lastX, state.lastY, mx, my, speed)) state.selected = d;
    }
  }
}

// ----------------------------------------------------------------- fire tools
// Feuerzeug: a small flame that sets exactly the touched part alight.
// Flamme: hold to burn, as before. Molotow: a bottle bursts into a pool of
// burning fuel that keeps burning for a while and sets alight what is in it.
const FIRE_MODES = ["FEUERZEUG", "FLAMME", "MOLOTOW"];
const FIRE_HINTS = ["Tippe auf ein Körperteil", "Halten zum Brennen", "Tippe, wo die Flasche platzt"];
function lighter(x, y) {
  let best = null, bk = -1, bd = 18;
  for (const d of state.dolls) for (let k = 0; k < PART_COUNT; k++) {
    if (d.gone[k]) continue;
    const [ax, ay] = limbStart(d, k), [qx, qy] = closestOnSeg(x, y, ax, ay, d.x[d.pb[k]], d.y[d.pb[k]]);
    const dist = Math.hypot(qx - x, qy - y) - (k === HEAD ? HEAD_R : RECT[k][0]);
    if (dist < bd) { bd = dist; best = d; bk = k; }
  }
  if (best) { best.ignite(bk, 3); state.selected = best; state.toast = 1; state.toastText = PART_NAME[bk] + " brennt"; }
  paintDisc(x, y, 3, FIRE, 0.8);
  whooshSound(0.4);
}
function molotov(x, y) {
  worldEvent("fire", x, y);
  // The fuel spreads out on the surface below the finger.
  let gy = Math.floor(y);
  while (gy < WH - 1 && !solidAt(x, gy + 1)) gy++;
  state.fires.push({ x, y: gy, r: 34, t: 7 });
  for (let n = 0; n < 40; n++) spawnParticle(x + rf(-4, 4), y + rf(-4, 4), rf(-260, 260), rf(-320, -40), FIRE);
  for (let n = 0; n < 14; n++) sparks.push({ x, y, vx: rf(-260, 260), vy: rf(-300, -60), life: rf(0.3, 0.8) });
  paintDisc(x, y, 14, FIRE, 0.7);
  for (const d of state.dolls) d.applyHeat(x, y, 30, 5);
  flashes.push({ x, y, ang: 0, age: 0 });
  state.shake = Math.max(state.shake, 0.18);
  glassSound(); whooshSound(1);
}
// Burning pools from the molotov: flames along the ground, dolls in them catch fire.
function stepFires() {
  for (const f of state.fires) {
    f.t -= DT;
    const k = Math.min(1, f.t / 2);
    for (let n = 0; n < 6 * k; n++) {
      const x = f.x + rf(-f.r, f.r) * (0.6 + 0.4 * k);
      let y = f.y;
      while (y > f.y - 30 && solidAt(x, y)) y--;
      if (isFree(getMat(Math.floor(x), Math.floor(y)))) setCell(Math.floor(x), Math.floor(y), FIRE, 0, 25 + rnd(35));
    }
    if (Math.random() < 0.3 * k) for (const d of state.dolls) d.applyHeat(f.x, f.y - 6, f.r * 0.8, 2);
  }
  state.fires = state.fires.filter((f) => f.t > 0);
}
// Flames licking up from every burning part, drawn over the doll.
// Flames on a burning body, drawn in the same pixel grid as the dolls.
// Tongues rise from cells all over the burning part and flicker about ten
// times a second. Pixels go in color buckets, tips first, so the bright core
// always sits on top and the rim stays red.
const FLAME_COLS = ["#a8200c", "#e24a16", "#ff8c1e", "#ffc834", "#fff2a8"];
const flameBuckets = FLAME_COLS.map(() => []);
function flameNoise(a, b) {
  let h = Math.imul(a | 0, 374761393) + Math.imul(b | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
}
function drawBodyFlames() {
  const now = performance.now() / 1000, P = 2;
  for (const bk of flameBuckets) bk.length = 0;
  ctx.save(); ctx.globalCompositeOperation = "lighter";
  for (const d of state.dolls) {
    const seen = new Set();
    for (let k = 0; k < PART_COUNT; k++) {
      if (d.fire[k] <= 0 || d.gone[k]) continue;
      const [ax, ay] = limbStart(d, k), bx = d.x[d.pb[k]], by = d.y[d.pb[k]], f = Math.min(1, d.fire[k] / 1.5);
      const len = Math.hypot(bx - ax, by - ay) || 1, ux = (bx - ax) / len, uy = (by - ay) / len;
      const w = (k === HEAD ? HEAD_R : RECT[k][0]) * 0.7, steps = Math.max(2, Math.round(len / (P * 2)));
      for (let q = 0; q <= steps; q++) for (const o of [-w, -w / 2, 0, w / 2, w]) {
        const px = lerp(ax, bx, q / steps) - uy * o, py = lerp(ay, by, q / steps) + ux * o;
        const gx = Math.floor(px / P), gy = Math.floor(py / P), key = gx * 4096 + gy;
        if (seen.has(key)) continue;
        seen.add(key);
        // Each cell flickers on its own beat, weaker fire leaves gaps.
        const beat = Math.floor(now * 10 + flameNoise(gx, gy) * 7);
        const n = flameNoise(gx * 31 + d.id, gy * 17 + beat);
        if (n > 0.25 + 0.75 * f) continue;
        const hc = 1 + Math.floor(flameNoise(gx + beat, gy - d.id) * (3 + 7.5 * f));
        for (let j = -1; j < hc; j++) {
          const c = Math.min(4, Math.floor((1 - (j + 1) / (hc + 1)) * 5));
          flameBuckets[c].push(gx * P, (gy - j) * P);
          // The lower half of a tongue is two pixels wide.
          if (j < hc / 2) flameBuckets[c].push((gx + 1) * P, (gy - j) * P);
        }
        // Now and then a spark flies off the tip.
        if (n < 0.08 * f) flameBuckets[2].push(gx * P + (beat % 3 - 1) * P, (gy - hc - 1 - (beat % 3)) * P);
      }
    }
    for (let k = 0; k < PART_COUNT; k++) {
      if (d.fire[k] <= 0 || d.gone[k]) continue;
      const [ax, ay] = limbStart(d, k), bx = d.x[d.pb[k]], by = d.y[d.pb[k]], f = Math.min(1, d.fire[k] / 1.5);
      const glow = ctx.createRadialGradient((ax + bx) / 2, (ay + by) / 2, 0, (ax + bx) / 2, (ay + by) / 2, 24);
      glow.addColorStop(0, `rgba(255,120,30,${0.16 * f})`); glow.addColorStop(1, "rgba(255,80,0,0)");
      ctx.fillStyle = glow; ctx.beginPath(); ctx.arc((ax + bx) / 2, (ay + by) / 2, 24, 0, Math.PI * 2); ctx.fill();
    }
  }
  ctx.restore();
  for (let c = 0; c < FLAME_COLS.length; c++) {
    const bk = flameBuckets[c];
    if (!bk.length) continue;
    ctx.fillStyle = FLAME_COLS[c];
    ctx.beginPath();
    for (let i = 0; i < bk.length; i += 2) ctx.rect(bk[i], bk[i + 1], P, P);
    ctx.fill();
  }
}
// Fire sounds: crackling while something burns, a whoosh when it catches,
// breaking glass for the molotov.
function noiseBurst(dur, freq, q, gain, type = "bandpass") { sfx((t) => nz(t, dur, { type, f: freq, q, g: gain, send: 0.15 })); }
const fireCrackle = () => noiseBurst(rf(0.01, 0.04), rf(1500, 4500), 2, rf(0.03, 0.08));

// Taser wires: from the gun to the two barbs, sagging a little. While the
// current runs, blue arcs jump between the barbs and the gun clicks.
function barbPos(d, k, t) {
  if (k === HEAD) return [d.x[d.pb[HEAD]], d.y[d.pb[HEAD]]];
  const [ax, ay] = limbStart(d, k);
  return [lerp(ax, d.x[d.pb[k]], t), lerp(ay, d.y[d.pb[k]], t)];
}
let zapAcc = 0;
function stepWires() {
  for (const w of wires) w.age += DT;
  wires = wires.filter((w) => (w.d ? state.dolls.includes(w.d) && (w.d.taseT > 0 || w.age < 9) : w.age < 3));
  if (state.dolls.some((d) => d.taseT > 0)) {
    zapAcc += DT;
    while (zapAcc > 1 / 19) { zapAcc -= 1 / 19; noiseBurst(0.012, 5200, 1, 0.09, "highpass"); }
  }
}
function drawWires() {
  if (!wires.length) return;
  ctx.save(); ctx.lineCap = "round";
  for (const w of wires) {
    const ends = w.d ? [barbPos(w.d, w.k, w.t), barbPos(w.d, w.k2, w.t2)] : [[w.ex, w.ey], [w.ex + 6, w.ey + 4]];
    ctx.strokeStyle = "rgba(205,205,215,0.75)"; ctx.lineWidth = 0.6;
    for (const [ex, ey] of ends) {
      const mx = (w.ox + ex) / 2, my = (w.oy + ey) / 2 + 10 + Math.hypot(ex - w.ox, ey - w.oy) * 0.06;
      ctx.beginPath(); ctx.moveTo(w.ox, w.oy); ctx.quadraticCurveTo(mx, my, ex, ey); ctx.stroke();
      ctx.fillStyle = "#c8c8d0"; ctx.fillRect(ex - 0.8, ey - 0.8, 1.6, 1.6);
    }
    if (w.d && w.d.taseT > 0) {
      // Arcs between the barbs, new every frame
      ctx.globalCompositeOperation = "lighter";
      const [[ax, ay], [bx, by]] = ends;
      for (let n = 0; n < 2; n++) {
        ctx.strokeStyle = n ? "rgba(140,200,255,0.5)" : "rgba(230,245,255,0.9)"; ctx.lineWidth = n ? 2.4 : 0.9;
        ctx.beginPath(); ctx.moveTo(ax, ay);
        for (let q = 1; q < 6; q++) ctx.lineTo(lerp(ax, bx, q / 6) + rf(-5, 5), lerp(ay, by, q / 6) + rf(-5, 5));
        ctx.lineTo(bx, by); ctx.stroke();
      }
      const g = ctx.createRadialGradient(ax, ay, 0, ax, ay, 12);
      g.addColorStop(0, "rgba(160,215,255,0.45)"); g.addColorStop(1, "rgba(120,180,255,0)");
      ctx.fillStyle = g; ctx.beginPath(); ctx.arc(ax, ay, 12, 0, Math.PI * 2); ctx.fill();
      ctx.globalCompositeOperation = "source-over";
    }
  }
  ctx.restore();
}
// The pop of the compressed gas that throws the barbs.
const taserPop = () => sfx((t) => { nz(t, 0.06, { type: "lowpass", f: 900, g: 0.35 }); for (let n = 0; n < 6; n++) nz(t + 0.02 + n * 0.015, 0.012, { type: "highpass", f: 4500, g: 0.2 }); tn(t, 0.3, { type: "sawtooth", f: 55, g: 0.05 }); });

// Dolls bump into each other instead of passing through.
function collideDolls() {
  const ds = state.dolls;
  // Bounding boxes first: two dolls far apart need no point checks at all,
  // so many dolls in the big room stay cheap.
  const box = ds.map((d) => {
    let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
    for (let i = 0; i < d.x.length; i++) { const r = d.rad[i]; x0 = Math.min(x0, d.x[i] - r); x1 = Math.max(x1, d.x[i] + r); y0 = Math.min(y0, d.y[i] - r); y1 = Math.max(y1, d.y[i] + r); }
    return [x0, y0, x1, y1];
  });
  for (let a = 0; a < ds.length; a++) for (let b = a + 1; b < ds.length; b++) {
    const A = box[a], B = box[b];
    if (A[0] > B[2] || B[0] > A[2] || A[1] > B[3] || B[1] > A[3]) continue;
    const p = ds[a], q = ds[b];
    for (let i = 0; i < p.x.length; i++) {
      if (p.gone[p.owner[i]]) continue;
      for (let j = 0; j < q.x.length; j++) {
        if (q.gone[q.owner[j]]) continue;
        const dx = q.x[j] - p.x[i], dy = q.y[j] - p.y[i], r = (p.rad[i] + q.rad[j]) * 0.8;
        const d2 = dx * dx + dy * dy;
        if (d2 >= r * r || d2 < 0.0001) continue;
        const d = Math.sqrt(d2), push = (r - d) / d;
        const wa = p.w(i), wb = q.w(j), ws = wa + wb;
        if (ws <= 0) continue;
        p.x[i] -= dx * push * wa / ws; p.y[i] -= dy * push * wa / ws;
        q.x[j] += dx * push * wb / ws; q.y[j] += dy * push * wb / ws;
      }
    }
  }
}

function physicsStep() {
  if (state.pressing) applyTool();
  stepFires();
  stepWires();

// The finger in screen units (sx, sy) for buttons and panels, and in the

function toGame(ev) {

  state.sx = clamp((ev.clientX - r.left) / r.width * W, 0, W - 0.01);

// ----------------------------------------------------------------- zoom

const ZOOM_BTN = { x: 0, y: 10, w: 84, h: 28 };
const zoomBtn = () => ({ ...ZOOM_BTN, x: W / 2 - ZOOM_BTN.w / 2 });
const HOME = { z: 1, x: 0, y: 0 };
homeView(HOME);

let activePointer = null, firePointer = null, lastPointerType = "mouse";

// ---------------------------------------------------------------- layout

function fit() {
  const stage = document.getElementById("stage");
  const hint = document.getElementById("hint");
  const cs = getComputedStyle(stage);
  const availW = stage.clientWidth - parseFloat(cs.paddingLeft) - parseFloat(cs.paddingRight);
  const hintH = hint.offsetParent ? hint.offsetHeight + 12 : 0;
  const availH = stage.clientHeight - hintH;
  const s = Math.max(0.2, Math.min(availW / W, availH / H));
  const cw = Math.floor(W * s), ch = Math.floor(H * s);
  canvas.style.width = cw + "px";
  canvas.style.height = ch + "px";
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(cw * dpr);
  canvas.height = Math.round(ch * dpr);
  K = canvas.width / W;
  iconCache.clear(); spriteCache.clear(); chartCache.key = "";
  buildStatic();
}
let refitTimer = 0;
window.addEventListener("resize", () => {
  fit();
  // Turned sideways or the free area changed a lot: restart once with a room that fits.
  clearTimeout(refitTimer);
  refitTimer = setTimeout(() => {
    if (innerWidth > innerHeight && Math.abs(idealWidth() - W) >= 96) location.reload();
  }, 400);
});
window.addEventListener("orientationchange", () => setTimeout(fit, 200));

// ---------------------------------------------------------------- render

const COL_P_BLOOD = "#9c0e1c", COL_P_FIRE = "#ffc048";
// Flies circle a dead body and sit on it now and then. A faint haze of
// stink rises while it bloats and rots.
function drawDecayFx() {
  const now = performance.now() / 1000;
  for (const d of state.dolls) {
    const dc = d.dc;
    if (!dc) continue;
    const cx = (d.x[P_NECK] + d.x[P_HIP]) / 2, cy = (d.y[P_NECK] + d.y[P_HIP]) / 2;
    const stink = Math.max(dc.bloat, dc.rot * (1 - dc.skel));

      ctx.strokeStyle = css([150, 170, 90], 0.25 * stink); ctx.lineWidth = 1.2; ctx.lineCap = "round";
      for (let n = 0; n < 3; n++) {
        const ph = (now * 0.3 + n / 3 + d.id * 0.17) % 1, x0 = cx + (n - 1) * 14;
        ctx.save(); ctx.globalAlpha *= Math.sin(ph * Math.PI);
        ctx.beginPath();

    for (let f = 0; f < count; f++) {

      const sit = Math.sin(now * 0.4 + sd) > 0.6;

        x = d.x[i] + Math.sin(sd) * 6; y = d.y[i] + Math.cos(sd * 1.3) * 5;
      } else {
        x = cx + Math.sin(now * sp + sd) * (18 + (f % 4) * 7) + Math.sin(now * 7.3 + sd * 2) * 3;
        y = cy - 12 + Math.sin(now * sp * 1.3 + sd * 1.7) * 14 + Math.cos(now * 9.1 + sd) * 2;
      }
      ctx.fillStyle = "#121212"; ctx.fillRect(x - 0.9, y - 0.7, 1.8, 1.4);
      if (!sit && ((now * 30 + f) | 0) % 2) { ctx.fillStyle = "rgba(220,220,230,0.6)"; ctx.fillRect(x - 0.6, y - 1.6, 1.2, 0.8); }
    }

}

  for (const g of gibs) rasterGib(g);
  for (const d of state.dolls) rasterDoll(d);
  for (const d of state.dolls) if (d.iv > 0) rasterInfusion(d);
  if (state.tool === T_GUN && !settings.front) rasterGun();
  pxEnd();
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(pixCan, 0, 0, WW, WH);
  ctx.imageSmoothingEnabled = true;
  drawBodyFlames();
  drawWires();
  // Very close up the body opens and shows its organs.
  if (settings.organs && cam.z > 3) for (const d of state.dolls) drawDollOrgans(d, smooth01((cam.z - 3) / 1.6));
  // Liquids, fire and smoke cover the dolls.
  ctx.drawImage(wcan, 0, 0, WW, WH);
  ctx.fillStyle = COL_P_BLOOD;
  ctx.beginPath();
  for (const p of particles) if (p.m === BLOOD) ctx.rect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
  ctx.fill();
  ctx.fillStyle = "rgba(120,170,240,0.85)";
  ctx.beginPath();
  for (const p of particles) if (p.m === WATER) ctx.rect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
  ctx.fill();
  ctx.fillStyle = COL_P_FIRE;
  ctx.beginPath();
  for (const p of particles) if (p.m !== BLOOD && p.m !== WATER) ctx.rect(p.x - 0.8, p.y - 0.8, 1.6, 1.6);
  ctx.fill();
  drawDecayFx();
  // Pins hold body points in place.
  for (const d of state.dolls) for (const [i] of d.pins) {
    if (d.gone[d.owner[i]]) continue;
    drawPin(d.x[i], d.y[i]);
  }
  // The pin rides along with the point being dragged, half see-through.
  const pd = state.pinDrag;
  if (pd && pd.d.grabbed === pd.i) { ctx.save(); ctx.globalAlpha *= 0.6 + 0.2 * Math.sin(performance.now() / 120); drawPin(pd.d.x[pd.i], pd.d.y[pd.i]); ctx.restore(); }
  // Bullet tracers and ricochet sparks
  ctx.lineCap = "round";
  // Bat swings: a white arc that fades out
  state.swings = state.swings.filter((sw) => (sw.age += frameDt) < 0.22);
  for (const sw of state.swings) {
    const a = 1 - sw.age / 0.22, r = 26 + sw.age * 60;
    ctx.strokeStyle = `rgba(255,255,255,${0.7 * a})`; ctx.lineWidth = 3 * a + 1; ctx.lineCap = "round";
    ctx.beginPath(); ctx.arc(sw.x - sw.dir * r * 0.6, sw.y, r, sw.dir > 0 ? -0.9 : Math.PI - 0.9, sw.dir > 0 ? 0.9 : Math.PI + 0.9); ctx.stroke();
  }
  for (const t of tracers) {
    ctx.strokeStyle = `rgba(255,236,160,${1 - t.age / 0.07})`; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(t.ax, t.ay); ctx.lineTo(t.bx, t.by); ctx.stroke();
  }
  ctx.fillStyle = "#ffd070";
  for (const p of sparks) ctx.fillRect(p.x - 1, p.y - 1, 2, 2);
  // Blade trail
  for (const s of state.trail) {
    ctx.strokeStyle = `rgba(240,246,255,${1 - s.age / 0.25})`; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(s.ax, s.ay); ctx.lineTo(s.bx, s.by); ctx.stroke();
  }
  // Light and explosion flashes add on top.
  ctx.globalCompositeOperation = "lighter";
  for (const e of effects) {
    const t = e.age / 0.5, r = 30 + t * 90;
    const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
    g.addColorStop(0, `rgba(255,230,160,${0.9 * (1 - t)})`);
    g.addColorStop(0.4, `rgba(255,120,40,${0.6 * (1 - t)})`);
    g.addColorStop(1, "rgba(255,60,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, Math.PI * 2); ctx.fill();
  }
  for (const f of flashes) {
    const s = f.s || 1, k = 1 - f.age / 0.06;
    // The room lights up warm for a moment.
    if (f.muzzle) {
      const L = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 170 * s);
      L.addColorStop(0, `rgba(255,190,110,${0.22 * k})`); L.addColorStop(1, "rgba(255,120,40,0)");
      ctx.fillStyle = L; ctx.beginPath(); ctx.arc(f.x, f.y, 170 * s, 0, Math.PI * 2); ctx.fill();
    }
    const g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, 20 * s);
    g.addColorStop(0, `rgba(255,244,200,${0.95 * k})`); g.addColorStop(0.45, `rgba(255,160,50,${0.6 * k})`); g.addColorStop(1, "rgba(255,80,0,0)");
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(f.x, f.y, 20 * s, 0, Math.PI * 2); ctx.fill();
    if (f.muzzle) {
      // A star of flame: a long tongue forward, short ones to the sides.
      ctx.save(); ctx.translate(f.x, f.y); ctx.rotate(f.ang + rf(-0.05, 0.05));
      ctx.fillStyle = `rgba(255,214,120,${0.9 * k})`;
      for (const [a, l, w] of [[0, 30, 5], [0.9, 12, 3], [-0.9, 12, 3], [0.35, 18, 3], [-0.35, 18, 3]]) {
        ctx.save(); ctx.rotate(a); ctx.beginPath(); ctx.moveTo(0, -w * s * 0.5); ctx.lineTo(l * s * rf(0.8, 1.15), 0); ctx.lineTo(0, w * s * 0.5); ctx.closePath(); ctx.fill(); ctx.restore();
      }
      ctx.fillStyle = `rgba(255,255,240,${k})`; ctx.beginPath(); ctx.arc(2, 0, 3.5 * s, 0, Math.PI * 2); ctx.fill();
      ctx.restore();
    }
  }
  ctx.drawImage(lightCan, 0, 0, WW, WH);
  ctx.globalCompositeOperation = "source-over";
  // Powder smoke
  for (const p of smokes) { const k = 1 - p.age / p.life; ctx.fillStyle = `rgba(190,188,182,${p.a * k * k})`; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2); ctx.fill(); }
  drawReloadMag();
  for (const d of state.dolls) if (d.monitor) drawMonitor(d);
  drawGhosts();
  // Aim line, cursor and the long press ring belong to the room.
  if (!settings.front) drawLaser();
  drawCursor();
  drawLongPress();
  // HUD
  ctx.setTransform(K, 0, 0, K, 0, 0);
  label("RAGPIT", 14, 26, 26, "#8e8e98");
  label((state.tool === T_GUN ? WEAPONS[state.weapon].name : TOOL_NAMES[state.tool]).toUpperCase(), 15, 52, 13, "#5a5a64");
  drawZoomBtn();
  let sel = state.selected;
  if (!sel || !state.dolls.includes(sel)) sel = state.selected = state.dolls[state.dolls.length - 1] || null;
  drawPanel(sel);
  // Front view: the gun fires from below the picture, its flash lights the
  // lower edge of the screen for a moment.
  if (settings.front && state.frontFlash > 0) {
    const fg = ctx.createRadialGradient(W * 0.78, H + 40, 10, W * 0.78, H + 40, 320);
    fg.addColorStop(0, `rgba(255,200,120,${0.35 * state.frontFlash})`); fg.addColorStop(1, "rgba(255,140,60,0)");
    ctx.fillStyle = fg; ctx.fillRect(0, 0, W, H);
  }
  drawContextBar();
  drawGunControls();
  drawToolbar();
  drawFsButton();
  drawMenuButton();
  drawExtrasButton();
  drawExtras();
  drawCtxMenu();
  drawAimView();
  drawDeathReport();
  const pk = tween("pausePill", state.paused || state.slow ? 1 : 0, 16);
  if (pk > 0.01) {
    if (state.paused || state.slow) pillText = state.paused ? "PAUSE" : "ZEITLUPE";
    const c = pillText === "PAUSE" ? "#ecece6" : "#b48cff";
    ctx.save(); ctx.globalAlpha *= pk; ctx.translate(0, (1 - pk) * -6);
    rr(W / 2 - 62, 100, 124, 28, 14); ctx.fillStyle = "rgba(15,15,19,0.9)"; ctx.fill();
    ctx.strokeStyle = c; ctx.lineWidth = 1.5; ctx.stroke();
    label(pillText, W / 2, 114.5, 13, c, "center");
    ctx.restore();
  }
  // Fade in from the menu color when a game starts or resumes.
  const enter = easeOut(state.screenT / 0.35);
  if (enter < 1) { ctx.fillStyle = css(hex("#121216"), 1 - enter); ctx.fillRect(0, 0, W, H); }
}

let acc = 0, lastT = performance.now();
function loop(now) {
  const realDt = Math.min(0.1, (now - lastT) / 1000);
  lastT = now;
  frameDt = realDt;
  state.screenT += realDt;
  state.toolT += realDt;
  state.extrasFlashT = Math.max(0, state.extrasFlashT - realDt);
  state.toast = Math.max(0, state.toast - realDt);
  // Upright phone: nothing runs, the painted portrait screen shows instead.
  if (portraitMQ.matches) { acc = 0; drawPortrait(realDt); requestAnimationFrame(loop); return; }
  acc += state.paused ? 0 : state.aimView ? realDt * 0.25 : state.slow ? realDt * 0.3 : realDt;
  if (state.screen === "game") { updateLongPress(); zoomStep(realDt); }
  let steps = 0;
  if (state.screen !== "game") {
    acc = 0;
    drawScreen(realDt);
  } else {
    // A slow phone runs at most three steps per frame and drops the rest,
    // so one slow frame does not snowball into the next.
    while (acc >= DT && steps < 3) { physicsStep(); acc -= DT; steps++; }
    if (steps === 3) acc = 0;
    render();
  }
  requestAnimationFrame(loop);
}

fit();
loadMap(0);
setScreen("title");
requestAnimationFrame((t) => { lastT = t; loop(t); });
if (document.fonts && document.fonts.load) document.fonts.load(`700 12px ${FONT}`).catch(() => {});
</script>
